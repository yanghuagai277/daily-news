gory": "社会民生与教育", "scope": "国内", "title": "昆明推出50余项秋假校外公益实践活动，全程免费向中小学生开放", "summary": "昆明市教育体育局推出“观山海·护生态，爱运动·爱生活”春城青少年秋假校外实践系列活动（11月13—15日），覆盖滇池绿道东西岸等点位，设8个主题体验营与城市生态研学打卡，全程免费、自愿实名预约，不与学业评价挂钩。", "source": "中国教育报/微博", "url": "https://m.weibo.cn/status/5363727004074066"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "广东平远发现植物新种“平远景天”，系丹霞地貌特有物种", "summary": "平远县林业局联合中山大学生命科学学院团队在国际植物分类学期刊正式发表景天科景天属新种“平远景天”，目前仅在平远五指石、南台山两地发现，是当地丹霞地貌特有种。团队跨两个生长季采集标本并提取DNA测序确认，具观赏与园艺开发价值。", "source": "梅州日报", "url": "https://mzrb.meizhou.cn/html/2026-11/15/content_416463.htm"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国完成空间站舱外激光“微创”试验，在轨运维获突破", "summary": "人民日报报道，我国空间站舱外激光“微创”试验近期在轨成功完成，系国际上首次在数百公里太空极端环境下通过遥操作开展激光精密切割。该试验由华中科技大学团队与上海空间电源研究所联合研制的舱外激光维修装置完成，标志在轨运维技术取得重大突破。", "source": "人民网", "url": "http://m2.people.cn/news/default.html?s=MV8xXzQwODMzNjY5XzEwMDRfMTc5NDYwNjQ1MA=="}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "宁忠岩速滑世界杯北京站加冕“双冠王”，连夺1000米与1500米金牌", "summary": "2026—2027赛季速度滑冰世界杯北京站，米兰冬奥会冠军宁忠岩先以1分07秒43打破“冰丝带”男子1000米场地纪录夺金，次日又以1分43秒64再夺1500米金牌，加冕本站双冠王；队友廉子文获1000米铜牌，取得新赛季开门红。", "source": "人民网/中新社", "url": "https://ent.people.com.cn/n1/2026/1114/c1012-40833763.html"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "国足2-0击败马来西亚，终结友谊赛三连败", "summary": "11月14日晚，在肇庆国际足球邀请赛中，中国男足凭借王钰栋第10分钟头球、张玉宁第19分钟单刀，主场2-0战胜马来西亚队，终结近期三连败。邵佳一赛后称胜利重要但“没有乐观的资本”，17日球队将迎战巴林队。", "source": "新华社", "url": "https://www.toutiao.com/article/7708061700003545600/"}, {"id": 12, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛今晨打响，BLG迎战GEN", "summary": "北京时间11月15日凌晨3点，2026英雄联盟全球总决赛在纽约巴克莱中心打响，中国LPL赛区BLG对阵韩国LCK一号种子GEN。BLG淘汰赛连克HLE、DK、T1三支韩队，GEN则近乎全胜晋级；全国110余城、300余家影院开通凌晨直播，影院直播规模创历史新高。", "source": "腾讯新闻/英雄联盟赛事", "url": "https://news.qq.com/rain/a/20261113A0DZX200"}, {"id": 13, "category": "战争与自然灾害", "scope": "国际", "title": "17国外长强烈谴责以色列空袭加沙医疗中心，霍尔木兹海域局势紧张", "summary": "巴基斯坦、埃及、沙特、土耳其等17国外长11月14日发表声明，以最强烈措辞谴责以色列对加沙汗尤尼斯纳赛尔医疗中心发动空袭，指其违反国际人道法。同日伊朗通报至少4艘油轮在霍尔木兹海峡触雷起火，联合国称该海域已发生134起商船袭击、致25名海员死亡。", "source": "新浪财经/CCTV国际时讯", "url": "https://finance.sina.com.cn/jjxw/2026-11-15/doc-iniytsqv3759980.shtml"}, {"id": 14, "category": "战争与自然灾害", "scope": "国内", "title": "两股冷空气接力南下，东北局地暴雪到大暴雪甚至特大暴雪", "summary": "中央气象台预报，14日至18日两股冷空气接连影响中东部，大部地区气温累计下降6—10℃、局地超12℃，19日凌晨0℃线将南压至淮河流域。17—18日辽宁、吉林、黑龙江东部有暴雪，局地大暴雪或特大暴雪，新增积雪可达30厘米以上，需防道路结冰。", "source": "中国天气网/中央气象台", "url": "https://www.topicbeat.com/news/article-1794682647330935047"}, {"id": 15, "category": "环境气候", "scope": "国际", "title": "COP31上的中国答卷：2035年NDC首提全经济范围绝对量减排目标", "summary": "在土耳其安塔利亚举行的COP31上，中国展示气候行动进展：2035年国家自主贡献（NDC）首次覆盖全经济范围、含所有温室气体并提出绝对量减排目标；2025年中国单位GDP二氧化碳排放下降5.0%，新能源汽车产销量连续11年全球第一，全国碳市场配额累计成交破9.17亿吨。", "source": "中国网/中新社", "url": "https://news.china.com.cn/2026-11/15/content_118774921.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "2026重庆汽车消费节启幕，80余品牌千余款车型集中亮相", "summary": "11月12—15日，2026（第十七届）重庆汽车消费节暨第七届房车生活节在重庆国际博览中心举行，规划8万平方米展区，汇聚80余个主流品牌、1000余款车型，新能源与智能化成核心看点。现场可叠加国家报废更新、置换更新及重庆购新三项补贴，单车最高可享2万元。", "source": "重庆市人民政府网", "url": "https://wap.cq.gov.cn/ykbzt/yhyshj/hzhd/202611/t20261110_16392896.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026广西知识大会在自治区博物馆举办，推动“书+展”深度融合", "summary": "11月13—15日，以“知识的长河”为主题的2026广西知识大会在广西壮族自治区博物馆主会场开启，设作家分享、书展市集、潮玩文创、文化沙龙四大板块，并联动多家“小而美”阅读空间。“博物馆NPC奇遇记”、古籍装订体验等让文物“开口说话”，打造城市知识嘉年华。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261114A0CP2G00"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "A级景区“有进有出”成常态，今年全国百余家景区被摘牌", "summary": "随着多地开启A级景区集中清退，今年以来全国22个省份100多家A级景区被摘牌或降级。从“一评到手、长期享用”到常态化复核、不合格即清退，释放行业监管标准持续收紧的信号，倒逼景区补齐配套短板、创新文旅产品，从追求数量规模转向质量效益。", "source": "光明日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_2666af8a94d71552"}]}, "yest": {"date": "2026-11-14", "generatedAt": "2026-11-14T07:35:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "欧盟首次举行领导人AI专题峰会，聚焦科技主权与风险监管", "summary": "欧盟领导人11月13日在爱尔兰都柏林举行首次AI专题峰会，讨论如何追赶他国AI产业步伐并防范潜在风险，强调增强科技主权。Mistral CEO与\"AI教父\"辛顿参会，爱沙尼亚与芬兰呼吁建立欧盟级AI安全事件应对机制。", "source": "财联社", "url": "https://www.cls.cn/detail/2534296"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI推出ChatGPT钱包，微软全球大宕机", "summary": "OpenAI推出ChatGPT钱包，授权智能体可调用绑定信用卡完成购物付款，首批面向美国18岁以上Pro用户；同日谷歌宣布Gemini接入谷歌钱包。另外微软Outlook、Teams及M365全球大宕机，峰值故障报告超13万条，微软称根因是网络容量升级问题。", "source": "华尔街见闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261114A04MEW00"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美国因空管通信故障发布全国地面停飞令", "summary": "因空中交通管制通信故障，美国联邦航空管理局（FAA）11月13日发布全国性地面停飞令，所有机场航班暂停起飞待另行通知；美国国家气象局亦遭遇全国性互联网通信故障。这是近年来罕见的全国航空停摆。", "source": "财联社", "url": "https://www.163.com/dy/article/LBM6E9Q405198CJN.html"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "美以伊冲突升级，中东局势高度紧张", "summary": "美以伊冲突持续升级：特朗普称将\"猛烈轰炸\"伊朗海岸线并继续摧毁舰船；伊朗公开新地下导弹城并称\"更先进能力未展出\"；以军要求伊朗大不里士部分居民撤离。多方信息战加剧，地区安全风险陡升。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34464732"}, {"id": 5, "category": "战争与自然灾害", "scope": "国内", "title": "两股冷空气接连来袭，东北局地暴雪到大暴雪", "summary": "中央气象台预报，11月14—18日两股冷空气接连影响我国，中东部降温6—10℃、局地超12℃，东北东部有暴雪到大暴雪；兰州、银川、太原或迎今冬初雪。公众需注意防寒保暖与出行防滑。", "source": "中央气象台/央广网", "url": "http://mp.weixin.qq.com/s?__biz=MzkxMzMwNTIwMQ==&mid=2247485229&idx=1&sn=5f5df516144e65f467f962088ca226df&chksm=c0519c80b47256aee63c6565fc109fa9ffb3bf011d9808cfe072a97b9b6028944daaccbcc1dc#rd"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "新赛道催生新岗位，AI与绿色职业扩容", "summary": "新华社报道，我国AI、新能源等新赛道催生大量新职业：具身智能机器人应用技术员、储能电站运维管理员、健康照护师等入选人社部新职业。上半年AI行业招聘企业数同比增24.8%，养老看护岗位同比增43.9%。", "source": "新华网/央视网", "url": "https://news.cctv.cn/2026/11/14/ARTIDgB9biBdGmJ1kotlMVSJ261114.shtml"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "全国城市联合招聘秋招提供岗位551.5万个", "summary": "人社部消息，2026年全国城市联合招聘高校毕业生秋季专场已举办1万余场招聘会，26.4万家用人单位提供岗位551.5万个，529.1万人次毕业生参与求职。活动聚焦数字经济、绿色经济等领域精准对接。", "source": "光明日报/新浪财经", "url": "https://finance.sina.com.cn/jjxw/2026-11-14/doc-iniyrtxp0898800.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "2027年考研报名347万，三连降后首回升", "summary": "教育部公布，2027年全国硕士研究生招生考试报名人数347万，在连续三年下降后回升4万，初试将于12月19—20日举行。就业承压下\"提升学历\"需求回弹，专硕扩招与交叉学科继续受热捧。", "source": "教育部/央视新闻", "url": "https://mp.weixin.qq.com/s?__biz=MzY5NzE2NDA5OA==&mid=2247484300&idx=1&sn=942d5722e5b26119772f6b6d06cc0858&chksm=f5b836cf8d37b1d6fcc6d911ae943e0b96666bc49180d46fe81e4608c7f2af26627120178351#rd"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "\"双11\"全网销售额破1.7万亿，即时零售大涨", "summary": "星图数据监测显示，今年\"双11\"全网电商销售额达17764亿元，同比增长4.8%；即时零售891亿元，同比大涨33%。线下即时配送与近场电商成新增长极，平台补贴转向履约效率。", "source": "星图数据/央视", "url": "http://mp.weixin.qq.com/s?__biz=MzkxMzMwNTIwMQ==&mid=2247485229&idx=1&sn=5f5df516144e65f467f962088ca226df&chksm=c0519c80b47256aee63c6565fc109fa9ffb3bf011d9808cfe072a97b9b6028944daaccbcc1dc#rd"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "我国完成空间站舱外激光\"微创\"试验", "summary": "人民日报报道，我国空间站舱外激光\"微创\"试验近期在轨成功完成，系国际上首次在数百公里太空极端环境下通过遥操作开展激光精密切割，标志在轨运维与相关装备制造技术取得重大突破。", "source": "人民网", "url": "http://m2.people.cn/news/default.html?s=MV8xXzQwODMzNjY5XzEwMDRfMTc5NDYwNjQ1MA=="}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "多国探索低成本太空建材，就地取材建月球基地", "summary": "多国探索低成本太空建材新路径：NASA推进靠太阳能从模拟月壤提氧的CaRD项目，雪城大学公布常温低压固化月壤方案（强度保留约92%），力求未来驻留深空就地取材、降低建造能耗。", "source": "新浪财经/齐鲁晚报", "url": "https://finance.sina.com.cn/jjxw/2026-11-14/doc-iniyriip0822884.shtml"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "宁忠岩速滑世界杯北京站1000米夺金破纪录", "summary": "2026-2027赛季速度滑冰世界杯北京站11月13日开赛，米兰冬奥冠军宁忠岩在男子1000米A组以1分07秒43夺金，刷新\"冰丝带\"场地纪录；队友廉子文摘铜，新赛季开门红。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-11-14/detail-iniyriiv3480322.d.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "三种流感同时流行，国产流感新药加速推进", "summary": "秋冬流感季开启，甲流H3N2、H1N1与乙流同时流行，中疾控提示尽早接种疫苗，奥司他韦等仍敏感。同时国产流感新药昂拉地韦新增\"高并发症风险甲流\"Ⅲ期临床获受理，治疗向预防端延伸。", "source": "中国医药创新促进会", "url": "https://www.phirda.com/artilce_44165.html"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "COP31\"中国角\"发布能源转型与绿证报告", "summary": "COP31\"中国角\"边会在土耳其安塔利亚举行，发布《中国能源转型展望2026》《中国绿证发展报告》等，提出非化石与化石能源消费比例由\"2:8\"向\"8:2\"转变；截至2025年底中国绿色燃料产能约800万吨/年。", "source": "新浪财经", "url": "https://finance.sina.com.cn/2026-11-14/doc-iniyrtxq7693048.shtml"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "工信部就《汽车改装管理办法》公开征求意见", "summary": "工信部11月13日发布《汽车改装管理办法（征求意见稿）》，拟对境内汽车改装实施分类管理并建立\"一车一档\"改装档案。调研显示2025年我国汽车改装市场规模超1500亿元、同比增20%。", "source": "人民网财经", "url": "https://finance.people.com.cn/n1/2026/1113/c1004-40833611.html"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16总决赛11月15日凌晨打响", "summary": "英雄联盟S16全球总决赛将于北京时间11月15日凌晨3点在纽约巴克莱中心打响，BLG迎战GEN，采用BO5赛制。全国110余城、300余家影院开通直播，电竞进影院观赛成新潮流。", "source": "18183游戏网", "url": "https://m.18183.com/gonglue/202611/6c4revui.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十一届博博会在海口开幕，聚焦文博数字化", "summary": "第十一届中国博物馆及相关产品与技术博览会（博博会）11月13—16日在海口举行，集中展示文博数字化、智慧展陈与新文创，博物馆文创与数字化持续升温，推动文化消费与人文交流。", "source": "央视新闻", "url": "https://mp.weixin.qq.com/s?__biz=MzY5NzE2NDA5OA==&mid=2247484300&idx=1&sn=942d5722e5b26119772f6b6d06cc0858&chksm=f5b836cf8d37b1d6fcc6d911ae943e0b96666bc49180d46fe81e4608c7f2af26627120178351#rd"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "多地推出秋假文旅大礼包与研学营", "summary": "多地推出秋假文旅大礼包：常州将秋假与周末连成5天小长假，上线恐龙探险、安全守护、农耕科创等十余类研学营并叠加文旅消费券；深圳周末也有博物馆特展、创意市集等丰富活动。", "source": "文旅常州/腾讯新闻", "url": "https://news.qq.com/rain/a/20261113A0E2VZ00"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
