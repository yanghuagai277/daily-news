: "国内", "title": "德约中网成就七冠王，赛事单日客流破4万创新高", "summary": "2026中网男单决赛10月6日晚，德约科维奇战胜德米纳尔成就“七冠王”，中网战绩改写为34胜0负。赛事火爆带动观赛热：截至10月4日累计入园超27万人、较去年同期增37%，单日客流两度破4万刷新历史纪录，带动周边消费近1.5亿元。", "source": "新京报/网易", "url": "https://www.163.com/dy/article/L8MBITMV05568W0A.html"}, {"id": "n14", "category": "健康养生", "scope": "国内", "title": "2026世界传统医药大会将于10月17日至18日在北京举行", "summary": "据2026世界传统医药大会组委会消息，由北京市政府、国家卫健委、国家中医药管理局、国家药监局主办，世界卫生组织共同举办的2026世界传统医药大会将于10月17日至18日在北京举行，聚焦传统医药传承创新与全球卫生合作。", "source": "人民网", "url": "https://health.people.com.cn/n1/2026/0924/c14739-40805108.html"}, {"id": "n15", "category": "环境气候", "scope": "国内", "title": "10月自然灾害风险形势发布：1—2个台风或影响我国", "summary": "应急管理部会同多部门会商研判，发布10月及国庆假期全国自然灾害风险形势：预计10月华中、华南、西南等地洪涝和风雹风险较高，西北太平洋和南海有3—4个台风生成、1—2个登陆或明显影响我国（强度总体偏强），部分区域地质灾害与森林火险等级较高。", "source": "应急管理部/央视", "url": "https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/02/ARTIBs87XTXQMvpb1dVRZBbU261002.shtml"}, {"id": "n16", "category": "汽车出行", "scope": "国内", "title": "中国一汽、丰田、广汽三方签约，南北丰田走向协同", "summary": "10月8日，中国一汽、丰田汽车、广汽集团在广州签署全新战略合作框架协议。广汽集团拟以发行股份方式购买中国一汽持有的一汽丰田50%股权，交易完成后一汽丰田仍独立运营、一汽成为广汽重要战略股东，南北丰田将在研发、采购、生产、销售等环节协同。", "source": "第一电动网", "url": "https://d1ev.com/news/qiye/313392"}, {"id": "n17", "category": "游戏电竞", "scope": "国内", "title": "英雄联盟S16全球总决赛10月16日开战，LPL四队出征", "summary": "《英雄联盟》2026全球总决赛（S16）将于10月16日在美国洛杉矶打响入围赛，11月15日纽约总决赛。LPL赛区派出AL、BLG、TES、iG四支队伍直接晋级瑞士轮；受北美时差影响，瑞士轮与决赛多在北京时间凌晨，仅八强与半决赛为早6点档。", "source": "网易", "url": "https://www.163.com/dy/article/L8JLSJ010553TF8P.html"}, {"id": "n18", "category": "文化读书", "scope": "国际", "title": "第78届法兰克福书展开幕，中国精品图书集中亮相", "summary": "第78届法兰克福书展10月7日在德国法兰克福会展中心开幕，来自100多个国家和地区超4000家出版机构参展。中国图书进出口集团组织80余家国内出版文化单位以“阅读中国”形象亮相，设336平方米联合展台，展出3000余种、4600余册精品图书。", "source": "中国新闻网", "url": "https://www.jwview.cn/cul/2026/10-08/10708957.shtml"}]}, "yest": {"date": "2026-10-06", "generatedAt": "2026-10-06T07:02:31+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": "n1", "category": "科技互联网与AI", "scope": "国内", "title": "华为与高通达成多年期广泛专利许可协议", "summary": "10月5日，华为与高通宣布达成多年期、广泛的专利交叉许可协议，覆盖5G、计算、人工智能与网络等领域，高通将收购华为部分美国专利。这是双方首份涵盖5G的许可协议，完成后华为累计专利许可总额将超69亿美元。", "source": "四川观察/证券时报", "url": "https://www.toutiao.com/article/7693230595119333942"}, {"id": "n2", "category": "科技互联网与AI", "scope": "国际", "title": "孙正义罕见示警：超级智能落入错误之手将“超级危险”", "summary": "10月4日京都“科技与社会”论坛上，软银创始人孙正义罕见警告，AI能力正指数级增长，各国须携手管控，超级智能若落入错误之手可能“超级危险”。其已通过软银向OpenAI注资约650亿美元，仍维持2040年AI占全球GDP两成的预测。", "source": "联合早报/彭博", "url": "https://www.zaobao.com.sg/finance/world/story20261004-9782537"}, {"id": "n3", "category": "国际时事", "scope": "国际", "title": "巴西总统选举首轮无人过半，卢拉与博索纳罗将二轮对决", "summary": "巴西高等选举法院公布首轮计票：自由党候选人博索纳罗得票47.03%居首，现任总统卢拉45.16%居次，无人过半，两人将于10月25日进入第二轮。同日西班牙首相桑切斯宣布解散议会，定于11月29日提前举行大选。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=439072437992694651"}, {"id": "n4", "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞与沙特冲突骤升，沙土巴启动集体防御", "summary": "胡塞武装称对沙特利雅得机场、拉比格阿美炼油厂等目标发动三轮导弹无人机打击；沙特主导多国联军以“也门黎明”行动出动百架战机摧毁324个目标。沙特、土耳其、巴基斯坦在利雅得召开“麦加防务联盟”紧急会议，决定在沙特部署军力、启动集体防御。", "source": "新华社/央视", "url": "https://www.news.cn/world/20261006/78659b5bedeb41929814d2fcc9a7a64e/c.html"}, {"id": "n5", "category": "财经经济与就业", "scope": "国内", "title": "9月中国大宗商品价格指数创四年半新高", "summary": "中国物流与采购联合会公布，9月中国大宗商品价格指数（CBPI）为137.6点，环比涨4.1%、同比涨22.9%，创2022年3月以来新高。重点监测50种商品中38种环比上涨，甲醇、乙二醇、焦炭涨幅居前，反映生产建设旺季需求持续改善。", "source": "中国物流与采购联合会/央视", "url": "https://www.163.com/dy/article/L8HP745B05198RSU.html"}, {"id": "n6", "category": "财经经济与就业", "scope": "国内", "title": "现房销售新政叠加房贷贴息，国庆多地楼市现看房热潮", "summary": "国庆假期，北京、上海、深圳等多地迎来看房热潮，楼市呈现量增价稳。新修订的现房销售制度逐步推进，叠加购房贷款贴息政策定向惠及刚需自住群体，部分热门板块优质房源出现多组客户同时关注，优质次新房成交节奏加快。", "source": "经济日报/每日经济新闻", "url": "https://www.mrjjxw.com/articles/2026-10-05/4597290.html"}, {"id": "n7", "category": "科学探索", "scope": "国际", "title": "2026诺贝尔生理学或医学奖授予光遗传学三位奠基者", "summary": "瑞典卡罗琳医学院10月5日宣布，将2026年诺贝尔生理学或医学奖授予卡尔·戴塞罗思、彼得·黑格曼和格奥尔格·内格尔，表彰其发现光门控离子通道和光遗传学。三人将平分1200万瑞典克朗（约802万元人民币）奖金。", "source": "中国青年网/新华社", "url": "https://news.youth.cn/gj/202610/t20261006_16901356.htm"}, {"id": "n8", "category": "体育赛事", "scope": "国内", "title": "国乒男单28年首跌出前三，孙颖莎重返女单世界第一", "summary": "国际乒联2026年第41周排名公布，王楚钦跌至男单第四，国乒男单28年来首次无缘世界前三；19岁日本选手松岛辉空登顶男单第一。女单方面，孙颖莎以7575分反超王曼昱重返世界第一，国乒仍占女单六席。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-10-06/detail-iniufhft3976447.d.html"}, {"id": "n9", "category": "体育赛事", "scope": "国内", "title": "郑钦文鏖战近三小时，时隔两年再进中网16强", "summary": "2026中国网球公开赛女单第三轮，中国选手郑钦文以2比1战胜赛会18号种子、捷克选手布兹科娃，鏖战近三小时，时隔两年再进中网16强，下一轮将对阵亚美尼亚选手查拉耶娃。", "source": "央视新闻/新民晚报", "url": "https://www.163.com/dy/article/L8GR2O4T0512DU6N.html"}, {"id": "n10", "category": "体育赛事", "scope": "国内", "title": "吴宜泽深圳公开赛夺冠，中国选手首包揽斯诺克世界前二", "summary": "2026斯诺克深圳公开赛决赛上演中国德比，吴宜泽10比5击败袁思俊夺冠，实时世界排名升至第二，仅次于赵心童。这是中国选手历史上首次包揽斯诺克世界排名前两位，吴宜泽也成为首位手握三座排名赛冠军的00后。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-10-06/detail-iniuezxv4086931.d.html"}, {"id": "n11", "category": "健康养生", "scope": "国际", "title": "俄西伯利亚抗鼠疫研究所一技术员死亡，近200人医学观察", "summary": "俄罗斯伊尔库茨克抗鼠疫研究所一名28岁女技术员因“不明原因肺炎”死亡，俄罗斯卫生部门称其样本未检出与职业相关的病原体，当地已对近200名接触者实施医学观察并启动防疫措施；WHO正与俄方沟通，评估认为公共健康风险较低。", "source": "Discover Magazine/CNN", "url": "https://www.discovermagazine.com/an-unexplained-death-at-a-siberian-plague-institute-leaves-nearly-200-under-observation-49769"}, {"id": "n12", "category": "环境气候", "scope": "国内", "title": "冷空气南下，长三角多地官宣入秋、气温创立秋后新低", "summary": "一股冷空气4日起自北向南影响中东部，长三角沪苏浙皖多地正式迈入秋天门槛。5日至7日南方大部最高气温将创立秋后新低，南京、合肥等地最低将达10℃左右，6日后天气转好、秋高气爽，但昼夜温差拉大需防感冒。", "source": "中国新闻网/中央气象台", "url": "https://www.toutiao.com/article/7692794564029071923/"}, {"id": "n13", "category": "汽车出行", "scope": "国内", "title": "方程豹9月交付破4.3万辆创纪录，连续三月站稳4万+", "summary": "比亚迪旗下方程豹公布9月销量43181辆，同比增79.0%，连续第三个月站稳月销4万+，并首次同时超越小鹏、小米等新势力品牌。品牌累计销量已突破58万台，从“小众玩家”蜕变为新能源市场的现象级黑马。", "source": "新浪汽车", "url": "https://k.sina.com.cn/article_7857201856_1d45362c001908pyvs.html"}, {"id": "n14", "category": "游戏电竞", "scope": "国内", "title": "2026英雄联盟全球总决赛S16赛程公布，10月16日开赛", "summary": "2026英雄联盟全球总决赛（S16）赛程公布，将于北京时间10月16日2:00正式开赛。同时，10月3日至17日的2026英雄联盟德玛西亚杯国际邀请赛已升级为国际赛事，汇聚LPL、LCK等六大赛区12支战队，落地北京亦庄。", "source": "新浪游戏", "url": "https://k.sina.com.cn/article_7857201856_1d45362c001908py50.html"}, {"id": "n15", "category": "娱乐影视", "scope": "国内", "title": "2026国庆档总票房破9亿元，《神探之痕迹》领跑", "summary": "据灯塔专业版，2026国庆档（10月1日—7日）电影总票房（含预售）已突破9亿元，连续5天单日票房破亿。陈思诚执导、张译马丽主演的《神探之痕迹》以超2.78亿元断层领跑，年度总票房随之突破300亿元。", "source": "新浪娱乐/灯塔专业版", "url": "https://ent.sina.cn/2026-10-05/detail-iniuevrv2562313.d.html"}, {"id": "n16", "category": "旅行出行", "scope": "国内", "title": "国庆返程高峰：6日44个路段易拥堵、79个服务区充电繁忙", "summary": "交通运输部动态研判，10月6日全国高速公路有44个路段易发拥堵，集中在江苏、广东、湖南、安徽、浙江、陕西等省；另有79个服务区充电特别繁忙，主要在湖南、河北、广东。建议错峰返程，可通过“e路畅通”小程序查询桩位。", "source": "交通运输部/央视", "url": "https://news.qq.com/rain/a/20261005A07WSJ00"}, {"id": "n17", "category": "社会民生与教育", "scope": "国内", "title": "董明珠任校长的格力技工学校首届新生开学", "summary": "10月4日至5日，由格力电器打造、董明珠担任校长的珠海市格力技工学校迎来首届新生，报到首日326人入学、六成来自省外，首届超8000人报名、招录比约27:1。学校设九大专业，推行“入校即入企、毕业即适岗”模式。", "source": "腾讯新闻/中国珠海发布", "url": "https://new.qq.com/rain/a/20261005A03F3R00"}]}};</script>

      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
