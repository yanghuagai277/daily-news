: "https://www.163.com/dy/article/L9JA0D6M0514R9P4.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "特朗普宣布对伊朗“最严经济行动”，霍尔木兹谈判陷僵局", "summary": "当地时间10月19日，特朗普宣布对伊朗采取“有史以来最严厉的经济行动”，称将孤立伊朗并切断其石油走私与金融渠道。此前伊朗外长表示“七日计划”（七日内重开霍尔木兹海峡）提议仍有效，美方暂停与伊对话，重开海峡谈判再陷僵局。", "source": "环球网", "url": "https://hqtime.huanqiu.com/share/article/4SsSS4pHqfj"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "法国大规模抗议演变为骚乱，2397人被捕", "summary": "10月17日，法国多地爆发抗议生活成本高涨的示威，部分演变为暴力冲突，多座市政厅遭纵火、商铺被洗劫。法国内政部统计全国约55万人参与，2397人被捕，997名警察和宪兵受伤；马克龙谴责暴力，总理将于19日召开危机会议。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34278496"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "2026金融街论坛年会北京开幕，四部门负责人将演讲", "summary": "2026金融街论坛年会10月19日至22日在北京举办，主题为“开放·合作·包容——共筑全球金融发展新生态”，40多个国家和地区400余位嘉宾出席。潘功胜、丁向群、吴清、朱鹤新将作主题演讲，集中发布系列金融改革发展政策。", "source": "中国经济网", "url": "https://www.ce.cn/macro/more/202610/t20261019_3262384.shtml"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "上市公司年内现金分红破2万亿元，超130家企业三季报预喜", "summary": "金融街论坛年会开幕之际，数据显示上市公司年内现金分红总额已突破2万亿元，以真金白银回馈投资者；超130家企业三季报预喜，AI产业链维持高景气，公募基金三季报陆续披露、调仓聚焦产业趋势。", "source": "新华财媒", "url": "https://news.qq.com/rain/a/20261019A03GOG00"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "全国秋粮收获过七成，已收购中晚稻1800万吨", "summary": "农业农村部最新调度显示，全国秋粮收获已过七成（东北过六成、黄淮海与西南过八成）。国家粮食和物资储备局称各地秋粮旺季收购有序展开，各类经营主体已收购中晚稻1800万吨；农发行提前安排2000亿元专项信贷资金收购。", "source": "中国经济网", "url": "http://bgimg.ce.cn/xwzx/gnsz/gdxw/202610/t20261019_3262499.shtml"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "央视曝光近视防控镜片乱象，江苏丹阳立案调查", "summary": "央视《每周质量报告》曝光近视防控镜片问题：丹阳部分商户一款多点离焦镜片批发价仅30元，零售参考价却标1980元；部分产品标识不规范、发布虚假广告。丹阳市监局通报基本属实，已对4家经营主体立案调查。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261019A02SUG00"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "我国首次太空培育两代水稻取得新突破", "summary": "神舟二十三号乘组已在轨超4个月，近期完成新一批水稻实验样品采集、播种与存储，我国首次太空培育两代水稻取得新突破。实验旨在解析长期微重力对水稻遗传稳定性的作用机制，未来有望实现地外粮食“原位”生产。", "source": "央视网", "url": "https://news.cctv.co     if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
