<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}

<script>window.__DATA__ = {"today": {"date": "2026-09-14", "generatedAt": "2026-09-14T07:20:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席金砖国家领导人第十八次会晤第二阶段会议并发表重要讲话", "summary": "当地时间9月13日上午，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第二阶段会议，发表题为《筑牢金砖合作根基 壮大全球南方力量》的重要讲话，就深化金砖合作提出人工智能开源普惠、贸易投资便利化等5项倡议。会议通过《新德里宣言》，中国将于2027年接任金砖轮值主席国。当晚习近平圆满结束与会行程返回北京。", "source": "人民日报", "url": "https://politics.people.com.cn/n1/2026/0914/c1024-40797886.html"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "美伊冲突持续：伊朗锡里克传出爆炸巨响，沙特关键输油管道中断", "summary": "据伊朗方面14日凌晨消息，霍尔木兹甘省锡里克地区传出数声爆炸巨响，性质尚未明确。美国总统特朗普13日重申，伊朗战事将在11月中期选举后结束，并称伊方“非常希望达成协议”。交易商及消息人士称，上周无人机袭击迫使沙特关闭大型东西向输油管道，若数日内不能恢复，全球石油供应恐损失4%。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7685157196400820790/"}, {"id": 3, "category": "财经经济与就业", "scope": "国内", "title": "央行连续4个工作日开展隔夜逆回购，单日操作上限6000亿元", "summary": "中国人民银行近日公告，9月14日至17日将连续四个工作日开展隔夜逆回购操作，每日操作量不超过6000亿元，采用固定利率、数量招标。这是今年6月新设的短期工具继8月后再次覆盖税期前后关键时点。分析认为，此举旨在熨平日间资金波动、守住短端利率，并非降准降息式“大水漫灌”。", "source": "每日经济新闻", "url": "https://www.nbd.com.cn/articles/2026-09-13/4580169.html"}, {"id": 4, "category": "财经经济与就业", "scope": "国际", "title": "中东局势推升油价，布伦特原油涨超3%重回107美元/桶", "summary": "北京时间9月14日，受中东冲突升级、沙特输油管道中断影响，国际油价集体拉升，布伦特原油期货涨超3%重回107美元/桶，纽约原油涨近3%；美股股指期货全线下跌，纳指期货跌超1%，比特币跌破7.7万美元。本周迎来“央行超级周”，市场预计美联储将开启年内首次加息。", "source": "21世纪经济报道", "url": "https://news.qq.com/rain/a/20260914A034MC00"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "AI三巨头罕见齐声呼吁放缓前沿AI研发，警示失控风险", "summary": "Anthropic首席执行官阿莫代伊12日发文警告AI风险“严峻”，须放慢模型能力提升步伐，并建议引入具员工同等权限的第三方评估团队。OpenAI首席执行官奥尔特曼与xAI创始人马斯克均公开表示支持。美媒称，这一立场一致凸显对AI的担忧正从行业边缘走向中心，但合作限发展或触及反垄断争议。", "source": "环球时报", "url": "https://www.toutiao.com/article/7685155521159594550/"}, {"id": 6, "category": "汽车出行", "scope": "国内", "title": "九部门发布智能网联新能源汽车“十五五”规划，2030年新能源乘用车占比70%", "summary": "工信部等九部门近日印发《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年新能源乘用车、商用车新车销量占比分别达70%、40%，高速公路等场景实现高度自动驾驶。2020—2025年我国新能源汽车年销量从136.7万辆增至1649万辆，渗透率由5.4%升至47.9%，已超额完成前期目标。", "source": "环球网", "url": "https://www.toutiao.com/article/768515548875277828/"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞称沙特24小时58次空袭；印尼客轮倾覆6死上百失踪", "summary": "也门胡塞武装13日称，过去24小时沙特对塔伊兹、荷台达等6省发动58次空袭；也门政府军称与胡塞在一个月冲突中伤亡约2000人，胡塞方面1000多人死亡。另据印尼方面消息，一艘载约243人的客轮13日倾覆沉没，截至14日上午已致6死、110人获救，仍有上百人失踪，船上无中国公民。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685148948562067983/"}, {"id": 8, "category": "战争与自然灾害", "scope": "国内", "title": "海南持续强降雨 多地发布暴雨红色预警，约4500艘渔船回港避风", "summary": "受南海热带低压残余环流与冷空气共同影响，海南岛13日以来普降暴雨到大暴雨、局地特大暴雨，保亭毛感乡12小时降雨量达362毫米。气象台继续发布暴雨红色预警，水利部针对海南启动洪水防御Ⅳ级应急响应，约4500余艘渔船已回港避风，预计14日南部部分地区仍有大暴雨。", "source": "国家气象中心", "url": "https://www.nmc.cn/publish/alarm/46902941600000_20260914020905.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "引力一号遥三火箭预计9月16日东海发射；北京6G空天地一体实验室发布", "summary": "据“海阳发布”消息，预计9月16日上午，由海阳东方航天港总装出厂的引力一号（遥三）运载火箭将搭乘发射船在东海海域发射。作为全球运力最大的固体火箭，其成功将进一步验证批量化发射能力。此外，中国联通研究院联合多家企业发布北京6G空天地一体实验室，国家超算互联网注册用户已突破170万。", "source": "每日经济新闻", "url": "https://news.qq.com/rain/a/20260914A0363800"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "SpaceX完成第700次猎鹰火箭发射，为SES送最后3颗卫星", "summary": "北京时间9月14日2时49分，SpaceX从佛罗里达发射猎鹰9号，为商业客户SES运送3颗卫星，这是其第700次猎鹰发射（含687次猎鹰9号、13次重型）。执行任务的B1080助推器完成第29次飞行并成功海上回收；2026年至今SpaceX已执行107次猎鹰发射，O3b mPOWER星座在中地球轨道卫星增至13颗。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260914A034PK00"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "LPL总决赛AL 3:1击败BLG夺队史首冠，Tarzan当选FMVP", "summary": "在《英雄联盟》LPL2026年总决赛中，AL以3比1击败BLG，捧起队史首座银龙杯，并以赛区一号种子身份直接晋级2026全球总决赛。总决赛系列赛结束后，Tarzan当选FMVP。对一支此前从未在LPL登顶的队伍而言，从“无冠”到“一号种子”仅隔一个总决赛系列赛。", "source": "网易", "url": "https://www.163.com/dy/article/L6P2409705561FZL.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "中网参赛阵容出炉，郑钦文、辛纳、德约科维奇等名将确认参赛", "summary": "随着2026美国网球公开赛临近尾声，中国网球公开赛参赛阵容渐完整，郑钦文、辛纳、德约科维奇、莱巴金娜、萨巴伦卡等名将均确认参赛，新科美网青少年女单冠军孙心然也将持外卡首次亮相中网女单正赛。同期，中国选手包揽2026年WDSF世界霹雳舞3V3混合团体锦标赛冠亚军。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-14/detail-ihfizwvu6760267.shtml"}, {"id": 13, "category": "游戏电竞", "scope": "国内", "title": "2026DFPL夏季赛季后赛车轮战开打，16支队伍角逐", "summary": "《三角洲行动》2026 DFPL夏季赛常规赛结束，季后赛于9月11日至13日开启。16支队伍率先进行六场车轮赛：常规赛前6名在首场交手，其余10队两两进入后续场次，每场结束后后4名落位下一场，直至六场全部结束。首场由EGG、eStar、SYG、JXG、杭州LGD、IBG同场竞技。", "source": "腾讯游戏", "url": "https://df.qq.com/cp/a20240906main/newsdetail.html?id=13198094453735269962"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "研究提示：腹型肥胖者或更缺维生素D，二者可能互为因果", "summary": "英国伦敦大学学院等发表于《糖尿病、肥胖与代谢》的研究显示，腹型肥胖与维生素D缺乏均升高死亡风险，二者并存时风险大幅攀升。专家解释，维生素D为脂溶性，会被大量脂肪“封存”难以释放；而缺乏维D又易致脂肪堆积、腰围增粗，形成恶性循环。男性腰围≥90厘米、女性≥85厘米即属腹型肥胖。", "source": "中国经济网", "url": "http://fashion.ce.cn/yw/202609/t20260914_3210836.shtml"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "财税与绿色金融推动经济“向绿”转型，清洁能源发电销售收入同比增17.1%", "summary": "最新税收数据显示，上半年生态保护和环境治理业销售收入同比增6.9%，以风、光、水、核为代表的清洁能源发电销售收入同比增17.1%，占电力生产销售收入38.8%。“十四五”中央财政累计下达污染防治和生态文明建设资金超2.3万亿元；挥发性有机物环境保护税试点将于2027年1月1日启动。", "source": "经济日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1436aa7280281952"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "“百社千校新疆行”走进和田，推动优质阅读资源下沉基层", "summary": "9月6日至8日，“百社千校新疆行”阅读推广活动在新疆和田举办，聚焦青少年阅读素养提升。出版单位代表、作家与阅读推广人走进多所中小学，开展图书捐赠与讲座。作家刘亮程在和田学院与师生探讨阅读与文学创作，库尔班大叔曾孙女如克亚木等也参与推广，助力书香校园建设。", "source": "人民日报海外版", "url": "https://paper.people.com.cn/rmrbhwb/pc/content/202609/14/content_30180928.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "“请3休13”拼假带火中秋国庆长线游，赏秋目的地订单翻倍", "summary": "2026年中秋、国庆仅隔3天，“请3休13”拼假方案走红，形成近年少有超长出行窗口。途牛数据显示，超35%游客提前出发、超10%错峰出行，6天以上中长线占预订31%，10天以上超长行程占26%。九寨沟、伊春等赏秋目的地民宿订单同比涨超3倍，家庭及三代同游占比超七成。", "source": "中工网", "url": "https://www.workercn.cn/papers/grrb/2026/09/14/4/news-9.html"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "中央组织部等5部委修订印发“5个办法”加强事业单位领导人员管理", "summary": "日前，中央组织部分别会同中央宣传部、教育部、科技部、国家卫生健康委，修订印发宣传思想文化、高校、中小学校、科研事业单位、公立医院等5个领导人员管理办法，进一步完善事业单位领导人员管理制度体系，为建设高素质专业化队伍提供制度保障。同时，中央网信办等三部门印发数字乡村高质量发展行动计划。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685151246822490664/"}]}, "yest": {"date": "2026-09-13", "generatedAt": "2026-09-13T06:02:58+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席金砖国家领导人第十八次会晤并发表重要讲话", "summary": "当地时间9月12日，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第一阶段会议，发表《共担时代责任 勇做先锋力量》重要讲话，提出人工智能赋能新型工业化等三大先锋主张，并宣布中国将于明年接任金砖主席国、主办第十九次会晤。", "source": "新华网/央视", "url": "https://www.news.cn/world/20260912/3286d45fd68a49c2b7b04579ba25795b/c.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "25位菲尔兹奖得主联合警告：AI与数学正“严重错位”", "summary": "当地时间9月11日，陶哲轩、邓煜等25位菲尔兹奖得主联合发表《人工智能在数学中的严重错位》声明，警告AI企业将解题当作能力基准，可能损害数学界对概念理解与人才培养的核心目标，呼吁警惕批量生成答案摧毁思想土壤。", "source": "新京报/网易", "url": "https://www.163.com/dy/article/L6LL82IA0512D3VJ.html"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "华为三折叠新机Mate XT 2开售即售罄，19999元起", "summary": "9月12日10:08，华为三折叠旗舰Mate XT 2非凡大师全渠道首销，起售价19999元，各版本及配色开售数分钟即售罄；搭载麒麟9050Pro、10.2英寸屏、3.5mm超薄机身，代抢费一度炒至5000元。", "source": "湖南日报/财联社/今日头条", "url": "https://www.toutiao.com/article/7684546614664413732/"}, {"id": 4, "category": "财经经济与就业", "scope": "国际", "title": "中东局势缓和油价回落，美股道指涨509点终结四连跌", "summary": "9月12日，尽管美国8月核心CPI超预期、美联储下周加息概率升至近九成，但中东缓和带动油价自四个月高位回落，叠加甲骨文资本开支引爆AI算力预期，道指收涨509点终结四连跌，纳指涨0.96%，戴尔飙涨近12%创新高。", "source": "华尔街见闻/今日头条", "url": "https://www.toutiao.com/article/7684687021536789018/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "《中国矿产资源报告2026》发布：14种矿产储量居世界第一", "summary": "9月11日发布的《中国矿产资源报告2026》显示，截至“十四五”末，我国稀土、钨、锡、钼等14种矿产储量居世界第一位，9种居前四位；2025年17种矿产产量世界第一，稀土冶炼产品占全球94%，产业链主导地位持续巩固。", "source": "央广网/自然资源部", "url": "https://www.cnr.cn/newscenter/dj/20260911/t20260911_527810868.shtml"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞称过去48小时沙特对也门发动129次空袭", "summary": "也门胡塞武装12日称，过去48小时沙特战机对也门7省发动129次空袭；此前胡塞已控制曼德海峡战略要地佩里姆岛及西部海岸，沙特东西输油管道遭无人机袭击后预防性关闭，红海航运与全球能源供应承压。", "source": "新华社/搜狐", "url": "https://www.sohu.com/a/1075358868_119038"}, {"id": 7, "category": "战争与自然灾害", "scope": "国内", "title": "青岛北海造船厂外籍货轮检修起火，25人遇难", "summary": "9月10日11时15分许，中国船舶集团青岛北海造船有限公司一艘外籍货轮靠港维修期间起火，船上42人中12人安全撤出、5人受伤，25名失联人员于当晚19时24分全部找到、均无生命体征；习近平作出重要指示，事故原因正调查。", "source": "人民网/人民日报", "url": "https://sd.people.com.cn/BIG5/n2/2026/0911/c166192-41693788.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "“红通人员”、瑞金市原扶贫办主任曾能贵被引渡回国", "summary": "近日，在中央追逃办统筹协调下，经国际执法司法合作，“红通人员”、江西省瑞金市原扶贫和移民办主任曾能贵被引渡回国。其涉嫌在扶贫项目中受贿，2024年1月外逃，今年1月被国际刑警组织发布红色通报，系“天网2026”行动成果。", "source": "中国新闻网/央视", "url": "https://m.chinanews.com/wap/detail/cht/zw/10695307.shtml"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "周伯文浦江论坛提出“科学研究是下一个编程”", "summary": "9月12日浦江创新论坛主论坛上，上海人工智能实验室主任周伯文提出“科学研究是下一个编程”，指出AI与科学将形成双轮驱动——单克隆抗体研发从4年压缩至90天，AI正从工具变为科研常驻参与者，但科学探索的罗盘仍应由人类掌握。", "source": "上观新闻/文汇报", "url": "https://www.jfdaily.com/staticsg/res/html/web/newsDetail.html?id=1175891&sid=11"}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "亚运会男篮中国105:59胜巴林，两连胜提前锁定八强", "summary": "9月12日名古屋亚运会男篮小组赛，中国队以105:59大胜巴林队豪取两连胜，凭借净胜84分提前锁定八强席位；全队11人登场全部得分，廖三宁23分6助攻、李悦洲6投全中18分，下一场将冲击小组第一。", "source": "新华网/新华社", "url": "https://www.news.cn/20260913/bedd5a42310f45d19871feb606ef1e70/c.html"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "研究：走路护心有“黄金组合”，每日7500至1万步+快走最佳", "summary": "《英国运动医学杂志》9月刊登一项追踪超6.4万人、历时8年的研究：每日7500—10000步且峰值步频约100步/分钟时，全因死亡风险最低（降43%）；步数不足者提速同样获益，超1万步性价比反而下降，“过犹不及”。", "source": "人民日报健康客户端/腾讯", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6076aa4fcb584952"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "国家防总针对海南启动防汛四级应急响应", "summary": "受南海热带低压（或成今年首个秋台风“杜鹃”）影响，9月13日至15日海南岛等地有大到暴雨、局地大暴雨，山洪地质灾害及城市内涝风险高。国家防总于9月12日19时对海南启动防汛四级应急响应。", "source": "央视新闻/应急管理部", "url": "https://news.qq.com/rain/a/20260912A0B4H800"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "九部门印发智能网联新能源汽车“十五五”规划", "summary": "工信部等九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年新能源乘用车、商用车新车销量占比分别达70%、40%，具备自动驾驶功能汽车规模应用，并首次将“产能预警调控”写入规划，推动落后产能有序退出。", "source": "第一财经/腾讯证券", "url": "https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?_tentrees_trans=0&id=SN20260911133201b624342d"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "2026暴雪嘉年华重启，魔兽/暗黑/星际/守望重磅前瞻", "summary": "暌违两年，暴雪嘉年华于9月12日至13日在美国阿纳海姆重启。开幕式对应北京时间13日凌晨1:30免费直播；四款核心IP成焦点——《魔兽世界》新资料片《最后的泰坦》、暗黑30周年回顾、星际神秘新作及守望先锋新英雄预告，并举办多项电竞赛事总决赛。", "source": "游民星空", "url": "https://www.gamersky.com/news/202609/2208376.shtml"}, {"id": 15, "category": "文化读书", "scope": "国际", "title": "第28届圣保罗国际图书双年展9月13日闭幕", "summary": "拉丁美洲最大书展——第28届圣保罗国际图书双年展于9月4日至13日在巴西圣保罗举行，以“情感盛宴”为主题，展览面积8.6万平方米（较上届增28%），汇聚350位作家、269家展商，西班牙首次担任主宾国，预计吸引超70万人次。", "source": "百度百科/北青网", "url": "https://baike.baidu.com/item/%E7%AC%AC28%E5%B1%8A%E5%9C%A3%E4%BF%9D%E7%BD%97%E5%9B%BD%E9%99%85%E5%9B%BE%E4%B9%A6%E5%8F%8C%E5%B9%B4%E5%B1%95/68521282"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "京雄快线开启全线贯通试运行，雄安可直达北京草桥", "summary": "9月12日，京雄快线正式启动全线贯通试运行。该线起自雄安城际站、全长约86公里，是国内首条设计时速200公里、公交化运营的轨道快线，接入北京地铁大兴机场线贯通至草桥，未来从雄安“半小时到大兴机场、一小时到北京丽泽”。", "source": "中国新闻网/央视", "url": "https://www.chinanews.com/cj/2026/09-12/10695252.shtml"}, {"id": 17, "category": "国际时事", "scope": "国际", "title": "欧盟委员会批准61亿欧元援乌资金", "summary": "欧盟委员会11日批准向乌克兰提供61亿欧元资金，用于采购防空反导系统、弹药、无人机和电子战设备等，乌克兰可借此采购“爱国者”PAC-3导弹。该笔资金来自900亿欧元援乌贷款，至此2026年度283亿欧元国防援助已全部分配完毕。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=4982214393469695162"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
