ary": "当地时间26日，第20届名古屋亚运会中国代表团在射击女子50米步枪三姿团体项目摘得第100金，当日共夺9金，累计107金41银28铜稳居榜首。男足3:0胜泰国时隔28年重返四强，跳水、乒乓球混双同步夺冠。", "source": "中国新闻网", "url": "https://finance.sina.com.cn/roll/2026-09-27/doc-initerwy0716544.shtml"}, {"id": 8, "category": "体育赛事", "scope": "国内", "title": "亚运会27日迎35金高峰日 乒乓田径多项冲金", "summary": "9月27日是名古屋亚运会开幕后第8个比赛日，全天将产生35枚金牌。乒乓球男女单打、男双上演中日对决，田径女子标枪、200米及女子100米栏等焦点决赛登场，跳水与自由式小轮车冲击亚运历史首金。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260927A02VX700"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国多项硬核工程接连突破 海上风机与水电装备领跑", "summary": "本周我国多项硬核工程接连突破：首个规模化应用18兆瓦海上风机项目全容量投运；最大直径双护盾硬岩掘进机“越喜号”（开挖直径13.01米）下线；全球单机容量最大500兆瓦冲击式水电机组转轮交付；首条跨海市域铁路宁象线通车。", "source": "网易", "url": "https://www.163.com/dy/article/L7QKM7330514R9L4.html"}, {"id": 10, "category": "环境气候", "scope": "国际", "title": "第26号台风“舒力基”升为台风级 趋向日本以南洋面", "summary": "中央气象台27日消息，今年第26号台风“舒力基”凌晨由强热带风暴级加强为台风级，中心附近最大风力13级，将趋向日本以南洋面。同期发布强对流预警，浙江、上海、辽宁等地局地有雷暴大风或冰雹，地质灾害气象风险预警同步升级。", "source": "中央气象台", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9906ab8527234852"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "60后“新银发”消费颠覆：近六成优先保障自身健康养老", "summary": "中国老龄协会调查显示，58.3%的60后新银发明确“先保障自己的健康养老、有余力再支持子女”。这一群体人均可支配收入是前代的2至3倍，旅游度假、健康养生消费占比约七成，正从“被照顾”转向自主决策生活。", "source": "今日头条", "url": "https://www.toutiao.com/article/7689977787741930022/"}, {"id": 12, "category": "游戏电竞", "scope": "国内", "title": "亚运电竞王者荣耀9月27日开赛 中国卫冕首战老挝", "summary": "第20届亚运会电竞项目9月27日正式开赛，王者荣耀亚运版本与和平精英亚运版本两天内决出金牌。中国队作为卫冕冠军，王者荣耀首战对阵老挝队，决赛采用BO7赛制，央视及多个平台全程直播。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-21/detail-inisppwf1016188.d.html"}, {"id": 13, "category": "旅行出行", "scope": "国内", "title": "中秋出行高位运行 26日跨区域流动超2.1亿人次", "summary": "中秋假期第二天（26日）出行客流保持高位，交通运输部数据显示全社会跨区域人员流动量预计超2.1亿人次。两岸“小三通”航线增开20个航班，预计出入境旅客超2.4万人次，日均客流较9月中上旬增长约34%。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34158631"}, {"id": 14, "category": "文化影视", "scope": "国内", "title": "2026中秋档电影票房破2亿 超20部新片集中上映" 上海开出首张处方并完成首例植入手术，已纳入“沪惠保”保障。", "source": "证券时报", "url": "https://www.stcn.com/article/detail/4027197.html"}, {"id": 12, "category": "汽车出行", "scope": "国际", "title": "特斯拉Semi电动卡车开启量产交付", "summary": "9月25日，特斯拉宣布Semi电动卡车开启量产交付。该车搭载辅助驾驶功能，配套Megacharger兆瓦级充电功率，标志着电动重卡从示范运行迈向规模化商用，剑指长途货运脱碳。", "source": "每日经济新闻", "url": "https://cd.nbd.com.cn/articles/2026-09-25/4592090.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "吉利发布AI智充 12C神盾金砖电池4分半充至70%", "summary": "9月23日吉利发布新一代AI智充技术，单枪峰值功率2250千瓦，配合12C神盾金砖电池，实测10%至70%充电仅需4分30秒、至97%约8分40秒，刷新全球量产车型补能速度纪录。", "source": "新浪财经", "url": "https://k.sina.com.cn/article_7879848959_1d5acf3ff06801l5xo.html"}, {"id": 14, "category": "文化影视", "scope": "国内", "title": "2026中秋档票房破亿 《复联4》加码臻享版领跑", "summary": "据灯塔专业版，9月25日中秋节全国电影票房达1.19亿元，2026中秋档总票房突破1亿元。《复仇者联盟4：终局之战（加码臻享版）》以4041万元夺冠，多部国产新片上座率偏低遇冷。", "source": "搜狐", "url": "https://www.sohu.com/a/1080993475_114941"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "中秋国庆假期全社会跨区域人员流动量预计达27.8亿人次", "summary": "国新办发布会研判，今年中秋三天跨区域人员流动量约6.5亿人次，国庆七天达21.3亿人次，合计27.8亿；国庆首日或达3.4亿创同期新高，公路自驾占九成以上，铁路预计发送2.84亿人次。", "source": "中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260924_3234565.shtml"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "海南“四城同办”校招收官 提供优质岗位7726个", "summary": "2026年“百万英才兴海南·四城同办”校招活动9月22日收官，组织284家用人单位携7726个岗位走进西安、成都、沈阳、北京四地高校，覆盖工程、AI、生物医药等方向，掀起引才热潮。", "source": "人民网", "url": "https://www.163.com/dy/article/L7O5I27705346936.html"}, {"id": 17, "category": "环境气候", "scope": "国际", "title": "台风“杜鹃”已致日本12死3失踪 多地发布警报", "summary": "据日方消息，今年第25号台风“杜鹃”已在日本造成12人死亡、3人下落不明。台风带来强风暴雨与山体滑坡风险，日本气象部门对多地区发布警报，救援与灾情核查工作持续进行。", "source": "央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1566ab702ee56852"}]}};</script>

    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
