 "环球网", "url": "https://www.huanqiu.com/article/4JxoltT0fBE"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "美国上周首申失业金降至19.4万创三个月新低 韩国央行按兵不动", "summary": "截至10月17日当周，美国初请失业救济人数减少6000人至19.4万，低于预期的20万，四周移动均值降至19.775万、为2022年以来最低。韩国央行在连续两次加息后维持基准利率3.00%不变，并上调经济增长预测。", "source": "华尔街见闻（腾讯新闻）", "url": "https://news.qq.com/rain/a/20261023A02KPS00"}, {"id": 8, "category": "财经经济与就业", "scope": "国际", "title": "OpenAI拟以1.25万亿美元估值完成300亿美元融资 阿联酋领投", "summary": "据市场消息，OpenAI拟以约1.25万亿美元估值完成300亿美元的新一轮融资，由阿联酋投资者领投；与此同时AI资本开支回报疑虑升温，叠加美以与伊朗冲突推高油价，10月22日纳指创6月以来最大单日跌幅、费城半导体指数跌6.72%。", "source": "华尔街见闻（今日头条）", "url": "https://www.toutiao.com/article/7699632006384976399/"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "西藏那曲巴青县7.0级地震已致16人遇难46人伤 启动救助三级响应", "summary": "10月22日22时33分，西藏那曲市巴青县发生7.0级地震，震源深度10公里。截至23日5时20分已造成16人遇难、46人受伤（重伤11人），房屋倒塌及受损339户；西藏启动自然灾害救助三级应急响应，救灾物资已运抵灾区。", "source": "光明网", "url": "https://m.gmw.cn/2026-10/23/content_1304578351.htm"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞武装称对沙特发动多轮袭击 目标含国防部与阿美原油设施 布油突破112美元", "summary": "据多家媒体报道，胡塞武装称对沙特发动多轮袭击，目标包括沙特国防部、沙特阿美原油设施等；美以被曝已制定中期选举后再次打击伊朗的计划，美军正“悄悄”收缩中东驻军规模，地缘紧张推升布伦特原油突破112美元。", "source": "华尔街见闻（网易）", "url": "https://www.163.com/dy/article/L9TI2HPN05198NMR.html"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "神舟二十三号载人飞行任务发布会：乘组将开展100余项科学实验 首次在轨培养两代水稻", "summary": "23日神舟二十三号载人飞行任务新闻发布会介绍，乘组将新开展100余项科学与应用项目，上行9项科学实验、样品及装置总重54.1公斤；将首次在空间站开展钙钛矿电池动态服役实验，并首次在轨培养连续两代水稻以解析长期微重力影响。", "source": "环球时报（凤凰网）", "url": "https://h5.ifeng.com/c/vivo/v002pg--XVE9N4oA1xQnTIb--zsx-_VFvYitKFn4S5VIytwwUs__?isNews=1&showComments=0"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "乒乓球亚锦赛国乒男团3-0横扫韩国 实现4连冠、第26次登顶", "summary": "北京时间23日凌晨，亚洲乒乓球锦标赛男团决赛中国队直落三盘战胜韩国队，连续第4次、历史第26次夺冠。周启豪3-1力克姜东秀，林诗栋3-0击败朴奎炫，向鹏3-1力克朴康贤，在缺少王楚钦的情况下由新阵容完成卫冕。", "source": "新浪新闻", "url": "https://news.sina.com.cn/zx/2026-10-23/doc-iniwcnuz5164915.shtml"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "雄安“双向奔赴山海行”全国班级手拉手 8所新建校对接30省153个班级", "summary": "雄安新区新建校园陆续迎来青海、云南、西藏等地“小客人”，通过“云端”与线下联动开展手拉手共建。目前“双向奔赴山海行”全国班级（中队）手拉手项目已为雄安8所新建中小学、幼儿园对接全国30个省区市的153个班级、8482名学生。", "source": "央视网", "url": "https://news.cctv.com/2026/10/23/ARTI9YV9oqt8YKOSgn2G7WGr261023.shtml"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "霜降将至 国家中医药管理局分享老年人秋季调护方法", "summary": "霜降节气将至，国家中医药管理局举行发布会分享中医调护：皮肤干痒应养血润肤、洗澡每周2至3次；睡不安可睡前泡脚、按揉神门穴与安眠穴；腰腿痛可热敷膝盖腰部15分钟，并多吃黑豆、核桃、山药、枸杞等补肾强腰食物。", "source": "央视网", "url": "https://news.cctv.com/2026/10/23/ARTI6V80MdnYMmgj8V9w3yqn261023.shtml"}, {"id": 15, "category": "健康养生", "scope": "国际", "title": "世卫组织：刚果（金）埃博拉疫情反弹 累计确诊9637例、死亡4646例", "summary": "世界卫生组织非洲区域办事处10月21日疫情报告显示，刚果（金）本轮埃博拉疫情出现反弹，近期新增确诊数再次上升，截至10月19日累计报告确诊病例9637例、死亡4646例，疫情已波及全国26个省中的8个省并向邻国蔓延。", "source": "健康报（腾讯新闻）", "url": "https://news.qq.com/rain/a/20261023A02C2O00"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "我国电动汽车充电基础设施总数达2477.7万个 特斯拉Optimus进入量产爬坡", "summary": "国家能源局数据显示，截至2026年9月底我国电动汽车充电基础设施（枪）总数达2477.7万个，同比增长37.2%，其中私人充电设施1957万个、同比增44%。特斯拉在三季度财报中确认Optimus人形机器人已开始在弗里蒙特工厂量产爬坡。", "source": "每日经济新闻（今日头条）", "url": "https://www.toutiao.com/article/7699631308854526492/"}, {"id": 17, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛瑞士轮开打 LPL四队出战、T1争四连冠", "summary": "2026英雄联盟全球总决赛瑞士轮于10月23日（北美时间）在美国得州阿伦开打，16支队伍角逐八强，采用“三胜晋级、三负淘汰”；LPL四队IG、TES、BLG、AL全员直通，T1作为LCK三号种子首战巴西LOS，冲击史无前例的四连冠。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261023A021SG00"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "2026武汉书展暨第21届华中图书交易会10月23日开幕 发放200万惠民券", "summary": "10月23日至25日，2026“书香长江”阅读周·武汉书展暨第21届华中图书交易会在湖北出版文化城举办，集结近600家出版文创机构、展出近6万种图书与文创，发放200万元文化惠民补贴，图书叠加券后最低可享3折，并首设“书友之夜”夜场。", "source": "央广网", "url": "https://www.cnr.cn/hubei/yw/20261015/t20261015_527842911.shtml"}]}, "yest": {"date": "2026-10-22", "generatedAt": "2026-10-22T12:05:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "中办、国办发布意见 全面实施“人工智能+”行动", "summary": "中办、国办发布《关于推动科技创新和产业创新深度融合的意见》，提出全面实施“人工智能+”行动，推动AI全方位赋能千行百业；以先进技术改造提升传统产业，加速工业互联网与设备更新。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261022A0284M00"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "美接连限制中国AI企业 商务部回应将采取必要措施", "summary": "美国国土安全部19日下令联邦机构移除中国AI企业深度求索（DeepSeek）技术并禁购其产品，国务院另制裁5家中企。商务部20日两度回应，称将采取必要措施维护中国企业正当权益。", "source": "国际金融报", "url": "https://www.ifnews.com/news.html?aid=878346&cid=49"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic公布Claude 64小时生成31.8万种蛋白设计", "summary": "Anthropic公布Claude在64小时内生成31.8万种蛋白设计，针对5种蝎毒筛出211个候选交实验室测试，17种达到结合标准，最快解离常数达个位数纳摩尔级，但尚未验证中和毒素能力。", "source": "腾讯研究院", "url": "https://www.sohu.com/a/1090863002_455313"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美以被曝拟中期选举后再次打击伊朗", "summary": "据《纽约时报》21日报道，美以军方已制定计划，拟美国中期选举后恢复对伊朗打击，潜在目标含能源设施、核设施及导弹无人机武器库；本周数十架以军战机逼近伊朗边境模拟打击。", "source": "中国新闻网", "url": "https://www.toutiao.com/article/7699336547992125992/"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "沙特机场遭袭致1死8伤 美下令撤离非紧急人员", "summary": "沙特达曼法赫德国王国际机场21日晚遭袭，造成1死8伤；同日沙特东部谢拜油田遭无人机袭击致2死2伤。美国国务院已下令驻沙特“非紧急”政府雇员及家属撤离。", "source": "华尔街见闻", "url": "https://www.163.com/dy/article/L9R287KS05568W0A.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "新兴领域良性循环加快形成 高技术制造贡献超五成工业增长", "summary": "人民网文章指出，高技术制造业以两成多增加值占比贡献超五成工业增长；前三季度高新技术产品出口合计超10万亿元、增长58.9%，1—8月规上高技术制造业利润同比增54.7%。", "source": "人民网", "url": "https://finance.people.com.cn/n1/2026/1022/c1004-40819179.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "全国城市联合招聘秋季专场推出155场就业服务活动", "summary": "人社部推出2026年全国城市联合招聘高校毕业生秋季专场新一批155场就业服务活动，含105场专场招聘、11场跨区域巡回招聘、29场直播带岗，覆盖人工智能、新能源等重点行业。", "source": "光明网", "url": "https://news.gmw.cn/2026-10/22/content_39059149.htm"}, {"id": 8, "category": "战争与自然灾害", "scope": "国内", "title": "超强台风“蔷琵”逼近东南沿海 国家防总启动四级响应", "summary": "今年第30号超强台风“蔷琵”22日5时位于台北东南约750公里洋面，中心最大风力16级。国家防总启动防台风四级应急响应，浙闽沿海部署防御、渔船回港避风、人员撤离上岸。", "source": "界面新闻", "url": "https://www.toutiao.com/article/7699299876089135659/"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "科学家发现首例确凿的黑洞重复潮汐瓦解恒星事件", "summary": "中国科学技术大学团队在《中国科学报》发表成果，发现首例确凿的黑洞重复潮汐瓦解恒星事件AT2023uqm，为研究恒星被黑洞反复“啃噬”逐步走向瓦解提供了天然实验室。", "source": "中国科学技术大学", "url": "https://news.ustc.edu.cn/info/1056/96664.htm"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "谷神星一号海射型遥八发射成功 西光肆号01星入轨", "summary": "21日11时39分，我国在山东日照附近海域成功发射谷神星一号海射型遥八运载火箭，搭载西光肆号01星进入预定轨道，标志全球首个低倾角民用遥感星座启动建设。", "source": "光明网", "url": "https://www.toutiao.com/article/7699231971318301238"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "体操世锦赛中国女团时隔20年再夺金 男团锁定奥运席位", "summary": "2026体操世锦赛中国女团以165.764分力压美日时隔20年再夺金牌、打破美国7连冠，并直通洛杉矶奥运会；男团获季军同样锁定奥运参赛席位。", "source": "网易体育", "url": "https://www.163.com/dy/article/L9RAFRCG0549GGF5.html"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "世界传统医药日 国家中医药管理局发布基层中医适宜技术手册", "summary": "10月22日世界传统医药日，国家中医药管理局发布《基层中医适宜技术手册（2026版）》，明确11类70项技术禁忌与操作规范，并提示拔罐刮痧并非越黑越排毒、留罐不超15分钟。", "source": "国家中医药管理局", "url": "http://mp.weixin.qq.com/s?__biz=MzUyMzEwOTc2OQ==&mid=2247505133&idx=1&sn=f4e21c4b88674e9066722590e308f530&chksm=f8a60b1e0be39d22e1adcf8b5541ae7524472190631a5cd3cb26f38a9d483f570073d282a9ef#rd"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "2026世界智能网联汽车大会开幕 工信部称L2搭载率已超70%", "summary": "2026世界智能网联汽车大会21日在北京开幕，工信部称将稳妥有序扩大场景应用。中科协数据显示2026上半年我国乘用车L2级辅助驾驶搭载率已超70%，预计2030年达95%以上。", "source": "新华每日电讯", "url": "http://mrdx.cn/h5/mrdx/content/20261022/Articel09003NR.htm"}, {"id": 14, "category": "游戏电竞", "scope": "国内", "title": "英雄联盟S16全球总决赛瑞士轮24日开打 LPL四队出战", "summary": "2026英雄联盟全球总决赛（S16）瑞士轮24日在美国开打，LPL四队IG、TES、BLG、AL全员直通；本届10月15日开赛、11月15日纽约决赛，采用“无畏征召”机制、BP规则革新。", "source": "18183游戏网", "url": "https://www.18183.com/gonglue/202610/i03e30ej.html"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026“不畅销”图书市集回归北京西单更新场", "summary": "2026“不畅销”图书市集22日至11月3日回归北京西单更新场，集中近两万本残书、微瑕书与新书1至4折售卖，并公开部分曾寄予厚望却未畅销书籍的预期销量、实际销量与编辑手记。", "source": "浦睿文化", "url": "http://mp.weixin.qq.com/s?__biz=MjM5ODk4NTExMw==&mid=2652098353&idx=1&sn=990e519207699cddcc50233e83596046&chksm=bc3001e4af5f9031ac88568cd2eac450fcb881efd868fd4ae0f378fd6f4ad7c0404465fc21d8#rd"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "全国碳市场配额累计成交量突破10亿吨 全球规模最大", "summary": "国新办21日发布《中国应对气候变化的政策与行动2026年度报告》。生态环境部称全国碳排放权交易市场五年多建成全球规模最大，配额累计成交量突破10亿吨，2027年扩围至石化、化工等行业。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/22/ARTICPmRpS5YZvpQVE5bWNqU261022.shtml"}, {"id": 17, "category": "社会民生与教育", "scope": "国内", "title": "四川印发方案 随迁子女教育保障纳入常住地公共服务", "summary": "四川省政府办公厅印发《推行常住地提供基本公共服务的实施方案》，要求加强随迁子女教育保障、动态增补公办学位、保障义务教育入学权益，到2030年未落户常住人口与户籍人口同等享有基本公共服务。", "source": "四川省人民政府", "url": "https://www.sc.gov.cn/10462/zfwjts/2026/10/20/05a42042f64b4f978a5836a751126832.shtml"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "国庆后错峰游黄金期 四条10天实测线路分人群", "summary": "国庆后错峰出游黄金期来临，新浪旅游梳理4条10天实测线路：额济纳胡杨+漠河约4000元、龙脊梯田约3500元、广西边海线人均3000元、川西稻城4000至6000元，秋色正浓、人潮回落。", "source": "新浪旅游", "url": "https://travel.sina.cn/2026-10-19/detail-inivtchx6251478.d.html"}]}};</script>

<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
