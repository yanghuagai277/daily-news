进稳岗扩容提质行动，提出构建“管产业就要管就业、促消费就要促就业、上项目就要扩就业”的“大就业”工作格局，确保各项重点任务如期完成。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20261104A03L3700"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "中小学校教室采光和照明卫生强制性新国标实施", "summary": "强制性国家标准《中小学校教室采光和照明卫生标准》11月1日起正式实施，新增采光均匀度、冬至日满窗日照时间、照明色温与显色指数等指标，全部技术条款均为强制性，旨在守护中小学生视力健康、防控近视。", "source": "工人日报", "url": "https://www.workercn.cn/papers/grrb/2026/11/04/5/news-4.html"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "NASA“雨燕”伽马射线暴太空望远镜失控再入大气层", "summary": "运行近22年的NASA“雨燕”伽马射线暴望远镜因未装推进系统、受太阳活动致轨道衰减，于11月4日前后失控再入大气层。其观测过2000余次伽马暴，约1.5吨中或有超100公斤碎片落至地表，NASA估计伤人概率约1/2100。", "source": "环球网", "url": "https://www.toutiao.com/article/7704081861567365647/"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "力箭二号遥二发射成功，千帆星座在轨卫星升至274颗", "summary": "11月3日8时15分，力箭二号遥二运载火箭在东风商业航天创新试验区发射，将千帆极轨21组卫星送入预定轨道。此次发射后千帆星座在轨卫星总量提升至274颗，按计划2026年底完成324颗部署、初步提供区域服务。", "source": "上观新闻", "url": "https://kuaibao.qq.com/s/20261104A02TVW00?refer=cp_1009"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "亚冠精英联赛：海港4:2胜喷气机，国安4:7负泰港", "summary": "2026—2027亚冠精英联赛第四轮，上海海港客场4:2击败澳超纽卡斯尔喷气机走出阴霾；北京国安一度4:3领先，却因拉莫斯第58分钟红牌被罚下，最终4:7遭泰国泰港逆转，吞下赛季首败，终结各项赛事21场不败。", "source": "天津日报", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-11/04/content_143090_3981157.htm"}, {"id": 12, "category": "健康养生", "scope": "国际", "title": "《自然》发表最详尽人类免疫系统遗传变异图谱", "summary": "澳大利亚加文医学研究所等机构分析近2000人、500多万个免疫细胞的基因序列与活性，绘制出迄今最详尽的人类遗传变异影响免疫系统图谱，鉴定出近1500个可能参与多种疾病发生的基因，有助于发现癌症、免疫与神经疾病新药物靶点。", "source": "科技日报", "url": "https://www.ce.cn/xwzx/kj/202611/t20261104_3282492.shtml"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感疫苗转向以三价为主，专家称保护力未“缩水”", "summary": "中国疾控中心周报显示全国流感阳性样本中甲型占67.6%。今年疫苗供应由三价、四价并行转向以三价为主，专家解释：WHO数据显示乙型Yamagata系自2020年3月以来未再自然流行，故不再纳入组分，三价仍可有效预防当前流行毒株，建议及时接种。", "source": "每日经济新闻", "url": "https://www.163.com/dy/article/LARMQTS10512B07B.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "最强厄尔尼诺事件峰值将至，今冬明春气候受明显影响", "summary": " 度营收达上年同期约12倍，IPO前高速扩张", "summary": "Anthropic向美国SEC提交的文件显示，2026年第三季度公司实现营收169.56亿美元，较上年同期的13.82亿美元增长约1127%；计算及基础设施费用同比增382%至约99亿美元，占营收58%。在AI需求持续高景气的背景下，公司正为上市做最后准备。", "source": "财联社（网易）", "url": "https://www.163.com/dy/article/LAPQIP8P05198CJN.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美伊释放和平谈判信号，国际油价创三个月来最大跌幅", "summary": "伊朗最高领袖批准政府推进和平谈判，特朗普称“有可能”与伊朗达成协议，市场乐观预期升温。受此影响，12月WTI原油期货下跌7.4%收于每桶96.46美元，布伦特跌7.6%至104.77美元，均创近三个月最大单日跌幅。谈判能否落地仍存不确定性。", "source": "新浪财经·环球市场播报", "url": "https://www.toutiao.com/article/7703700995431219727/"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "英国推进移民永居制度改革，居留年限拟由5年延长至10年", "summary": "英国内政大臣马哈茂德确认推进“贡献型永居”计划，将大多数合法移民申请永居的居住年限由5年延长至10年，并追溯适用于已在等候者，预计影响约50万人。为平息党内反对，从事社会护理的外籍护理人员可沿用5年路径，须于2025年5月前抵英。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7703698123905860130/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "央行11月3日开展第三次互换便利操作，回购增持再贷款转长期制度", "summary": "中国人民银行11月3日开展证券、基金、保险公司互换便利（SFISF）操作，期限1年，31家机构申报需求超1000亿元。同时金融管理部门明确，股票回购增持再贷款由阶段性安排转为长期制度，再贷款利率由1.25%降至1%，以稳定资本市场。", "source": "央广网", "url": "https://www.toutiao.com/article/7703761409614823999"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "央行近5年来首次上调外汇存款准备金率2个百分点", "summary": "中国人民银行决定自2026年11月15日起，将金融机构外汇存款准备金率由4%上调至6%，为近5年来首次上调。举措意在冻结更多银行体系外汇资金、平衡外汇供需，缓解人民币升值压力；消息公布后离岸人民币短线走弱。", "source": "央视网财经（第一财经）", "url": "https://finance.cctv.cn/2026/11/03/ARTI0K0Js3R1p13H0yRSl6Fx261103.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "海南陵水发布暴雨红色预警，全县中小学幼儿园停课半天", "summary": "11月3日5时10分，陵水县气象台将暴雨橙色预警升级为红色预警。根据《海南省教育系统应对台风暴雨极端天气停课指导意见》，全县中小学、幼儿园、校外培训机构及托管机构上午停课半天，寄宿制学校对留校学生实施封闭管理，复课时间另行通知。", "source": "腾讯新闻（陵水县教育局）", "url": "https://news.qq.com/rain/a/20261103A02SUZ00"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "第27届中国国际教育年会在京举行，首发高等教育国际合作报告", "summary": "10月29日至31日，第27届中国国际教育年会在北京举行，以“开放育新 合作致远”为主题，主宾国为泰国，吸引70多个国家和地区的6000余位教育工作者参会。年会首次发布《中国高等教育国际合作与交流发展报告（2026）》，同期中国国际教育展有35个国家和地区420余所院校参展。", "source": "中国教育新闻网", "url": "http://www.jyb.cn/rmtzgjyb/202611/t20261103_2111537803.html"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "西班牙高铁列车相撞事故遇难者身份确认取得进展", "summary": "西班牙官方通报，10月28日中部托莱多省发生的高速列车相撞事故共造成69人遇难。截至11月2日，已确认66名遇难者身份，救援与身份核实工作持续推进。这是西班牙近年来最严重的铁路事故之一，事故原因仍在调查中。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1793660890206&item_id=18259069750278224431&channelId=1119"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞武装导弹袭击医疗中心，造成20名平民死伤", "summary": "也门政府卫生部门11月2日通报，胡塞武装使用导弹袭击了拉赫季省一处医疗中心，造成20名平民死伤。胡塞武装方面暂未回应。近期也门局势持续紧张，周边国家与调停方正尝试推动人道主义救援与停火安排。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7703698123905860130/"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "天问三号进入初样研制，有望成人类首个火星取样返回任务", "summary": "在2026年深空探测（天都）国际会议上，天问三号首席科学家、中科院院士侯增谦介绍，任务已处于初样研制阶段，有望成为人类首个火星取样返回任务，首要科学目标是探寻火星生命痕迹。任务计划钻取最深约2米样品，并将建设全球首个“行星保护实验室”。", "source": "新京报", "url": "https://www.bjnews.com.cn/search?bwsk=%E5%A4%A9%E9%97%AE"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "孙颖莎4-1逆转蒯曼，夺得WTT蒙彼利埃站女单冠军", "summary": "WTT蒙彼利埃冠军赛女单决赛，中国选手孙颖莎先丢一局后连扳四局，以4-1逆转队友蒯曼夺冠。她赛后表示蒯曼近期进步明显、冲击力很强，胜负关键在于临场调整与关键分把握。同轮中国军团在多项赛事中表现稳健。", "source": "澎湃新闻", "url": "https://m.thepaper.cn/newsDetail_forward_34385067"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感季提前、多毒株共同活跃，疾控提示尽早接种疫苗", "summary": "国家流感中心介绍，自7月起我国甲型H3N2与乙型Victoria系共同流行，呈“多毒株活跃、流行提前”特点，学校、写字楼等密闭空间聚集性感染风险上升。儿童、65岁以上老人、孕产妇及慢性病患者为重症高危人群；整个流感季均可接种，早打优于晚打。", "source": "光明网（央视财经）", "url": "https://health.gmw.cn/2026-11/03/content_39080561.htm"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "《全球能源转型报告》显示可再生能源发电占比首超煤电", "summary": "《全球能源转型报告（2026）》指出，2025年全球可再生能源发电量增长8.5%，占比达33.8%，百年以来首次超过煤电33.0%；全球可再生能源装机达5149GW，同比增长15.5%，中国对新增装机贡献率63.6%。但报告警示转型呈“量增速滞”分化格局，关键矿产供应链成核心掣肘。", "source": "中国石油石化（网易）", "url": "https://www.163.com/dy/article/LAPAR7JE05508GA4.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "前9月中国对欧盟汽车出口183万辆，已超去年全年", "summary": "中国汽车流通协会乘联分会数据显示，2026年前9个月中国对欧盟汽车出口达183万辆，远超去年全年；9月单月同比增128%、累计同比增87%，其中插混出口增372%、纯电在高关税下仍近2倍增长。比亚迪、吉利、奇瑞、零跑等中国主流车企在欧洲表现突出。", "source": "财联社", "url": "https://www.163.com/dy/article/LAQ5GIMN05198CJN.html"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "国产武侠游戏《影之刃零》发售72小时全平台销量破400万", "summary": "11月2日，国产武侠动作游戏《影之刃零》宣布发售后72小时全平台销量突破400万。第三方数据显示其Steam峰值在线玩家于11月1日达83万创历史新高，在线人数连续四天走高；《黑神话：悟空》制作人冯骥发文祝贺，称比销量更可喜的是好评率连续三天改善。", "source": "每日经济新闻（今日头条）", "url": "https://www.toutiao.com/a7703705260207997503"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "粤港澳图书馆藏孙中山文献展在香港中央图书馆开幕", "summary": "时值孙中山诞辰160周年，广东省立中山图书馆、香港公共图书馆、澳门公共图书馆及澳门科技大学图书馆联合举办“山川毓秀 故纸含情——粤港澳图书馆藏孙中山文献展”，11月3日至15日在香港中央图书馆展出其不同时期的历史文件、活动照片、著作版本等珍贵文献。", "source": "香港公共图书馆", "url": "https://www.hkpl.gov.hk/mobile/tc/extension-activities/event-detail/304725/a-world-of-beauty-told-through-old-pages-exhibition-of-sun-yat-sen-documents-from-libraries-in-guangdong-hong-kong-and-macao"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "多地秋假开启，亲子赏秋出游消费热度攀升", "summary": "浙江、四川、江苏、广东、福建等地中小学秋假陆续启动，主流模式为“3天秋假+周末”拼出5天弹性小长假。去哪儿数据显示，“秋假”“赏秋”等关键词搜索量月环比增长2.2倍，11月酒店预订量同比增五成、机票增两成，亲子游热度月环比翻番。", "source": "凤凰网文化（晨间资讯）", "url": "http://mp.weixin.qq.com/s?__biz=MzkwNjIzNTgzMg==&mid=2247484116&idx=1&sn=287798cf2b6a5c904cca29af9a6f9b7f&chksm=c17711362f30d6104cac8a224dae9babf03dde8f3c7040031709907cb11d0bac64c59352ca29#rd"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
