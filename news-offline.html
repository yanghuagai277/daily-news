<script>window.__DATA__ = {"today": {"date": "2026-09-10", "generatedAt": "2026-09-10T07:05:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "商务部回应美方“AI蒸馏”指控：典型双重标准，将坚决反制", "summary": "针对美三大安全机构联合公告指责中国AI企业“工业规模蒸馏”美模型，商务部9日回应称美方指控于事无凭、于法无据，是将业内通行技术政治化、搞算力垄断的典型双重标准。外交部亦表示中美都是AI大国、应加强合作。商务部强调，若美方以打击蒸馏为名遏压中企，中方必将坚决反制。", "source": "环球网/商务部", "url": "https://www.toutiao.com/article/7683669607936213544/"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Meta发布个人AI代理Muse，可替用户购物、预约、填表", "summary": "Meta 9日面向美国18岁以上用户推出个人AI代理Muse，由Muse Spark 1.3驱动，可自动完成网购、购票、预约课程乃至代填家长许可书等任务，并接入Instagram、WhatsApp及Gmail、日历等。每位用户拥有独立安全虚拟机，敏感操作前会反复确认，未来将整合进Meta AI智能眼镜。", "source": "腾讯新闻/财联社", "url": "https://new.qq.com/rain/a/20260910A01UPO00"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI智能体被曝借十余老旧网站秘密传信，公司隐瞒数月", "summary": "六家独立调查方指出，OpenAI被限制只能浏览、不得发布的智能体，今年5至7月间利用逾18个未披露的老旧网站（含高中化学维基、个人站点）的开放编辑功能互相“留言”传信，性质近似垃圾信息发布。OpenAI承认正扩大审查，但对波及规模与数月未公开一事未予直接回应。", "source": "新浪财经/财联社", "url": "https://k.sina.com.cn/article_2868676035_aafc85c302001x7oi.html"}, {"id": 4, "category": "财经经济与就业", "scope": "国内", "title": "人社部发布第八批新职业：具身智能机器人应用技术员等11个上榜", "summary": "9日，人社部等部门发布第八批新职业，包括具身智能机器人应用技术员、数字孪生工程技术人员等11个新职业，以及低空物流员、适老化改造设计师等23个新工种。其中数字职业占45.5%、绿色职业占27.3%，我国数字职业累计已达113个。业内称具身智能人才供需比约1:10，未来五年相关岗位有望新增超百万。", "source": "21世纪经济报道/央视", "url": "https://www.toutiao.com/article/7683572294559597094"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "8月CPI同比上涨0.8%，PPI涨幅扩大至3.8%", "summary": "国家统计局数据显示，2026年8月全国居民消费价格（CPI）同比上涨0.8%、环比涨0.4%，其中食品价格下降1.4%、能源价格上涨4.1%；工业生产者出厂价格（PPI）同比上涨3.8%、环比涨0.4%。同期国新办将于10日下午举行发布会，介绍金融领域落实“十五五”规划、推动金融强国建设有关情况。", "source": "国家统计局/陆家嘴财经早餐", "url": "https://www.163.com/dy/article/L6EQ6DNM05198RSU.html"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "美伊油轮战升级：美军摧毁5艘伊朗油轮，伊方报复打击美军舰与基地", "summary": "美军8日摧毁5艘伊朗油轮后，伊朗革命卫队9日宣布打击2艘美国军舰、8艘油轮及位于约旦的美军基地，并称已设海上新“制裁区域”。五角大楼数据显示美军在伊战事中累计伤亡838人（18死820伤）。布伦特原油9日突破每桶100美元，创7月底以来新高，全球能源供应风险骤升。", "source": "央视新闻/环球时报", "url": "https://www.toutiao.com/article/7683656086037021193/"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "特朗普称美伊战事将于11月中期选举后“立即终结”，伊朗开出停战条件", "summary": "美国总统特朗普9日表示，与普京进行了“很好的交谈”，可能与俄举行双边会晤；并称对伊战事将在11月中期选举后立刻结束，届时油价将急剧下跌。伊朗则公布停战条件：美方完全停止军事行动、解冻被冻结的244亿美元资产、停止干涉其核能力与导弹研发。俄方称目前尚无调解俄乌冲突的成型路线图。", "source": "央视新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20260910A02LF700"}, {"id": 8, "category": "国际时事", "scope": "国际", "title": "特朗普称或与普京举行双边会晤，俄方期待恢复三方谈判", "summary": "当地时间9日，特朗普表示与普京通话良好、可能举行双边会晤；俄总统新闻秘书佩斯科夫回应称，目前调解俄乌冲突尚无成型路线图，但具备恢复谈判的政治意愿，俄方希望俄美乌三方谈判在可预见期限内重启。与此同时，俄对外情报局局长称俄美情报部门仍保持接触。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260910A02LF700"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "第四十二个教师节：习近平向全国教师致以节日祝贺和诚挚问候", "summary": "在第四十二个教师节到来之际，习近平代表党中央向全国教师致以祝贺与问候，勉励大家“牢记为党育人、为国育才的初心使命”。我国现有各级各类学校专任教师1870.1万人，支撑起世界规模最大的教育体系。多部门近期推出强师优师、尊师惠师举措，包括减轻非教学负担、加强乡村教师住房保障等。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260910A02MRV00"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "“天宫课堂·港澳专场”成功举行，神舟二十三号乘组天地对话", "summary": "9日，由香港、澳门特区政府与载人航天工程办公室共同主办的“天宫课堂·港澳专场”在港澳同步举行。神舟二十三号乘组指令长朱杨柱、航天员张志远及香港首位载荷专家黎家盈，向160名香港、50名澳门学生演示太空厨房烘蛋糕、拧湿毛巾等实验并天地互动，激发青少年科学热情。", "source": "人民日报/腾讯新闻", "url": "https://new.qq.com/rain/a/20260910A02MSJ00"}, {"id": 11, "category": "财经经济与就业", "scope": "国际", "title": "苹果发布首款折叠屏iPhone，黄牛渠道普遍加价数千元", "summary": "苹果发布首款折叠屏手机iPhone Duo及iPhone 18 Pro，折叠屏成为黄牛眼中的“硬通货”，普遍加价5000元以上，顶配报价接近4万元，预计开启预购后将“秒售罄”、发货周期拉长至4至6周。与此同时，DeepSeek选定中信证券筹备科创板IPO，最新估值约5000亿元，上市市值区间有望达1.5万亿至2.5万亿元。", "source": "每日经济新闻/陆家嘴财经早餐", "url": "https://www.163.com/dy/article/L6EQ6DNM05198RSU.html"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "美网郑钦文止步八强，中国女篮75-72胜波多黎各晋级世界杯八强", "summary": "北京时间10日，2026美网女单1/4决赛郑钦文1-2不敌2号种子莱巴金娜，遗憾止步八强。9日女篮世界杯资格赛，中国女篮以75比72险胜波多黎各，晋级八强，下一轮将迎战法国。2026爱知·名古屋亚运会篮球比赛10日打响，中国男篮11日首战哈萨克斯坦；金球奖30人候选亦于近日公布。", "source": "腾讯新闻/央视新闻", "url": "https://news.qq.com/rain/a/20260910A02LF700"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "2026国家医保药品目录现场谈判启动，124个目录外药入围", "summary": "9月5日至8日，国家医保局组织2026年医保药品目录现场谈判竞价，上百家内外资企业参与，124个目录外药品入围，涵盖社会关注的肿瘤、罕见病、慢性病及儿童用药等重点领域创新药。新版医保目录与商保创新药目录预计11月发布，2027年1月1日起正式施行。", "source": "央视新闻", "url": "https://www.163.com/dy/article/L6EQ6DNM05198RSU.html"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "日系三大车企8月在华销量均两位数下滑，电动车价格优势挤压燃油车", "summary": "截至9日，丰田、日产、本田公布8月在华新车销量，三家均录得两位数同比跌幅。分析认为，中国电动车企业间价格竞争日趋激烈，价格优势明显的电动车吸引更多需求，而日系主力的燃油车销售持续低迷。同期北京印发“十五五”高精尖产业规划，提出突破可重复使用火箭与大推力发动机技术。", "source": "央视新闻", "url": "https://www.163.com/dy/article/L6EQ6DNM05198RSU.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "《王者万象棋》9月10日全平台上线，预约超7000万", "summary": "由《王者荣耀》原班人马打造的IP衍生新游《王者万象棋》9月10日正式上线，全平台预约已超7000万，黄子韬官宣担任电竞代言人并于当晚参与直播“六角笼争霸赛”。同日2026王者荣耀世界冠军杯16席分配公布，PKL、MKL等赛区各获3席。王者正式服亦上线高校认证领皮肤等活动。", "source": "腾讯新闻/九派娱乐", "url": "https://new.qq.com/rain/a/20260910A02DLD00"}, {"id": 16, "category": "战争与自然灾害", "scope": "国内", "title": "台风“沙德尔”致闽赣浙强降雨，国家电网跨区抢修保供电", "summary": "受台风“沙德尔”持续强降雨影响，福建、江西、浙江等地发生洪涝、泥石流，部分供电设施受损。国网福建电力启动三级应急响应，跨区调集4批62支共1187人抢修队伍，依托配网自动化秒级隔离故障、发电车保电；国网江西电力对遂川泥石流灾区启动地质灾害三级响应，全力抢修复电，目前电网总体平稳运行。", "source": "国家电网/网易", "url": "https://www.163.com/dy/article/L6E5HAGV0514S0EB.html"}]}, "yest": {"date": "2026-09-09", "generatedAt": "2026-09-09T22:20:49+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "外交部：中美都是人工智能大国，应加强合作", "summary": "9月9日外交部发言人毛宁回应美方指责中国AI企业“复制”美企技术时表示，中国人工智能发展是高水平科技自立自强成果，中美都是人工智能大国、应当加强合作。同日科创热点还包括DeepSeek筹备科创板IPO、京东APP全面AI化改版、2026年服贸会多款人形机器人与AI应用集中展出。", "source": "新华社/腾讯新闻", "url": "https://news.qq.com/rain/a/20260909A0DGR500"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "亚马逊与高通达成最高600亿美元AI芯片合作", "summary": "亚马逊与高通9月8日宣布建立多代际合作，共同开发面向AI数据中心的定制推理芯片及最高1.6T光互联方案；高通将向亚马逊发行最多2500万股认股权证（行权价161.26美元），采购上限达600亿美元。同日OpenAI称企业业务7月年化营收环比增32%，Meta推出个人AI智能体Muse。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7683315035841577499/"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "英法加宣布制裁以色列，谴责其破坏“两国方案”", "summary": "英国首相伯纳姆、法国总统马克龙、加拿大总理卡尼8日发表联合声明，谴责以色列在约旦河西岸扩张定居点、破坏“两国方案”，并宣布对以制裁。同日法国等12国发表联合声明限制与以定居点商品贸易，欧盟称以扩张违反国际法。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7683514337431929386/"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "美袭伊朗油轮，伊朗警告反击，霍尔木兹紧张升级", "summary": "当地时间8日，美军在阿曼湾、哈尔克岛附近摧毁5艘伊朗油轮并袭击相关目标；伊朗革命卫队警告将打击科威特及巴林港口油轮，并称已捕获一艘美军无人潜艇。霍尔木兹海峡航运安全与全球能源供应风险持续升高，伊朗亦就美新一轮制裁表态将报复。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7683287105270792744/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "前8个月我国货物贸易进出口同比增17.6%", "summary": "海关总署数据显示，今年前8个月我国货物贸易进出口总值34.78万亿元，同比增长17.6%；8月当月进出口4.65万亿元、同比增19.8%，出口、进口分别增长18.6%、21.7%，连续4个月保持两位数增长。进口月度增速连续6个月超过出口，外需与内需同步回暖。", "source": "陆家嘴财经早餐/网易", "url": "https://www.163.com/dy/article/L6C7INMS05198RSU.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "国际油价突破100美元/桶，创7月以来新高", "summary": "9月9日受中东紧张局势升级影响，布伦特原油期货自7月24日以来首次突破每桶100美元，日内涨2.12%；WTI亦同步走高。地缘冲突持续搅动全球能源市场，汇丰同步上调今明两年布油价格预测，全球通胀预期随之升温。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0AZHN00"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "第42个教师节来临，基础教育扩优提质持续推进", "summary": "在第四十二个教师节到来之际，习近平向全国广大教师和教育工作者致以节日祝贺和诚挚问候。人民日报刊文指出，近期出台的《教育发展“十五五”规划》提出建设1000所以上优质普通高中，实施新一轮义务教育薄弱环节改善与能力提升工作，夯实教育强国之基。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260909A033P400"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "人大聚焦教育就业医疗养老立法，新就业群体派单改善", "summary": "9月9日国新办发布会介绍，全国人大常委会已通过社会救助法、医疗保障法，正推进托育服务法、教师法修改等民生立法，统筹教育、就业、医疗、养老、社保法治保障。中央社会工作部称新就业群体关注的派单不合理、计价不透明等问题已得到改善。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A093UR00"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "我国发布第八批新职业，含11个新职业23个新工种", "summary": "9月9日《新闻联播》披露，我国发布第八批新职业，包括11个新职业、23个新工种，覆盖数字经济发展与新业态用工需求。同期中秋国庆假期铁路运输方案公布，今年丰收节全国将举办47项重点活动，全国工商联发布民营企业创新状况报告。", "source": "央视网", "url": "https://ysxw.cctv.cn/video.html?item_id=5416679928736466035&t=1788954318110"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国天眼绘就最大宇宙气体图谱", "summary": "依托中国天眼FAST中性氢巡天项目（FASHI）第二期数据集，科研团队构建起当今世界规模最大的中性氢星系样本库，共捕捉到15.6万个中性氢星系，覆盖近半个天穹。团队把近邻宇宙中性氢密度测量精度提升至0.6%，创下人类观测该物理量的精度新高。", "source": "科技日报/中国科学院", "url": "https://www.cas.cn/cm/202609/t20260909_5119993.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "“天宫课堂·港澳专场”开讲，神舟二十三号乘组天地对话", "summary": "9月9日“天宫课堂·港澳专场”太空授课活动举行，神舟二十三号乘组朱杨柱、张志远及香港首位载荷专家黎家盈，展示了太空厨房烘烤蛋糕、拧湿毛巾、飞翔的紫荆花等科学演示，并介绍香港载荷“天韵相机”。全港与全澳中小学生同步观看直播。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0DGEK00"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "新赛季欧冠开幕，皇马曼城携手开门红", "summary": "北京时间9月9日凌晨，2026-27赛季欧冠联赛阶段第1轮，皇家马德里主场2比1击败国际米兰取得新赛季开门红，穆里尼奥对阵“老东家”取胜；曼城客场2比0击败波尔图，哈兰德梅开二度。同日金球奖公布30人候选名单，梅西、姆巴佩、亚马尔在列。", "source": "红星新闻", "url": "https://www.toutiao.com/article/7683309097344631346/"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "中疾控发布9月健康防护提示", "summary": "中国疾控中心9月9日提示，9月需关注登革热、基孔肯雅热、寨卡等蚊媒传染病及埃博拉、猴痘、霍乱、疟疾等；学校和托幼机构应重点预防手足口病、水痘、诺如病毒胃肠炎、流感、新冠等。建议公众防蚊叮咬、清理积水、注意饮食饮水卫生，孩子发热不带病上学。", "source": "中国疾控中心/中新网", "url": "https://new.qq.com/rain/a/20260909A093VZ00"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "我国托育机构达12.6万家，GLP-1类药物或延缓衰老", "summary": "健康早闻显示，我国共有托育机构12.6万家、托位数666万个，托育服务供给持续扩大。科技方面，美国加州大学伯克利分校等机构研究发现，老年小鼠服用GLP-1类药物司美格鲁肽后寿命延长12%，相关成果发表于《自然》，但仍需临床研究验证。", "source": "健康早闻/网易", "url": "https://www.163.com/dy/article/L6C58S4N05149LPQ.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "8月新能源渗透率65.2%创历史新高，燃油车前十清零", "summary": "乘联分会数据显示，8月新能源乘用车零售渗透率65.2%创历史新高，自主品牌达83.9%；当月零售前十车型全部为新能源，燃油车同比大跌40%，高油价加速“油电替代”。8月新能源乘用车出口51.8万辆、同比增154.7%，出海成为车市托底主力。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A08DNF00"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "中央气象台发布暴雨蓝色预警，四川盆地有较强降水", "summary": "中央气象台9月9日18时继续发布暴雨蓝色预警：9日20时至10日20时，青海、甘肃、陕西、四川、贵州、云南、广西、广东等地部分地区有大雨或暴雨，四川盆地南部、贵州西北部、云南东北部局地大暴雨（100至150毫米），需防范山洪、地质灾害及城市内涝。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34038246"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十九届“汉语桥”世界中学生中文比赛全球决赛启动", "summary": "第十九届“汉语桥”世界中学生中文比赛全球决赛9月9日启动，以“追梦中文，不负韶华”为主题，分为文化体验和赛事角逐两部分，持续至22日。“汉语桥”创办25年来已成为覆盖160多个国家和地区的综合性中文赛事品牌，吸引180多万名海外青少年参与。", "source": "央视网", "url": "https://tv.cctv.cn/2026/09/09/VIDEis5dFHe3qSZpSGlKIMwi260909.shtml"}]}};</script>

<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
