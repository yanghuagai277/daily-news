 "第42个教师节来临，基础教育扩优提质持续推进", "summary": "在第四十二个教师节到来之际，习近平向全国广大教师和教育工作者致以节日祝贺和诚挚问候。人民日报刊文指出，近期出台的《教育发展“十五五”规划》提出建设1000所以上优质普通高中，实施新一轮义务教育薄弱环节改善与能力提升工作，夯实教育强国之基。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260909A033P400"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "人大聚焦教育就业医疗养老立法，新就业群体派单改善", "summary": "9月9日国新办发布会介绍，全国人大常委会已通过社会救助法、医疗保障法，正推进托育服务法、教师法修改等民生立法，统筹教育、就业、医疗、养老、社保法治保障。中央社会工作部称新就业群体关注的派单不合理、计价不透明等问题已得到改善。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A093UR00"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "我国发布第八批新职业，含11个新职业23个新工种", "summary": "9月9日《新闻联播》披露，我国发布第八批新职业，包括11个新职业、23个新工种，覆盖数字经济发展与新业态用工需求。同期中秋国庆假期铁路运输方案公布，今年丰收节全国将举办47项重点活动，全国工商联发布民营企业创新状况报告。", "source": "央视网", "url": "https://ysxw.cctv.cn/video.html?item_id=5416679928736466035&t=1788954318110"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国天眼绘就最大宇宙气体图谱", "summary": "依托中国天眼FAST中性氢巡天项目（FASHI）第二期数据集，科研团队构建起当今世界规模最大的中性氢星系样本库，共捕捉到15.6万个中性氢星系，覆盖近半个天穹。团队把近邻宇宙中性氢密度测量精度提升至0.6%，创下人类观测该物理量的精度新高。", "source": "科技日报/中国科学院", "url": "https://www.cas.cn/cm/202609/t20260909_5119993.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "“天宫课堂·港澳专场”开讲，神舟二十三号乘组天地对话", "summary": "9月9日“天宫课堂·港澳专场”太空授课活动举行，神舟二十三号乘组朱杨柱、张志远及香港首位载荷专家黎家盈，展示了太空厨房烘烤蛋糕、拧湿毛巾、飞翔的紫荆花等科学演示，并介绍香港载荷“天韵相机”。全港与全澳中小学生同步观看直播。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0DGEK00"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "新赛季欧冠开幕，皇马曼城携手开门红", "summary": "北京时间9月9日凌晨，2026-27赛季欧冠联赛阶段第1轮，皇家马德里主场2比1击败国际米兰取得新赛季开门红，穆里尼奥对阵“老东家”取胜；曼城客场2比0击败波尔图，哈兰德梅开二度。同日金球奖公布30人候选名单，梅西、姆巴佩、亚马尔在列。", "source": "红星新闻", "url": "https://www.toutiao.com/article/7683309097344631346/"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "中疾控发布9月健康防护提示", "summary": "中国疾控中心9月9日提示，9月需关注登革热、基孔肯雅热、寨卡等蚊媒传染病及埃博拉、猴痘、霍乱、疟疾等；学校和托幼机构应重点预防手足口病、水痘、诺如病毒胃肠炎、流感、新冠等。建议公众防蚊叮咬、清理积水、注意饮食饮水卫生，孩子发热不带病上学。", "source": "中国疾控中心/中新网", "url": "https://new.qq.com/rain/a/20260909A093VZ00"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "我国托育机构达12.6万家，GLP-1类药物或延缓衰老", "summary": "健康早闻显示，我国共有托育机构12.6万家、托位数666万个，托育服务供给持续扩大。科技方面，美国加州大学伯克利分校等机构研究发现，老年小鼠服用GLP-1类药物司美格鲁肽后寿命延长12%，相关成果发表于《自然》，但仍需临床研究验证。", "source": "健康早闻/网易", "url": "https://www.163.com/dy/article/L6C58S4N05149LPQ.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "8月新能源渗透率65.2%创历史新高，燃油车前十清零", "summary": "乘联分会数据显示，8月新能源乘用车零售渗透率65.2%创历史新高，自主品牌达83.9%；当月零售前十车型全部为新能源，燃油车同比大跌40%，高油价加速“油电替代”。8月新能源乘用车出口51.8万辆、同比增154.7%，出海成为车市托底主力。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A08DNF00"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "中央气象台发布暴雨蓝色预警，四川盆地有较强降水", "summary": "中央气象台9月9日18时继续发布暴雨蓝色预警：9日20时至10日20时，青海、甘肃、陕西、四川、贵州、云南、广西、广东等地部分地区有大雨或暴雨，四川盆地南部、贵州西北部、云南东北部局地大暴雨（100至150毫米），需防范山洪、地质灾害及城市内涝。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34038246"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十九届“汉语桥”世界中学生中文比赛全球决赛启动", "summary": "第十九届“汉语桥”世界中学生中文比赛全球决赛9月9日启动，以“追梦中文，不负韶华”为主题，分为文化体验和赛事角逐两部分，持续至22日。“汉语桥”创办25年来已成为覆盖160多个国家和地区的综合性中文赛事品牌，吸引180多万名海外青少年参与。", "source": "央视网", "url": "https://tv.cctv.cn/2026/09/09/VIDEis5dFHe3qSZpSGlKIMwi260909.shtml"}]}, "yest": {"date": "2026-09-09", "generatedAt": "2026-09-09T12:47:38+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"category": "国际时事", "scope": "国内", "title": "香港首任行政长官董建华逝世，享年89岁", "summary": "据董建华办公室9月9日凌晨消息，全国政协前副主席、香港特别行政区首任行政长官董建华，于2026年9月8日晚10时许在亲人陪伴下于医院安详辞世，享年89岁。他1997年香港回归后出任首任特首，是“一国两制”实践的重要亲历者。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/gn/2026/09-09/10692991.shtml", "id": 1}, {"category": "战争与自然灾害", "scope": "国际", "title": "尼泊尔泥石流灾害遇难人数升至1366人", "summary": "据尼泊尔警方修正后的最新数据，截至当地时间9月8日20时，该国泥石流灾害造成的遇难人数升至1366人。此前中方已向尼泊尔提供多批紧急援助物资，第四批物资由空军运-20运抵加德满都，救援与善后工作仍在持续推进。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/gj/2026/09-09/10692998.shtml", "id": 2}, {"category": "国际时事", "scope": "国际", "title": "第81届联合国大会开幕", "summary": "当地时间9月8日，在第80届联合国大会闭幕后，第81届联合国大会在纽约联合   var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
