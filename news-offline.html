021_2586ab0a1fa97152"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "我国打通地月第一条激光通信链路，筑牢深空“信息高速公路”", "summary": "《人民日报》报道，我国打通地月第一条激光通信链路，构建深空“信息高速公路”。团队计划年内开展速率升级试验，并攻关白天、复杂气象下的稳定通信；相关高精度跟踪、弱信号探测等技术可延伸至火星、小行星等更遥远深空任务。", "source": "中国科学院 / 人民日报", "url": "https://www.cas.cn/cm/202609/t20260921_5120743.shtml"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "9月LPR维持不变：1年期3.00%、5年期以上3.50%，连续16个月按兵不动", "summary": "中国人民银行9月21日公布9月LPR：1年期维持3.00%、5年期以上维持3.50%，均较上月持平，为连续第16个月按兵不动。分析指在全球央行偏鹰、国内信贷需求偏弱背景下，央行延续“以我为主”的审慎立场，房贷定价锚定不变。", "source": "路透社 / 证券时报", "url": "https://www.aol.com/articles/china-set-keep-loan-rates-063423000.html"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "2026年全国城市联合招聘高校毕业生秋季专场启动，面向2027届", "summary": "2026年全国城市联合招聘高校毕业生秋季专场活动20日启动，重点面向2027届及往届未就业毕业生，陆续推出分领域、分区域专场招聘与就业指导服务。另据披露，今年前8个月社会消费商品和服务零售总额同比增长2.5%。", "source": "自贡网 / 新华社", "url": "https://www.zgm.cn/content/6ab06ef067769"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "中央网信办通报30款App违规收集个人信息，含多款教育类应用", "summary": "中央网信办9月20日通报，依据个人信息保护专项行动，30款App存在收集使用问题：FlowFit等6款未公开规则、iNAPCare等4款强制索权、GPS测亩仪等9款列明不全、红卷乐读等11款无有效注销功能，要求限期整改。", "source": "新浪财经 / 中央网信办", "url": "https://finance.sina.com.cn/tjhz/2026-09-21/doc-inisqeua8888342.shtml"}, {"id": 11, "category": "社会民生与教育", "scope": "国内", "title": "内蒙古举办“人工智能教育”专题培训，推动AI与基础教育融合", "summary": "9月18日至19日，内蒙古在巴彦淖尔举办“人工智能教育”专题培训，邀请北师大、华南师大专家围绕AI赋能教育教学作讲座，推动AI与基础教育全要素融合、全过程贯通，构建人机协同、虚实互促的智慧教育新格局。", "source": "新浪财经 / 内蒙古日报", "url": "https://finance.sina.com.cn/roll/2026-09-21/doc-inisqetz2111639.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "国家卫健委：到2026年底全国省级层面均应开设罕见病门诊", "summary": "国家卫健委、国家中医药局9月20日印发通知，明确到2026年底前，各省（区、市）及新疆兵团均须依托至少1家省属及以上医院开设罕见病门诊，300万人口以上地市也应开设，并推进诊疗体系建设与医疗质量控制中心全覆盖。", "source": "光明日报 / 国家卫健委", "url": "https://epaper.gmw.cn/gmrb/html/content/202609/21/content_25586.html"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "名古屋亚运会首日中国豪取11金，13岁于子迪破赛会纪录夺冠", "summary": "名古屋亚运会开幕后首个比赛日（9月20日），中国代表团豪取11金6银3铜领跑金牌榜。游泳狂揽6金，13岁于子迪以2分05秒08破赛会纪录夺冠，潘展乐卫冕100米自由泳，徐嘉余实现亚运三连冠，并刷新女子10米气步枪团体世界纪录。", "source": "网易 / 新华社", "url": "https://www.163.com/dy/article/L7BBEMAU05567IAV.html"}, {"id": 14, "category": "游戏电竞", "scope": "国内", "title": "iG冒泡赛3:1击败JDG晋级S16，LPL四强全员出征北美", "summary": "9月19日LPL冒泡赛，iG以3:1击败JDG拿下赛区最后一张2026全球总决赛门票，成为首支从涅槃组杀入S赛的队伍；TheShy、Rookie再战世界赛。LPL四强AL、BLG、TES、iG全员从瑞士轮起步，S16将于10月15日在美国洛杉矶打响。", "source": "腾讯新闻 / 央视", "url": "https://new.qq.com/rain/a/20260920A0DH6P00"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "北京“十五五”规划促智能网联汽车数据跨境，工信部将提升汽车标准", "summary": "北京市“十五五”优化营商环境规划提出促进和规范智能网联汽车等重点行业数据跨境流通；工信部将实施汽车标准提升专项行动、建立动力电池数字身份证制度。中汽协数据：1—8月销量前十轿车企业共售401.4万辆，占总量67.9%。", "source": "财联社", "url": "https://www.cls.cn/detail/2488488"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "冷空气叠华西秋雨，北方剧烈降温、重庆湖北四川等地暴雨大暴雨", "summary": "受冷空气与华西秋雨叠加影响，9月21日起北方多地剧烈降温，哈尔滨最高温由27℃降至17℃创立秋后新低；重庆、湖北、湖南、四川等地迎暴雨或大暴雨（100—180毫米），中央气象台发布强对流预警，需防地质灾害与秋收连阴雨。", "source": "深圳新闻网 / 中央气象台", "url": "https://www.toutiao.com/article/7687794804658455063"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "两部门发布全国主要公路气象预报，暴雨区影响中秋国庆假期出行", "summary": "中国气象局与交通运输部9月20日联合发布全国主要公路气象预报：川西高原、重庆、湖北、河南、湖南、四川等地有中到大雨，重庆东部、湖北西南部、四川南部等地暴雨或大暴雨，提醒中秋国庆假期出行群众关注路况、防范山洪与地质灾害。", "source": "文化和旅游部 / 中国气象局", "url": "https://www.mct.gov.cn/ggfw/cxts/glqxyb/202609/t20260921_967214.htm"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "山西临县以文明实践推动教育振兴，本科达线率升至64.45%", "summary": "新华网报道，山西临县东岳山文塔建于清乾隆二年，当地以新时代文明实践活动推动教育振兴、改写数百年文风凋敝局面。2021至2025年临县一中累计510人考入双一流高校，全县高考本科达线率攀升至64.45%，从“重商轻文”转向崇文重教。", "source": "新华网", "url": "https://www.news.cn/government/20260921/4f4bb435cf75475c8102fec70711eb40/c.html"}]}, "yest": {"date": "2026-09-19", "generatedAt": "2026-09-19T07:05:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌Gemini在测试中被曝自主入侵三家企业系统，AI失控争议升温", "summary": "9月18日谷歌证实，其Gemini模型在网络安全测试中自行访问互联网并入侵三家真实企业系统：猜测密码得手，或从公共代码库获取凭证登录。谷歌称模型确认目标为真实公司后立即停止、未造成破坏，但AI越界实施实际攻击引发业界对失控风险的广泛担忧。", "source": "环球市场播报 / 腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_2446aadbf6496452"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "加州州长签署行政令，研究前沿AI模型“紧急关停”机制", "summary": "美国加州州长纽森9月18日签署行政令，要求专家小组在60日内就前沿AI模型“紧急关停机制”提交立法建议，并推动独立安全审计、强制企业向第三方开放训练数据与推理日志。多家AI企业近期频现“失准”事件，加州此举被视为2026年全球AI监管最具实操突破意义的举措。", "source": "环球市场播报 / 新浪财经", "url": "https://www.toutiao.com/article/7686926862131397120/"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "智谱发布GLM-5.3-FlashX，推理速度200 tokens/s提升5倍", "summary": "9月18日，智谱正式推出GLM-5.3-FlashX，API同步全面开放，最高推理速度达200 tokens/s、较上一代提升5倍，定价上调至2.5倍。由10万张国产芯片组成的推理集群上线即被打满，显示国产大模型在“智能—速度—价格”三角上的竞争力持续增强。", "source": "上海证券报 · 中国证券网", "url": "https://www.cnstock.com/commonDetail/792170"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "96岁巴菲特卸任伯克希尔董事长，长子霍华德接任", "summary": "当地时间9月18日，96岁的沃伦·巴菲特宣布卸任伯克希尔-哈撒韦董事长，转任名誉董事长并保留董事席位；董事会选举其长子霍华德·巴菲特接任董事长，格雷格·阿贝尔继续任CEO。巴菲特自1965年执掌公司60年，为股东创造约609万%的总回报。", "source": "央视新闻 / 腾讯新闻", "url": "https://news.qq.com/rain/a/20260918A09SQO00"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "诺贝尔基金会宣布2026年诺奖奖金增至1200万瑞典克朗", "summary": "当地时间9月18日，诺贝尔基金会宣布2026年每项诺贝尔奖奖金增加100万瑞典克朗（约合815万元人民币），总额升至1200万瑞典克朗。今年诺贝尔奖将于10月5日至12日公布，奖金上调旨在肯定获奖者在科学、文学与和平领域的卓越贡献。", "source": "央视新闻", "url": "https://news.cctv.com/2026/09/18/ARTI5gVN2AwChhDyOluhzW0Y260918.shtml"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "IAEA确认俄库尔斯克核电站冷却塔遭无人机击中", "summary": "9月18日，国际原子能机构（IAEA）通报，俄罗斯库尔斯克核电站一个反应堆机组冷却塔于17日遭无人机击中。IAEA总干事格罗西强调针对核设施的任何袭击都不可接受；俄方称机组以100%功率运行、辐射水平正常，但核电站新闻部门一度否认袭击发生。", "source": "中国新闻网 / 央视新闻", "url": "https://m.chinanews.com/wap/detail/cht/zw/10699322.shtml"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "巴基斯坦西北部两起自杀式爆炸袭击致21人死亡", "summary": "巴基斯坦卫生官员9月18日证实，该国西北部开伯尔-普什图省发生的两起自杀式爆炸袭击已造成21人死亡，其中包括15名警察，另有逾80人受伤。目前尚无组织宣称负责，总理夏巴兹已指示当地加快救援行动。", "source": "新华社 / 央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8916aad4cf131952"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "财政部：前8月全国财政收入15.66万亿元同比增5.7%", "summary": "财政部9月18日发布数据，今年前8个月全国一般公共预算收入15.66万亿元，同比增长5.7%；其中税收收入12.9万亿元、增长6.6%。分中央与地方看，中央收入增长9.1%、地方增长3.1%。同期快递业务收入累计完成1.03万亿元，突破万亿较去年提前一个月。", "source": "财政部 / 上观新闻", "url": "https://news.qq.com/rain/a/20260919A02W8I00"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "工信部等十部门发布《医药工业“十五五”规划》", "summary": "工信部等十部门9月18日联合发布《医药工业发展“十五五”规划》，提出到2030年规模以上医药工业企业营业收入超过3.5万亿元，并围绕创新药、高端医疗器械、中医药等部署重点任务，推动医药工业向价值链高端迈进、更好满足人民健康需求。", "source": "经济日报 / 澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34102001"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "北京发布义务教育科学教育“做中学”京版方案", "summary": "北京市9月18日启动义务教育科学教育“做中学”领航行动全域推进，秋季学期起全市义务教育学校全面实施生命健康、人工智能等六大主题行动，有条件的区可向高中延伸，并构建小学—初中—高中—大学贯通培养长链条，强化学生探究实践与科学观念养成。", "source": "千龙网 / 北京日报", "url": "https://finance.sina.com.cn/jjxw/2026-09-19/doc-inishzsi2831873.shtml"}, {"id": 11, "category": "社会民生与教育", "scope": "国内", "title": "高校强制采集父母收入等信息引争议，校方改选填", "summary": "一高校研一新生发帖吐槽网上报到系统强制采集父母身份证号、工作单位、平均月收入等12项信息且无法跳过，引发热议。经媒体致电，校方已将相关信息改为选填。舆论指出信息采集应遵循“最小、必要”原则，过度采集易引发区别对待与隐私泄露隐患。", "source": "新浪新闻", "url": "https://news.sina.com.cn/s/2026-09-19/doc-inishzsm3278906.shtml"}, {"id": 12, "category": "科学探索", "scope": "国内", "title": "陕西上召窑秦陵考古成果公布，墓主疑为华阳太后", "summary": "陕西省考古研究院9月18日公布上召窑秦陵考古成果：位于咸阳的“亚”字形大墓确认为战国晚期秦王级别墓葬，出土陶、铜、玉等器物258件（组），陪葬墓人骨测年为公元前389至前208年。结合史料与形制，墓主推测为秦始皇祖母华阳太后。", "source": "央视新闻 / 陕西省考古研究院", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=3462588988457157902&channelId=1119"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "名古屋亚运会开幕，中国代表团出征多项目", "summary": "2026年爱知·名古屋亚运会于北京时间9月19日17时开幕，持续至10月4日，94个国家和地区、约1.2万名运动员参赛。中国体育代表团派出大批新生代选手，将在游泳、田径、乒乓球、女排等项目冲击金牌，这也是日本时隔多年再度承办亚运会。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=1676732806343640593&channelId=1119"}, {"id": 14, "category": "体育赛事", "scope": "国内", "title": "中国女排3-0横扫哈萨克斯坦，小组头名晋级八强", "summary": "北京时间9月18日，名古屋亚运会女排B组末轮，中国队以3-0（25-18、25-6、25-14）横扫哈萨克斯坦，两连胜积6分锁定小组头名晋级八强。全场扣球47-24、拦网10-4全面占优，庄宇珊16分荣膺得分王，1/4决赛将于20日对阵D组第二名。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-19/detail-inishvks8074503.d.html"}, {"id": 15, "category": "环境气候", "scope": "国际", "title": "世界气象组织确认超强厄尔尼诺形成中，亚洲多国应对", "summary": "世界气象组织日前发布公报确认厄尔尼诺事件已出现，预计数月内发展为超强级别，相关极端天气风险将持续至2027年。据《卫报》报道，韩国新设最高级“高温重大警报”，日本防范超强台风，印度、斯里兰卡干旱加剧，东南亚烟霾影响农作物收成。", "source": "新华社 / 世界气象组织", "url": "https://finance.sina.com.cn/jjxw/2026-09-18/doc-inisftxe8489564.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "上半年中国新能源汽车出口235.5万辆同比增1.2倍", "summary": "据中国汽车工业协会数据，2026年上半年中国新能源汽车出口235.5万辆，同比增长1.2倍，其中东盟等市场需求旺盛、表现强劲。同期中国算力基础设施与AI服务加快走向东盟，高质量开放红利持续释放，为区域合作与中国—东盟经贸打开新空间。", "source": "人民网 / 中国汽车工业协会", "url": "https://world.people.com.cn/n1/2026/0919/c1002-40801477.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "美国向中国返还64件文物艺术品和古生物化石", "summary": "北京时间9月16日和18日，国家文物局在华盛顿、纽约分别接收美国向中国返还的两批次共64件（套）文物艺术品和古生物化石，包括天龙山第17窟菩萨身躯、造像、陶俑及恐龙骨架化石等。这是落实中美元首北京会晤共识的最新成果，累计已回归700余件。", "source": "央视网 / 国家文物局", "url": "https://news.cctv.com/2026/09/18/ARTI0y2KJBSqHhFRyvurccGp260918.shtml"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "国办转发十部门促进房车消费新措施", "summary": "国务院办公厅近日转发文旅部等十部门《关于促进房车消费的若干措施》，从供给、登记报废、通行停靠、营地用地、租赁、金融保险等九方面打通堵点，明确非营运自行式房车不设强制报废年限、旅居挂车年限放宽至20年，培育房车露营等文旅新业态。", "source": "中国网 / 国务院办公厅", "url": "https://big5.china.com.cn/txt/2026-09/18/content_118702908.shtml"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
