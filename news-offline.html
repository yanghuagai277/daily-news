 "国际", "title": "特朗普称若谈判有进展“极不可能”再对伊大动武", "summary": "美国总统特朗普8日称，只要美伊谈判取得进展，美国“极不可能”恢复对伊朗大规模军事行动，但强调驻中东美军已“准备就绪”、未排除再动武。美方称中东已部署3艘航母，并锁定伊境内发电厂、桥梁等目标。", "source": "央视网/新华社", "url": "https://news.cctv.com/2026/11/09/ARTINmNxo9JLUn7AnmCkGezd261109.shtml"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "俄军空袭乌能源设施 第聂伯罗逾60万人断电", "summary": "据新华社，俄国防部8日称对为乌军服务的燃料和能源基础设施实施打击，并在黑海打击一艘运送军用物资的船只。乌方表示，第聂伯罗彼得罗夫斯克州等地遭大规模袭击，巴甫洛格勒等超60万居民断电，冬季电网保供压力达极值。", "source": "新华财经", "url": "https://www.cnfin.com/hb-lb/detail/20261109/4492657_1.html"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "央行出手稳汇率 增强汇率双向弹性维护市场平稳", "summary": "业内人士指出，央行上调外汇存款准备金率传递明显稳汇率信号，重在稳住升值节奏、增强双向弹性，而非逆转人民币长期趋势。背景是人民币面临较强升值压力、单边预期强化且年末季节性结汇高峰临近。", "source": "中国金融信息网", "url": "https://m.cnfin.com/zs-lb//zixun/20261109/4492784_1.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "中国10月末外汇储备升至34052亿美元 黄金连增24个月", "summary": "国家外汇管理局数据显示，截至2026年10月末，我国外汇储备规模34052亿美元，较9月末增49亿美元、升幅0.14%；黄金储备达7830万盎司，环比增83万盎司，连续第24个月增持。", "source": "新华财经", "url": "https://www.cnfin.com/yw-lb/detail/20261109/4492671_1.html"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "我国制备出已知最冷人造物质 等效温度降至9.7皮开尔文", "summary": "利用中国空间站超冷原子物理实验柜，我国科学家以全光阱冷却将铷原子云降至9.7皮开尔文（比室温低14个数量级），可稳定观测7秒，刷新此前38皮开尔文世界纪录，成果在线发表于《科学》。", "source": "中国科学院/光明日报", "url": "https://www.cas.cn/cm/202611/t20261109_5123775.shtml"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "中国团队首次完整演示“日冕加热”物理过程", "summary": "中国原子能科学研究院联合多所高校，利用SG-II激光装置在实验室内产生磁重联现象，首次完整演示纳耀斑通过磁重联加热日冕，为这一长期未解的重大科学问题提供首个实验室定量基准。", "source": "光明网", "url": "https://news.gmw.cn/2026-11/09/content_39091300.htm"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "中超收官：大连英博惊天逆转夺队史首冠 蓉城屈居亚军", "summary": "2026赛季中超8日收官，成都蓉城2:3不敌山东泰山，大连英博3:1胜天津津门虎，两队同积52分，英博凭相互战绩优势夺冠。曾最多领先18分的蓉城连续错失冠军点；奥斯卡以23球荣膺金靴。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/ty/2026/11-09/10728620.shtml"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "冷空气来袭 专家提醒警惕心脑血管急症", "summary": "央视提示，随着冷空气南下气温骤降，心梗、脑梗进入高发期，研究显示气温每降低1℃心梗风险升高2%。专家提醒慢病患者勿擅自停降压药、避免清晨低温晨练与高温泡脚，出现胸闷、肢体无力等信号及时就医。", "source": "央视网", "url": "https://news.cctv.com/2026/11/09/ARTIwn2HnPyl9ZxPmXwyWFAq261109.shtml"}, {"id": 11, "category": "环境气候", "scope": "国内", "title": "寒潮大风蓝色预警持续 南方多地降温超10℃", "summary": "中央气象台9日6时继续发布寒潮与大风蓝色预警：预计9日至10日，江西东部、浙江南部、福建等地降温8—10℃、局地10—12℃；10日晨0℃线南压至陕南至华北南部一带。东部和南部海域有7—8级、阵风9—10级大风。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261109_8132307.html"}, {"id": 12, "category": "汽车出行", "scope": "国内", "title": "进博会中外汽车产业链携手 智能化新能源化共赢", "summary": "第九届进博会上，大众、宝马、通用、福特等国际车企密集牵手中国伙伴：大众展示中德联合研发新车型，通用与Momenta联合开发高阶辅助驾驶，特斯拉上海工厂本土化率达98%，博世ADAS将搭载奇瑞六款车型。", "source": "上海证券报", "url": "https://www.163.com/dy/article/LB9DD0AI0552C2FY.html"}, {"id": 13, "category": "游戏电竞", "scope": "国内", "title": "湖南首届电竞文旅潮玩消费周长沙启幕", "summary": "由湖南省文旅厅主办的“潮起潇湘 乐竞湖南”首届湖南电竞文旅潮玩消费周11月9日在长沙开幕，现场配备高配电竞设备供免费试玩《无畏契约》《王者荣耀》等，设非遗展区与“瓦力狂欢夜”，并全省联动四城拉动文旅消费。", "source": "腾讯新闻/湖南日报", "url": "https://news.qq.com/rain/a/20261108A0A8GE00"}, {"id": 14, "category": "文化读书", "scope": "国内", "title": "新疆阿勒泰中学以京剧社团铸牢中华民族共同体意识", "summary": "新疆阿勒泰市第三中学2500余名学生涵盖16个民族，开设京剧、冬不拉、书法等近40个社团，推行混班教学、混合住宿与共同就餐。学生在唱念做打与互鉴中增进认同，《人民日报》报道其以文化人、以情聚心的实践。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20261109A03XD000"}, {"id": 15, "category": "社会民生与教育", "scope": "国内", "title": "昆明秋假推出“城市实践课” 中小学生用脚步丈量家乡", "summary": "昆明将于11月13日秋假首日推出“城市里的实践课”一日游，串联市规划馆、巫家坝飞虎博物馆与AI未来馆，融合城市历史、红色航空与科技体验。活动面向6至15岁学生，费用128元/人，后续还将推出非遗、职业探访等主题。", "source": "云南网/昆明日报", "url": "https://society.yunnan.cn/system/2026/11/09/034191841.shtml"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "山西稷山晒出教育“小账本” 小微权力置于阳光下", "summary": "山西运城稷山县完善校园食堂全县集采集配与净菜供应、教辅严守“一科一辅”并全程留痕，将收支、征订、采购结果主动公示。中国教育报评价，以过程公开夯实校园治理信任，约束权力落脚于教育惠民。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202611/t20261109_2111539600.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "第二十八届哈尔滨冰雪大世界升级 西区新增7条400米冰滑梯", "summary": "第二十八届哈尔滨冰雪大世界持续优化业态，园区西区将打造7条400米超长冰滑梯，并全域布设20余处大中小型冰滑梯形成梯度布局。滑道终点衔接冰雪大舞台与气膜暖堡，实现游玩、观演、休憩一站式体验。", "source": "哈尔滨日报", "url": "https://kuaibao.qq.com/s/20261109A04GUR00?refer=cp_1009"}]}};</script>

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
