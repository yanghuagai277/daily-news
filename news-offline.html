 "category": "战争与自然灾害", "scope": "国际", "title": "巴拿马7.6级强震后续：逾1250房屋受损 800余人避难", "summary": "联合国人道主义事务协调厅12日更新称，巴拿马10月9日发生的7.6级地震已造成约1250栋房屋、619所学校、29处医疗设施及16座桥梁受损，800余人入住避难所，27人受伤，无人员死亡报告。全国进入紧急状态，救援持续。", "source": "ReliefWeb", "url": "https://reliefweb.int/report/panama/latin-america-caribbean-weekly-situation-update-12-october-2026"}, {"id": 8, "category": "科学探索", "scope": "国际", "title": "韦布望远镜首次直接证实褐矮星水云会随自转增厚变薄", "summary": "美国亚利桑那大学团队利用詹姆斯·韦布空间望远镜，对距地球约7.5光年的褐矮星WISE 0855连续11小时观测，首次直接证实其水云厚度随时间变化，并实时捕捉大气深层气体上涌过程，成果发表于《天体物理学杂志》。", "source": "科学网", "url": "https://news.sciencenet.cn/htmlnews/2026/10/572777.shtm"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "2026别克LPGA锦标赛10月15日在上海开赛 殷若宁领衔", "summary": "2026别克LPGA锦标赛15日在上海开幕，来自17个国家和地区的81位球员参赛，含36位LPGA冠军。中国名将殷若宁、卫冕冠军吉诺·提提库等亮相。此前名古屋亚运会上中国女队包揽高尔夫团体金牌，殷若宁摘个人银牌。", "source": "网易", "url": "https://www.163.com/dy/article/L95CJAQK0514A42S.html"}, {"id": 10, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛10月15日北美开战 LPL四队出征", "summary": "2026英雄联盟全球总决赛（S16）于10月15日在美国拉开帷幕，19支战队角逐召唤师杯，入围赛在洛杉矶进行。LPL赛区AL、BLG、TES、iG四队全员直通瑞士轮，时隔多年重返北美，被称“含冠量最高一届”，Faker冲击第七冠。", "source": "腾讯新闻", "url": "https://www.toutiao.com/a7689404409457033770"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "全国卫生与健康大会召开 习近平系统阐明健康中国“六大能力”", "summary": "全国卫生与健康大会10月12日至13日在北京召开，习近平出席并发表重要讲话，系统阐明健康中国应具备健康管理、疾病防控、医疗服务、医保支撑、医药创新、人才培养“六大能力”。大会强调预防是最经济有效的健康策略，确保“十五五”决定性进展。", "source": "国家卫健委", "url": "https://www.nhc.gov.cn/wjw/mtbd/202610/43de38f0a9c0401799c2ba8195f1cc40.shtml"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "中央气象台发暴雨蓝色预警 冷空气15至19日影响我国大部", "summary": "中央气象台15日06时继续发布暴雨蓝色预警，湖南中北部、湖北东部、江西北部、安徽西南部等地有暴雨（50—90毫米）。15日至19日新一轮冷空气自西向东影响我国大部，北方降温4—8℃、局地超10℃，新疆青海等地有暴雪。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/country/warning/downpour.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "国庆高速新能源车充电671万次 繁忙服务区同比降17%", "summary": "国家能源局监测显示，10月1日至7日全国高速公路新能源汽车充电671.1万次、电量1.63亿千瓦时，日均充电量同比增51.42%。在新能源车流量同比增35%背景下，日均充电特别繁忙服务区数量同比下降17%，“充电焦虑”明显缓解。", "source": "中国经济网", "url": "https://auto.ce.cn/auto/gundong/202610/t20261012_3254914.shtml"}, {"id": 14, "category": "文化读书", "scope": "国内", "title": "2026天府书展10月16日成都启幕 3.7万种图书惠民", "summary": "2026天府书展将于10月16日至19日在成都举行，2.2万平方米展馆、200多家出版单位携3.7万余种图书参展，发放500万元惠民消费券，配套800余场活动。本届首设台湾地区图书专区并引入河洛文化AI大模型，麦家、阿来等名家现场交流。", "source": "中国全民阅读网", "url": "https://www.nationalreading.gov.cn/ydzg/dfdt/202610/t20261013_1012237.html"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "国庆假期跨区域人员流动21.42亿人次 绿色自驾成主流", "summary": "交通运输部数据显示，10月1日至7日全社会累计跨区域人员流动量达21.42亿人次，日均3.06亿人次，同比增长0.6%。自驾仍为出游主流，新能源汽车凭借经济与绿色属性成为长途出行重要载体，高速充电体验持续改善。", "source": "人民日报", "url": "https://www.163.com/dy/article/L92B6ACF0530MKMJ.html"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "江西高校推行“隐形餐补” 资助无感更有温度", "summary": "秋季开学以来，江西多所高校将“隐形餐补”从个别探索变为常态：餐补到账仅显示“补助发放”，避免标签化与心理压力。从“学生找资助”转向“资助找学生”，并配套勤工助学、临时困难补助等，确保不让一个学生因困失学。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202610/t20261013_2111529632.html"}, {"id": 17, "category": "健康养生", "scope": "国际", "title": "美国今年麻疹确诊超4080例 创1991年来年度新高", "summary": "新华社援引美国疾控中心数据，截至10月8日美国今年已报告4080例麻疹确诊病例，超过2025年全年，为1991年以来年度最高，约95%患者未接种或接种情况不明。世卫组织同时表示，俄“不明原因肺炎”事件尚无持续传播证据。", "source": "新华社", "url": "https://news.qq.com/rain/a/20261012A02ESZ00"}]}, "yest": {"date": "2026-10-11", "generatedAt": "2026-10-11T07:10:31+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": "n1", "category": "科技互联网与AI", "scope": "国内", "title": "腾讯云开源团队AI协作工具TeamAI，适配16种Agent、调用成本降76%", "summary": "10月10日，腾讯云宣布开源团队AI协作工具TeamAI，基于Git统一存储团队Skill、规范与项目知识，已适配WorkBuddy、Claude Code、Cursor等16种Agent，实现“一人配置、全员复用”，内部测试显示模型调用成本降低76%。", "source": "腾讯网/凤凰网", "url": "https://new.qq.com/rain/a/20261010A07XZE00"}, {"id": "n2", "category": "国际时事", "scope": "国际", "title": "俄乌战事最新：俄称控制两处居民点，乌称打击俄萨马拉州石油设施", "summary": "10月10日，俄国防部称俄军已控制哈尔科夫地区卢卡绍沃和洛巴诺夫卡两处居民点，并打击乌军工能源设施；乌方通报同日打击了俄萨马拉州一处大型石油设施，称其为俄军供油枢纽。", "source": "央视新闻/腾讯", "url": "https://new.qq.co 具箱。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/jk/2026/10-10/10710598.shtml"}, {"id": "n10", "category": "环境气候", "scope": "国内", "title": "第三次新疆综合科考成果发布：查明冰川24202条，生态持续向好", "summary": "第三次新疆综合科学考察成果10月10日发布。历时5年、46家单位6000余人次参与，全面更新新疆生态本底：查明冰川24202条，近30年河川径流量增约100亿立方米，荒漠化与沙化实现“双缩减”。", "source": "中青报/央视", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6596acabe1f53752"}, {"id": "n11", "category": "汽车出行", "scope": "国内", "title": "中国新能源乘用车全球份额达62%，1-8月全球销量1570万辆", "summary": "乘联分会数据显示，2026年1至8月全球新能源乘用车销量约1570万辆、同比增15%，中国新能源乘用车全球份额达62%，7至8月升至65.3%；中国品牌在东盟新能源市场占比已超30%。", "source": "每日经济新闻/腾讯", "url": "https://news.qq.com/rain/a/20261009A02ID500"}, {"id": "n12", "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛开战，LPL四队AL、BLG、TES、iG登场", "summary": "英雄联盟2026赛季全球总决赛（S16）10月在美国拉开战幕，全球6赛区19支队伍参赛、延续瑞士轮赛制，总决赛11月14日在纽约巴克莱中心举行；LPL四队AL、BLG、TES、iG登场，受北美时差影响多在北京时间凌晨出战。", "source": "萌娘百科/Riot", "url": "https://mobile.moegirl.org.cn/zh-hans/%E8%8B%B1%E9%9B%84%E8%81%94%E7%9B%9F2026%E8%B5%9B%E5%AD%A3%E5%85%A8%E7%90%83%E6%80%BB%E5%86%B3%E8%B5%9B"}, {"id": "n13", "category": "娱乐影视", "scope": "国内", "title": "国庆档电影票房11.64亿元，国产片领跑，“电影+文旅”升温", "summary": "据网络平台数据，2026年国庆档（10月1日至7日）电影票房达11.64亿元，国产影片领跑，题材涵盖悬疑、喜剧、动画等；各地以惠民观影券、“电影+文旅”串联消费，电影全产业链产值今年已超4800亿元。", "source": "央视网", "url": "https://news.cctv.com/2026/10/08/ARTI0m5H6eGkx4Niq3rq086k261008.shtml"}, {"id": "n14", "category": "文化读书", "scope": "国内", "title": "电影《欢迎来龙餐馆》将代表内地角逐第99届奥斯卡最佳国际影片", "summary": "国庆假期持续热映的电影《欢迎来龙餐馆》片方10月7日宣布，该片将代表中国内地角逐第99届奥斯卡最佳国际影片；影片以扎实内容与反战、护童的朴素价值观，被视作中外文化交流载体。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/08/ARTIheMgWRG8FNWbvViEsF4b261008.shtml"}, {"id": "n15", "category": "旅行出行", "scope": "国内", "title": "全国铁路10月11日起实行四季度调图，长三角列车对数创历史新高", "summary": "10月11日零时起，全国铁路实行第四季度列车运行图。长三角铁路旅客列车开行达1435.5对、创历史新高；重庆至武汉最快缩至3小时53分，多地首开进京高铁，并新增中越国际联运班列。", "source": "中国铁路/腾讯", "url": "https://new.qq.com/rain/a/20261011A02VY000"}, {"id": "n16", "category": "财经经济与就业", "scope": "国内", "title": "秋粮收获过半，三季度线下消费支付金额同比增长2.6%", "summary": "农业农村部调度显示，目前全国秋粮收获过半，西南收七成半、东北三成半；发改委数据称三季度线下消费支付金额同比增2.6%、9月增3.1%，增速连三月上行，经济回升向好态势巩固。", "source": "经济日报/澎湃", "url": "https://www.thepaper.cn/newsDetail_forward_34229441"}, {"id": "n17", "category": "国际时事", "scope": "国际", "title": "美国宣布制裁国际刑事法院，多国发表联合声明反对", "summary": "当地时间10月9日，美国政府宣布对国际刑事法院实施制裁；ICC强烈反对，多国发表联合声明表示遗憾并坚定支持其独立性。同日特朗普称中期选举前不攻击伊朗，普京会晤伊朗总统促停火。", "source": "央视新闻/今日头条", "url": "https://www.toutiao.com/article/7694800574600135219/"}]}};</script>

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
