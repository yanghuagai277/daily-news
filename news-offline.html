om/jzkzj/2026-09-18/detail-ihfkhckz2210533.shtml"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "长征十二号成功发射卫星互联网低轨25组卫星，长征系列第667次飞行", "summary": "9月17日8时32分，长征十二号运载火箭在海南商业航天发射场点火起飞，成功将卫星互联网低轨25组卫星送入预定轨道。长十二由中国航天科技集团八院抓总研制，是我国首款4米级箭径单芯级火箭，700公里太阳同步轨道运力不低于6吨，本次为长征系列第667次发射。", "source": "腾讯新闻 / 科技日报", "url": "https://new.qq.com/rain/a/20260918A02EX100"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "快舟十一号一箭双星，成功发射天仪51、52星", "summary": "北京时间9月17日10时40分，我国在酒泉卫星发射中心使用快舟十一号遥三运载火箭，成功将天仪51、52星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是快舟十一号运载火箭的第7次飞行，进一步丰富了我国快速响应发射能力。", "source": "央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_7636aac79ef53652"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "亚运男篮半决赛今夜中国vs日本，九一八之夜争决赛席位", "summary": "北京时间9月18日18时20分，名古屋亚运会男篮半决赛中国对阵东道主日本，胜者进决赛。中国队1/4决赛87:78胜沙特，廖三宁砍30分7板4助；日本以B联赛球员为主的“二队”曾85:78淘汰中国台北。另一场韩国对伊朗15时先打，决赛9月20日进行。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260917A0F2K600"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "国家中医药局开秋季养生发布会：推荐八段锦，提醒科学“贴秋膘”", "summary": "国家中医药管理局9月17日召开“秋季中医药养生”专题发布会。专家提示秋季应滋阴润燥、早睡早起，可练习八段锦、太极拳舒缓身心；并强调现代人营养过剩，贴秋膘应“清补为主、有病先治、因人而异”，高血压糖尿病等慢病患者不可盲目进补或停医嘱用药。", "source": "国家中医药管理局", "url": "http://www.natcm.gov.cn/bangongshi/gongzuodongtai/2026-09-17/38776.html"}, {"id": 11, "category": "环境气候", "scope": "国际", "title": "WMO《臭氧公报》：全球臭氧层持续恢复，2025南极空洞数十年最小", "summary": "9月16日国际保护臭氧层日，世界气象组织发布《臭氧公报》称，2025年南极臭氧空洞深度与范围连续第二年显著低于1990—2010年平均，为有记录以来第四至第五小。秘书长绍洛表示这是环保成功案例，自2000年持续恢复，预计数十年内完全复原；中国累计淘汰约72万吨消耗臭氧层物质。", "source": "新华社 / 世界气象组织", "url": "https://finance.sina.com.cn/jjxw/2026-09-17/doc-inisapns9533044.shtml"}, {"id": 12, "category": "汽车出行", "scope": "国内", "title": "智能网联汽车强制性国标GB 47955—2026发布，2027年实施规范L2辅助驾驶", "summary": "工信部牵头制定的《智能网联汽车 组合驾驶辅助系统安全要求》（GB 47955—2026）已发布，将于2027年1月1日实施。标准首次以强制国标形式明确L2组合驾驶辅助的驾驶员监测、系统边界与试验方法，并要求企业宣传禁用“自动驾驶”等误导性表述，2026年乘用车L2渗透率已约七成。", "source": "齐鲁晚报 / 工信部", "url": "https://ql1d.com/general/28051864.html"}, {"id": 13, "category": "游戏电竞", "scope": "国内", "title": "LPL资格赛TES 3-1击败IG锁定三号种子，WE与JDG今夜生死战", "summary": "9月17日LPL全球总决赛资格赛M1，TES以3-1击败IG，锁定LPL赛区三号种子，IG跌入M3保留最后一次机会。9月18日17时M2由WE对阵JDG，胜者将与IG争夺最后一张S赛门票，败者直接淘汰；BLG、AL此前已分获一、二号种子，代表LPL出征S16。", "source": "直播吧", "url": "https://m.zhibo8.com/news/web/other/2026-09-18/6aac7a4ae5927native.htm"}, {"id": 14, "category": "文化读书", "scope": "国内", "title": "电影《731》9·18上映首日破多项影史纪录，票房超3亿元", "summary": "9月18日电影《731》正式上映，据猫眼数据单日场次破27.4万场，超过《哪吒之魔童闹海》成为中国影史单片单日总场次冠军；截至当晚票房突破3.1亿元，排片占比高达68%。多地影院将首场定在9时18分并标注“警钟长鸣”，影片以平民视角揭露侵华日军731部队暴行。", "source": "深圳特区报 / 搜狐", "url": "https://www.sohu.com/a/936395624_121384255"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "“宝藏小城”旅游升温，河北滦平酒店预订同比增超10倍", "summary": "中秋国庆双节临近，自然风光优越的“宝藏小城”成为文旅黑马。据携程等平台数据，滦平等地假期旅游产品搜索量环比增超60%，酒店预订量同比增超10倍，金山岭长城周边多酒店“满房”。1至8月滦平接待游客615.33万人次、同比增8.7%，沉浸式体验与普通话之乡IP带动全域游。", "source": "纵览新闻 / 河北日报", "url": "https://www.toutiao.com/article/7686654753517863424/"}, {"id": 16, "category": "财经经济与就业", "scope": "国际", "title": "美联储时隔三年重启加息至3.75%—4%，全球市场震荡、英央行按兵不动", "summary": "北京时间9月17日凌晨，美联储以12:0通过加息25个基点，将联邦基金利率目标区间升至3.75%—4.00%，为2023年7月以来首次加息。受此影响美股尾盘跳水、现货黄金跌约1%、美元指数重上100；英国央行同日维持3.75%利率不变，为连续第六次按兵不动。", "source": "东方财富网 / 中国证券报", "url": "https://finance.eastmoney.com/a/202609173876452677.html"}]}, "yest": {"date": "2026-09-17", "generatedAt": "2026-09-17T06:00:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "上海AI实验室发布书生·星河智能体，科研人机协同实证AI使用率96.5%", "summary": "上海人工智能实验室联合复旦、中科院软件所等研发的“书生·星河”智能体模型（AtriaDawnPreview）近日发布。团队基于56名研发人员769条任务记录的实证显示，该科研场景中AI辅助使用率高达96.5%，但85.5%的技术路线选择、93.4%的研究目标界定仍由人类决策，印证“AI执行、人类掌舵”的可控协同范式；该模型在8项权威基准中获两项第一。", "source": "新民晚报 / 上海人工智能实验室", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_0956aab07b460352"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌发布Gemini 3.8 Live实时对话模型，并成立DeepMind Institute专攻AGI", "summary": "9月16日，谷歌DeepMind同日推出两项重磅动作：发布Gemini 3.8 Live及Extended Thinking两款端到端语音大模型，支持实时多模态交互与并行后台推理，开发者即日起可通过Gemini API调用；同时联合成立DeepMind Institute，由Shane Legg领衔，系统研究AGI对经济与社会的影响。行业解读认为其“学术+产业”双轮驱动策略为模型能力提供理论背书。", "source": "新浪科技（AI热点小时报）", "url": "https://k.sina.com.cn/article_7857201856_1d45362c001908noyi.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "联合国秘书长古特雷斯敦促中东和乌克兰紧张局势降级", "summary": "联合国秘书长古特雷斯9月16日在联大高级别周前记者会上呼吁中东和乌克兰紧张局势降级，强调“降级必须是第一、第二、第三优先”。他要求各方停止伤害平民、确保人道救援无障碍，并依照国际法全面恢复霍尔木兹与曼德海峡航行自由；就乌克兰冲突，他呼吁立即停火，作为迈向公正持久和平的第一步。", "source": "中国网 / 新华社", "url": "https://www.china.org.cn/world/Off_the_Wire/2026-09/17/content_118699585.shtml"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "俄无人机击中乌客车与火车致5死，交通与能源设施互袭延续", "summary": "乌克兰官员9月16日称，俄罗斯无人机当天击中乌南部一辆客运巴士和一列火车，造成5人死亡。随着莫斯科持续打击交通与基础设施，俄军同时发动对基辅等地的无人机袭击。乌方则打击俄萨马拉锡兹兰炼油厂及无人机设施，特朗普所称“停打能源目标”次日即被打破，双方能源设施互袭态势延续。", "source": "The Financial Express（路透社）", "url": "https://today.thefinancialexpress.com.bd/world/news-in-brief-2026-09-17-1789577616"}, {"id": 5, "category": "财经经济与就业", "scope": "国际", "title": "美联储时隔三年重启加息，将利率上调25个基点至3.75%—4.00%", "summary": "北京时间9月17日凌晨，美联储宣布加息25个基点，将联邦基金利率目标区间上调至3.75%—4.00%，为2023年7月以来首次加息，FOMC以12票赞成、0票反对通过。最新点阵图显示多数官员预计年内还将再加息一次；受此影响美股尾盘跳水，道指跌1.21%，现货黄金跌约1%，美元指数重上100关口。", "source": "东方财富网 / 中国证券报", "url": "https://finance.eastmoney.com/a/202609173876452677.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "8月经济“三稳两快”：工业增5.2%、失业率5.3%、高技术制造涨16.7%", "summary": "国家统计局9月15日公布，8月全国规模以上工业增加值同比增长5.2%，较上月加快0.7个百分点；城镇调查失业率5.3%，居民消费价格同比上涨0.8%。高技术制造业与数字产品制造业增加值分别增长16.7%、15.7%，货物进出口总额同比增长19.8%，经济运行呈“生产、就业、物价稳，新兴与外贸增长快”特点。", "source": "人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9286aa9c1d363452"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国将首次制定全国统一医保医疗服务项目目录，首批覆盖13类", "summary": "9月16日，国家医保局正式印发《国家基本医疗保险医疗服务项目目录（第一批）制定工作方案》，我国将首次制定全国统一的医保医疗服务项目目录。方案坚持“保基本”定位，首批覆盖心血管、呼吸、眼科、妇科、放疗、麻醉、护理、康复、口腔种植、辅助生殖等13类，落地后将率先应用于跨省异地就医结算，再逐步与各省支付范围衔接。", "source": "中国新闻网 / 金普新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3546aab0bd874252"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "引力一号遥三一箭九星海上发射成功，载荷破3吨创新高", "summary": "北京时间9月16日6时，我国太原卫星发射中心在东海海域使用引力一号遥三运载火箭，将千帆极轨26组卫星及EUHT技术试验卫星共9颗送入预定轨道，任务成功。本次净载荷超3吨、入轨高度约800公里，创单次海上发射载荷重量与轨道高度新高，为千帆星座组网精准补位。此为引力一号第4次飞行。", "source": "光明网", "url": "https://www.toutiao.com/article/7686220673458405930/"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "美军官称需为月球周边空间作战做准备，太空军事化提速", "summary": "据美联社9月16日报道，美军参谋长联席会议主席丹·凯恩表示，美军不仅需要为地球轨道作战做好准备，还需为月球周边空间作战做准备。此前美国空军部长已公开证实美军在轨部署“太空控制武器”，标志美国太空军事政策重大变化，引发对《外层空间条约》框架下常规太空武器扩张的关注。", "source": "新华社", "url": "https://www.toutiao.com/article/7686243305792733742/"}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "亚运男篮中国87:78力克沙特晋级四强，半决赛9月18日战日本", "summary": "2026名古屋亚运会男篮1/4决赛，中国男篮以87:78击败沙特阿拉伯队，晋级四强。廖三宁砍下30分7篮板4助攻，余嘉豪16分9篮板，胡金秋14分。四强对阵为：中国对日本、韩国对伊朗；中国男篮半决赛将于9月18日18:20打响，争冠热门菲律宾、约旦均提前出局。", "source": "新浪体育（CBA）", "url": "https://k.sina.com.cn/article_5559864694_14b64cd7600101cok2.html?subch=cba"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "亚运男足开门红：中国2:1逆转朝鲜，吴曦张玉宁联袂破门", "summary": "9月16日，名古屋亚运会男足小组赛B组，中国男足亚运队2:1逆转战胜朝鲜队。吴曦送出精准助攻并由张玉宁头球扳平，终场前吴曦挑射反超比分，两名超龄球员“相互成全”奉献精彩配合。中国队在“死亡之组”拼下宝贵3分，9月20日将迎战小组赛第二个对手伊朗队。", "source": "天津日报 / 新浪财经", "url": "https://www.163.com/dy/article/L70L4MG405568W0A.html"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "教育部部署第12个全国近视防控宣传教育月，主题聚焦高度近视", "summary": "教育部近日发布通知，决定今年9月开展第12个全国近视防控宣传教育月，主题为“落实健康第一理念，科学防控高度近视”，要求以健康学校建设为统领，在秋季学期持续推进近视防控宣传教育，至少组织1次主题宣传活动。同期国家中医药局在福建三明举办培训班，推广三明医改中医药经验。", "source": "腾讯新闻 / 教育部", "url": "https://news.qq.com/rain/a/20260917A029D000"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "中国累计淘汰约72万吨消耗臭氧层物质，氢氟碳化物减排超额", "summary": "9月16日国际保护臭氧层日纪念大会上，生态环境部披露：自加入《蒙特利尔议定书》以来，中国累计淘汰约72万吨消耗臭氧层物质；接受《基加利修正案》后，氢氟碳化物生产和使用总量已累计比国家履约目标分别减少11.85亿和7.59亿吨二氧化碳当量以上，为全球环境治理作出重要贡献。", "source": "人民日报海外版", "url": "https://paper.people.com.cn/rmrbhwb/pc/content/202609/17/content_30181590.html"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "九部门发布智能网联新能源车“十五五”规划，中国汽车迈向由大到强", "summary": "工信部等九部门联合发布《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年全产业链优势进一步巩固、进入世界汽车强国行列。2025年我国汽车产销连续17年全球第一，新能源汽车产销连续11年居首、出口同比激增103.7%；L2级辅助驾驶新车渗透率已升至70%，L3级迈入商业化应用，技术领先成为核心竞争力。", "source": "经济参考报 / 新浪汽车", "url": "https://k.sina.com.cn/article_7517400647_1c0126e47059098sn0.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026英雄联盟全球总决赛LPL资格赛9月17日开赛，决出最后两席", "summary": "2026 LPL全球总决赛资格赛（冒泡赛）于9月17日至19日在上海联盟竞技场举行，每日17:00一场BO5。赛程为：17日TES对阵IG（M1，争三号种子），18日WE对阵JDG（M2），19日M1败者对M2胜者争夺四号种子。胜者将代表LPL赛区出征S16全球总决赛，赛事门票与直播同步开放。", "source": "腾讯网 / 腾竞体育", "url": "https://new.qq.com/rain/a/20260909A0DZC900"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "2026“我与地坛”北京书市开幕，展期11天设九大展区", "summary": "9月17日，2026“我与地坛”北京书市启幕，作为北京文化论坛会客厅活动之一，展期11天覆盖中秋小长假。地坛公园主展场面积突破2万平方米，设九大展区、500余展位，汇聚400多家出版机构；同期举办150余场讲座、签售与对谈，濮存昕、赵冬梅等数十位作家到场，并走出北京联动保定、天津办展。", "source": "新浪财经 / 北京日报", "url": "https://finance.sina.com.cn/jjxw/2026-09-17/doc-inisaawt3644615.shtml"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "“双节”出游预订火爆，机票酒店预订量大幅攀升", "summary": "今年中秋与国庆仅隔三天，“请3休13”拼假方案打造全年最长出游窗口。同程数据显示截至9月14日，“中秋”“国庆”搜索热度月环比增278%，国内热门城市机票预订同比增超40%；携程称机票订单同比增约五成、酒店订单增近两倍。航旅纵横显示9月25日至10月7日国内航线机票预订超606万张，同比增约14%。", "source": "东方财富网 / 经济参考报", "url": "https://finance.eastmoney.com/a/202609173876466332.html"}, {"id": 18, "category": "国际时事", "scope": "国内", "title": "香港公布首个五年规划，对接国家“十五五”迈上由治及兴新阶段", "summary": "9月16日，香港特区行政长官李家超在立法会公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》并发表施政报告。规划共7篇28章约6万字，明确经济发展新突破、北部都会区提速、民生福祉改善等5大目标，制定105项指标，是香港主动对接国家“十五五”、由治及兴的行动纲领。", "source": "新浪财经 / 新华社", "url": "https://k.sina.com.cn/article_3167104922_bcc62f9a02001vg6g.html"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
