475923968/"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "武契奇辞去塞尔维亚总统职务，将以\"普通公民\"身份竞选总理", "summary": "当地时间9月27日晚，塞尔维亚总统武契奇提交辞呈，提前结束第二任期；按此前安排将参加下届政府总理竞选。议长布尔纳比奇代行总统职权，10月25日提前举行议会选举。", "source": "中国新闻网", "url": "https://m.chinanews.com/wap/detail/cht/zw/10704719.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "特朗普称本周将与伊朗重启谈判，霍尔木兹海峡通航仍受阻", "summary": "特朗普27日表示预计本周与伊朗重启谈判，但已拒绝伊方重开霍尔木兹海峡提案，并称\"一直在考虑\"恢复军事打击；伊朗称已做好战事重开准备但未放弃外交。美伊分歧聚焦海峡通航与核问题让步。", "source": "中国网", "url": "https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-09/28/content_118715337.shtml"}, {"id": 4, "category": "财经经济与就业", "scope": "国内", "title": "前8月全国规上工业企业利润增15.7%，电子行业拉动明显", "summary": "国家统计局：1—8月全国规上工业企业实现利润总额52719.8亿元，同比增15.7%；电子行业利润同比增1.1倍、贡献率62.0%，高技术制造业增54.7%。8月单月增4.2%。", "source": "中国经济网（国家统计局）", "url": "https://www.ce.cn/macro/more/202609/t20260928_3239220.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "中秋假期消费升温，智能穿戴销售额增1.2倍、以旧换新带动115.3亿", "summary": "商务部数据：中秋假期重点零售餐饮企业日均销售额同比增6.1%，智能穿戴设备销售额增1.2倍、具身智能机器人增93.1%；前两天以旧换新惠及190.7万人次，带动销售额115.3亿元。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260928A04Y2B00"}, {"id": 6, "category": "旅行出行", "scope": "国内", "title": "我国首次单日开通四条高铁新线，多地迈入高铁时代", "summary": "9月28日，京港高铁雄商段、西渝高铁西康段、宜兴高铁、哈伊高铁同步开通，覆盖华北、东北、西北、华中。雄商段552公里、最快2小时27分达商丘；哈伊高铁结束伊春不通高铁历史。", "source": "央广网", "url": "https://www.cnr.cn/china/news/20260928/t20260928_527827419.shtml"}, {"id": 7, "category": "体育赛事", "scope": "国际", "title": "亚运乒乓球收官：王曼昱女单夺冠，国乒男双中日对决胜出", "summary": "名古屋亚运会27日中国代表团再夺12金，以119金48银38铜领跑。王曼昱4比2胜孙颖莎夺女单，林诗栋/黄友政4比2胜日本组合夺男双；严子怡标枪破纪录、陈圆将110米栏夺金。", "source": "央广网", "url": "https://www.toutiao.com/article/7690389877875016246/"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "\"天关\"携手\"拉索\"发现42光年X射线尾迹，破解宇宙线传播谜题", "summary": "中科院团队利用\"天关\"卫星与\"拉索\"联合观测，在距地约4600光年脉冲星PSR J1740+1000周围发现延伸约42光年的超长X射线尾迹，为目前已知最长，揭示高能粒子可定向传播数十光年。", "source": "中国新闻网", "url": "https://m.chinanews.com/wap/detail/cht/zw/10700611.shtml"}, {"id": 9, "     if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
