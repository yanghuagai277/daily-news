长期特别国债更新公办养老机构设备11万台套。", "source": "中国西藏网/央广网", "url": "https://www.tibet.cn/cn/Instant/news/202611/t20261112_8070574.html"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "加沙纳赛尔医院遭以军空袭 至少6死", "summary": "巴勒斯坦通讯社12日报道，以军当天空袭加沙南部汗尤尼斯纳赛尔医院，造成至少6死20余伤，死者含一名外科医生。以方称精准打击哈马斯汗尤尼斯旅指挥官。自7日暴雨来袭，数万顶帐篷被淹，逾15万顶帐篷及排水设备仍未获以方批准进入，人道危机加剧。", "source": "新浪新闻/新华网", "url": "https://news.sina.com.cn/w/2026-11-12/doc-iniyntut1096664.shtml"}, {"id": 8, "category": "科学探索", "scope": "国际", "title": "火星阿尔巴山探测到异常氯化氢 火山或仍\"活\"着", "summary": "国际团队在《科学进展》发表研究，于火星阿尔巴山附近寒冷季节探测到异常聚集的氯化氢气体，并发现多条此前未识别的狭窄裂缝（宽数十厘米、长可达10公里）。异常信号指向地下仍有岩浆活动，若证实或为微生物提供热液环境，为寻找火星生命提供新方向。", "source": "新浪科技/科技日报", "url": "https://k.sina.com.cn/article_5953466437_162dab0450670bhmmc.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "中国北方旱区首次发现\"精灵圈\"现象", "summary": "中科院地理所于贵瑞团队联合兰州大学等首次在我国北方旱区记录并确认\"精灵圈\"现象，成果11日发表于《美国科学院院刊》。研究引入相变理论，揭示灌草在资源竞争中达成\"亚稳态\"空心环的空间分割机制，或为沙漠边缘生态预警提供新标尺。", "source": "搜狐/新华社", "url": "https://www.sohu.com/a/1100747012_162758"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "达喀尔青奥会中国体操混团夺历史首金", "summary": "11日达喀尔青奥会体操混合团体决赛，杨兰斌与陈紫嫣凭三轮稳定发挥助中国队夺该项目青奥会历史首金，日本、以色列分获银铜。拳击赛场张正坤获男子60公斤级铜牌；此前中国已包揽男、女团体两金，田径再添两银一铜。", "source": "新浪财经/新华社", "url": "https://finance.sina.com.cn/jjxw/2026-11-13/doc-iniypksm1089512.shtml"}, {"id": 11, "category": "健康养生", "scope": "国际", "title": "中外团队Nature研究：肥胖诊断不能只看体重", "summary": "华中科大潘安团队基于中、英、美、西四国超84万人数据研究证实，肥胖诊断不能单凭BMI\"一刀切\"。约22.7%-31.3%的体脂过多者仅处\"临床前肥胖\"，10年随访显示临床前肥胖全因死亡风险增19%、临床肥胖陡增69%。成果12日发表于《自然》。", "source": "科学网/中新网", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574625.shtm"}, {"id": 12, "category": "环境气候", "scope": "国际", "title": "2026全球碳预算报告：化石燃料排放微降0.4%", "summary": "国际\"全球碳计划\"报告预计，2026年全球化石燃料二氧化碳排放量同比微降0.4%至382亿吨，主因太阳能风能扩张及能源市场动荡。但计入土地利用变化排放后总量将升至433亿吨；中国贡献了全球约一半由可再生能源和电动车避免的减排。", "source": "中国经济网/新华社", "url": "http://tech.ce.cn/yw/202611/t20261112_3291704.shtml"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "中国新能源车\"开向亚太\" 产业链本地化落地", "summary": "在APEC深化区域合作背景下，中国新能源车从深圳小漠港装船出海，在泰国、马来西亚、新加坡等地扎根。某车企在泰累计交付破13万辆、门店超160家、罗勇府工厂设计年产能15万辆，本地化生产模式带动亚太绿色出行。", "source": "云南网/央视新闻", "url": "https://news.yunnan.cn/system/2026/11/12/034194250.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "第二届莫斯科国际游戏周落幕 吸引25万人次", "summary": "第二届莫斯科国际游戏周11月1日闭幕，四天吸引25万人次参与，促成25国合作伙伴交流。CS2国际赛事956支战队预选、直播观赛200万；公众\"电子游戏之夜\"约1.5万人参与。莫斯科游戏中心与上海、阿布扎比园区并列全球竞争力前三。", "source": "网易", "url": "https://www.163.com/dy/article/LBI4Q4QU0556PAP8.html"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026广西知识大会启幕 以\"知识的长河\"为主题", "summary": "2026广西知识大会11月13-15日在广西博物馆启幕，联动书店与\"小而美\"阅读空间开设分会场。设名家对谈、万册好书3折展销、非遗市集、鲁迅诞辰145周年文学快闪及平陆运河主题专区等七大板块，把读书拆成多种打开方式。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261104A09ZYY00"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "秋假催热11月旅游淡季 主题乐园研学爆发", "summary": "各地秋假政策带动主题乐园与研学游爆发，上海海昌旗下酒店自12日起连续7天提前满房、收入同比增10%；去哪儿数据显示开封万岁山、自贡恐龙博物馆等门票预订同比增超10倍，北京景区搜索量同比大增360%领跑全国。", "source": "重庆日报/澎湃", "url": "https://www.cqrb.cn/shishi/2026-11-12/2819810_pc.html"}, {"id": 17, "category": "科技互联网与AI", "scope": "国内", "title": "工信部加强智能体终端设备进网管理", "summary": "工信部近日印发《关于加强智能体终端设备进网管理的通知》，为具备自主感知、决策、执行能力的智能体终端（含手机、穿戴设备、智能网联汽车、人形机器人）划定运行边界，防范隐私泄露、算法偏差与新型网络攻击等风险，引导AI健康发展。", "source": "中国经济网", "url": "http://ipaper.ce.cn/pad/content/202611/13/content_341816.html"}]}, "yest": {"date": "2026-11-12", "generatedAt": "2026-11-12T14:54:42+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "百度世界2026举办 李彦宏首提“组织进化三原则”并发布文心5.5 Flash", "summary": "11月12日百度世界2026在北京举办，李彦宏判断AI下一幕是“智能组织”，首次提出打破岗位边界、沉淀隐性知识、设计流程闭环三原则。大会围绕“芯云模体”架构发布大模型交易平台词元所、文心大模型5.5 Flash预览版及多款智能体升级，昆仑芯公布新品计划，萝卜快跑全球化提速。", "source": "环球网/网易", "url": "https://www.163.com/dy/article/LBHOQGST0514R9OJ.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "英伟达黄仁勋风波发酵盘后跳水 OpenAI单季亏损109亿美元", "summary": "11月12日AI行业多项重磅传来：英伟达股价盘后跌超3%，CEO黄仁勋被曝与下属存在婚外情、董事会委托独立调查并引发股东诉讼；OpenAI第三季度营收据称达100亿美元但亏损扩大至109亿；SpaceX与xAI上线Grok Voice 3.0语音API，每分钟0.08美元。", "source": "凤凰网科技/网易", "url": "https://www.163.com/dy/article/LBH538KN0556I485.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "俄美乌三方会谈在阿布扎比结束 就大规模换俘达成协议", "summary": "为期两天的俄美乌三方会谈11日在阿布扎比结束，各方就大规模交换被俘人员达成协议，双方各自移交人数或超1000人、规模或创纪录。但在结束冲突、领土争议、乌安全保障及欧洲安全架构等核心议题上仍存“重大分歧”，后续库什纳、威特科夫将赴莫斯科见普京。", "source": "新华社/网易", "url": "https://www.163.com/dy/article/LBH8K8N20514CQIE.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "两油轮在霍尔木兹海峡触雷爆炸 美军严格执行对伊朗海上封锁", "summary": "伊朗革命卫队海军称，10日晚两艘油轮试图经未经授权的航线秘密驶出霍尔木兹海峡，触碰水雷引发剧烈爆炸。美中央司令部表示美军正严格执行对伊海上封锁；伊朗方面警告未遵守其航行安全要求的船舶将被视为威胁，并重申重开海峡须满足七项条件。", "source": "央视新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261112A038XJ00"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "央行发布三季度货币政策执行报告 加力实施支持资本市场两项工具", "summary": "人民银行11日发布2026年第三季度货币政策执行报告，明确加大逆周期调节力度，加力实施支持资本市场的两项货币政策工具，用好债市非银大额赎回互换便利，维护股票、债券、外汇等金融市场平稳运行，保持流动性充裕与融资条件相对宽松。", "source": "中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261112_3291905.shtml"}, {"id": 6, "category": "社会民生与教育", "scope": "国内", "title": "国家明确支持增加普通高中学位 推进养老托育普惠降价", "summary": "发改委“十五五”民生发布会明确，将通过新建改扩建等支持各地普高扩容、提升初中升高中比例，并稳步扩大优质本科招生；同时推进老旧养老机构改造、护理型床位占比达73%，实现托育综合服务中心地市级全覆盖，推动“一老一小”与社区集成服务就近可及。", "source": "央视新闻/都昌县政府", "url": "https://www.duchang.gov.cn/zwzx/bmdt/202611/t20261112_7363840.html"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "中欧“微笑”卫星发布首批观测图像 多项成果属全球首次", "summary": "近日中欧联合发布“微笑”（SMILE）卫星首批观测图像与探测数据，多项成果属全球首次。该卫星5月19日发射，旨在从远距离给地球磁层拍摄动态全景图，揭示太阳风如何撞击地球“防护盾”，提升空间天气预警能力，是我国空间科学从参与走向贡献关键能力的缩影。", "source": "央视网/光明日报", "url": "https://news.cctv.cn/2026/11/12/ARTIuOBAbUOnh7hYuDuBpHFe261112.shtml"}, {"id": 8, "category": "体育赛事", "scope": "国内", "title": "熊猫杯中国U19男足3:1击败越南 收获开门红", "summary": "11日成都熊猫杯首轮，中国U19男足3:1力克越南U19。杨展彭第15分钟任意球直接破门、第74分钟点射梅开二度，彭子鸣造点并终场前助攻击杀，越南由莫里奇头球扳回一城。本届熊猫杯为U20亚洲杯备战，中国队14日、17日将迎战塔吉克斯坦与韩国。", "source": "人民网", "url": "https://ent.people.com.cn/n1/2026/1112/c1012-40832411.html"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "大连英博中超神奇夺冠 从1%概率逆袭登顶", "summary": "8日中超末轮，大连英博3:1力克天津津门虎，而成都蓉城客场2:3不敌山东泰山，大连以21年等待上演“二年级生”夺冠奇迹。数据网站统计其夺冠概率长期在1%，收官战前才升至13%；路透社称成都“史诗级崩盘”，西班牙《马卡报》感叹足球永远充满惊喜。", "source": "沈阳日报", "url": "https://epaper.syd.com.cn/syrb/h5/html5/2026-11/12/content_121056_20016265.htm"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "我国科学家领衔84万人研究在《自然》重新定义全球肥胖标准", "summary": "北京时间12日凌晨，华中科技大学潘安教授团队联合多国专家在《自然》发表重磅研究，基于四大国家队列、超84万人数据验证“临床前/临床肥胖”框架。研究显示仅约22.7%—31.3%体脂过多者出现器官损伤；临床肥胖全因死亡风险达69%，但77%—91%临床前者十年内未恶化。", "source": "中国青年网", "url": "https://news.youth.cn/jsxw/202611/t20261112_16963015.htm"}, {"id": 11, "category": "环境气候", "scope": "国际", "title": "世界气象组织：厄尔尼诺将于12月达有记录以来最强水平", "summary": "世界气象组织报告称，超强厄尔尼诺自8月持续增强，预计12月达有记录以来最强，影响持续至2027年。今年1—9月全球平均地表温度较工业化前高约1.47℃，2026年料为有记录最暖四年之一；海洋热含量与海平面均创历史新高，冰川持续退缩。", "source": "光明日报", "url": "https://news.gmw.cn/2026-11/12/content_39097326.htm"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "中东部雨雪发展 华南局地暴雨 北方多地降雪 华北黄淮有雾霾", "summary": "中央气象台12日预报：12—13日西南、江淮、江南、华南有中到大雨，广西、广东、海南局地暴雨或大暴雨；12—15日新疆北部山区局地暴雪或大暴雪。12—14日华北中南部、黄淮等地有轻至中度霾、局地重度霾，12日晨多省发布大雾黄色预警，局地能见度低于200米。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261112_8138616.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "中国新能源车“开向亚太” 产业链本地化落地泰国等国", "summary": "在APEC深化区域可持续合作背景下，满载新能源汽车的滚装船从深圳启航驶向世界。在泰国，某中国车企本地组装推进、罗勇府海外基地设计年产能15万辆，已累计交付突破13万辆、门店超160家覆盖全部77府，并引入闪充技术，从“卖车”走向整条产业链扎根。", "source": "央视新闻/云南网", "url": "https://news.yunnan.cn/system/2026/11/12/034194250.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "任天堂《塞尔达传说:时之笛》重制首发四天破520万份 BLAST香港开赛", "summary": "任天堂公布，11月5日发售的Switch 2独占《塞尔达传说：时之笛》重制版首四天全球销量突破520万份，刷新该平台首发纪录。同日，BLAST.tv主办的顶级CS2职业赛“BLAST Premier Rivals香港2026”开赛，汇全球一线战队落地中国香港，带动区域电竞与文旅消费。", "source": "每日经济新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261112A0352K00"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "第十三届上海国际童书展13日揭幕 501家展商齐聚、首设漫画周", "summary": "第十三届上海国际童书展将于13—15日在上海世博展览馆举办，吸引37个国家和地区501家参展商，其中海外152家，期间举办300余场活动。首届“上海漫画周”全新亮相，蔡皋、曹文轩、罗杰·米罗等国际安徒生奖得主将到场，全球童书首发平台呈现260部年度新书。", "source": "新闻晨报/网易", "url": "https://www.163.com/dy/article/LBHRPMEE0514A42S.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "2026旅游出行大会在银川启幕 发布多项行业报告", "summary": "11日，由中国旅游车船协会主办的2026旅游出行大会在宁夏银川启幕，以“洞察新消费 智行创未来”为主题，汇聚旅游客运、自驾房车、租赁、邮轮游艇等主体。会上发布《中国旅游客运行业发展报告》等四项年度成果，并集中展示银川交旅融合路与智慧出行体系建设成效。", "source": "新华网宁夏频道", "url": "https://www.nx.news.cn/20261112/55686331eefe4dd4a759c878ca0a6464/c.html"}, {"id": 17, "category": "战争与自然灾害", "scope": "国际", "title": "加沙再遭以军空袭 纳赛尔医疗中心6死 过冬物资仍受阻", "summary": "加沙地带民防部门12日称，以军凌晨空袭南部汗尤尼斯纳赛尔医疗中心，造成包括一名外科医生在内的至少6死约20伤。连日暴雨致数万顶帐篷被淹，联合国称超15万顶帐篷及排水水泵已就绪却未获以方批准进入；以方否认阻碍物资并继续指责哈马斯。", "source": "新华社/网易", "url": "https://www.163.com/dy/article/LBHPQ74505346RC6.html"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
