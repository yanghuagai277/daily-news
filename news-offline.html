n/2026/09/08/VIDENmE5DiPD1FRaGFhfjBv9260908.shtml"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞武装袭击沙特四城致73伤 中东战事升级", "summary": "胡塞武装9月8日称使用无人机和导弹袭击沙特阿美在艾卜哈、吉赞的设施及艾卜哈国际机场等，沙特主导多国联军称袭击致73名平民受伤，多处能源设施起火。分析指这是长期以来胡塞对沙特最严重袭击，布伦特原油当日突破99美元/桶。", "source": "观察者网", "url": "https://new.qq.com/rain/a/20260909A039RZ00"}, {"id": 11, "category": "战争与自然灾害", "scope": "国际", "title": "伊朗称若能源资产遭美打击将报复 霍尔木兹谈判进入最后阶段", "summary": "伊朗议会议长卡利巴夫警告，若美国打击伊朗油气资产，美在中东能源资产将遭报复。同时伊朗与阿曼就划定霍尔木兹海峡安全海上通道谈判取得重大进展、进入最后阶段。美军称对伊海上封锁已使94艘商船改道。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7682926060228346402"}, {"id": 12, "category": "财经经济与就业", "scope": "国内", "title": "8月末我国外汇储备规模升至34383亿美元 黄金22连增", "summary": "国家外汇局数据显示，截至2026年8月末我国外汇储备规模为34383亿美元，较7月末上升195亿美元、升幅0.57%；黄金储备达7673万盎司，环比增加65万盎司，连续第22个月增持。8月美元指数下跌、全球资产价格分化共同推动规模上升。", "source": "新华财经", "url": "https://www.toutiao.com/article/7682939982557856256"}, {"id": 13, "category": "财经经济与就业", "scope": "国内", "title": "前8个月我国货物贸易进出口同比增17.6%", "summary": "海关总署数据显示，今年前8个月我国货物贸易进出口总值34.78万亿元，同比增长17.6%；8月当月进出口4.65万亿元、同比增19.8%，出口、进口分别增长18.6%、21.7%，连续4个月保持两位数增长，进口月度增速连续6个月超过出口。", "source": "央视网", "url": "https://tv.cctv.com/2026/09/08/VIDEtKgOPfSyNDYmBx7yLkca260908.shtml"}, {"id": 14, "category": "财经经济与就业", "scope": "国际", "title": "国际油价涨超3%逼近100美元 高盛预警或冲120", "summary": "受胡塞袭沙特能源设施及美伊海上对峙影响，9月8日布伦特原油涨2.18%报99.116美元/桶、WTI涨3.21%报94.415美元/桶，盘中布油触及99.42美元。高盛称若航运袭击升级，油价或冲120美元，推升全球通胀预期。", "source": "21世纪经济报道", "url": "https://new.qq.com/rain/a/20260909A0373M00"}, {"id": 15, "category": "社会民生与教育", "scope": "国内", "title": "应届本科生一线城市平均月薪8051元", "summary": "麦可思研究数据显示，2025届应届本科毕业生在一线、新一线城市月收入分别达8051元、6622元，北京、上海、深圳均超8000元。同日中央宣传部、发改委发布“诚信之星”，农业农村部等六部门部署完善乡村振兴投入机制。", "source": "腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6926a9f3c8e17852"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "“深圳-香港-广州”集群蝉联全球创新集群百强榜首", "summary": "世界知识产权组织发布《2026年全球创新指数》百强集群报告，中国以25个集群蝉联世界第一，“深圳-香港-广州”连续两年登顶榜首，北京、上海-苏州分列     var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
