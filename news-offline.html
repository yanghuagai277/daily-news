生与教育", "scope": "国内", "title": "西藏那曲7.0级地震13天后复学，师生异地安置拉萨", "summary": "西藏那曲巴青7.0级地震过去13天后，11月4日来自玛如乡、岗切乡的师生在拉萨那曲完全中学举行升旗仪式、开启复学第一课。原址校舍严重受损，那曲市分3批将师生易地安置拉萨，配备心理教师跟班，做到“到校即开课”。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/06/content_341447.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "教资笔试成绩今发布、面试报名同步启动；冷空气局地降温超12℃", "summary": "教育部教育考试院发布通知，2026年下半年中小学教师资格考试（笔试）成绩于11月6日发布，面试报名同步启动。今明两天冷空气继续影响内蒙古、东北、华北、黄淮等地，局地降温超12℃、阵风7至9级，黑龙江东北部局地有暴雪。", "source": "全国妇联女性之声", "url": "https://www.163.com/dy/article/LB0SVT2V05149JUI.html"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "科学家首次绘制三维日冕磁场图，有助精准预测太阳磁暴", "summary": "美国国家大气研究中心等机构团队首次绘制出三维日冕磁场图，成果发表于《天体物理学杂志快报》。团队利用莫纳罗亚太阳天文台偏振仪数据，通过解码穿过日冕的光与波，在三维空间“看见”太阳隐藏的磁性结构，有助更精准预测影响地球的太阳磁暴。", "source": "科技日报", "url": "https://edu.yunnan.cn/system/2026/11/06/034190256.shtml"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "欧空局发现火星火山未死：地下或仍留存岩浆热源", "summary": "欧洲航天局ExoMars项目TGO轨道器在火星阿尔巴山新鲜火山裂隙上空捕捉到定点集中的氯化氢气体信号，论文11月4日刊于《Science Advances》。该信号不同于沙尘暴期地表反应产物，指向地下岩浆房排气，显示火星火山未彻底熄灭、仍具活动潜力。", "source": "快科技", "url": "https://m.mydrivers.com/newsview/1163529.html"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "中国男篮公布世预赛集训名单，周琦王哲林赵继伟等老将回归", "summary": "中国篮协11月4日公布新一期男篮集训名单，备战2027篮球世界杯预选赛第五窗口期。周琦、王哲林、赵继伟、张镇麟等老将回归，杨瀚森因在NBA无法回归；球队11月8日至21日在京集训，随后赴西亚迎战沙特（11月26日多哈）与黎巴嫩（11月29日）。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34413433"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "中国科学家完成全球首例“化学遗传学神经调控”人体临床（癫痫）", "summary": "11月5日《新英格兰医学杂志》发表中国科学家完成的首例化学遗传学神经调控人体临床研究。宣武医院、北京脑科学所团队通过基因递送让特定神经元表达“人工设计受体”，用药时激活、不吃药时静默；3例难治性癫痫患者月均发作由4.33次降至0.33次。", "source": "科技日报", "url": "https://www.stdaily.com/web/gdxw/2026-11/05/content_608943.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "全国首个非侵入式脑机接口临床研究完成备案，主攻卒中康复", "summary": "天津大学脑机海河实验室团队研发的“SCS联合无创脑控混动外骨骼”卒中康复项目11月5日完成国家卫健委生物医学新技术临床研究备案（国务院令第818号），系全国首个完成备案的非侵入式脑机接口临床研究，标志该技术迈入规范化临床阶段。", "source": "中国科学报", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574291.shtm"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "“十五五”绿色发展新图景：光伏装机历史性超过煤电", "summary": "“十五五”专项规划勾勒绿色发展新图景：上半年全国煤电发电量占比首次低于50%，光伏发电装机历史性超过煤电，每10度电近4度为绿电。国务院《“十五五”碳达峰行动方案》7月印发，《国家应对气候变化“十五五”规划》首次在五年规划层面系统构建全领域气候目标体系。", "source": "新浪财经", "url": "https://k.sina.cn/article_2810373291_a782e4ab020030aw2.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "国内L2+辅助驾驶搭载率达70%，L3强制标准2027年7月落地", "summary": "2026世界智能网联汽车大会透露，截至2026年9月国内L2及以上辅助驾驶搭载率已达70%，L3级准入测试推进中，相关强制性标准将于2027年7月1日落地。华为引望称辅助驾驶累计行驶近170亿公里，国庆七天乾崑智驾辅助里程近5.6亿公里。", "source": "浙江日报", "url": "https://zjrb.zjol.com.cn/html/2026-11/06/content_3944234.htm"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16八强开战：BLG首局1-0领先DK", "summary": "2026英雄联盟全球总决赛八强战11月6日开打，LPL二号种子BLG对阵LCK四号种子DK（BO5）。BLG首局凭借Knight蛇女摇摆与先锋团配合1比0先下一城；另一场T1对阵KC于11月7日进行，GEN此前3比0零封LYON率先晋级四强。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261106A039AB00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "文旅部公示拟新增17家国家5A级旅游景区", "summary": "文化和旅游部11月5日公示拟确定17家国家5A级旅游景区，公示期至11月11日。名单涵盖正定古城、天津泰达航母主题公园、南京玄武湖、广州塔、成都大熊猫基地、敦煌阳关玉门关、茶卡盐湖、西夏陵等，将进一步丰富国内优质文旅目的地供给。", "source": "中国网", "url": "https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-11/05/content_118763077.shtml"}, {"id": 18, "category": "战争与自然灾害", "scope": "国际", "title": "俄方称卢甘斯克一公共汽车遭袭致5死13伤", "summary": "俄方任命的卢甘斯克地区领导人帕谢奇尼克5日称，乌武装部队当天袭击该地区一辆公共汽车，造成5人死亡、13人受伤，所有伤员已获救治；乌方还在列布里科沃至罗韦尼基路段袭击另一车辆致2人死亡。俄乌黑海及地面冲突仍在多点延续。", "source": "央视新闻客户端", "url": "https://news.yunnan.cn/system/2026/11/06/034190191.shtml"}]}, "yest": {"date": "2026-11-05", "generatedAt": "2026-11-05T07:35:52.329708+0800", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "财经经济与就业", "scope": "国内", "title": "第九届进博会开幕：4142家境外企业参展，展览面积首破44万平米", "summary": "第九届中国国际进口博览会11月5日至10日在上海开幕，4142家境外企业参展，整体展览展示面积首次突破44万平方米，全球首发、亚洲首秀、中国首展的代表性展品超480件，创历年新高；为最不发达国家免费展位面积增加17%。", "source": "经济日报", "url": "https://www.thepaper.cn/newsDetail_forward_34409395"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "腾讯混元Hy4正式版发布：参数达770B，首引入视觉与电脑操作能力", "summary": "腾讯11月4日发布混元Hy4正式版，参数规模达770B，较上代显著爬坡，并首次引入视觉理解能力与电脑操作（ComputerUse）能力。其在579个真实金融任务众测中得3.04分居开源第一，幻觉率由15.76%降至5.45%，并计划开源权重。", "source": "每日经济新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1976aebbaad73252"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "AI的“Token”走进直播间与大众消费，双11成独立品类", "summary": "今年“双十一”，Token（词元）作为独立品类在多家电商平台架开售，直播间开卖半小时即售出约10万份AI会员月卡、累计约2万亿Token。信通院数据显示2026年6月国内词元日均消耗量约500万亿，是2025年12月的近4倍，大模型从企业采购走向大众消费。", "source": "央视网", "url": "https://news.cctv.cn/2026/11/05/ARTIJxA12vr3pHN1TfAxXc67261105.shtml"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美伊战事持续：特朗普确认空袭格什姆岛，伊朗宣布“最高战备”", "summary": "美国总统特朗普确认，美军对伊朗格什姆岛一处防空设施发动“小规模攻击”，并称“伊朗战争将在我想要的时候结束”。伊朗议长称已处“最高战备”，要求美方先解除海上封锁、放松制裁才考虑重开霍尔木兹海峡；海湾国家正紧急斡旋。", "source": "21世纪经济报道", "url": "https://www.163.com/dy/article/LAV25SEP05199NPP.html"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "美国中期选举民主党大胜，时隔20年重掌国会两院", "summary": "美国11月3日中期选举结果出炉，多家主流媒体预测民主党不仅夺回众议院，还拿下参议院，时隔20年再度同时掌控国会两院，预计获54个参席、248个众席。特朗普称愿接受结果、准备与民主党合作。市场迎来“庆祝行情”，道指暴涨1569点。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261105A0356600"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "俄乌三方会谈敲定11月10—11日阿布扎比，白宫5日先谈", "summary": "俄总统新闻秘书佩斯科夫确认，俄美乌三方会谈将于11月10日至11日在阿联酋阿布扎比举行，俄方代表团由总统助理梅金斯基率领，欧洲不参与。会谈前夕俄军对乌能源设施发动大规模袭击，基辅等多地紧急停电；白宫5日先举行俄乌代表会谈。", "source": "上观新闻", "url": "https://www.163.com/dy/article/LAUVN3P0055040N3.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "多省推进落实带薪休假；教育部发高考防骗预警、军队文职招考启动", "summary": "今年以来广东、陕西、安徽等多地发文推进落实带薪年休假、鼓励错峰休假。教育部发布2027年高考报名防骗预警，提醒警惕“内部补报名”等话术。2027年军队文职招考5日8时启动网上报名，下半年教资笔试成绩6日可查。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261105A02XKR00"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "秋粮丰收成定局，全年粮食产量有望连续3年超1.4万亿斤", "summary": "农业农村部：今年秋粮面积稳中略增、收获过九成，丰收成定局，全年粮食产量有望连续3年保持在1.4万亿斤以上，夏粮3014.9亿斤首破3000亿斤创新高。央行4日起下调股票回购增持再贷款利率0.25个百分点至1%，维护资本市场平稳。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17141410633081116276&channelId=1119"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "AIMS望远镜首次观测到太阳耀斑下的磁场变化", "summary": "中科院国家天文台团队利用AIMS望远镜，在X1.5级耀斑爆发脉冲相首次直接测得低层大气磁场明显减弱，将磁场测量精度从百高斯提升至优于十高斯，相关成果发表于《自然·天文》，有助完善太阳耀斑模型、深化空间天气认知。", "source": "科技日报", "url": "https://kuaibao.qq.com/s/20261104A0B2AW00?refer=cp_1009"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "科学家开发系外行星探测新方法FLIP，灵敏度达传统15倍", "summary": "美国西北大学团队提出名为FLIP的影像处理框架，用机器学习生成特定恒星的模拟眩光并从观测中扣除，灵敏度达传统方法的2至15倍，并借助韦布望远镜成功获得51波江座b的首个影像，成果11月5日发表于《自然》。", "source": "中国科学报", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574233.shtm"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "欧冠第4轮：曼城3-2莱比锡、利物浦遭逆转、科莫9-1血洗朗斯", "summary": "欧冠联赛阶段第4轮多场戏剧对决：曼城客场3-2险胜莱比锡、哈兰德制胜；利物浦2-3遭费内巴切逆转吞首败；科莫9-1血洗朗斯创本轮最大分差；阿森纳2-1布拉格斯拉维亚4轮不败，皇马3-2雅典AEK四轮全胜。英超3胜2负居五大联赛之首。", "source": "直播吧", "url": "https://news.zhibo8.com/zuqiu/2026-11-05/6aeb4ea877c4fnative.htm"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "WTT法兰克福冠军赛：国乒3人3-0晋级男单16强", "summary": "WTT法兰克福冠军赛男单第二个比赛日，国乒温瑞博3-0完胜韩国安宰贤，与早前王楚钦、周启豪的两场3-0一同晋级16强；日本松岛辉空、张本智和及德国奥恰洛夫等亦均以3-0过关，目前16强已出12席，国乒、日本、德国各占3人。", "source": "网易体育", "url": "https://m.163.com/news/article/LAUM7Q1E0552G3HD.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "进博会医疗器械及医药保健展区扩容；医保发第22批智能监管“两库”", "summary": "第九届进博会医疗器械及医药保健展区全面扩容，以“健康中国，美好生活”为主题设四大专区，全球前20制药企业16家参展。国家医保局发布第22批智能监管“两库”规则和知识点，推动定点机构将智能提醒对接事前自查，守好医保基金。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34409428"}, {"id": 14, "category": "健康养生", "scope": "国际", "title": "《自然》发表最详尽人类免疫系统遗传变异图谱", "summary": "《自然》发表三项研究，澳大利亚加文医学研究所等分析近2000人、500多万个免疫细胞基因序列与活性，绘制出迄今最详尽的人类遗传变异影响免疫系统图谱，鉴定近1500个或参与多种疾病发生的基因，助力癌症与神经疾病新靶点发现。", "source": "科技日报", "url": "https://finance.sina.com.cn/wm/2026-11-05/doc-inixrqea8957011.shtml"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "强冷空气袭北方：黑龙江局地暴雪，中央气象台发大风蓝警", "summary": "4日至6日冷空气影响内蒙古、东北、华北、黄淮等地，普遍降温4至8℃、局地超12℃，伴5至6级风、阵风7至9级。内蒙古东北部、黑龙江等地有中到大雪、局地暴雪，黑龙江中东部局地雨转冻雨；中央气象台继续发布大风蓝色预警，双鸭山升级暴雪黄色预警。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/alarm/23050041600000_20261105064801.html"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "10月新能源乘用车零售114.8万辆；宁德时代联手章鱼能源探欧洲家储", "summary": "乘联分会：10月全国新能源乘用车零售预计114.8万辆，同比降10%、环比增6%，今年累计零售890.7万辆降12%；厂商批发180.7万辆同比增12%。宁德时代联手工章鱼能源、新能安探欧洲家储；广汽首个海外电池PACK厂在泰国投产；比亚迪否认“天神之眼C停产”传闻。", "source": "每日经济新闻", "url": "https://news.qq.com/rain/a/20261105A031WL00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "舞蹈诗剧《只此青绿》5年演满1000场，成演出市场长线IP", "summary": "舞蹈诗剧《只此青绿》自2021年首演至2026年已演满1000场，足迹遍及海内外近90城，200余款文创线下销售额近1600万元，同名电影票房超5000万元。剧组按企业化运营、以销定产，把“千里江山图”美学转化为长线文化IP，7月曾在台北加演两场。", "source": "人民日报", "url": "https://acg.sohu.com/a/1097339511_120578424"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "11月5日起燃油附加费上调；秋假带动亲子出游热潮", "summary": "11月5日零时起国内航线燃油附加费上调：800公里以下由50元调至80元、以上由90元调至140元，成人往返长途成本增百元。多省推行中小学秋假形成5天“小长假”，航旅纵横显示11月机票预订超1864万张，滑雪游带动张家口预订同比增270%。", "source": "搜狐财经", "url": "https://www.sohu.com/a/1097158802_121627717"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
