从“按人头”转向保障留校学生。", "source": "网易", "url": "https://www.163.com/dy/article/L89KQO8R0556E2W2.html"}, {"id": "n7", "category": "科学探索", "scope": "国际", "title": "谷歌将自研AI芯片TPU送入近地轨道，启动“太阳捕手”太空算力验证", "summary": "10月1日，谷歌首颗在轨AI计算验证卫星随Transporter-18任务入轨，搭载4颗自研Trillium TPU，由PlanetLabs制造、经SpaceX发射。受太空散热限制，芯片每次仅能连续运行约15分钟。这是人类首次将专为AI设计的芯片送上太空实测，为未来星上数据中心探路。", "source": "新浪科技", "url": "https://k.sina.com.cn/article_7879923515_1d5ae173b06801kpbc.html"}, {"id": "n8", "category": "科学探索", "scope": "国内", "title": "中国天问三号将绘全火星地质图，2028年取回500克样本", "summary": "中国探火工程稳步推进：天问一号实现绕落巡、祝融号获取地面数据，下一步天问三号计划取回500克火星样本。2028年底，中国将完成1:500万全火星地质图，划分地质单元、搭建年代框架，为未来火星探测与资源利用建立全球基准框架。", "source": "腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9026ac03f1885252"}, {"id": "n9", "category": "体育赛事", "scope": "国内", "title": "中网：德约科维奇逆转布云朝克特晋级八强", "summary": "2026中国网球公开赛10月2日继续在国家门球中心进行。六届赛会冠军德约科维奇鏖战三盘，以2:1逆转中国选手布云朝克特，中网连胜纪录扩至31场。女单2号种子萨巴伦卡、男单3号种子梅德韦杰夫均2:0横扫对手迎来“开门红”。", "source": "中国新闻网", "url": "https://www.toutiao.com/article/7692205657835028992"}, {"id": "n10", "category": "体育赛事", "scope": "国内", "title": "亚运收官日：中国女垒争金、吴易昺冲男单冠军", "summary": "10月3日名古屋亚运会迎来倒数第二个比赛日，除马术外所有项目收官，将产生47金。女子垒球决赛中国队若胜日本，将时隔28年再夺亚运金牌；网球男单吴易昺闯入决赛，将与香港选手黄泽林争冠，力争个人首枚亚运男单金牌。", "source": "环球网/央视体育", "url": "https://www.163.com/dy/article/L8A73MCJ0514R9OJ.html"}, {"id": "n11", "category": "战争与自然灾害", "scope": "国内", "title": "10月及国庆假期全国自然灾害风险形势发布：1—2个台风或影响我国", "summary": "国家防灾减灾救灾委员会办公室、应急管理部会商研判，10月华中、华南、西南等地洪涝和风雹风险较高，西北太平洋和南海或有3—4个台风生成，其中1—2个可能登陆或明显影响我国，强度总体偏强、主要影响华南沿海，局地地质灾害与森林火险等级亦较高。", "source": "新浪财经/应急管理部", "url": "https://k.sina.com.cn/article_5953466437_162dab0450670be408.html"}, {"id": "n12", "category": "战争与自然灾害", "scope": "国际", "title": "沙特拟对也门胡塞武装发动攻势，目标直指曼德海峡", "summary": "据媒体报道，沙特正考虑两套作战方案，拟对也门胡塞武装发动军事攻势，目标直指连接红海与亚丁湾的战略咽喉曼德海峡，以重开受冲击的红海航运通道；行动最早或数周内启动。美国未直接下场，但已向沙特提供情报支持，地区紧张持续升级。", "source": "华尔街见闻", "url": "https://www.toutiao.com/article/7692225011545047552/"}, {"id": "n13", "category": "健康养生", "scope": "国内", "title": "研究：水煮沸可降微塑料摄入70%—80%，卫健委倡导多喝白开水", "summary": "《Science of the Total Environment》刊发研究显示，将饮用水煮沸5分钟并静置冷却，其中微塑料浓度可降70%以上，按成人、儿童、婴儿估算摄入量减少约70%—80%，因硬水析出的水垢会把部分颗粒裹挟沉底。国家卫健委亦倡导少喝含糖饮料、多喝白开水与淡茶水。", "source": "腾讯新闻/梅斯医学", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_4866ac026b456852"}, {"id": "n14", "category": "环境气候", "scope": "国际", "title": "瑞士冰川五年减近20%，2026年再失5.5%冰量创史上第二高", "summary": "瑞士科学院10月1日援引冰川监测网数据称，受冬季降雪稀少与5—9月强热浪叠加，2026年瑞士冰川冰量减少5.5%，为有记录以来第二高；过去五年总冰量缩减近五分之一。单座冰川平均变薄2.5至4米，7—9月融水流失约2.2万亿升，专家警告阿尔卑斯冰川长期恐难存续。", "source": "经济日报/新华社", "url": "http://intl.ce.cn/sjjj/qy/202610/t20261003_3247244.shtml"}, {"id": "n15", "category": "汽车出行", "scope": "国内", "title": "国庆首日高速充电量同比增60.4%创历史节假日单日新高", "summary": "国家能源局测算，国庆假期首日全国高速公路充电量达2804.69万千瓦时，同比增长60.4%，创节假日单日历史新高；6.27万个高速充电设施（枪）纳入国家监测平台。新能源汽车自驾出游激增，各地增配移动充电桩与充电机器人、加派引导缓解补能压力。", "source": "网易/陆家嘴财经早餐", "url": "https://c.m.163.com/news/a/L8A2LTA005198RSU.html"}, {"id": "n16", "category": "游戏电竞", "scope": "国内", "title": "亚运电竞中国队三金一银，广东原创游戏闪耀赛场", "summary": "名古屋亚运会电竞项目，由王者荣耀、和平精英、第五人格、永劫无间组成中国集训队获三金一银。其中《第五人格》中日决赛中国队2:0夺亚运史上首枚非对称竞技金牌，《永劫无间》为中式武侠广东研发产品。2026年上半年我国电竞产业收入131.15亿元，同比增长2.78%。", "source": "南方都市报", "url": "https://www.toutiao.com/article/7692217943022682665/"}, {"id": "n17", "category": "文化读书", "scope": "国内", "title": "故宫“典则：唐宋书画展”引观展热潮，107件书画亮相", "summary": "国庆假期故宫文华殿“典则：唐宋书画展”持续火爆，展出书画文物107件，其中24件为近30年首次展出，含褚遂良摹《兰亭序》、传阎立本《步辇图》宋摹本等。观众凌晨排队、全程耗时约7小时，折射大众对高品质文化生活的井喷式需求。", "source": "齐鲁壹点/潮新闻", "url": "https://www.toutiao.com/article/7692229783375168040/"}, {"id": "n18", "category": "旅行出行", "scope": "国内", "title": "国庆首日跨区域人员流动量预计3.34亿人次，铁路发送2520万创新高", "summary": "交通运输部消息，国庆假期第一天全社会跨区域人员流动量预计达3.34亿人次，公路出行占比近九成。国铁集团数据显示10月1日全国铁路发送旅客2520.4万人次，创单日发送量历史新高，加开列车2324列；民航、水路同步迎来高峰，交通部门全力保障出行。", "source": "央视网", "url": "https://news.cctv.cn/2026/10/02/ARTIbcyMkcqU8h7uBBqthgxy261002.shtml"}]}, "yest": {"date": "2026-10-02", "generatedAt": "2026-10-02T07:35:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": "n1", "category": "科技互联网与AI", "scope": "国内", "title": "Anthropic招股书披露：博通将提供最高420亿美元贷款支持其AI芯片采购", "summary": "AI公司Anthropic在IPO招股书中披露，芯片巨头博通将向其提供最高420亿美元贷款，用于租赁自研AI加速芯片。该安排使博通既供应硬件又担任融资方，明年Anthropic有望成为博通核心芯片业务最大客户，亦引发潜在利益冲突争议。", "source": "网易/财联社", "url": "https://www.163.com/dy/article/L86VLMGE05198CJN.html"}, {"id": "n2", "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI上一轮融资收官：英伟达、软银各完成300亿美元出资", "summary": "据披露，英伟达与软银已分别完成对OpenAI上一轮融资最后一笔100亿美元投资，各自300亿美元承诺全部交割。软银累计投入达646亿美元、持股约13%，成为最大外部投资方；亚马逊此前已完成500亿美元出资。", "source": "网易/格隆汇", "url": "https://www.163.com/dy/article/L87EHPCL05566WVY.html"}, {"id": "n3", "category": "财经经济与就业", "scope": "国内", "title": "港股国庆后开门红 恒生指数突破27000点创年内新高", "summary": "国庆长假后港股迎来开门红，恒生指数一举突破27000点关口、创年内新高。半导体板块表现亮眼领涨大市，中芯国际单日涨逾12%。市场情绪受内地政策预期与资金回流提振，成交额明显放大。", "source": "凤凰网", "url": "https://ishare.ifeng.com/c/s/v0029itkPKllfSPCMxi--rMy3cZCYqc20htOFUem1HvPNGkc__"}, {"id": "n4", "category": "财经经济与就业", "scope": "国际", "title": "美债收益率高位震荡 30年期房贷利率升至7.28%创近三年新高", "summary": "受油价飙升与通胀预期推动，美国10年期国债收益率盘中触及5.34%、创2002年以来新高，30年期固定房贷利率升至7.28%、为2023年11月以来最高。国际油价同步大涨，布伦特原油一度突破102美元。", "source": "智通财经", "url": "https://www.zhitongcaijing.com/content/detail/1503143.html"}, {"id": "n5", "category": "国际时事", "scope": "国际", "title": "美军向中东增派第三艘航母及最多1万名士兵", "summary": "据美媒援引官员报道，五角大楼正向中东派遣第三个航母战斗群及更多两栖舰艇，预计新增约9000至1万名士兵，11月底前抵达。特朗普正考虑若美伊谈不拢，在中期选举后恢复对伊朗军事打击，中东美军将达5万余人。", "source": "新浪财经/华尔街日报", "url": "https://wap.cj.sina.cn/7x24/5123105"}, {"id": "n6", "category": "战争与自然灾害", "scope": "国际", "title": "沙特空袭也门多地 24小时内发动47次空袭", "summary": "沙特对也门多地发动空袭，据也门方面通报，24小时内沙特实施至少47次空袭，并首次打击首都萨那。与此同时，也门西南部战事加剧，胡塞武装称30名成员在交火中死亡，地区紧张局势持续升级。", "source": "新浪财经", "url": "https://finance.sina.com.cn/roll/2026-10-02/doc-initusmt7636480.shtml"}, {"id": "n7", "category": "科学探索", "scope": "国内", "title": "人体蛋白质组导航计划π-HuB进入实施阶段", "summary": "我国牵头的人体蛋白质组导航国际大科学计划π-HuB正式进入实施阶段。该计划旨在绘制人类全生命周期蛋白质组图谱，揭示疾病发生机制，为精准医学提供底层数据支撑，标志我国生命科学领域又一重大基础设施落地。", "source": "科技日报/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9896abdafd503252"}, {"id": "n8", "category": "科学探索", "scope": "国际", "title": "研究：2021至2023年南极冰量逆势增加约6950亿吨", "summary": "《自然》发表研究显示，受热带暖池等气候因子驱动，2021至2023年间南极冰量出现逆势增长、约增加6950亿吨，暂时减缓全球海平面上升。科学家指出这属短期波动，长期变暖背景下南极冰盖仍面临加速消融风险。", "source": "今日头条/自然", "url": "https://www.toutiao.com/article/7690800476492808739/"}, {"id": "n9", "category": "体育赛事", "scope": "国内", "title": "WTT中国大满贯：王楚钦、孙颖莎晋级单打八强", "summary": "WTT中国大满贯赛继续进行，王楚钦、孙颖莎等国乒主力分别战胜各自对手、晋级男女单打八强；混双项目王楚钦/孙颖莎组合闯入决赛。主场作战的国乒在多条战线保持强势，向冠军发起冲击。", "source": "新华社/ITouchTV", "url": "https://m.itouchtv.cn/article/9bdf5a5f612a3e4fac78756096a5eb18"}, {"id": "n10", "category": "体育赛事", "scope": "国内", "title": "亚运会中国代表团金牌破150枚 网球女单提前包揽金银", "summary": "名古屋亚运会进入第13个比赛日，中国代表团金牌数已突破154枚高居榜首。网球女单半决赛王曦雨、张帅分别获胜会师决赛，提前包揽金银；攀岩张悦彤、储守宏分获女子攀石与男子速度金牌。", "source": "央视新闻/新浪", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=11451647902508366458&channelId=1119"}, {"id": "n11", "category": "健康养生", "scope": "国内", "title": "疾控部门发布国庆假期健康提示：谨防食源性疾病与流感", "summary": "针对国庆长假聚餐出游增多，疾控部门发布健康提示：注意预防诺如等食源性疾病，勤洗手、食物充分加热；当前流感等呼吸道传染病进入高发季，建议尽早接种流感疫苗；前往南方省份需防蚊灭蚊、防范虫媒传染病。", "source": "湖州市卫健委", "url": "https://wjw.huzhou.gov.cn/col/col1229863607/art/2026/art_89c0ab24d3ed48d08cc5f0b1ca27ed26.html"}, {"id": "n12", "category": "汽车出行", "scope": "国内", "title": "国庆新能源车出行高峰 高速服务区充电排长队", "summary": "国庆假期自驾出游激增，新能源汽车成为出行主力，部分高速服务区出现充电排队现象。各地电力部门增配移动充电桩、智能充电机器人并加派引导人员，通过数字化调度缓解补能压力，保障假期绿色出行。", "source": "网易", "url": "https://www.163.com/dy/article/L87FQV2T0550AVKV.html"}, {"id": "n13", "category": "环境气候", "scope": "国内", "title": "全国首个百万千瓦级光伏光热项目在青海共和并网发电", "summary": "10月1日，全国首个集光伏发电、光热储能与电热转换于一体的百万千瓦级清洁能源工程——青海共和百万千瓦光伏光热项目成功并网。项目投产后年均上网电量约22亿度，每年可节约标煤69万吨、减碳约207万吨。", "source": "央视网", "url": "https://news.cctv.com/2026/10/02/ARTInGviEm5kZ0mZzaQuJYOD261002.shtml"}, {"id": "n14", "category": "游戏电竞", "scope": "国际", "title": "Esports Awards 2026提名公布 Bin、T1、BLG等入围", "summary": "2026年电竞颁奖典礼（Esports Awards）提名名单公布，来自LPL的Bin以及T1、BLG等战队与选手入围多个奖项。过去一年全球电竞热度持续走高，亚洲赛事版图中中国战队表现亮眼，备受粉丝与行业关注。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261002A000BM00"}, {"id": "n15", "category": "文化读书", "scope": "国内", "title": "地坛书市首次走进天津 海河阅读季百余出版社参展", "summary": "有着“北京文化名片”之称的地坛书市首次走出北京、落地天津，作为海河阅读季重点项目亮相。活动汇聚全国100余家出版社、展出6至8万种图书，并配套名家讲座、亲子阅读等文化活动，推动全民阅读。", "source": "新浪网", "url": "https://k.sina.com.cn/article_3314280193_c58be70102001jmxy.html"}, {"id": "n16", "category": "旅行出行", "scope": "国内", "title": "国庆假期首日跨区域人员流动量预计达3.34亿人次", "summary": "交通运输部消息，国庆假期第一天全社会跨区域人员流动量预计达3.34亿人次，公路出行占比近九成。全国铁路预计发送旅客2480万人次、加开列车2324列；民航、水路同步迎来高峰，交通部门全力保障出行。", "source": "央视网", "url": "https://news.cctv.cn/2026/10/02/ARTIbcyMkcqU8h7uBBqthgxy261002.shtml"}, {"id": "n17", "category": "社会民生与教育", "scope": "国内", "title": "新修订《国防动员法》10月1日起施行 新兴领域动员首次入法", "summary": "新修订的《中华人民共和国国防动员法》自10月1日起正式施行，首次将网信、科技、数据等新兴领域动员写入法律，适应现代战争与国家安全形势变化，为平时应急与战时动员提供更为系统的法治保障。", "source": "央视新闻/新浪", "url": "https://cj.sina.cn/article/norm_detail?url=https%3A%2F%2Ffinance.sina.com.cn%2Fjjxw%2F2026-10-02%2Fdoc-initusmt7636324.shtml"}]}};</script>

      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
