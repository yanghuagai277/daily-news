 "category": "社会民生与教育", "scope": "国内", "title": "多省推进落实带薪休假；教育部发高考防骗预警、军队文职招考启动", "summary": "今年以来广东、陕西、安徽等多地发文推进落实带薪年休假、鼓励错峰休假。教育部发布2027年高考报名防骗预警，提醒警惕“内部补报名”等话术。2027年军队文职招考5日8时启动网上报名，下半年教资笔试成绩6日可查。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261105A02XKR00"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "秋粮丰收成定局，全年粮食产量有望连续3年超1.4万亿斤", "summary": "农业农村部：今年秋粮面积稳中略增、收获过九成，丰收成定局，全年粮食产量有望连续3年保持在1.4万亿斤以上，夏粮3014.9亿斤首破3000亿斤创新高。央行4日起下调股票回购增持再贷款利率0.25个百分点至1%，维护资本市场平稳。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17141410633081116276&channelId=1119"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "AIMS望远镜首次观测到太阳耀斑下的磁场变化", "summary": "中科院国家天文台团队利用AIMS望远镜，在X1.5级耀斑爆发脉冲相首次直接测得低层大气磁场明显减弱，将磁场测量精度从百高斯提升至优于十高斯，相关成果发表于《自然·天文》，有助完善太阳耀斑模型、深化空间天气认知。", "source": "科技日报", "url": "https://kuaibao.qq.com/s/20261104A0B2AW00?refer=cp_1009"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "科学家开发系外行星探测新方法FLIP，灵敏度达传统15倍", "summary": "美国西北大学团队提出名为FLIP的影像处理框架，用机器学习生成特定恒星的模拟眩光并从观测中扣除，灵敏度达传统方法的2至15倍，并借助韦布望远镜成功获得51波江座b的首个影像，成果11月5日发表于《自然》。", "source": "中国科学报", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574233.shtm"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "欧冠第4轮：曼城3-2莱比锡、利物浦遭逆转、科莫9-1血洗朗斯", "summary": "欧冠联赛阶段第4轮多场戏剧对决：曼城客场3-2险胜莱比锡、哈兰德制胜；利物浦2-3遭费内巴切逆转吞首败；科莫9-1血洗朗斯创本轮最大分差；阿森纳2-1布拉格斯拉维亚4轮不败，皇马3-2雅典AEK四轮全胜。英超3胜2负居五大联赛之首。", "source": "直播吧", "url": "https://news.zhibo8.com/zuqiu/2026-11-05/6aeb4ea877c4fnative.htm"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "WTT法兰克福冠军赛：国乒3人3-0晋级男单16强", "summary": "WTT法兰克福冠军赛男单第二个比赛日，国乒温瑞博3-0完胜韩国安宰贤，与早前王楚钦、周启豪的两场3-0一同晋级16强；日本松岛辉空、张本智和及德国奥恰洛夫等亦均以3-0过关，目前16强已出12席，国乒、日本、德国各占3人。", "source": "网易体育", "url": "https://m.163.com/news/article/LAUM7Q1E0552G3HD.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "进博会医疗器械及医药保健展区扩容；医保发第22批智能监管“两库”", "summary": "第九届进博会医疗器械及医药保健展区全面扩容，以“健康中国，美好生活”为主题设四大专区，全球前20制药企业16家参展。国家医保局发布第22批智能监管“两库”规则和知识点，推动定点机构将智能提醒对接事前自查，守好医保基金。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34409428"}, {"id": 14, "category": "健康养生", "scope": "国际", "title": "《自然》发表最详尽人类免疫系统遗传变异图谱", "summary": "《自然》发表三项研究，澳大利亚加文医学研究所等分析近2000人、500多万个免疫细胞基因序列与活性，绘制出迄今最详尽的人类遗传变异影响免疫系统图谱，鉴定近1500个或参与多种疾病发生的基因，助力癌症与神经疾病新靶点发现。", "source": "科技日报", "url": "https://finance.sina.com.cn/wm/2026-11-05/doc-inixrqea8957011.shtml"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "强冷空气袭北方：黑龙江局地暴雪，中央气象台发大风蓝警", "summary": "4日至6日冷空气影响内蒙古、东北、华北、黄淮等地，普遍降温4至8℃、局地超12℃，伴5至6级风、阵风7至9级。内蒙古东北部、黑龙江等地有中到大雪、局地暴雪，黑龙江中东部局地雨转冻雨；中央气象台继续发布大风蓝色预警，双鸭山升级暴雪黄色预警。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/alarm/23050041600000_20261105064801.html"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "10月新能源乘用车零售114.8万辆；宁德时代联手章鱼能源探欧洲家储", "summary": "乘联分会：10月全国新能源乘用车零售预计114.8万辆，同比降10%、环比增6%，今年累计零售890.7万辆降12%；厂商批发180.7万辆同比增12%。宁德时代联手工章鱼能源、新能安探欧洲家储；广汽首个海外电池PACK厂在泰国投产；比亚迪否认“天神之眼C停产”传闻。", "source": "每日经济新闻", "url": "https://news.qq.com/rain/a/20261105A031WL00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "舞蹈诗剧《只此青绿》5年演满1000场，成演出市场长线IP", "summary": "舞蹈诗剧《只此青绿》自2021年首演至2026年已演满1000场，足迹遍及海内外近90城，200余款文创线下销售额近1600万元，同名电影票房超5000万元。剧组按企业化运营、以销定产，把“千里江山图”美学转化为长线文化IP，7月曾在台北加演两场。", "source": "人民日报", "url": "https://acg.sohu.com/a/1097339511_120578424"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "11月5日起燃油附加费上调；秋假带动亲子出游热潮", "summary": "11月5日零时起国内航线燃油附加费上调：800公里以下由50元调至80元、以上由90元调至140元，成人往返长途成本增百元。多省推行中小学秋假形成5天“小长假”，航旅纵横显示11月机票预订超1864万张，滑雪游带动张家口预订同比增270%。", "source": "搜狐财经", "url": "https://www.sohu.com/a/1097158802_121627717"}]}, "yest": {"date": "2026-11-04", "generatedAt": "2026-11-04T08:59:44.199929+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "2026乌镇峰会开幕：开源成AI竞争核心议题", "summary": "2026年世界互联网大会乌镇峰会11月3日开幕，蔡崇信表示阿里千问已开源超470款模型、全球下载突破40亿次，衍生模型超33万。中外企业围绕开源生态、算力基建与企业级服务竞逐AI下一程，我国将进一步完善开源体系。", "source": "中国经济网", "url": "https://www.ce.cn/cysc/newmain/yc/jsxw/202611/t20261104_3282387.shtml"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "小米披露机器人业务两项最新落地进展", "summary": "小米在乌镇峰会披露机器人进展：工业场景人形机器人于中控台侧盖板工站完成8小时作业验证并自主纠偏；家庭场景具身基座模型在青年公寓启动试运营，完成连续超30分钟、覆盖3房间、50+任务的长程验证。", "source": "界面新闻", "url": "https://www.toutiao.com/article/7704103512329814591/"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美伊对峙升级：特朗普称对伊朗格什姆岛发动“小规模攻击”", "summary": "特朗普称美军对伊朗格什姆岛一处防空设施发动有限打击，同时表示“没有立即打击伊朗的计划”。伊朗要求美方完整回应其提出的7项条件才开放霍尔木兹海峡；阿曼附近一艘油轮遭两枚不明弹体击中，暂无人员伤亡报告。", "source": "第一财经", "url": "https://www.163.com/dy/article/LASKMB5H0519DDQ2.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "俄美乌三方会谈敲定11月10—11日阿布扎比举行", "summary": "俄总统新闻秘书佩斯科夫证实，俄美乌三方会谈将于11月10日至11日在阿联酋阿布扎比举行，系2月以来首次重启。与此同时，乌能源设施遭俄大规模袭击，首都基辅一度停水停电；英法牵头“志愿联盟”多国部队将于9—22日在波兰举行首次演习。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7704084451388146239/"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "美国中期选举正式投票：改选众议院全部435席及参议院35席", "summary": "美东时间11月3日，美国中期选举迎来正式投票日，共和党与民主党角逐国会众议院全部435个席位及参议院100席中的35席。选情胶着，市场等待结果落地，资金在选举前重新买入此前遭抛售的芯片股。", "source": "央视新闻", "url": "https://tv.cctv.com/2026/11/04/VIDEkjriPmWJzwNVJYmDXIJM261104.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "央行11月15日起上调外汇存款准备金率至6%", "summary": "中国人民银行决定自11月15日起上调金融机构外汇存款准备金率2个百分点，由4%提高至6%，为2021年12月以来首次，预计可冻结约240亿美元外汇流动性。近期人民币对美元升破6.65元，创四年多新高。", "source": "新华财经", "url": "https://www.cnfin.com/yw-lb/detail/20261104/4490641_1.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "人社部加力推进稳岗扩容提质行动", "summary": "人社部召开会议，贯彻落实党中央、国务院稳就业决策部署，加力推进稳岗扩容提质行动，提出构建“管产业就要管就业、促消费就要促就业、上项目就要扩就业”的“大就业”工作格局，确保各项重点任务如期完成。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20261104A03L3700"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "中小学校教室采光和照明卫生强制性新国标实施", "summary": "强制性国家标准《中小学校教室采光和照明卫生标准》11月1日起正式实施，新增采光均匀度、冬至日满窗日照时间、照明色温与显色指数等指标，全部技术条款均为强制性，旨在守护中小学生视力健康、防控近视。", "source": "工人日报", "url": "https://www.workercn.cn/papers/grrb/2026/11/04/5/news-4.html"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "NASA“雨燕”伽马射线暴太空望远镜失控再入大气层", "summary": "运行近22年的NASA“雨燕”伽马射线暴望远镜因未装推进系统、受太阳活动致轨道衰减，于11月4日前后失控再入大气层。其观测过2000余次伽马暴，约1.5吨中或有超100公斤碎片落至地表，NASA估计伤人概率约1/2100。", "source": "环球网", "url": "https://www.toutiao.com/article/7704081861567365647/"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "力箭二号遥二发射成功，千帆星座在轨卫星升至274颗", "summary": "11月3日8时15分，力箭二号遥二运载火箭在东风商业航天创新试验区发射，将千帆极轨21组卫星送入预定轨道。此次发射后千帆星座在轨卫星总量提升至274颗，按计划2026年底完成324颗部署、初步提供区域服务。", "source": "上观新闻", "url": "https://kuaibao.qq.com/s/20261104A02TVW00?refer=cp_1009"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "亚冠精英联赛：海港4:2胜喷气机，国安4:7负泰港", "summary": "2026—2027亚冠精英联赛第四轮，上海海港客场4:2击败澳超纽卡斯尔喷气机走出阴霾；北京国安一度4:3领先，却因拉莫斯第58分钟红牌被罚下，最终4:7遭泰国泰港逆转，吞下赛季首败，终结各项赛事21场不败。", "source": "天津日报", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-11/04/content_143090_3981157.htm"}, {"id": 12, "category": "健康养生", "scope": "国际", "title": "《自然》发表最详尽人类免疫系统遗传变异图谱", "summary": "澳大利亚加文医学研究所等机构分析近2000人、500多万个免疫细胞的基因序列与活性，绘制出迄今最详尽的人类遗传变异影响免疫系统图谱，鉴定出近1500个可能参与多种疾病发生的基因，有助于发现癌症、免疫与神经疾病新药物靶点。", "source": "科技日报", "url": "https://www.ce.cn/xwzx/kj/202611/t20261104_3282492.shtml"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感疫苗转向以三价为主，专家称保护力未“缩水”", "summary": "中国疾控中心周报显示全国流感阳性样本中甲型占67.6%。今年疫苗供应由三价、四价并行转向以三价为主，专家解释：WHO数据显示乙型Yamagata系自2020年3月以来未再自然流行，故不再纳入组分，三价仍可有效预防当前流行毒株，建议及时接种。", "source": "每日经济新闻", "url": "https://www.163.com/dy/article/LARMQTS10512B07B.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "最强厄尔尼诺事件峰值将至，今冬明春气候受明显影响", "summary": "中国气象局称，2026年9月形成、10月发展为有监测记录以来最强的厄尔尼诺事件，预计秋末冬初达峰值。受其影响，今冬全国气温总体偏高但寒潮频次略偏多、冷暖起伏大，北方强降温降雪、南方阶段性低温雨雪冰冻风险突出；11月将有4轮冷空气过程。", "source": "人民日报", "url": "https://www.163.com/dy/article/LASCHB0305346936.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "车市“增速换挡”：内需承压、出口高增，监管出手整治", "summary": "9月国内汽车销量190.4万辆、同比降26%，行业利润率连续三年下滑至3.3%；同期出口105.3万辆、同比增61.4%，前三季度整车出口820.5万辆、同比增65.8%，新能源车出口增127.9%。工信部等四部门已启动生产一致性与质量提升专项行动规范竞争。", "source": "中国青年报", "url": "https://www.sohu.com/a/1096854553_119038"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛四分之一决赛开打", "summary": "2026英雄联盟全球总决赛（S16）淘汰赛四分之一决赛于北京时间11月4日6时开打，对阵为TES vs iG、DK vs BLG、GEN vs LYON、KC vs T1。LPL赛区三支队伍晋级八强，赛事在北美举行，冠亚军决赛定于11月14日纽约巴克莱中心。", "source": "新浪体育", "url": "https://www.sina.cn/news/detail/5360352583748792.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "乌镇峰会聚焦数字文化新业态，AI助中国IP出海", "summary": "2026乌镇峰会展现数字文化新生态：学界指出AI技术正为网络文学、网络影视剧、网络游戏三类数字文化产品提供应用场景与牵引。CPOPwave等平台以群像形式整合优质出海IP，打造中国流行文化出海的集体名片，推动文明交流互鉴。", "source": "光明网", "url": "https://news.qq.com/rain/a/20261104A02VAD00"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "山东等多地秋假带动亲子出游热潮，淡季转新旺季", "summary": "山东、湖南、广东、山西等多地中小学秋假开启，首个秋假释放集中出行需求：美团数据显示11月机票搜索量周环比增136%、住宿预订增175%，亲子家庭房增109%。山东16地市以门票惠民、研学产品迎接双向客流，11月正从全年最淡月转为亲子出游新旺季。", "source": "人民网", "url": "https://sd.people.com.cn/BIG5/n2/2026/1031/c166192-41737952.html"}]}};</script>

    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
