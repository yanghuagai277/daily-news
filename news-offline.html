ian.gov.cn/zwgk/tjxx/tjfx/202611/t20261102_2242505.htm"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "苏丹称来自埃塞俄比亚的无人机袭击已造成数百人伤亡", "summary": "苏丹 11 月 1 日声明，2026 年 2 月 15 日至 10 月 27 日共发生 70 起自埃塞境内发起的无人机袭击，涉 187 架自杀式无人机及 82 枚弹药，造成 484 名平民、176 名士兵死亡，200 名士兵受伤。苏丹将向安理会与非盟申诉。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7703339583596937747"}, {"id": 8, "category": "科学探索", "scope": "国际", "title": "旅行者 1 号将于 11 月 18 日抵达距地球一光天，创人类航天史纪录", "summary": "NASA 确认旅行者 1 号将于 11 月 18 日首次达到距地球一光天（约 160.95 亿英里），成为人类史上最远人造物体。该探测器 1977 年发射、已工作近 49 年，以约 6.12 万公里/小时飞离太阳系，地空单程通信时延将达约 24 小时。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261101A0BKLC00"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国载人月球探测工程采用「两次发射、环月对接」方案", "summary": "第七届载人航天学术大会披露，我国载人月球探测采用「两次发射、环月对接」方案：两枚长征十号分别将揽月着陆器与梦舟飞船送入地月转移轨道，于环月轨道交会对接，航天员换乘着陆器登月。长征十号、梦舟、揽月研制顺利，揽月着陆器将先行无人飞行「彩排」。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7703147845485855267"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "阿森纳 1-0 客胜利物浦，时隔 14 年攻克安菲尔德登顶", "summary": "英超第 9 轮，阿森纳客场 1-0 击败利物浦：第 16 分钟阿利松出球失误，赖斯助攻哈弗茨破门。枪手豪取联赛 4 连胜，积 24 分以 3 分优势力压曼城独占榜首，并终结 13 场英超对利物浦不胜纪录；利物浦积 15 分跌至第 5。", "source": "网易（体坛周报）", "url": "https://www.163.com/dy/article/LANEC6US05299JMD.html"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "20 岁安东内利成 F1 史上最年轻年度总冠军", "summary": "梅赛德斯车队意大利车手安东内利 11 月 1 日在 F1 墨西哥大奖赛提前锁定年度总冠军，以 20 岁之龄成为 F1 历史上最年轻的年度冠军车手。赛前他以 365 分领跑，领先第二名拉塞尔 123 分，本站收获季军即够积分提前加冕。", "source": "网易（体育产业早餐）", "url": "https://www.163.com/dy/article/LANG9PNT0529CSEE.html"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "孙颖莎 4-1 逆转蒯曼，夺得 WTT 蒙彼利埃站女单冠军", "summary": "WTT 蒙彼利埃站女单决赛，孙颖莎先丢一局后连扳四局，以 4-1 逆转队友蒯曼夺冠。她赛后表示蒯曼近期进步明显、冲击力很强，双方水平接近，胜负关键在于临场调整与关键分把握。同轮尤文 2-0 十人那不勒斯、皇马 3-0 桑坦德竞技均告捷。", "source": "澎湃新闻", "url": "https://m.thepaper.cn/newsDetail_forward_34385067"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感季提前、多毒株共同活跃，疾控提示尽早接种", "summary": "国家流感中心介绍，自 7 月起我国甲型 H3N2 与乙型 Victoria 系共同流行，呈「多毒株活跃、流行提前」特点。专家提醒儿童、65 岁以上老人、孕产妇及慢性病患者为重症高危人群，持续高烧、胸闷胸痛等须及时就医；整个流感季均可接种，早打优于晚打。", "source": "华声新闻（央视财经）", "url": "https://news.voc.com.cn/news/202611/34138558.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "2026「零碳使命」中国气候行动周在京启幕", "summary": "COP31 召开前夕，由 WWF 北京代表处与凤凰卫视共同主办的 2026「零碳使命」中国气候行动周 10 月 26 日在北京启幕，以「韧链共生·绿色新程」为主题，汇聚主管部门、国际机构与企业代表，持续线上直播至 11 月 1 日。", "source": "中国青年网（央广网）", "url": "https://news.youth.cn/hotnews_41880/202611/t20261102_16944875.htm"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "小鹏 10 月交付首破 5 万台创历史新高，海外交付增 166%", "summary": "10 月车企交付：小鹏 50,237 台（环比 +22%、同比 +20%），首破 5 万创新高，海外 13,326 台同比 +166%；蔚来 34,246 台同比 -15.2%，理想 29,025 台同比 -8.6%。吉利称「金九银十」首现基本消失。", "source": "网易（财经早餐）", "url": "https://www.163.com/dy/article/LAN6PP5B05199O55.html"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "S16 全球总决赛 BLG 搭末班车，LPL 三队晋级八强", "summary": "2026 英雄联盟 S16 瑞士轮收官，BLG 2-0 胜 HLE 晋级，GEN、DK、T1、IG、TES、KC、LYON 入围八强。LPL 的 IG、TES、BLG 三队突围，八强 TES 与 iG 再演「LPL 内战」，11 月 4 日起打四分之一决赛。", "source": "腾讯网（北青先锋电竞）", "url": "https://new.qq.com/rain/a/20261101A03LTC00"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "旅游「双 11」大促开跑，「先囤后约」成错峰消费新引擎", "summary": "今年旅游行业提前卡位「双 11」，飞猪现货开售 4 小时商品销量近 100 万件、超 200 商家成交额翻倍，大牌酒店 5 折起、部分低至 3 折。春秋旅游、广州康辉等推「先囤后约」早鸟权益，覆盖冰雪、避寒、丝路等错峰矩阵，将淡季重新定义为错峰消费窗口。", "source": "广州日报新花城", "url": "https://huacheng.gz-cmc.com/pages/2026/10/21/3d4a0f6a2571481d85cde9421ef8a729.html"}]}, "yest": {"date": "2026-10-30", "generatedAt": "2026-10-30T11:51:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "腾讯发布 Buddy One 跨应用 AI 协同体系", "summary": "腾讯正式发布面向个人用户的跨应用AI协同体系“Buddy One”，打通腾讯文档、会议、网盘与ima等办公协同产品，共享WorkBuddy Agent底座，实现统一账号、统一积分池与跨应用资料检索。WorkBuddy PC端5.9.0以上关联账号即可用，近期关联送100积分、原有积分不清零。", "source": "腾讯新闻（陆家嘴财经早餐）", "url": "https://news.qq.com/rain/a/20261030A02N9000"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌 Gemini 4 Carbon 登顶智能指数，首发价减半", "summary": "谷歌发布Gemini 4 Carbon，以59分登顶AA智能指数5.0，首发输入价为2美元/百万Token、约为Opus 5.5的一半；Terminal-Bench 4.0得分65.2%、SEC-bench Pro 88.2%刷新SOTA，作弊与提示词注入攻击成功率均为0.0%，先向部分网安防御者开放。", "source": "搜狐（腾讯研究院AI速递）", "url": "https://www.sohu.com/a/1094612416_455313"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Mistral 开源 Large 4：万亿参数 MoE、百万 token 上下文", "summary": "法国Mistral发布开源大模型Mistral Large 4（代号“Le Chonk”），采用约1万亿总参数、490亿激活参数的MoE架构，支持100万token上下文，按Mistral Ecosystem Open-Weight License开放权重；其网络安全基准Cyber Index得分82%，高于多家闭源前沿模型。", "source": "AI Breaking Wire", "url": "https://aibreakingwire.com/news/the-ai-brief-azure-ai-mode-ads-anthropic-mistral"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美军向特朗普汇报对伊朗军事选项，副总统信函试图重启谈判", "summary": "美军中央司令部司令布拉德·库珀10月29日在白宫向特朗普汇报针对伊朗的军事行动选项，美方已向部分海湾国家发出信号、为中期选举后可能的高强度军事行动做准备；同日美副总统万斯致信伊朗最高国安会秘书试图重启谈判，伊朗称已收到但暂未回应。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7702223762829181475"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "以色列议会选举初步计票完成，内塔尼亚胡阵营未获多数", "summary": "以色列中央选举委员会完成本届议会选举全部初步计票，由内塔尼亚胡领导的右翼执政联盟获53席、反对党阵营获48席、阿拉伯裔政党获19席，无任何阵营达到组阁所需的61席；组阁谈判或持续数周，不排除再次举行大选。", "source": "第一财经（昨夜今晨）", "url": "https://www.toutiao.com/article/7702238039841587747"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "西班牙高铁相撞事故死亡升至64人，全国哀悼三天", "summary": "西班牙托莱多省乌尔达高铁相撞事故死亡人数已升至64人，初步调查指向信号系统故障与人为调度失误，西班牙宣布全国哀悼三天；被追尾列车在紧急制动后因系统问题两次尝试重启均未成功，首相称将全面强化铁路安全。", "source": "网易（每日早报）", "url": "https://www.163.com/dy/article/LAFPNONF05562NPF.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "美国三季度GDP年化增长3.4%，创一年来最快", "summary": "美国商务部数据显示，2026年第三季度实际GDP按年率增长3.4%，超出市场预期并创一年来最快增速，AI资本开支成为核心驱动力；同期9月核心PCE物价指数同比升3.1%、环比升0.3%，上周初请失业金人数降至19.4万人。", "source": "新浪财经（新华财经）", "url": "https://finance.sina.com.cn/money/bond/2026-10-30/doc-iniwyfvy5557151.shtml"}, {"id": 8, "category": "财经经济与就业", "scope": "国际", "title": "美联储维持利率3.75%—4%不变，两名委员主张加息", "summary": "美联储10月28日结束议息会议，宣布维持联邦基金利率目标区间在3.75%至4%不变，暂停9月启动的加息步伐，但理事库克与克利夫兰联储主席哈马克主张加息25个基点；声明将经济评价由“稳健”上调为“强劲”，12月仍可能温和加息。", "source": "中国经济网（中国证券报）", "url": "http://intl.ce.cn/sjjj/qy/202610/t20261030_3276312.shtml"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "国内成品油价每吨上调345/335元（调控后）", "summary": "国家继续对成品油价格采取临时调控措施，自10月29日24时起，国内汽、柴油标准品价格每吨分别应上调440元、420元，调控后实际上调345元、335元，折合92号汽油、0号柴油每升分别上调约0.26元、0.28元。", "source": "中国新闻网（浙江）", "url": "https://www.zj.chinanews.com/jzkzj/2026-10-30/detail-ihfmppat9988882.shtml"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "美加宇航员出舱为国际空间站安装太阳能电池阵列", "summary": "国际空间站两名宇航员10月29日完成约7小时11分钟的太空行走，为空间站2A电力通道安装第7套卷绕式太阳能电池阵列，以提供额外电力保障关键任务运行及未来安全受控离轨；此为支持空间站组装维护的第285次出舱。", "source": "新华社（新浪）", "url": "https://k.sina.com.cn/article_1699432410_654b47da02001xi26.html"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "中国首批风云卫星极端天气AI模型发布", "summary": "中国首批风云气象卫星极端天气人工智能模型正式发布，可自动分析台风的位置、结构、强度及演变趋势并生成解译文本，号称台风“体检报告”27秒即可生成，将提升极端天气预警的自动化与时效性。", "source": "今日头条（看世界·新闻早知道）", "url": "https://www.toutiao.com/article/7702223848829174312/"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "中国U17女足点球4比3淘汰法国，队史首进世界杯八强", "summary": "北京时间10月30日凌晨，2026年U17女足世界杯八分之一决赛，中国队常规时间0比0战平法国，点球大战4比3胜出，历史上首次晋级该项赛事八强；门将牛子琪常规时间高接抵挡、点球大战两度扑出对手射门成为制胜关键，11月2日将战巴西。", "source": "中国日报网", "url": "https://cn.chinadaily.com.cn/a/202610/30/WS6ae3db67e4b09a165c792748.html"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "教育部印发办法，选优配强中小学校领导班子", "summary": "教育部会同相关部门印发《中小学校领导人员管理暂行办法》，鼓励城镇、优质学校领导人员到乡村、薄弱学校任职，将乡村薄弱学校任职3年以上作为选任优先条件；要求建立以素质教育为导向的考核体系，坚决扭转唯分数、唯升学倾向。", "source": "中国教育新闻网（中国教育报）", "url": "http://www.jyb.cn/rmtzgjyb/202610/t20261030_2111536648.html"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "两部门发文推进基层中医适宜技术推广应用", "summary": "国家中医药局、国家卫健委联合印发通知，进一步加强基层中医适宜技术（含少数民族医）推广应用，提出到2030年县级中医适宜技术推广中心基本实现全覆盖，并建设国家级师资库与开放共享教学资源库，提升基层中医药服务能力。", "source": "腾讯新闻（健康早闻）", "url": "https://news.qq.com/rain/a/20261030A02H5L00"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "特斯拉中国更新购车优惠，Model 3尾款立减增至1万元", "summary": "特斯拉中国10月30日更新购车优惠，活动期10月30日至11月30日：Model 3尾款立减由5000元提至1万元，Model Y则由7000元降至4000元；同时Model 3/Y五年0息最低首付由7.99万元降至3.99万元。乘联会数据显示其前三季度在华零售同比降11.9%。", "source": "搜狐（每日经济新闻）", "url": "https://www.sohu.com/a/1094813234_121347613"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "国产3A《影之刃零》发售首日Steam在线峰值破72万", "summary": "国产黑暗武侠3A《影之刃零》10月29日全平台发售，首日Steam同时在线峰值突破72万、跻身历史单机总榜第15位并登顶全球热销榜；PC版Metacritic媒体均分88、超越《黑神话：悟空》的81分，发售24小时玩家评价“特别好评”。", "source": "新浪新闻（浪涨新闻）", "url": "https://k.sina.com.cn/article_2292899701_88aadf7504001u3jg.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "湘西“入境奔县游”火爆，上半年预订量同比增239%", "summary": "依托民族文化与过境免签延长至240小时等政策，湘西州站上入境“奔县游”潮头，2026年上半年预订量同比暴涨239%；前三季度全州入境过夜游客24.07万人次、总花费超1亿美元，凤凰古城、芙蓉镇成为海外游客深度体验目的地。", "source": "湖南日报（参考消息）", "url": "http://mp.weixin.qq.com/s?__biz=MzAxMTM1ODY3OA==&mid=2649935897&idx=1&sn=06bd9282ebb32f2b79f7ed8be2ba46cb"}, {"id": 18, "category": "环境气候", "scope": "国内", "title": "西藏南部将现特大暴雪，中东部新一轮冷空气降温", "summary": "受孟加拉湾气旋风暴残涡与高空槽共同影响，10月30日至31日青藏高原中东部有明显雨雪，西藏南部沿喜马拉雅山附近高海拔区域为暴雪到大暴雪、局地特大暴雪，累计新增积雪可达30厘米以上；国家防减救灾办已会商部署防范。中东部新一轮冷空气将降温4至8℃、局地超10℃。", "source": "环球网（中央气象台）", "url": "https://china.huanqiu.com/article/4ToomBczRW3"}]}};</script>

<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
