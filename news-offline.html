: "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17182002740829893985&channelId=1119"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "中国空间站制备出已知最冷人造物质，等效温度降至9.7皮开尔文", "summary": "中国科学院团队利用中国空间站梦天舱超冷原子物理实验柜，率先以全光阱冷却将铷原子云等效温度降至9.7皮开尔文，较室温降14个数量级，可持续观测7秒，制备出目前已知最冷人造物质，成果6日在线发表于《科学》，向绝对零度再进一步。", "source": "光明日报", "url": "https://news.gmw.cn/2026-11/07/content_39089783.htm"}, {"id": 8, "category": "体育赛事", "scope": "国际", "title": "WTT法兰克福冠军赛爆冷：男单世界冠军雨果1-3不敌21岁德国小将", "summary": "2026WTT法兰克福冠军赛冷门频出：男单世界冠军、巴西名将雨果1比3不敌世界排名第40的21岁德国小将维姆，止步八强；国乒周启豪1比3不敌中国台北林昀儒出局，仅剩温瑞博守全区。日本队张本智和、张本美和等顺利晋级，外协会年轻选手加速崛起。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A006MY00"}, {"id": 9, "category": "健康养生", "scope": "国内", "title": "立冬进补有讲究，广东多家中医院启动膏方节，专家提示辨证适度", "summary": "11月7日立冬，广东多家中医院启动膏方节，广东省中医院五大院区同步开展名医义诊与体质辨识、免费品膏。国家卫健委此前以“时令节气与健康”为主题提示，冬令进补应“因人而异、适度平衡”，并建议重点人群尽早接种流感疫苗以预防呼吸道传染病。", "source": "广州日报", "url": "https://news.dayoo.com/gzrbrmt/202611/05/170638_55020741.htm"}, {"id": 10, "category": "环境气候", "scope": "国际", "title": "COP31中国角边会“跨界聚力 气候同行”将办，聚焦气候教育与同一健康", "summary": "COP31将于土耳其安塔利亚举行，中国角边会“跨界聚力 气候同行”定于11月9日举办，聚焦气候教育与公众参与、“同一健康”三大亮点，分享中国气候预警与适应实践。同期欧盟哥白尼监测显示，2026年10月为有记录以来最热10月，全年升温超1.5℃概率逾99%。", "source": "微言环保", "url": "https://www.163.com/dy/article/LB3LKNNE051493C2.html"}, {"id": 11, "category": "汽车出行", "scope": "国内", "title": "小米汽车10月销量突破5万台，增程车型拉动新势力格局重塑", "summary": "小米汽车10月销量突破5万台，较9月的4万台再上台阶，由新上市的澎程增程车型（上市30天锁单超7万辆）拉动，与零跑、小鹏构成新势力第一梯队，改写“蔚小理”格局。小米前10个月累计交付超31.9万台，全年55万辆目标仍具挑战。", "source": "象视汽车", "url": "https://www.163.com/dy/article/LB2A3HFK0547ESEH.html"}, {"id": 12, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16八强收官，7日T1对阵KC，决赛15日纽约打响", "summary": "2026英雄联盟全球总决赛八强单败淘汰赛进入收官：6日DK对阵BLG、GEN 3比0零封LYON率先晋级四强；7日迎来T1对阵KC的焦点战，半决赛8至9日进行，冠亚军决赛15日在纽约布鲁克林巴克莱中心打响，LPL四队AL、BLG、TES、iG出征。", "source": "今日头条", "url": "https://www.toutiao.com/a7704514898801312290"}, {"id": 13, "category": "文化读书", "scope": "国内", "title": "第九届中国非物质文化遗产博览会在重庆开幕，890个非遗项目亮相", "summary": "第九届中国非物质文化遗产博览会6日在重庆开幕，来自全国31个省区市的890个非遗项目集中亮相，特设“百味山河”非遗美食风物集，持续至11月10日。同期重庆第二十届老年产业博览会开幕，“银龄”模特将地标“穿”在身上走秀，聚焦银发经济。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A038RM00"}, {"id": 14, "category": "旅行出行", "scope": "国内", "title": "成都—九寨黄龙机场7日起复航，川航每周六直飞约55分钟", "summary": "九寨黄龙机场7日起恢复成都航线，由四川航空执飞，每周六往返各一班，成都天府至九寨单程飞行约55分钟、不含税参考价300元，适合周末短途错峰游。该机场10月25日起季节性停航，复航后冬春航季暂仅保留成都航线，落地需接驳至景区。", "source": "四川省中国青年旅行社", "url": "http://www.woyts.com/gt/14111.html"}, {"id": 15, "category": "战争与自然灾害", "scope": "国际", "title": "中东紧张持续，欧洲再遭民航客机炸弹威胁（一周内第三波）", "summary": "中东紧张持续：伊朗革命卫队6日宣布在格什姆岛上空击落第16架美军无人机，美方称数千美军已在中东就绪；霍尔木兹海峡附近一艘油轮爆炸，今年以来已记录155起相关海上安全事件。与此同时欧洲再遭民航客机炸弹威胁，为一周内第三波。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17182002740829893985&channelId=1119"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "杭州十所小学开家长非暴力沟通课，四句话改善亲子关系", "summary": "杭州临平十所小学为家长开设非暴力沟通课程，引导家长开口前先在心里过“四句话”：说看见的、说感受、表达期望、提出请求，以改善亲子关系和家庭教育质量，受到家长广泛关注。同期杭州多地推出购房补贴，最高20万元。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A038S000"}, {"id": 17, "category": "社会民生与教育", "scope": "国内", "title": "第二艘国产大型邮轮“爱达·花城号”在上海交付，月底商业首航", "summary": "第二艘国产大型邮轮“爱达·花城号”6日在上海正式交付，按计划9日从上海启航赴广州，月底开启商业首航。该轮是国产大型邮轮又一里程碑，标志着我国邮轮自主建造能力持续夯实，将为冬季滨海旅游与邮轮经济注入新动能。", "source": "搜狐新闻", "url": "https://www.sohu.com/a/1098299522_267106"}]}, "yest": {"date": "2026-11-06", "generatedAt": "2026-11-06T08:00:09.146485+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "2026世界互联网大会乌镇峰会落幕：AI与开源成绝对焦点", "summary": "2026年世界互联网大会乌镇峰会以“开源开放 共建共享”为主题闭幕，27场分论坛几乎均聚焦AI。博览会吸引54个国家和地区671家中外企业与机构参与，“人工智能+”成为展示核心，具身智能、人形机器人等从演示走向工厂、商铺与家庭场景落地。", "source": "人民网", "url": "https://finance.people.com.cn/n1/2026/1106/c1004-40828560.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "腾讯Hy4调用激增紧急十倍扩容；全国已建成5G工厂1260个", "summary": "腾讯11月5日宣布，混元Hy4于11月4日在WorkBuddy首发接入后调用激增，已紧急将推理集群扩容十倍并提升免费额度。工信部同期披露，全国已建成工业5G专网超2.6万个、5G工厂1260个，5G应用融入全部97个国民经济大类。", "source": "每日经济新闻", "url": "https://kuaibao.qq.com/s/20261106A03A4I00?refer=cp_1009"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "中东局势紧绷：霍尔木兹海峡两油轮触雷起火，伊朗击落美无人机", "summary": "当地时间11月5日，伊朗海军称两艘违规油轮在霍尔木兹海峡东部触雷起火，革命卫队当晚还在格什姆岛击落一架美军无人机（系击落第六架同型机）。胡塞武装称对沙特达曼机场发动无人机袭击，沙特主导联军过去24小时对也门空袭61次，中东局势持续紧张。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261106A03CUJ00"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "俄乌黑海互袭升级，黑海停火料成三方会谈重要议题", "summary": "俄乌在黑海海域互袭持续升级，俄国防部5日称凌晨打击敖德萨西南52公里处一艘载军用物资干货船。报道显示今年5至10月双方在黑海与亚速海水域共袭击317艘船只，为去年同期4倍多；黑海停火料成下周俄美乌三方会谈重要议题。", "source": "腾讯新闻", "url": "https://kuaibao.qq.com/s/20261106A03CNZ00?refer=cp_1009"}, {"id": 5, "category": "财经经济与就业", "scope": "国际", "title": "英国央行三年多来首次加息至4%；美国10月非农今晚公布", "summary": "英国央行宣布加息25个基点至4%，为2023年8月以来首次加息，货币政策委员会以8比1通过，央行警告若中东冲突未解此次“不太可能是最后一次”。美国10月非农就业与失业率数据于北京时间11月6日晚公布，成为检验加息预期的关键窗口。", "source": "新华财经", "url": "https://www.cnfin.com/yw-lb/detail/20261106/4491807_1.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "五部门发文加强消费基础设施建设，提出20项举措", "summary": "国家发改委等5部门发布《关于加强消费基础设施建设 促进消费投资良性互动的指导意见》，从完善城乡商业设施、提升服务消费设施、优化出行消费设施等方面提出20项具体举措。前三季度服务零售额增长5.0%、明显快于商品零售1.0%，政策精准回应多元消费需求。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/06/content_341454.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "西藏那曲7.0级地震13天后复学，师生异地安置拉萨", "summary": "西藏那曲巴青7.0级地震过去13天后，11月4日来自玛如乡、岗切乡的师生在拉萨那曲完全中学举行升旗仪式、开启复学第一课。原址校舍严重受损，那曲市分3批将师生易地安置拉萨，配备心理教师跟班，做到“到校即开课”。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/06/content_341447.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "教资笔试成绩今发布、面试报名同步启动；冷空气局地降温超12℃", "summary": "教育部教育考试院发布通知，2026年下半年中小学教师资格考试（笔试）成绩于11月6日发布，面试报名同步启动。今明两天冷空气继续影响内蒙古、东北、华北、黄淮等地，局地降温超12℃、阵风7至9级，黑龙江东北部局地有暴雪。", "source": "全国妇联女性之声", "url": "https://www.163.com/dy/article/LB0SVT2V05149JUI.html"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "科学家首次绘制三维日冕磁场图，有助精准预测太阳磁暴", "summary": "美国国家大气研究中心等机构团队首次绘制出三维日冕磁场图，成果发表于《天体物理学杂志快报》。团队利用莫纳罗亚太阳天文台偏振仪数据，通过解码穿过日冕的光与波，在三维空间“看见”太阳隐藏的磁性结构，有助更精准预测影响地球的太阳磁暴。", "source": "科技日报", "url": "https://edu.yunnan.cn/system/2026/11/06/034190256.shtml"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "欧空局发现火星火山未死：地下或仍留存岩浆热源", "summary": "欧洲航天局ExoMars项目TGO轨道器在火星阿尔巴山新鲜火山裂隙上空捕捉到定点集中的氯化氢气体信号，论文11月4日刊于《Science Advances》。该信号不同于沙尘暴期地表反应产物，指向地下岩浆房排气，显示火星火山未彻底熄灭、仍具活动潜力。", "source": "快科技", "url": "https://m.mydrivers.com/newsview/1163529.html"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "中国男篮公布世预赛集训名单，周琦王哲林赵继伟等老将回归", "summary": "中国篮协11月4日公布新一期男篮集训名单，备战2027篮球世界杯预选赛第五窗口期。周琦、王哲林、赵继伟、张镇麟等老将回归，杨瀚森因在NBA无法回归；球队11月8日至21日在京集训，随后赴西亚迎战沙特（11月26日多哈）与黎巴嫩（11月29日）。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34413433"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "中国科学家完成全球首例“化学遗传学神经调控”人体临床（癫痫）", "summary": "11月5日《新英格兰医学杂志》发表中国科学家完成的首例化学遗传学神经调控人体临床研究。宣武医院、北京脑科学所团队通过基因递送让特定神经元表达“人工设计受体”，用药时激活、不吃药时静默；3例难治性癫痫患者月均发作由4.33次降至0.33次。", "source": "科技日报", "url": "https://www.stdaily.com/web/gdxw/2026-11/05/content_608943.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "全国首个非侵入式脑机接口临床研究完成备案，主攻卒中康复", "summary": "天津大学脑机海河实验室团队研发的“SCS联合无创脑控混动外骨骼”卒中康复项目11月5日完成国家卫健委生物医学新技术临床研究备案（国务院令第818号），系全国首个完成备案的非侵入式脑机接口临床研究，标志该技术迈入规范化临床阶段。", "source": "中国科学报", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574291.shtm"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "“十五五”绿色发展新图景：光伏装机历史性超过煤电", "summary": "“十五五”专项规划勾勒绿色发展新图景：上半年全国煤电发电量占比首次低于50%，光伏发电装机历史性超过煤电，每10度电近4度为绿电。国务院《“十五五”碳达峰行动方案》7月印发，《国家应对气候变化“十五五”规划》首次在五年规划层面系统构建全领域气候目标体系。", "source": "新浪财经", "url": "https://k.sina.cn/article_2810373291_a782e4ab020030aw2.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "国内L2+辅助驾驶搭载率达70%，L3强制标准2027年7月落地", "summary": "2026世界智能网联汽车大会透露，截至2026年9月国内L2及以上辅助驾驶搭载率已达70%，L3级准入测试推进中，相关强制性标准将于2027年7月1日落地。华为引望称辅助驾驶累计行驶近170亿公里，国庆七天乾崑智驾辅助里程近5.6亿公里。", "source": "浙江日报", "url": "https://zjrb.zjol.com.cn/html/2026-11/06/content_3944234.htm"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16八强开战：BLG首局1-0领先DK", "summary": "2026英雄联盟全球总决赛八强战11月6日开打，LPL二号种子BLG对阵LCK四号种子DK（BO5）。BLG首局凭借Knight蛇女摇摆与先锋团配合1比0先下一城；另一场T1对阵KC于11月7日进行，GEN此前3比0零封LYON率先晋级四强。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261106A039AB00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "文旅部公示拟新增17家国家5A级旅游景区", "summary": "文化和旅游部11月5日公示拟确定17家国家5A级旅游景区，公示期至11月11日。名单涵盖正定古城、天津泰达航母主题公园、南京玄武湖、广州塔、成都大熊猫基地、敦煌阳关玉门关、茶卡盐湖、西夏陵等，将进一步丰富国内优质文旅目的地供给。", "source": "中国网", "url": "https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-11/05/content_118763077.shtml"}, {"id": 18, "category": "战争与自然灾害", "scope": "国际", "title": "俄方称卢甘斯克一公共汽车遭袭致5死13伤", "summary": "俄方任命的卢甘斯克地区领导人帕谢奇尼克5日称，乌武装部队当天袭击该地区一辆公共汽车，造成5人死亡、13人受伤，所有伤员已获救治；乌方还在列布里科沃至罗韦尼基路段袭击另一车辆致2人死亡。俄乌黑海及地面冲突仍在多点延续。", "source": "央视新闻客户端", "url": "https://news.yunnan.cn/system/2026/11/06/034190191.shtml"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
