": "https://m.chinanews.com/wap/detail/cht/zw/10699322.shtml"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "巴基斯坦西北部两起自杀式爆炸袭击致21人死亡", "summary": "巴基斯坦卫生官员9月18日证实，该国西北部开伯尔-普什图省发生的两起自杀式爆炸袭击已造成21人死亡，其中包括15名警察，另有逾80人受伤。目前尚无组织宣称负责，总理夏巴兹已指示当地加快救援行动。", "source": "新华社 / 央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8916aad4cf131952"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "财政部：前8月全国财政收入15.66万亿元同比增5.7%", "summary": "财政部9月18日发布数据，今年前8个月全国一般公共预算收入15.66万亿元，同比增长5.7%；其中税收收入12.9万亿元、增长6.6%。分中央与地方看，中央收入增长9.1%、地方增长3.1%。同期快递业务收入累计完成1.03万亿元，突破万亿较去年提前一个月。", "source": "财政部 / 上观新闻", "url": "https://news.qq.com/rain/a/20260919A02W8I00"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "工信部等十部门发布《医药工业“十五五”规划》", "summary": "工信部等十部门9月18日联合发布《医药工业发展“十五五”规划》，提出到2030年规模以上医药工业企业营业收入超过3.5万亿元，并围绕创新药、高端医疗器械、中医药等部署重点任务，推动医药工业向价值链高端迈进、更好满足人民健康需求。", "source": "经济日报 / 澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34102001"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "北京发布义务教育科学教育“做中学”京版方案", "summary": "北京市9月18日启动义务教育科学教育“做中学”领航行动全域推进，秋季学期起全市义务教育学校全面实施生命健康、人工智能等六大主题行动，有条件的区可向高中延伸，并构建小学—初中—高中—大学贯通培养长链条，强化学生探究实践与科学观念养成。", "source": "千龙网 / 北京日报", "url": "https://finance.sina.com.cn/jjxw/2026-09-19/doc-inishzsi2831873.shtml"}, {"id": 11, "category": "社会民生与教育", "scope": "国内", "title": "高校强制采集父母收入等信息引争议，校方改选填", "summary": "一高校研一新生发帖吐槽网上报到系统强制采集父母身份证号、工作单位、平均月收入等12项信息且无法跳过，引发热议。经媒体致电，校方已将相关信息改为选填。舆论指出信息采集应遵循“最小、必要”原则，过度采集易引发区别对待与隐私泄露隐患。", "source": "新浪新闻", "url": "https://news.sina.com.cn/s/2026-09-19/doc-inishzsm3278906.shtml"}, {"id": 12, "category": "科学探索", "scope": "国内", "title": "陕西上召窑秦陵考古成果公布，墓主疑为华阳太后", "summary": "陕西省考古研究院9月18日公布上召窑秦陵考古成果：位于咸阳的“亚”字形大墓确认为战国晚期秦王级别墓葬，出土陶、铜、玉等器物258件（组），陪葬墓人骨测年为公元前389至前208年。结合史料与形制，墓主推测为秦始皇祖母华阳太后。", "source": "央视新闻 / 陕西省考古研究院", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=3462588988457157902&channelId=1119"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "名古屋亚运会开幕，中国代表团出征多项目", "summary": "2026年爱知·名古屋亚运会于北京时间9月19日17时开幕，持续至10月4日，94个国家和地区、约1.2万名运动员参赛。中国体育代表团派出大批新生代选手，将在游泳、田径、乒乓球、女排等项目冲击金牌，这也是日本时隔多年再度承办亚运会。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=1676732806343640593&channelId=1119"}, {"id": 14, "category": "体育赛事", "scope": "国内", "title": "中国女排3-0横扫哈萨克斯坦，小组头名晋级八强", "summary": "北京时间9月18日，名古屋亚运会女排B组末轮，中国队以3-0（25-18、25-6、25-14）横扫哈萨克斯坦，两连胜积6分锁定小组头名晋级八强。全场扣球47-24、拦网10-4全面占优，庄宇珊16分荣膺得分王，1/4决赛将于20日对阵D组第二名。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-19/detail-inishvks8074503.d.html"}, {"id": 15, "category": "环境气候", "scope": "国际", "title": "世界气象组织确认超强厄尔尼诺形成中，亚洲多国应对", "summary": "世界气象组织日前发布公报确认厄尔尼诺事件已出现，预计数月内发展为超强级别，相关极端天气风险将持续至2027年。据《卫报》报道，韩国新设最高级“高温重大警报”，日本防范超强台风，印度、斯里兰卡干旱加剧，东南亚烟霾影响农作物收成。", "source": "新华社 / 世界气象组织", "url": "https://finance.sina.com.cn/jjxw/2026-09-18/doc-inisftxe8489564.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "上半年中国新能源汽车出口235.5万辆同比增1.2倍", "summary": "据中国汽车工业协会数据，2026年上半年中国新能源汽车出口235.5万辆，同比增长1.2倍，其中东盟等市场需求旺盛、表现强劲。同期中国算力基础设施与AI服务加快走向东盟，高质量开放红利持续释放，为区域合作与中国—东盟经贸打开新空间。", "source": "人民网 / 中国汽车工业协会", "url": "https://world.people.com.cn/n1/2026/0919/c1002-40801477.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "美国向中国返还64件文物艺术品和古生物化石", "summary": "北京时间9月16日和18日，国家文物局在华盛顿、纽约分别接收美国向中国返还的两批次共64件（套）文物艺术品和古生物化石，包括天龙山第17窟菩萨身躯、造像、陶俑及恐龙骨架化石等。这是落实中美元首北京会晤共识的最新成果，累计已回归700余件。", "source": "央视网 / 国家文物局", "url": "https://news.cctv.com/2026/09/18/ARTI0y2KJBSqHhFRyvurccGp260918.shtml"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "国办转发十部门促进房车消费新措施", "summary": "国务院办公厅近日转发文旅部等十部门《关于促进房车消费的若干措施》，从供给、登记报废、通行停靠、营地用地、租赁、金融保险等九方面打通堵点，明确非营运自行式房车不设强制报废年限、旅居挂车年限放宽至20年，培育房车露营等文旅新业态。", "source": "中国网 / 国务院办公厅", "url": "https://big5.china.com.cn/txt/2026-09/18/content_118702908.shtml"}]}, "yest": {"date": "2026-09-18", "generatedAt": "2026-09-18T08:01:18+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "华为发布昇腾960超节点并官宣芯片提前就绪，智能制造“十五五”开局强劲", "summary": "9月17日华为全联接大会披露，昇腾960超节点采用NPO近封装光学技术，单卡FP8算力达2PFLOPS、HBM最高288GB、带宽9.6TB/s；昇腾960芯片提前就绪。同日全国先进制造业大会传达习近平总书记指示，上半年规上工业集成电路产量同比增超23%，C919累计交付41架。", "source": "经济日报 / 央视新闻", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260918_3220253.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "日本首相高市早苗改组内阁，维新会议员首次入阁", "summary": "当地时间9月17日，日本首相高市早苗改组内阁，系其2025年10月上台以来首次内阁改组；维新会议员首次入阁，内阁阵容出现明显调整。同日央视“早啊新闻来了”还提醒，9月18日是九一八事变爆发95周年，警钟长鸣、吾辈自强。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=4513405555968554656"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美众议院通过俄伊制裁法案，特朗普威胁就加拿大“准成员”对欧盟加税", "summary": "美国众议院通过《2026年林赛·格雷厄姆制裁俄罗斯和伊朗法案》，重点针对俄能源行业，并对俄伊贸易伙伴施压。同时特朗普警告，若欧盟推进吸纳加拿大成为首个“准成员”，将对欧加征关税甚至全面停止贸易，欧盟—加拿大峰会定于10月在蒙特利尔举行。", "source": "腾讯新闻 / 央视", "url": "https://news.qq.com/rain/a/20260918A029BA00"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "俄军打击乌大型军用数据中心并拦截641架无人机，红海航运持续受扰", "summary": "俄国防部9月17日通报，俄军凌晨打击了乌克兰最大一处军用数据中心，并称16日夜至17日凌晨在多地拦截和击毁641架乌无人机。乌方则打击俄炼油厂及无人机设施；与此同时胡塞武装对沙特发动频繁空袭，红海航运安全形势依旧紧张。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7686623510910747190/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "中秋国庆“超长黄金周”带火深度游，机票酒店预订大幅攀升", "summary": "今年中秋与国庆紧紧相连，“请3休13”拼假策略走红。同程报告显示，截至9月14日平台“中秋”“国庆”搜索热度月环比增278%，国内热门城市机票预订同比增超40%，1200公里以上长航线增34%，高品质酒店预订占比提升近10个百分点，年轻人占比近48%。", "source": "经济日报", "url": "https://www.ce.cn/cysc/newmain/yc/jsxw/202609/t20260918_3220217.shtml"}, {"id": 6, "category": "社会民生与教育", "scope": "国内", "title": "国办印发《烟花爆竹全链条安全监管意见》；广电总局推进机顶盒内置电视", "summary": "国务院办公厅印发《关于进一步加强烟花爆竹全链条安全监管的意见》，对防范化解重大安全风险、遏制事故作出部署。另据国新办发布会，国家广电总局将推动机顶盒功能以软件形态内置于电视机，用户配通用遥控器即可一键开关机、一键看频道，简化看电视操作。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-18/detail-ihfkhckz2210533.shtml"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "长征十二号成功发射卫星互联网低轨25组卫星，长征系列第667次飞行", "summary": "9月17日8时32分，长征十二号运载火箭在海南商业航天发射场点火起飞，成功将卫星互联网低轨25组卫星送入预定轨道。长十二由中国航天科技集团八院抓总研制，是我国首款4米级箭径单芯级火箭，700公里太阳同步轨道运力不低于6吨，本次为长征系列第667次发射。", "source": "腾讯新闻 / 科技日报", "url": "https://new.qq.com/rain/a/20260918A02EX100"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "快舟十一号一箭双星，成功发射天仪51、52星", "summary": "北京时间9月17日10时40分，我国在酒泉卫星发射中心使用快舟十一号遥三运载火箭，成功将天仪51、52星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是快舟十一号运载火箭的第7次飞行，进一步丰富了我国快速响应发射能力。", "source": "央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_7636aac79ef53652"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "亚运男篮半决赛今夜中国vs日本，九一八之夜争决赛席位", "summary": "北京时间9月18日18时20分，名古屋亚运会男篮半决赛中国对阵东道主日本，胜者进决赛。中国队1/4决赛87:78胜沙特，廖三宁砍30分7板4助；日本以B联赛球员为主的“二队”曾85:78淘汰中国台北。另一场韩国对伊朗15时先打，决赛9月20日进行。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260917A0F2K600"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "国家中医药局开秋季养生发布会：推荐八段锦，提醒科学“贴秋膘”", "summary": "国家中医药管理局9月17日召开“秋季中医药养生”专题发布会。专家提示秋季应滋阴润燥、早睡早起，可练习八段锦、太极拳舒缓身心；并强调现代人营养过剩，贴秋膘应“清补为主、有病先治、因人而异”，高血压糖尿病等慢病患者不可盲目进补或停医嘱用药。", "source": "国家中医药管理局", "url": "http://www.natcm.gov.cn/bangongshi/gongzuodongtai/2026-09-17/38776.html"}, {"id": 11, "category": "环境气候", "scope": "国际", "title": "WMO《臭氧公报》：全球臭氧层持续恢复，2025南极空洞数十年最小", "summary": "9月16日国际保护臭氧层日，世界气象组织发布《臭氧公报》称，2025年南极臭氧空洞深度与范围连续第二年显著低于1990—2010年平均，为有记录以来第四至第五小。秘书长绍洛表示这是环保成功案例，自2000年持续恢复，预计数十年内完全复原；中国累计淘汰约72万吨消耗臭氧层物质。", "source": "新华社 / 世界气象组织", "url": "https://finance.sina.com.cn/jjxw/2026-09-17/doc-inisapns9533044.shtml"}, {"id": 12, "category": "汽车出行", "scope": "国内", "title": "智能网联汽车强制性国标GB 47955—2026发布，2027年实施规范L2辅助驾驶", "summary": "工信部牵头制定的《智能网联汽车 组合驾驶辅助系统安全要求》（GB 47955—2026）已发布，将于2027年1月1日实施。标准首次以强制国标形式明确L2组合驾驶辅助的驾驶员监测、系统边界与试验方法，并要求企业宣传禁用“自动驾驶”等误导性表述，2026年乘用车L2渗透率已约七成。", "source": "齐鲁晚报 / 工信部", "url": "https://ql1d.com/general/28051864.html"}, {"id": 13, "category": "游戏电竞", "scope": "国内", "title": "LPL资格赛TES 3-1击败IG锁定三号种子，WE与JDG今夜生死战", "summary": "9月17日LPL全球总决赛资格赛M1，TES以3-1击败IG，锁定LPL赛区三号种子，IG跌入M3保留最后一次机会。9月18日17时M2由WE对阵JDG，胜者将与IG争夺最后一张S赛门票，败者直接淘汰；BLG、AL此前已分获一、二号种子，代表LPL出征S16。", "source": "直播吧", "url": "https://m.zhibo8.com/news/web/other/2026-09-18/6aac7a4ae5927native.htm"}, {"id": 14, "category": "文化读书", "scope": "国内", "title": "电影《731》9·18上映首日破多项影史纪录，票房超3亿元", "summary": "9月18日电影《731》正式上映，据猫眼数据单日场次破27.4万场，超过《哪吒之魔童闹海》成为中国影史单片单日总场次冠军；截至当晚票房突破3.1亿元，排片占比高达68%。多地影院将首场定在9时18分并标注“警钟长鸣”，影片以平民视角揭露侵华日军731部队暴行。", "source": "深圳特区报 / 搜狐", "url": "https://www.sohu.com/a/936395624_121384255"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "“宝藏小城”旅游升温，河北滦平酒店预订同比增超10倍", "summary": "中秋国庆双节临近，自然风光优越的“宝藏小城”成为文旅黑马。据携程等平台数据，滦平等地假期旅游产品搜索量环比增超60%，酒店预订量同比增超10倍，金山岭长城周边多酒店“满房”。1至8月滦平接待游客615.33万人次、同比增8.7%，沉浸式体验与普通话之乡IP带动全域游。", "source": "纵览新闻 / 河北日报", "url": "https://www.toutiao.com/article/7686654753517863424/"}, {"id": 16, "category": "财经经济与就业", "scope": "国际", "title": "美联储时隔三年重启加息至3.75%—4%，全球市场震荡、英央行按兵不动", "summary": "北京时间9月17日凌晨，美联储以12:0通过加息25个基点，将联邦基金利率目标区间升至3.75%—4.00%，为2023年7月以来首次加息。受此影响美股尾盘跳水、现货黄金跌约1%、美元指数重上100；英国央行同日维持3.75%利率不变，为连续第六次按兵不动。", "source": "东方财富网 / 中国证券报", "url": "https://finance.eastmoney.com/a/202609173876452677.html"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
