<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}

<script>window.__DATA__ = {"today": {"date": "2026-11-03", "generatedAt": "2026-11-03T10:39:31.813862+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "2026世界互联网大会乌镇峰会开幕，聚焦开源开放与人工智能治理", "summary": "11月3日，2026年世界互联网大会乌镇峰会在浙江乌镇开幕，主题为“开源开放 共建共享——携手构建网络空间命运共同体”。本届设27场分论坛，来自54个国家和地区的671家企业参展，发布卫星互联网、量子通信、6G、大模型、具身智能等1000余项新技术；会前DeepSeek宣布将全面开源内部推理框架。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1793669070135&item_id=380867392816843151&channelId=1119"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic第三季度营收达上年同期约12倍，IPO前高速扩张", "summary": "Anthropic向美国SEC提交的文件显示，2026年第三季度公司实现营收169.56亿美元，较上年同期的13.82亿美元增长约1127%；计算及基础设施费用同比增382%至约99亿美元，占营收58%。在AI需求持续高景气的背景下，公司正为上市做最后准备。", "source": "财联社（网易）", "url": "https://www.163.com/dy/article/LAPQIP8P05198CJN.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美伊释放和平谈判信号，国际油价创三个月来最大跌幅", "summary": "伊朗最高领袖批准政府推进和平谈判，特朗普称“有可能”与伊朗达成协议，市场乐观预期升温。受此影响，12月WTI原油期货下跌7.4%收于每桶96.46美元，布伦特跌7.6%至104.77美元，均创近三个月最大单日跌幅。谈判能否落地仍存不确定性。", "source": "新浪财经·环球市场播报", "url": "https://www.toutiao.com/article/7703700995431219727/"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "英国推进移民永居制度改革，居留年限拟由5年延长至10年", "summary": "英国内政大臣马哈茂德确认推进“贡献型永居”计划，将大多数合法移民申请永居的居住年限由5年延长至10年，并追溯适用于已在等候者，预计影响约50万人。为平息党内反对，从事社会护理的外籍护理人员可沿用5年路径，须于2025年5月前抵英。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7703698123905860130/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "央行11月3日开展第三次互换便利操作，回购增持再贷款转长期制度", "summary": "中国人民银行11月3日开展证券、基金、保险公司互换便利（SFISF）操作，期限1年，31家机构申报需求超1000亿元。同时金融管理部门明确，股票回购增持再贷款由阶段性安排转为长期制度，再贷款利率由1.25%降至1%，以稳定资本市场。", "source": "央广网", "url": "https://www.toutiao.com/article/7703761409614823999"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "央行近5年来首次上调外汇存款准备金率2个百分点", "summary": "中国人民银行决定自2026年11月15日起，将金融机构外汇存款准备金率由4%上调至6%，为近5年来首次上调。举措意在冻结更多银行体系外汇资金、平衡外汇供需，缓解人民币升值压力；消息公布后离岸人民币短线走弱。", "source": "央视网财经（第一财经）", "url": "https://finance.cctv.cn/2026/11/03/ARTI0K0Js3R1p13H0yRSl6Fx261103.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "海南陵水发布暴雨红色预警，全县中小学幼儿园停课半天", "summary": "11月3日5时10分，陵水县气象台将暴雨橙色预警升级为红色预警。根据《海南省教育系统应对台风暴雨极端天气停课指导意见》，全县中小学、幼儿园、校外培训机构及托管机构上午停课半天，寄宿制学校对留校学生实施封闭管理，复课时间另行通知。", "source": "腾讯新闻（陵水县教育局）", "url": "https://news.qq.com/rain/a/20261103A02SUZ00"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "第27届中国国际教育年会在京举行，首发高等教育国际合作报告", "summary": "10月29日至31日，第27届中国国际教育年会在北京举行，以“开放育新 合作致远”为主题，主宾国为泰国，吸引70多个国家和地区的6000余位教育工作者参会。年会首次发布《中国高等教育国际合作与交流发展报告（2026）》，同期中国国际教育展有35个国家和地区420余所院校参展。", "source": "中国教育新闻网", "url": "http://www.jyb.cn/rmtzgjyb/202611/t20261103_2111537803.html"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "西班牙高铁列车相撞事故遇难者身份确认取得进展", "summary": "西班牙官方通报，10月28日中部托莱多省发生的高速列车相撞事故共造成69人遇难。截至11月2日，已确认66名遇难者身份，救援与身份核实工作持续推进。这是西班牙近年来最严重的铁路事故之一，事故原因仍在调查中。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1793660890206&item_id=18259069750278224431&channelId=1119"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞武装导弹袭击医疗中心，造成20名平民死伤", "summary": "也门政府卫生部门11月2日通报，胡塞武装使用导弹袭击了拉赫季省一处医疗中心，造成20名平民死伤。胡塞武装方面暂未回应。近期也门局势持续紧张，周边国家与调停方正尝试推动人道主义救援与停火安排。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7703698123905860130/"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "天问三号进入初样研制，有望成人类首个火星取样返回任务", "summary": "在2026年深空探测（天都）国际会议上，天问三号首席科学家、中科院院士侯增谦介绍，任务已处于初样研制阶段，有望成为人类首个火星取样返回任务，首要科学目标是探寻火星生命痕迹。任务计划钻取最深约2米样品，并将建设全球首个“行星保护实验室”。", "source": "新京报", "url": "https://www.bjnews.com.cn/search?bwsk=%E5%A4%A9%E9%97%AE"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "孙颖莎4-1逆转蒯曼，夺得WTT蒙彼利埃站女单冠军", "summary": "WTT蒙彼利埃冠军赛女单决赛，中国选手孙颖莎先丢一局后连扳四局，以4-1逆转队友蒯曼夺冠。她赛后表示蒯曼近期进步明显、冲击力很强，胜负关键在于临场调整与关键分把握。同轮中国军团在多项赛事中表现稳健。", "source": "澎湃新闻", "url": "https://m.thepaper.cn/newsDetail_forward_34385067"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感季提前、多毒株共同活跃，疾控提示尽早接种疫苗", "summary": "国家流感中心介绍，自7月起我国甲型H3N2与乙型Victoria系共同流行，呈“多毒株活跃、流行提前”特点，学校、写字楼等密闭空间聚集性感染风险上升。儿童、65岁以上老人、孕产妇及慢性病患者为重症高危人群；整个流感季均可接种，早打优于晚打。", "source": "光明网（央视财经）", "url": "https://health.gmw.cn/2026-11/03/content_39080561.htm"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "《全球能源转型报告》显示可再生能源发电占比首超煤电", "summary": "《全球能源转型报告（2026）》指出，2025年全球可再生能源发电量增长8.5%，占比达33.8%，百年以来首次超过煤电33.0%；全球可再生能源装机达5149GW，同比增长15.5%，中国对新增装机贡献率63.6%。但报告警示转型呈“量增速滞”分化格局，关键矿产供应链成核心掣肘。", "source": "中国石油石化（网易）", "url": "https://www.163.com/dy/article/LAPAR7JE05508GA4.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "前9月中国对欧盟汽车出口183万辆，已超去年全年", "summary": "中国汽车流通协会乘联分会数据显示，2026年前9个月中国对欧盟汽车出口达183万辆，远超去年全年；9月单月同比增128%、累计同比增87%，其中插混出口增372%、纯电在高关税下仍近2倍增长。比亚迪、吉利、奇瑞、零跑等中国主流车企在欧洲表现突出。", "source": "财联社", "url": "https://www.163.com/dy/article/LAQ5GIMN05198CJN.html"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "国产武侠游戏《影之刃零》发售72小时全平台销量破400万", "summary": "11月2日，国产武侠动作游戏《影之刃零》宣布发售后72小时全平台销量突破400万。第三方数据显示其Steam峰值在线玩家于11月1日达83万创历史新高，在线人数连续四天走高；《黑神话：悟空》制作人冯骥发文祝贺，称比销量更可喜的是好评率连续三天改善。", "source": "每日经济新闻（今日头条）", "url": "https://www.toutiao.com/a7703705260207997503"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "粤港澳图书馆藏孙中山文献展在香港中央图书馆开幕", "summary": "时值孙中山诞辰160周年，广东省立中山图书馆、香港公共图书馆、澳门公共图书馆及澳门科技大学图书馆联合举办“山川毓秀 故纸含情——粤港澳图书馆藏孙中山文献展”，11月3日至15日在香港中央图书馆展出其不同时期的历史文件、活动照片、著作版本等珍贵文献。", "source": "香港公共图书馆", "url": "https://www.hkpl.gov.hk/mobile/tc/extension-activities/event-detail/304725/a-world-of-beauty-told-through-old-pages-exhibition-of-sun-yat-sen-documents-from-libraries-in-guangdong-hong-kong-and-macao"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "多地秋假开启，亲子赏秋出游消费热度攀升", "summary": "浙江、四川、江苏、广东、福建等地中小学秋假陆续启动，主流模式为“3天秋假+周末”拼出5天弹性小长假。去哪儿数据显示，“秋假”“赏秋”等关键词搜索量月环比增长2.2倍，11月酒店预订量同比增五成、机票增两成，亲子游热度月环比翻番。", "source": "凤凰网文化（晨间资讯）", "url": "http://mp.weixin.qq.com/s?__biz=MzkwNjIzNTgzMg==&mid=2247484116&idx=1&sn=287798cf2b6a5c904cca29af9a6f9b7f&chksm=c17711362f30d6104cac8a224dae9babf03dde8f3c7040031709907cb11d0bac64c59352ca29#rd"}]}, "yest": {"date": "2026-11-02", "generatedAt": "2026-11-02T11:53:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "国行 Apple Intelligence 接入阿里千问，11 月 4 日开放测试", "summary": "苹果 10 月 31 日宣布与阿里合作，将通义千问整合进中国大陆版 Apple Intelligence，预计 11 月 4 日随 iOS 27.3 测试版上线、12 月正式推送。用户可通过 Siri 调用千问问答、文档图片追问及「千问创作」。", "source": "腾讯新闻（全球科技早参）", "url": "https://news.qq.com/rain/a/20261102A030DQ00"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI 下调新一轮融资目标至估值 1.25 万亿美元", "summary": "受 AI 股遭抛售及 Anthropic 即将上市影响，OpenAI 据称已将融资目标从 1.4 万亿美元估值、300 亿美元，下调至 1.25 万亿美元估值、约 200 亿美元。阿联酋 MGX 料成主要参与方，反映市场对 AI 高估值态度转审慎。", "source": "每经网（数智早参）", "url": "https://www.nbd.com.cn/articles/2026-11-01/4633594.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "伊朗同意「两天计划」，美方履约方能重启伊美谈判", "summary": "伊朗外长阿拉格齐 11 月 1 日表示，伊朗同意调解方「两天计划」：第一天美国履约，第二天霍尔木兹海峡开放、交通恢复，此后伊美方能复谈。美方须满足确定新航线、解冻资金、结束地区战争等《伊斯兰堡谅解备忘录》条件，以方敦促特朗普选后「立即恢复对伊战争」。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7703342930760581670"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "阿根廷媒体称阿情报机构协助博索纳罗出逃", "summary": "阿根廷《第12页报》11 月 1 日报道，阿国家情报秘书处一名曾派驻美使馆的情报人员策划并协助巴西大选落败者弗拉维奥·博索纳罗于 10 月 27 日经边境大桥入境阿根廷、再乘私人飞机赴厄瓜多尔。巴西最高法院 26 日禁其离境，其 28 日仍抵美国佛州。", "source": "央视网（新华网）", "url": "https://news.cctv.cn/2026/11/02/ARTIrszKpPUNheGIMHEdMp8n261102.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "从「十五五」专项规划看扩大内需着力点", "summary": "「十五五」开局之年消费提质扩容与有效投资双向发力。国务院 7 月批复《扩大消费「十五五」规划》，明确 2030 年社会消费品零售总额达 60 万亿元左右，部署增收稳岗、扩大灵活就业参保、推行长期护理保险，布局普惠养老托育等改善型供给。", "source": "经济网（新华社）", "url": "https://www.ceweekly.cn/news/important/2026/1102/502304.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "前三季度全国城镇新增就业 1052 万人，完成全年目标 87.7%", "summary": "人社部发布前三季度进展：1—9 月全国城镇新增就业 1052 万人，完成全年目标 87.7%，城镇调查失业率均值 5.2%，形势总体稳定。多措并举促青年就业，出台 16 条政策并开展「就业公共服务进校园」百日行动，推动 AI 赋能就业友好型发展。", "source": "人社部（莆田市人社局转载）", "url": "https://rsj.putian.gov.cn/zwgk/tjxx/tjfx/202611/t20261102_2242505.htm"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "苏丹称来自埃塞俄比亚的无人机袭击已造成数百人伤亡", "summary": "苏丹 11 月 1 日声明，2026 年 2 月 15 日至 10 月 27 日共发生 70 起自埃塞境内发起的无人机袭击，涉 187 架自杀式无人机及 82 枚弹药，造成 484 名平民、176 名士兵死亡，200 名士兵受伤。苏丹将向安理会与非盟申诉。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7703339583596937747"}, {"id": 8, "category": "科学探索", "scope": "国际", "title": "旅行者 1 号将于 11 月 18 日抵达距地球一光天，创人类航天史纪录", "summary": "NASA 确认旅行者 1 号将于 11 月 18 日首次达到距地球一光天（约 160.95 亿英里），成为人类史上最远人造物体。该探测器 1977 年发射、已工作近 49 年，以约 6.12 万公里/小时飞离太阳系，地空单程通信时延将达约 24 小时。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261101A0BKLC00"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国载人月球探测工程采用「两次发射、环月对接」方案", "summary": "第七届载人航天学术大会披露，我国载人月球探测采用「两次发射、环月对接」方案：两枚长征十号分别将揽月着陆器与梦舟飞船送入地月转移轨道，于环月轨道交会对接，航天员换乘着陆器登月。长征十号、梦舟、揽月研制顺利，揽月着陆器将先行无人飞行「彩排」。", "source": "央广网（央视新闻）", "url": "https://www.toutiao.com/article/7703147845485855267"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "阿森纳 1-0 客胜利物浦，时隔 14 年攻克安菲尔德登顶", "summary": "英超第 9 轮，阿森纳客场 1-0 击败利物浦：第 16 分钟阿利松出球失误，赖斯助攻哈弗茨破门。枪手豪取联赛 4 连胜，积 24 分以 3 分优势力压曼城独占榜首，并终结 13 场英超对利物浦不胜纪录；利物浦积 15 分跌至第 5。", "source": "网易（体坛周报）", "url": "https://www.163.com/dy/article/LANEC6US05299JMD.html"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "20 岁安东内利成 F1 史上最年轻年度总冠军", "summary": "梅赛德斯车队意大利车手安东内利 11 月 1 日在 F1 墨西哥大奖赛提前锁定年度总冠军，以 20 岁之龄成为 F1 历史上最年轻的年度冠军车手。赛前他以 365 分领跑，领先第二名拉塞尔 123 分，本站收获季军即够积分提前加冕。", "source": "网易（体育产业早餐）", "url": "https://www.163.com/dy/article/LANG9PNT0529CSEE.html"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "孙颖莎 4-1 逆转蒯曼，夺得 WTT 蒙彼利埃站女单冠军", "summary": "WTT 蒙彼利埃站女单决赛，孙颖莎先丢一局后连扳四局，以 4-1 逆转队友蒯曼夺冠。她赛后表示蒯曼近期进步明显、冲击力很强，双方水平接近，胜负关键在于临场调整与关键分把握。同轮尤文 2-0 十人那不勒斯、皇马 3-0 桑坦德竞技均告捷。", "source": "澎湃新闻", "url": "https://m.thepaper.cn/newsDetail_forward_34385067"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "今年流感季提前、多毒株共同活跃，疾控提示尽早接种", "summary": "国家流感中心介绍，自 7 月起我国甲型 H3N2 与乙型 Victoria 系共同流行，呈「多毒株活跃、流行提前」特点。专家提醒儿童、65 岁以上老人、孕产妇及慢性病患者为重症高危人群，持续高烧、胸闷胸痛等须及时就医；整个流感季均可接种，早打优于晚打。", "source": "华声新闻（央视财经）", "url": "https://news.voc.com.cn/news/202611/34138558.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "2026「零碳使命」中国气候行动周在京启幕", "summary": "COP31 召开前夕，由 WWF 北京代表处与凤凰卫视共同主办的 2026「零碳使命」中国气候行动周 10 月 26 日在北京启幕，以「韧链共生·绿色新程」为主题，汇聚主管部门、国际机构与企业代表，持续线上直播至 11 月 1 日。", "source": "中国青年网（央广网）", "url": "https://news.youth.cn/hotnews_41880/202611/t20261102_16944875.htm"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "小鹏 10 月交付首破 5 万台创历史新高，海外交付增 166%", "summary": "10 月车企交付：小鹏 50,237 台（环比 +22%、同比 +20%），首破 5 万创新高，海外 13,326 台同比 +166%；蔚来 34,246 台同比 -15.2%，理想 29,025 台同比 -8.6%。吉利称「金九银十」首现基本消失。", "source": "网易（财经早餐）", "url": "https://www.163.com/dy/article/LAN6PP5B05199O55.html"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "S16 全球总决赛 BLG 搭末班车，LPL 三队晋级八强", "summary": "2026 英雄联盟 S16 瑞士轮收官，BLG 2-0 胜 HLE 晋级，GEN、DK、T1、IG、TES、KC、LYON 入围八强。LPL 的 IG、TES、BLG 三队突围，八强 TES 与 iG 再演「LPL 内战」，11 月 4 日起打四分之一决赛。", "source": "腾讯网（北青先锋电竞）", "url": "https://new.qq.com/rain/a/20261101A03LTC00"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "旅游「双 11」大促开跑，「先囤后约」成错峰消费新引擎", "summary": "今年旅游行业提前卡位「双 11」，飞猪现货开售 4 小时商品销量近 100 万件、超 200 商家成交额翻倍，大牌酒店 5 折起、部分低至 3 折。春秋旅游、广州康辉等推「先囤后约」早鸟权益，覆盖冰雪、避寒、丝路等错峰矩阵，将淡季重新定义为错峰消费窗口。", "source": "广州日报新花城", "url": "https://huacheng.gz-cmc.com/pages/2026/10/21/3d4a0f6a2571481d85cde9421ef8a729.html"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
