月22日发表成果，首次实时记录到“声子”（单个声波量子）在不同能态间的量子跃迁——会如光子般突然消失又重现。该突破有望为量子计算、高灵敏度生物传感器及下一代声学器件开辟新路径。", "source": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/09/260921081054.htm"}, {"id": 8, "category": "体育赛事", "scope": "国内", "title": "亚运会第4比赛日产生33金，中国女排3-0日本夺冠成就十冠王", "summary": "名古屋亚运会9月23日进入第4比赛日，全天产生33枚金牌。前一比赛日中国女排3-0横扫日本队，实现亚运三连冠、队史第十枚亚运金牌；当日中国队在体操男女团体、游泳、射击多点冲金，男足U23迎战阿联酋争出线。", "source": "央视体育/网易", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=16535114362103644022&channelId=1119"}, {"id": 9, "category": "健康养生", "scope": "国内", "title": "国家卫健委、市场监管总局发布50项新食品安全国家标准和修改单", "summary": "国家卫健委、市场监管总局9月22日联合发布50项新食品安全国家标准及修改单，涵盖污染物管控、乳品加工、食品添加剂等领域，其中丙烯酰胺、铅、锡3项污染物控制规范推动重点污染物从末端限量转向源头防控。", "source": "中国新闻网/中国经济网", "url": "https://www.nhc.gov.cn/sps/c100088/202609/4f357dbdd51748fea20ce817d0466c40.shtml"}, {"id": 10, "category": "环境气候", "scope": "国内", "title": "生态环境部发布《全国碳市场发展报告(2026)》，碳市场扩围提速", "summary": "生态环境部9月15日在武汉发布《全国碳市场发展报告（2026）》：截至8月底全国碳市场累计成交9.61亿吨、成交额656.99亿元；2026年四行业纳入重点排放单位3680家、覆盖碳排放约83亿吨，占全国总量65%以上，碳价稳步升至97.90元/吨。", "source": "人民网/央视网", "url": "https://hb.people.com.cn/n2/2026/0915/c406123-41696847.html"}, {"id": 11, "category": "汽车出行", "scope": "国内", "title": "工信部等九部门印发智能网联新能源汽车“十五五”规划", "summary": "工信部等九部门11日公布《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年进入世界汽车强国行列，国内新能源乘用车、商用车新车销量占比分别达70%、40%，具备自动驾驶功能的汽车实现规模应用。", "source": "中国政府网/新华社", "url": "https://www.gov.cn/lianbo/202609/content_7080733.htm"}, {"id": 12, "category": "游戏电竞", "scope": "国内", "title": "亚运会电竞项目9月23日开赛，《永劫无间》等率先登场", "summary": "第20届亚运会电子竞技项目9月23日至10月2日在日本名古屋举行，共11个小项、纳入正式奖牌序列。网易《永劫无间》作为唯一中式竞技题材于23日至24日率先开赛，《第五人格》亚运版定于28日至30日进行，中国队多项目出征。", "source": "环球网", "url": "https://3w.huanqiu.com/a/c36dc8/4THgAOtGUZM?agt=23"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "第48届世界技能大赛在上海开幕，68国1385名选手参赛", "summary": "第48届世界技能大赛9月22日在上海开幕，主题为“技能改变世界、技能照亮前程”，设64个比赛项目，68个国家和地区1385名选手参赛，规模为历届之最；中国代表团71人参加全部项目，大赛将于27日闭幕。", "source": "农民日报/人民网", "url": "https://szb.farmer.com.cn/nmrb/html/2026/20260923/20260923_1/nmrb_20260923_13412_1_2102509418826534923.html"}, {"id": 14, "category": "旅行出行", "scope": "国内", "title": "全国国庆文化和旅游消费月启动，发放3.1亿消费券", "summary": "2026年全国国庆文化和旅游消费月22日在云南弥勒启动，从9月下旬持续至10月底，各地将举办超2万场次文旅活动，发放超3.1亿元消费券等补贴，覆盖景区游览、非遗体验、研学旅游、夜间经济等多元场景。", "source": "光明日报", "url": "https://epaper.gmw.cn/gmrb/html/content/202609/23/content_25859.html"}, {"id": 15, "category": "娱乐影视", "scope": "国内", "title": "中秋国庆档超20部新片集中上映，从“大片通吃”转向分众深耕", "summary": "今年中秋国庆档将有超20部中外新片集中上映，市场从大片通吃转向分众深耕。陈思诚执导、张译领衔的《神探之痕迹》10月1日登场，于谦梁家辉《老江湖》、闫妮叶童《活色生香》及《复仇者联盟4》重映等覆盖各年龄层。", "source": "天津日报/新浪", "url": "https://www.toutiao.com/article/7688223170322645513/"}, {"id": 16, "category": "国际时事", "scope": "国际", "title": "芬兰等20国及欧盟呼吁管控前沿人工智能，确保人类控制", "summary": "芬兰总统斯图布、挪威首相斯特勒共同发起《呼吁管控前沿人工智能模型》倡议，已获德国等20国及欧盟委员会领导人支持，呼吁AI始终处于人类控制下、建立共同标准并探索设立国际核查机构；中美英法等尚未签署。", "source": "环球网/新华社", "url": "https://www.toutiao.com/article/7688278964573323837/"}]}, "yest": {"date": "2026-09-21", "generatedAt": "2026-09-21T12:01:42.453520+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic评估发新模型、IPO延期至11月；特朗普宣布组建“人工智能部队”", "summary": "9月20日消息，Anthropic正评估推出新AI模型以应对OpenAI竞争，同时将IPO从10月推迟至11月以展示更强Q3业绩，估值约2万亿美元。特朗普19日宣布组建“人工智能部队”并拟任命AI事务总管，称AI规模或达美国GDP的25%。", "source": "每日经济新闻 / 央视新闻", "url": "https://www.toutiao.com/article/7687766864390324742/"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "华为联合内蒙古移动完成全国首个露天矿山5G-A千兆上行验证", "summary": "中国移动内蒙古公司联合华为在呼伦贝尔伊敏露天矿完成全国首个5G-A千兆上行网络能力验证，为工业高带宽场景提供新方案。另据披露，OpenAI正洽谈新一轮融资、估值剑指1.2万亿美元；三星向荷兰AI芯片创企Euclyd注资，后者完成2.31亿美元融资挑战英伟达。", "source": "通信世界 / 网易", "url": "https://www.163.com/dy/article/L7B2RDDK051288FS.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "中美经贸团队在纽约启动磋商；胡塞称24小时遭28次空袭", "summary": "当地时间9月20日，中美经贸团队在美国纽约启动经贸磋商。同日新华社报道，也门胡塞武装称过去24小时遭遇28次空袭，波及塔伊兹、马里卜等三省；卡塔尔方面称美方希望与伊朗达成协议以结束冲突，多方正推动恢复谈判。", "source": "新华网", "url": "https://english.news.cn/20260921/94a293281b74413286dd7b37e262922c/c.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美伊紧张升级：伊朗边境部署大规模部队，特朗普称处于“决策阶段”", "summary": "央视报道，伊朗陆军司令20日称已在西北、西、西南等多处边境部署大规模部队保持高度战备。特朗普称胡塞武装同意不与美交战、美军不发动进攻性打击，并称对伊朗问题处于“决策阶段”，未来或现“非常重大的事情”，地区局势持续紧绷。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7687755603816628772/"}, {"id": 5, "category": "战争与自然灾害", "scope": "国际", "title": "莫斯科市和莫斯科州遭无人机袭击，造成2死5伤", "summary": "据综合消息，俄罗斯官员20日称，首都莫斯科市和莫斯科州当天遭无人机袭击，共造成2人死亡、5人受伤。与此同时，乌克兰方面发动的无人机袭击也波及俄多地，地区冲突外溢、平民安全风险上升，引发多方关注。", "source": "安阳县人民政府（早知天下事）", "url": "https://www.ayx.gov.cn/2026/09-21/3660525.html"}, {"id": 6, "category": "科学探索", "scope": "国内", "title": "天关卫星联手“拉索”发现42光年X射线尾迹，破解宇宙线传播谜题", "summary": "中科院高能所与南京大学9月21日宣布，借助天关卫星与“拉索”(LHAASO)联合观测，在距地球约4600光年的脉冲星PSR J1740−1000周围发现长达42光年的X射线尾迹，为目前已知最长，揭示高能粒子可沿固定方向传播数十光年。", "source": "新华社 / 中国科学院高能物理研究所", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_2586ab0a1fa97152"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "我国打通地月第一条激光通信链路，筑牢深空“信息高速公路”", "summary": "《人民日报》报道，我国打通地月第一条激光通信链路，构建深空“信息高速公路”。团队计划年内开展速率升级试验，并攻关白天、复杂气象下的稳定通信；相关高精度跟踪、弱信号探测等技术可延伸至火星、小行星等更遥远深空任务。", "source": "中国科学院 / 人民日报", "url": "https://www.cas.cn/cm/202609/t20260921_5120743.shtml"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "9月LPR维持不变：1年期3.00%、5年期以上3.50%，连续16个月按兵不动", "summary": "中国人民银行9月21日公布9月LPR：1年期维持3.00%、5年期以上维持3.50%，均较上月持平，为连续第16个月按兵不动。分析指在全球央行偏鹰、国内信贷需求偏弱背景下，央行延续“以我为主”的审慎立场，房贷定价锚定不变。", "source": "路透社 / 证券时报", "url": "https://www.aol.com/articles/china-set-keep-loan-rates-063423000.html"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "2026年全国城市联合招聘高校毕业生秋季专场启动，面向2027届", "summary": "2026年全国城市联合招聘高校毕业生秋季专场活动20日启动，重点面向2027届及往届未就业毕业生，陆续推出分领域、分区域专场招聘与就业指导服务。另据披露，今年前8个月社会消费商品和服务零售总额同比增长2.5%。", "source": "自贡网 / 新华社", "url": "https://www.zgm.cn/content/6ab06ef067769"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "中央网信办通报30款App违规收集个人信息，含多款教育类应用", "summary": "中央网信办9月20日通报，依据个人信息保护专项行动，30款App存在收集使用问题：FlowFit等6款未公开规则、iNAPCare等4款强制索权、GPS测亩仪等9款列明不全、红卷乐读等11款无有效注销功能，要求限期整改。", "source": "新浪财经 / 中央网信办", "url": "https://finance.sina.com.cn/tjhz/2026-09-21/doc-inisqeua8888342.shtml"}, {"id": 11, "category": "社会民生与教育", "scope": "国内", "title": "内蒙古举办“人工智能教育”专题培训，推动AI与基础教育融合", "summary": "9月18日至19日，内蒙古在巴彦淖尔举办“人工智能教育”专题培训，邀请北师大、华南师大专家围绕AI赋能教育教学作讲座，推动AI与基础教育全要素融合、全过程贯通，构建人机协同、虚实互促的智慧教育新格局。", "source": "新浪财经 / 内蒙古日报", "url": "https://finance.sina.com.cn/roll/2026-09-21/doc-inisqetz2111639.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "国家卫健委：到2026年底全国省级层面均应开设罕见病门诊", "summary": "国家卫健委、国家中医药局9月20日印发通知，明确到2026年底前，各省（区、市）及新疆兵团均须依托至少1家省属及以上医院开设罕见病门诊，300万人口以上地市也应开设，并推进诊疗体系建设与医疗质量控制中心全覆盖。", "source": "光明日报 / 国家卫健委", "url": "https://epaper.gmw.cn/gmrb/html/content/202609/21/content_25586.html"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "名古屋亚运会首日中国豪取11金，13岁于子迪破赛会纪录夺冠", "summary": "名古屋亚运会开幕后首个比赛日（9月20日），中国代表团豪取11金6银3铜领跑金牌榜。游泳狂揽6金，13岁于子迪以2分05秒08破赛会纪录夺冠，潘展乐卫冕100米自由泳，徐嘉余实现亚运三连冠，并刷新女子10米气步枪团体世界纪录。", "source": "网易 / 新华社", "url": "https://www.163.com/dy/article/L7BBEMAU05567IAV.html"}, {"id": 14, "category": "游戏电竞", "scope": "国内", "title": "iG冒泡赛3:1击败JDG晋级S16，LPL四强全员出征北美", "summary": "9月19日LPL冒泡赛，iG以3:1击败JDG拿下赛区最后一张2026全球总决赛门票，成为首支从涅槃组杀入S赛的队伍；TheShy、Rookie再战世界赛。LPL四强AL、BLG、TES、iG全员从瑞士轮起步，S16将于10月15日在美国洛杉矶打响。", "source": "腾讯新闻 / 央视", "url": "https://new.qq.com/rain/a/20260920A0DH6P00"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "北京“十五五”规划促智能网联汽车数据跨境，工信部将提升汽车标准", "summary": "北京市“十五五”优化营商环境规划提出促进和规范智能网联汽车等重点行业数据跨境流通；工信部将实施汽车标准提升专项行动、建立动力电池数字身份证制度。中汽协数据：1—8月销量前十轿车企业共售401.4万辆，占总量67.9%。", "source": "财联社", "url": "https://www.cls.cn/detail/2488488"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "冷空气叠华西秋雨，北方剧烈降温、重庆湖北四川等地暴雨大暴雨", "summary": "受冷空气与华西秋雨叠加影响，9月21日起北方多地剧烈降温，哈尔滨最高温由27℃降至17℃创立秋后新低；重庆、湖北、湖南、四川等地迎暴雨或大暴雨（100—180毫米），中央气象台发布强对流预警，需防地质灾害与秋收连阴雨。", "source": "深圳新闻网 / 中央气象台", "url": "https://www.toutiao.com/article/7687794804658455063"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "两部门发布全国主要公路气象预报，暴雨区影响中秋国庆假期出行", "summary": "中国气象局与交通运输部9月20日联合发布全国主要公路气象预报：川西高原、重庆、湖北、河南、湖南、四川等地有中到大雨，重庆东部、湖北西南部、四川南部等地暴雨或大暴雨，提醒中秋国庆假期出行群众关注路况、防范山洪与地质灾害。", "source": "文化和旅游部 / 中国气象局", "url": "https://www.mct.gov.cn/ggfw/cxts/glqxyb/202609/t20260921_967214.htm"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "山西临县以文明实践推动教育振兴，本科达线率升至64.45%", "summary": "新华网报道，山西临县东岳山文塔建于清乾隆二年，当地以新时代文明实践活动推动教育振兴、改写数百年文风凋敝局面。2021至2025年临县一中累计510人考入双一流高校，全县高考本科达线率攀升至64.45%，从“重商轻文”转向崇文重教。", "source": "新华网", "url": "https://www.news.cn/government/20260921/4f4bb435cf75475c8102fec70711eb40/c.html"}]}};</script>

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
