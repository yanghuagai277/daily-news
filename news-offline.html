季度财政收入17.23万亿元同比增5.1% 证券交易印花税增65.1%", "summary": "财政部数据显示，今年前三季度全国一般公共预算收入17.23万亿元、同比增5.1%，税收收入14.07万亿元、增6.1%；证券交易印花税2391亿元、大增65.1%。财政支出21.02万亿元、增1%，前三季度专项债发行进度达81%。", "source": "腾讯网（陆家嘴财经早餐）", "url": "https://new.qq.com/rain/a/20261024A033VS00"}, {"id": 8, "category": "战争与自然灾害", "scope": "国内", "title": "西藏那曲巴青县7.0级地震 16人遇难76伤 救助响应升至三级", "summary": "10月22日22时33分西藏那曲巴青县发生7.0级地震、震源深度10公里，截至23日13时致16人遇难、76人受伤。国家防减救灾委、应急管理部将救助响应升至三级，中组部划拨2500万元党费，央行开通国库资金汇划绿色通道支持救灾。", "source": "央视网", "url": "https://tv.cctv.cn/2026/10/24/VIDE68eSK0N7Ln1Cn5yXDXZL261024.shtml"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "超强台风“蔷琵”逼近浙江 国家防总启动防汛防台风四级响应", "summary": "今年第30号台风“蔷琵”（超强台风级）逼近，中央气象台继续发布台风蓝色预警，不排除25日擦过浙江沿海。国家防总、应急管理部针对江苏启动防汛防台风四级响应，浙江将响应提升至三级，温州44架次航班取消、部分列车停运。", "source": "央视网", "url": "https://tv.cctv.com/2026/10/24/VIDE1TZIbAh44r0WRn2V6RHK261024.shtml"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "一批重大工程刷新进度：遥感五十号03星发射、跨海大桥合龙、硬X射线出光", "summary": "10月23日18时15分，我国在太原用长征六号改火箭成功将遥感五十号03星发射升空，用于国土普查与防灾减灾；杭州湾跨海铁路大桥北航道桥合龙，硬X射线自由电子激光装置首次出光，黄茅峡水库进入河道主体施工，多项硬科技迎关键节点。", "source": "央广网（今日头条）", "url": "https://www.toutiao.com/article/7700025428383138304"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "酒泉凌晨成功发射遥感五十三号07-09星等 一箭多星", "summary": "10月24日3时25分，我国在酒泉卫星发射中心用长征四号乙运载火箭，成功将遥感五十三号07-09星、遥感五十六号19-21星发射升空，卫星顺利入轨，主要用于科学试验、国土资源普查、农产品估产和防灾减灾等领域。", "source": "央视网", "url": "https://tv.cctv.cn/2026/10/24/VIDEt8B0kdMLhii3eN5tFXKB261024.shtml"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "全球顶级铁三IP Challenge Shanghai首次落地上海 海湾户外运动季启幕", "summary": "第四届上海湾户外运动季暨海湾红叶嘉年华10月24日至25日举行，全球顶级铁人三项IP“Challenge Shanghai”首次落地上海，汇聚20个国家和地区近1200名选手，在杭州湾北岸游泳、骑行、穿行万亩森林公园；森林半程马拉松11月29日开跑。", "source": "上观新闻", "url": "https://www.shobserver.com/sgh/detail?id=4078626"}, {"id": 13, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16瑞士轮首日 LPL的iG、TES双双告负跌入0-1", "summary": "2026英雄联盟全球总决赛瑞士轮10月24日打响，首日LPL对阵LCK两场焦点战全部失利：iG前期领先却被GEN翻盘，TES被HLE的Zeka洛克“屠杀”24分钟速败。两队落入0-1组，瑞士轮三胜晋级、三负淘汰，仍有调整空间。", "source": "腾讯新闻（雷速体育）", "url": "https://new.qq.com/rain/a/20261024A02BY100"}, {"id": 14, "category": "汽车出行", "scope": "国际", "title": "特斯拉Q3财报：FSD入华审批未落地 中国车企智能化优势凸显", "summary": "特斯拉公布2026财年第三财季财报：营收280.46亿美元、归母净利润7.87亿美元，但FSD全面入华审批仍未落地、未给新时间表。马斯克称正争取更广泛监管批准，中国车企凭借本土路况适配与数据积累已在智驾赛道建立竞争优势。", "source": "网通社汽车", "url": "https://auto.news18a.com/news/storys_307786.html"}, {"id": 15, "category": "健康养生", "scope": "国内", "title": "秋冬季流感疫苗开打 多地纳入职工医保个人账户支付", "summary": "2026秋冬季流感疫苗已可预约接种，通常11月前完成接种可筑牢免疫屏障。新疆等地自9月1日起将流感疫苗费用及注射费纳入职工医保个人账户支付范围，惠及参保人及已参保近亲属，降低接种经济负担。", "source": "阿克陶县人民政府", "url": "https://www.xjakt.gov.cn/xjakt/c104949/202610/b7a00c16b396444793803be5a4c148f6.shtml"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "厄尔尼诺发展年 今年台风编号已达30号 本世纪数量仅次于2013", "summary": "温州气象台指出今年为厄尔尼诺发展年、赤道中东太平洋海温偏高、西北太平洋远洋海温同步走高，为台风生成提供能量；今年台风编号已至30号、本世纪数量仅次于2013年的31个，“蔷琵”成超强台风逼近华东较为罕见。", "source": "温州市人民政府", "url": "https://www.wenzhou.gov.cn/col/col1217832/art_2026/art_030edf80d52b4f158b015b564af630dc.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026武汉书展启幕 熊召政、苏德超携新书首发", "summary": "2026“书香长江”阅读周·武汉书展10月23日启幕，集结15家城市出版社与李敬泽、熊召政、刘醒龙等30余位作家学者。10月24日茅奖得主熊召政携《忽必烈：南征大理国》、武大教授苏德超携哲学新书首发，全城联动惠民。", "source": "凤凰网", "url": "https://news.ifeng.com/c/8xSOsLFEz6y"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "教育部等组织长征胜利90周年思政大课 全国大中小学生同上一堂", "summary": "教育部、中央网信办、人民日报社联合组织的“长征胜利90周年”思政大课10月23日起在人民日报客户端全天滚动播出，面向全国大中小学生，以红色主题教育规模化落地，引导青少年传承长征精神、厚植家国情怀。", "source": "人民日报（微信公众号综合）", "url": "http://mp.weixin.qq.com/s?__biz=MzY5NzE2NDA5OA==&mid=2247484139&idx=1&sn=96b32e762b104295f1036cc6d889ed7e&chksm=f5031727c2f481d1ab7815e5f6ef62f1e9f6015da17a555c4e2b7cd60300f1d5202aa5203ae9#rd"}]}, "yest": {"date": "2026-10-23", "generatedAt": "2026-10-23T07:41:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "第23届中国计算机大会在成都开幕 算力成底座、AI进实验室", "summary": "10月22日，第23届中国计算机大会在成都开幕，注册人数超1.1万，创二十余年首次落地四川。会场高频词为数据、算力、实验室；中科曙光“登峰”全国产十万卡AI超集群已支撑300多个重点科学工程仿真与万卡级模型预训练，科学智能成为热议焦点。", "source": "央视网", "url": "https://news.cctv.com/2026/10/23/ARTI0ONz97ca0R8q3pFBYtxs261023.shtml"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "中科曙光发布OneScience科学大模型平台 百亿参数基因组模型Genos问世", "summary": "10月23日中国计算机大会上，中科曙光发布国内首个“科学大模型一站式开发平台”OneScience，定位科研模型研发-训练-评测-部署一体化。同期发布全球首个百亿参数可部署“基因组通用基础模型”Genos，参数约100亿，支持百万碱基对超长上下文与单碱基分辨率识别。", "source": "AI工具导航", "url": "https://toolnavs.com/zh/article/545-2-4-xiao-shi-ai-xin-wen-zhong-ke-shu-guang-onescience-genos-fa-bu-ao-zhou-qi-don"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic发布个人智能体Claude Duet 由Opus 5.5驱动、继承记忆与6000+连接器", "summary": "Anthropic发布个人智能体Claude Duet，由Claude Opus 5.5驱动，可调用超6000个连接器与插件，并直接继承原账户的记忆、Skills与应用连接；提供独立iOS、Android与网页端，配独立云端虚拟机后台执行任务，首批面向美国Pro和Max用户开放候补。", "source": "腾讯研究院（搜狐）", "url": "https://www.sohu.com/a/1091363921_455313"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "俄美乌三方代表团在阿布扎比开始谈判 泽连斯基称重点在结束冲突具体条件", "summary": "当地时间23日，俄罗斯、美国、乌克兰三方代表团在阿联酋阿布扎比开始闭门谈判。泽连斯基当晚表示，此次三方会谈十分重要，当前谈判重点在于结束冲突的具体条件，乌方已为代表团确定对话框架，次日军方高层将加入谈判。", "source": "环球网", "url": "https://www.huanqiu.com/article/4Q599AIqIdL"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "法国卢浮宫等多个博物馆因示威闭馆 伊朗称已做好非对称战争准备", "summary": "法国政府22日宣布，因巴黎24日举行示威，卢浮宫、奥赛、毕加索博物馆当日闭馆，巴黎部分区域宵禁延长至25日晨。同日伊朗军方称在装备上已做好应对非对称战争的准备，议会议长警告若与伊开战美国将承担“苦涩后果”。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7699617138868273690/"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "匈牙利总理欧尔班批评欧盟“将西方拖入无望战争”", "summary": "当地时间10月23日，匈牙利总理欧尔班在一场演讲中批评欧盟在俄乌冲突升级中的角色，称布鲁塞尔正将西方拖入一场毫无希望取胜的战争，欧洲经济“正在陷入战争”，并警告“现在的局势比过去70年中的任何时候都更接近世界大战”。", "source": "环球网", "url": "https://www.huanqiu.com/article/4JxoltT0fBE"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "美国上周首申失业金降至19.4万创三个月新低 韩国央行按兵不动", "summary": "截至10月17日当周，美国初请失业救济人数减少6000人至19.4万，低于预期的20万，四周移动均值降至19.775万、为2022年以来最低。韩国央行在连续两次加息后维持基准利率3.00%不变，并上调经济增长预测。", "source": "华尔街见闻（腾讯新闻）", "url": "https://news.qq.com/rain/a/20261023A02KPS00"}, {"id": 8, "category": "财经经济与就业", "scope": "国际", "title": "OpenAI拟以1.25万亿美元估值完成300亿美元融资 阿联酋领投", "summary": "据市场消息，OpenAI拟以约1.25万亿美元估值完成300亿美元的新一轮融资，由阿联酋投资者领投；与此同时AI资本开支回报疑虑升温，叠加美以与伊朗冲突推高油价，10月22日纳指创6月以来最大单日跌幅、费城半导体指数跌6.72%。", "source": "华尔街见闻（今日头条）", "url": "https://www.toutiao.com/article/7699632006384976399/"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "西藏那曲巴青县7.0级地震已致16人遇难46人伤 启动救助三级响应", "summary": "10月22日22时33分，西藏那曲市巴青县发生7.0级地震，震源深度10公里。截至23日5时20分已造成16人遇难、46人受伤（重伤11人），房屋倒塌及受损339户；西藏启动自然灾害救助三级应急响应，救灾物资已运抵灾区。", "source": "光明网", "url": "https://m.gmw.cn/2026-10/23/content_1304578351.htm"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞武装称对沙特发动多轮袭击 目标含国防部与阿美原油设施 布油突破112美元", "summary": "据多家媒体报道，胡塞武装称对沙特发动多轮袭击，目标包括沙特国防部、沙特阿美原油设施等；美以被曝已制定中期选举后再次打击伊朗的计划，美军正“悄悄”收缩中东驻军规模，地缘紧张推升布伦特原油突破112美元。", "source": "华尔街见闻（网易）", "url": "https://www.163.com/dy/article/L9TI2HPN05198NMR.html"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "神舟二十三号载人飞行任务发布会：乘组将开展100余项科学实验 首次在轨培养两代水稻", "summary": "23日神舟二十三号载人飞行任务新闻发布会介绍，乘组将新开展100余项科学与应用项目，上行9项科学实验、样品及装置总重54.1公斤；将首次在空间站开展钙钛矿电池动态服役实验，并首次在轨培养连续两代水稻以解析长期微重力影响。", "source": "环球时报（凤凰网）", "url": "https://h5.ifeng.com/c/vivo/v002pg--XVE9N4oA1xQnTIb--zsx-_VFvYitKFn4S5VIytwwUs__?isNews=1&showComments=0"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "乒乓球亚锦赛国乒男团3-0横扫韩国 实现4连冠、第26次登顶", "summary": "北京时间23日凌晨，亚洲乒乓球锦标赛男团决赛中国队直落三盘战胜韩国队，连续第4次、历史第26次夺冠。周启豪3-1力克姜东秀，林诗栋3-0击败朴奎炫，向鹏3-1力克朴康贤，在缺少王楚钦的情况下由新阵容完成卫冕。", "source": "新浪新闻", "url": "https://news.sina.com.cn/zx/2026-10-23/doc-iniwcnuz5164915.shtml"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "雄安“双向奔赴山海行”全国班级手拉手 8所新建校对接30省153个班级", "summary": "雄安新区新建校园陆续迎来青海、云南、西藏等地“小客人”，通过“云端”与线下联动开展手拉手共建。目前“双向奔赴山海行”全国班级（中队）手拉手项目已为雄安8所新建中小学、幼儿园对接全国30个省区市的153个班级、8482名学生。", "source": "央视网", "url": "https://news.cctv.com/2026/10/23/ARTI9YV9oqt8YKOSgn2G7WGr261023.shtml"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "霜降将至 国家中医药管理局分享老年人秋季调护方法", "summary": "霜降节气将至，国家中医药管理局举行发布会分享中医调护：皮肤干痒应养血润肤、洗澡每周2至3次；睡不安可睡前泡脚、按揉神门穴与安眠穴；腰腿痛可热敷膝盖腰部15分钟，并多吃黑豆、核桃、山药、枸杞等补肾强腰食物。", "source": "央视网", "url": "https://news.cctv.com/2026/10/23/ARTI6V80MdnYMmgj8V9w3yqn261023.shtml"}, {"id": 15, "category": "健康养生", "scope": "国际", "title": "世卫组织：刚果（金）埃博拉疫情反弹 累计确诊9637例、死亡4646例", "summary": "世界卫生组织非洲区域办事处10月21日疫情报告显示，刚果（金）本轮埃博拉疫情出现反弹，近期新增确诊数再次上升，截至10月19日累计报告确诊病例9637例、死亡4646例，疫情已波及全国26个省中的8个省并向邻国蔓延。", "source": "健康报（腾讯新闻）", "url": "https://news.qq.com/rain/a/20261023A02C2O00"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "我国电动汽车充电基础设施总数达2477.7万个 特斯拉Optimus进入量产爬坡", "summary": "国家能源局数据显示，截至2026年9月底我国电动汽车充电基础设施（枪）总数达2477.7万个，同比增长37.2%，其中私人充电设施1957万个、同比增44%。特斯拉在三季度财报中确认Optimus人形机器人已开始在弗里蒙特工厂量产爬坡。", "source": "每日经济新闻（今日头条）", "url": "https://www.toutiao.com/article/7699631308854526492/"}, {"id": 17, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛瑞士轮开打 LPL四队出战、T1争四连冠", "summary": "2026英雄联盟全球总决赛瑞士轮于10月23日（北美时间）在美国得州阿伦开打，16支队伍角逐八强，采用“三胜晋级、三负淘汰”；LPL四队IG、TES、BLG、AL全员直通，T1作为LCK三号种子首战巴西LOS，冲击史无前例的四连冠。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261023A021SG00"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "2026武汉书展暨第21届华中图书交易会10月23日开幕 发放200万惠民券", "summary": "10月23日至25日，2026“书香长江”阅读周·武汉书展暨第21届华中图书交易会在湖北出版文化城举办，集结近600家出版文创机构、展出近6万种图书与文创，发放200万元文化惠民补贴，图书叠加券后最低可享3折，并首设“书友之夜”夜场。", "source": "央广网", "url": "https://www.cnr.cn/hubei/yw/20261015/t20261015_527842911.shtml"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
