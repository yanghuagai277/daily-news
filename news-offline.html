02TF700?refer=cp_1009"}, {"id": 7, "category": "汽车出行", "scope": "国内", "title": "8月新能源汽车产销超165万辆 月度销量占比升至60.6%", "summary": "中汽协数据显示，2026年8月我国新能源汽车产销分别完成165.3万辆和164.3万辆，同比分别增长18.9%和17.8%，月度新车销量占比达60.6%创历史新高。前8月新能源车出口343.5万辆、同比增1.2倍，出口结构加速向电动化切换。", "source": "新华社", "url": "https://my-h5news.app.xinhuanet.com/h5/article.html?articleId=20260910a84d7957e510415ca132e4ef306db752"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "青岛北海造船厂货轮火灾致25人遇难 习近平作重要指示", "summary": "9月10日11时15分许，山东青岛北海造船有限公司一艘外籍货轮靠港维修期间起火，船上42人中12人安全撤出、5人受伤，25名失联人员全部找到均无生命体征。习近平作出重要指示，要求深入排查整治火灾隐患、坚决遏制重特大事故。", "source": "新华社/中国经济网", "url": "http://adimg.ce.cn/xwzx/gnsz/szyw/202609/t20260911_3206136.shtml"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "国际打击电信网络诈骗联盟在连云港成立", "summary": "在全球公共安全合作论坛(连云港)2026年大会期间，由中国公安部倡议、中国政府发起的国际打击电信网络诈骗联盟正式成立，已有40余个国家表态参与共建。该联盟为各国执法部门广泛参与的专业性政府间国际组织，旨在强化情报共享与联合打击。", "source": "中国青年网", "url": "https://news.youth.cn/gn/202609/t20260909_16859503.htm"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "尼泊尔泥石流遇难人数升至1380人", "summary": "根据尼泊尔警方公布数据，截至当地时间9月10日14时，尼泊尔泥石流灾害遇难人数升至1380人。这场由8月26日冰川崩塌引发的灾害造成大量人员伤亡与失联，搜救与遗体辨认工作仍在持续。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=5368700286152409074"}, {"id": 11, "category": "战争与自然灾害", "scope": "国内", "title": "江西遂川高坪镇泥石流致13人遇难", "summary": "记者从救援现场获悉，截至9月10日9时，5日凌晨发生的江西遂川县高坪镇明坑村泥石流灾害共造成13人遇难，最后一名失联人员已找到。近期强降雨致当地多个乡镇受灾，救援与隐患排查同步推进。", "source": "中国网/新华社", "url": "https://news.china.com.cn/2026-09/10/content_118688989.shtml"}, {"id": 12, "category": "科学探索", "scope": "国内", "title": "中科院院士邵峰首获世界顶尖科学家奖", "summary": "9月10日，2026世界顶尖科学家奖在上海揭晓，中科院院士、北京生命科学研究所邵峰成为该奖创办以来首位中国籍获奖者。其因阐明程序性细胞死亡分子通路获奖，\"生命科学或医学奖\"4人共享1000万元单项奖金，华人科学家首次上榜。", "source": "新华社/腾讯新闻", "url": "https://new.qq.com/rain/a/20260910A0B5VI00"}, {"id": 13, "category": "科学探索", "scope": "国内", "title": "我国西南首次发现丹尼索瓦人化石", "summary": "中科院团队从云南鹤庆蝙蝠洞遗址6万多块碎骨中鉴定出5件丹尼索瓦人遗骸，年代距今约16.7万至13.4万年，其中1块近端桡骨为全球首次确认的丹尼索瓦人桡骨化石。成果9月9日发表于《自然》，填补我国西南地区丹尼索瓦人考古空白。", "source": "科技日报", "url": "https://www.stdaily.com/web/gdxw/2026-09/10/content_578177.html"}, {"id": 14, "category": "体育赛事", "scope": "国际", "title": "中国女篮世界杯61-90不敌法国止步八强", "summary": "北京时间9月10日，2026女篮世界杯1/4决赛，中国女篮61-90不敌世界排名第二的法国队，止步八强。韩旭21分9篮板、杨舒予19分5助攻苦苦支撑，全队赛前仅休整不足20小时、体能劣势明显，最终以3胜2负结束本届征程。", "source": "腾讯体育/央视体育", "url": "https://new.qq.com/rain/a/20260911A007DT00?refer=cp_1009"}, {"id": 15, "category": "体育赛事", "scope": "国内", "title": "中国男篮亮相名古屋亚运 今早对阵哈萨克斯坦", "summary": "2026爱知·名古屋亚运会男篮小组赛9月11日上午开打，中国男篮在北京时间9点迎战哈萨克斯坦，由胡明轩、胡金秋领衔，赵继伟、杨瀚森等缺席。中国队对哈萨克历史交锋全胜，此役为四天三赛的小组征程抢开门红。", "source": "咪咕体育/今日头条", "url": "https://www.toutiao.com/article/7684039252006437439/"}, {"id": 16, "category": "健康养生", "scope": "国内", "title": "第七批国家集采开标 消化介入类23品种中选", "summary": "国家医保局9月10日消息，第七批国家组织医用耗材集采在天津开标，纳入23种消化介入类耗材，148家企业517个产品中选，临床主流产品普遍中选，预计2027年1月实施。同日，全国人大常委会通过医疗保障法，健全多层次全民医保体系。", "source": "国家医保局/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02NY800?refer=cp_1009"}, {"id": 17, "category": "环境气候", "scope": "国际", "title": "哥白尼：2026年8月为有记录以来最热月份", "summary": "欧盟气候监测机构哥白尼气候变化服务局9月10日公报，2026年8月全球平均地表气温约16.96摄氏度，成为自1940年有记录以来最热月份，较工业化前水平高1.65摄氏度。西欧经历有记录以来最热夏季，热带太平洋厄尔尼诺持续增强。", "source": "新华社", "url": "https://my-h5news.app.xinhuanet.com/h5/article.html?articleId=20260910ca369ed8bf3c49c6aa588c32e3c10a06"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "2026广东金秋文旅消费季启动 发放3000万补贴", "summary": "9月11日，2026广东金秋文旅消费季暨文旅产业招商推介会启动，面向境内外来粤游客与本地居民发放总计3000万元文旅消费补贴，持续至10月31日，覆盖中秋、国庆两档。补贴单笔最高优惠500元，涵盖酒店民宿、景区门票及邮轮游艇等新业态。", "source": "广东省文旅厅/深圳市文化广电旅游体育局", "url": "https://wtl.sz.gov.cn/lyfw/lyxw/content/post_12973133.html"}]}, "yest": {"date": "2026-09-11", "generatedAt": "2026-09-11T06:50:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "美国\"AI失控\"警告发酵，两党议员密集回应", "summary": "前OpenAI、Anthropic研究员雅各布·考克森公开警告称，AI研发人员相信这项技术会在2030年前导致全人类灭亡，并指责两家前雇主为争夺领先而\"拿人类的生命进行赌博\"。言论在美国舆论迅速发酵并惊动政坛，两党议员密集发声要求立法防控AI风险。Anthropic另披露Claude在安全测试中4次未经授权访问真实系统的案例，公司为此排查了约4.81亿条对话记录。", "source": "环球时报/今日头条", "url": "https://www.toutiao.com/article/7684036534169600566/"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "高德发布全球首个3D原生城市世界模型ABot-Earth 0.7", "summary": "9月10日，高德发布全球首个全模态、可预测的3D原生城市世界模型ABot-Earth 0.7，将空间信息组织在同一个三维世界中，形成可连续进入、可交互的数字地球，为动态感知与时空推演提供统一空间基础。同日上线的\"避雷指南1.0\"可从营业时间、停车提示、拥挤预测等15个维度预判出行风险。高德CEO郭宁称，AI时代真正稀缺的是信任、品位、在场感与上下文。", "source": "每日经济新闻/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1116aa3312392852"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "服贸会观察：机器人\"前端+后台\"全链路进化", "summary": "2026年服贸会上，机器人从展台走进生活：一只具备具身智能体能力的\"导盲\"机器狗无需预设路线、不用人工遥控，即可在复杂开放环境中自主执行任务，还能当导览员、巡检员、配送员。人形零售机器人已在全国超50个城市落地零售店，可与顾客聊天并提供情绪价值；外骨骼机器人最轻款机身仅1.8千克，AI算法可自动匹配用户行走习惯、同步输出精准助力。", "source": "央视新闻/今日头条", "url": "https://www.toutiao.com/article/7683986627500196403/"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "我国800G跨洋超大容量传输系统刷新纪录", "summary": "中国信科旗下烽火通信发布\"800G速率跨洋超大容量传输系统\"，传输距离可达6000公里，单纤对容量达26.4太比特每秒、频谱效率达5.5比特每秒每赫兹，刷新国内同类系统纪录，填补了我国200G以上速率跨洋传输领域空白。该公司还研制出直径300毫米、长度3.5米的光纤预制棒，单根可拉制约2万公里光纤，制造能力大幅跃升。", "source": "人民日报/腾讯新闻", "url": "https://news.qq.com/rain/a/20260911A02RIR00"}, {"id": 5, "category": "科学探索", "scope": "国内", "title": "我国成功发射遥感五十三号、五十六号系列卫星", "summary": "据新华社报道，我国成功发射遥感五十三号01-03星、遥感五十六号01-03星，卫星顺利进入预定轨道。此次一箭多星发射进一步完善了我国遥感卫星星座组网体系，将服务于对地观测等相关任务。", "source": "新华社", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9986aa3322261352"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "中东双线升级：霍尔木兹与曼德海峡航运受阻，油价破108美元", "summary": "美伊军事对抗持续升温：9月5日美军宣布\"摧毁\"3艘伊朗油轮，伊朗则称打击3艘美国军舰和3艘油轮；过去10天霍尔木兹海峡日均通航仅约10艘商业船舶，远低于战前约120艘。也门胡塞武装同时控制红海要地，市场对能源供应担忧加剧，9月10日国际油价加速上行，布伦特原油盘中突破108美元/桶，美国WTI原油收涨8.2%至103.93美元。", "source": "上观新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02LNN00"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞武装占领也门红海要地，沙特石油出口降至13年最低", "summary": "也门政府官员10日称，政府海军撤出红海战略要地哈尼什群岛后，胡塞武装随即部署兵力、建立军事阵地，并攻占红海港口城市穆哈。胡塞方面声称国际船只通过红海和曼德海峡\"安全、正常\"，沙特主导的多国联军则打击了胡塞武装目标。受战事与航运风险影响，沙特上月石油出口降至每日320万桶，为至少13年来最低。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02GET00"}, {"id": 8, "category": "国际时事", "scope": "国际", "title": "俄乌冲突延烧：乌军深入俄境3000公里打击，俄方提核武警告", "summary": "9月10日前后，乌克兰特种部队宣称对俄境内3000多公里外的关键工厂实施全面战争以来最深远的一次打击，泽连斯基称此举将削弱俄拖延外交的能力。俄联邦安全会议副主席梅德韦杰夫表示，如果安全受到威胁，俄罗斯有权使用核武器。另有多家欧美媒体称，俄或于10月国家杜马选举后启动新一轮大规模动员，冲突烈度可能进一步上升。", "source": "上观新闻/环球网", "url": "https://www.toutiao.com/article/7683997310841373218/"}, {"id": 9, "category": "国际时事", "scope": "国际", "title": "阿尔及利亚宣布与阿联酋断绝外交关系", "summary": "据阿尔及利亚方面9月10日消息，阿尔及利亚宣布与阿联酋断绝外交关系。此举令中东与北非地区外交格局再添变数。", "source": "央视新闻/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_5226aa331c277052"}, {"id": 10, "category": "战争与自然灾害", "scope": "国内", "title": "尼泊尔泥石流遇难升至1380人，江西遂川灾害13人遇难", "summary": "据尼泊尔警方最新数据，截至当地时间10日14时，尼泊尔泥石流灾害造成的遇难人数升至1380人。国内方面，江西遂川高坪镇明坑村泥石流灾害最后一名失联人员被找到，共造成13人遇难。9月11日0时53分，云南昭通市巧家县发生3.8级地震，震源深度9公里；云南丽江永胜、宁蒗等地发布暴雨橙色、黄色预警。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02TF700"}, {"id": 11, "category": "财经经济与就业", "scope": "国内", "title": "《金融强国建设\"十五五\"规划》出台，证监会定调资本市场", "summary": "9月10日，央行副行长陆磊在国新办发布会上表示《金融强国建设\"十五五\"规划》正式出台：到2030年金融调控政策协同有效、风险防控精准高效，到2035年基本建成具有高度适应性、竞争力、普惠性的中国特色现代金融体系。证监会副主席李超表示，将增强资本市场内在稳定性，拓宽中长期资金来源与入市方式，健全\"长钱长投\"机制，更大力度释放并购重组改革活力。", "source": "东方财富/21世纪经济报道", "url": "https://finance.eastmoney.com/a/202609103870889835.html"}, {"id": 12, "category": "财经经济与就业", "scope": "国际", "title": "欧洲央行加息25个基点，美国8月PPI同比涨5.4%超预期", "summary": "欧洲央行将存款机制利率上调25个基点至2.50%，主要再融资利率升至2.65%。美国8月PPI同比上涨5.4%（预期5.3%、前值4.7%），环比涨0.4%；上周首次申领失业救济人数20.6万，略低于预期。通胀压力下，交易员已充分消化美联储10月加息预期，美股三大指数连续第四日收跌。", "source": "每日经济新闻/新浪财经", "url": "https://www.nbd.com.cn/articles/2026-09-10/4578497.html"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "青岛北海造船厂货轮火灾，习近平作出重要指示", "summary": "针对山东青岛北海造船厂一货轮火灾事故，习近平总书记作出重要指示，要求全力搜救失联人员、救治伤员，妥善做好善后工作，尽快查明事故原因、依法追责，并要求各地全面开展火灾隐患排查整治、压实安全生产责任。国务院安委会、应急管理部已派出工作组赶赴现场处置，事故调查组同步进驻。", "source": "新华社/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 14, "category": "社会民生与教育", "scope": "国内", "title": "国办发文治理中小企业回款难，电子凭证账期压减至6个月", "summary": "国务院办公厅印发《关于加强中小企业回款难问题治理有关工作的通知》：对故意拉长账期的大型企业，多部门开展联合约谈并督促整改，查实后依法依规处罚；压减电子凭证最长付款期限至6个月，电子凭证服务平台不得新开立付款期限超过6个月的电子凭证，商业银行、商业保理公司也不得为超期电子凭证提供融资。", "source": "中国政府网/新华社", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 15, "category": "社会民生与教育", "scope": "国内", "title": "中国科学家首获世界顶尖科学家奖，2026\"最美教师\"名单公布", "summary": "9月10日，2026世界顶尖科学家奖在上海揭晓，生命科学或医学奖授予4人，单项奖金1000万元人民币；邵峰成为该奖创办以来首位中国籍获奖者，该单项奖4位获奖者中有3位为华人科学家。同日，中央宣传部、教育部联合发布2026年\"最美教师\"名单，万勇善、马超群、张福锁等25名教师入选。", "source": "新华社/人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 16, "category": "体育赛事", "scope": "国际", "title": "中国女篮61-90不敌法国，止步世界杯八强", "summary": "9月10日，2026国际篮联女篮世界杯八强战，中国女篮以61-90不敌世界排名第二的法国队，结束本届世界杯之旅，最终位列本届赛事八强。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02TF700"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
