ry": "游戏电竞", "scope": "国内", "title": "亚运电竞王者荣耀9月27日开赛 中国卫冕首战老挝", "summary": "第20届亚运会电竞项目9月27日正式开赛，王者荣耀亚运版本与和平精英亚运版本两天内决出金牌。中国队作为卫冕冠军，王者荣耀首战对阵老挝队，决赛采用BO7赛制，央视及多个平台全程直播。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-21/detail-inisppwf1016188.d.html"}, {"id": 13, "category": "旅行出行", "scope": "国内", "title": "中秋出行高位运行 26日跨区域流动超2.1亿人次", "summary": "中秋假期第二天（26日）出行客流保持高位，交通运输部数据显示全社会跨区域人员流动量预计超2.1亿人次。两岸“小三通”航线增开20个航班，预计出入境旅客超2.4万人次，日均客流较9月中上旬增长约34%。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34158631"}, {"id": 14, "category": "文化影视", "scope": "国内", "title": "2026中秋档电影票房破2亿 超20部新片集中上映", "summary": "据灯塔专业版，截至9月26日17时44分，2026年中秋档（9月25日—27日）电影总票房突破2亿元，总出票518.89万张。《复仇者联盟4》加码臻享版以约6607万元领跑，超20部中外新片涵盖悬疑、喜剧、动画等类型。", "source": "新浪娱乐", "url": "https://ent.sina.cn/2026-09-27/detail-initfanv5111771.d.html"}, {"id": 15, "category": "汽车出行", "scope": "国际", "title": "大众全球召回约286万辆汽车 转向螺栓存腐蚀隐患", "summary": "德国大众汽车集团9月25日证实，因转向系统固定螺栓可能因腐蚀断裂、极端情况或致转向失灵，将在全球召回约286万辆汽车，其中德国约96万辆，涉及途观、途安、高尔夫及奥迪Q3等车型，目前属预防性召回、尚无事故报告。", "source": "新浪汽车", "url": "https://auto.sina.cn/2026-09-27/detail-initerwz5322358.d.html"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "著名音乐家刘欢病逝享年63岁 从教三十余载", "summary": "对外经济贸易大学9月26日发布讣告：该校退休教师、著名音乐家刘欢于9月25日上午9时52分在上海病逝，享年63岁。刘欢从教三十余载，代表作有《好汉歌》《我和你》等，曾在北京奥运开幕式献唱，丧事从简不举行告别仪式。", "source": "中国新闻网", "url": "https://m.chinanews.com/wap/detail/chs/zw/10704043.shtml"}, {"id": 17, "category": "战争与自然灾害", "scope": "国际", "title": "俄军连续第三夜袭基辅 打击乌“星链”数据中心", "summary": "俄军25日晚至26日凌晨动用“缟玛瑙”“锆石”等高超音速导弹，命中基辅一处为乌军提供星链运行支持的数据处理中心，并连续第三夜袭击基辅，造成1人受伤及多处起火。俄方意在削弱乌军信息化作战体系，标志打法转向体系破击。", "source": "网易", "url": "https://www.163.com/dy/article/L7QJ91NA05566Z4A.html"}]}};</script>

    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
