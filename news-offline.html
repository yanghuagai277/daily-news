ent_118762934.shtml"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "中超收官日：成都蓉城打平即夺队史首冠，大连英博争逆转", "summary": "2026赛季中超11月8日15:30八场同开迎来收官。成都蓉城52分领跑、打平即可夺队史首冠；大连英博49分需在客场胜天津且蓉城输球才能逆转。奥斯卡、卡迪斯同以21球领跑金靴榜，青岛海牛、武汉三镇已降级。", "source": "天津日报 / 新浪体育", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-11/08/content_143084_3994199.htm"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "立冬养生提醒：专家提示过度进补、久坐不动等误区", "summary": "江西11月6日举行立冬专场健康发布会，专家提醒冬季养生常见误区为“过度进补、过度保暖、久坐不动”，宜早睡晚起、颈部背部足部保暖、饮食清补温润。慢病患者须规律用药、监测指标，面瘫发病72小时内应尽早就诊。", "source": "央广网", "url": "https://www.sohu.com/a/1098376985_362042"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "寒潮大风蓝色预警：15省份部分地区降温超10℃", "summary": "中央气象台8日6时继续发布寒潮与大风蓝色预警，预计8日至10日华北大部、西南地区东部和南部等地降温6—10℃，四川西部、贵州西部等15省份部分地区降温10—12℃、局地超14℃。北京、河北北部等地有大到暴雪。", "source": "川观新闻", "url": "https://www.toutiao.com/article/7705584023024550436/"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "Momenta获日产全球创新奖，高阶智驾加速普惠落地", "summary": "11月6日Momenta荣获日产2026年度全球创新奖。双方已在N7、N6、NX8等多款车型合作辅助驾驶，近90%的NX8车主选择搭载Momenta强化学习大模型的MAX及以上版本，超50%车主每天使用辅助驾驶。", "source": "腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6536aeec94097852"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026 CRL皇室战争全球总决赛上海收官，中国选手止步", "summary": "2026皇室战争职业联赛（CRL）全球总决赛11月8日在上海黄浦里滩文化中心收官，系时隔多年重回中国大陆并首次落地中国。中国选手飞行雪绒、Midnight双败淘汰赛拼至最后一刻遗憾止步，加冕时刻于当日决出。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261107A0E2ZN00"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "北京11月逛展攻略：景泰蓝宫廷艺术特展、龟兹文化艺术展上新", "summary": "北京11月多家博物馆推出重磅展览：恭王府“御器凝辉”景泰蓝宫廷艺术特展展出近58件复刻与大师作品；中国工艺美术馆“龟兹文化艺术展”呈现丝路文明；国博“大河之东”展运城200余件出土文物，溯源中华文明肇兴。", "source": "今日头条", "url": "https://www.toutiao.com/article/7703858336961233448"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "成都上榜《国家地理》2027全球最佳旅行目的地，为中国唯一入选城市", "summary": "美国《国家地理》发布“2027年全球最佳旅行目的地”榜单，从六大洲甄选25个目的地，成都成为唯一上榜中国城市。推荐理由聚焦三星堆、金沙等3000年古蜀文明与昼夜不息的烟火生活，恰逢2027年三星堆发现百年。", "source": "成都日报 / 腾讯新闻", "url": "https://kuaibao.qq.com/s/20261105A0DMHA00?refer=cp_1009"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "四川中小学教辅材料进校园划出十五条红线，12月5日起施行", "summary": "四川省教育厅等三部门11月5日印发《中小学教辅材料进校园管理实施细则（试行）》，明确教辅须进评议目录、执行“一科一辅”、自愿购买且学校代购不得牟利，并列出15条严禁事项（含不得向小学一二年级推荐、不得入校推销），12月5日起施行。", "source": "央广网 / 四川日报", "url": "https://www.cnr.cn/scfw/scpd/yw201/20261108/t20261108_527865859.shtml"}]}};</script>

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
