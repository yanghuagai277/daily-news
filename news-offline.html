:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}

.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}

<script>window.__DATA__ = {"today": {"date": "2026-11-17", "generatedAt": "2026-11-17T09:46:21+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "阿里发布新一代基座大模型Qwen4-Max，单任务平均费用降约六成", "summary": "11月16日，阿里巴巴发布新一代基座大模型Qwen4-Max，总参数2.4万亿，具备原生视觉能力并支持百万上下文，采用基于Qwen稀疏注意力的全新MoE架构。该模型已在千问AI平台开放API，缓存命中每百万Tokens低至0.5元，完成单任务的平均费用较上代大降约六成，中小尺寸模型将陆续开源。", "source": "每日经济新闻", "url": "https://www.163.com/dy/article/LBTSLB6Q0512B07B.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "AMD完成收购World Labs，李飞飞出任执行副总裁兼首席科学家", "summary": "11月16日，AMD宣布完成对AI研究公司World Labs的收购，以增强其在AI模型领域的研发能力。World Labs专注于可创建和模拟交互式3D环境的AI模型及机器人学习仿真技术。创始人李飞飞加入AMD出任执行副总裁兼首席科学家，直接向董事长兼首席执行官苏姿丰汇报。", "source": "界面新闻", "url": "https://www.163.com/dy/article/LBU3EL6D0534A4SC.html"}, {"id": 3, "category": "国际时事", "scope": "国内", "title": "中俄美三国元首将在深圳举行历史上首次面对面会晤", "summary": "外交部发言人毛宁11月16日宣布，中俄美三国元首将在深圳举行历史上首次面对面会晤，围绕维护世界和平、促进大国关系战略稳定深入交换意见，具有开创性意义。毛宁表示，三国均为联合国创始会员国和安理会常任理事国，历史上曾并肩赢得世界反法西斯战争胜利，加强沟通、管控分歧符合三国利益和国际社会期待。", "source": "外交部/腾讯新闻", "url": "https://news.qq.com/rain/a/20261117A02Q4400"}, {"id": 4, "category": "国际时事", "scope": "国内", "title": "2026年APEC工商领导人峰会在深圳开幕，习近平出席开幕式", "summary": "2026年APEC工商领导人峰会11月17日至18日在深圳前海国际会议中心举行，主题为“共促繁荣，共赢未来”，习近平主席出席开幕式并发表主旨演讲。据中国贸促会介绍，2000余位政商领袖参会，涵盖21个APEC经济体及115家世界500强企业，峰会将发布《2026年APEC工商领导人峰会深圳倡议》。", "source": "央广网", "url": "https://www.cnr.cn/jingji/ycbd/20261117/t20261117_527875333.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "10月经济运行总体平稳：工业增4.8%，城镇调查失业率降至5.1%", "summary": "国家统计局在11月16日国新办发布会上介绍，10月份我国经济延续总体平稳、向新向优态势：规模以上工业增加值同比增长4.8%，服务业生产指数增长4.6%，全国城镇调查失业率5.1%、连续两个月下降。前10月服务零售额增长4.9%，10月进出口总额同比增长31.2%，CPI同比上涨0.7%。", "source": "人民日报", "url": "https://finance.sina.com.cn/jjxw/2026-11-17/doc-iniyyrkt2424637.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美联储主席沃什：正为AI三种影响制定预案，市场押注12月加息", "summary": "北京时间11月17日凌晨，美联储主席沃什在旧金山生产率与就业会议致辞，称已就AI对经济的潜在影响制定应急预案，涵盖生产力繁荣、大规模失业、技术泡沫破裂三种路径，并警示AI预期回报下降或引发股市走弱与失业上升。此前美国10月CPI超预期，利率期货市场已完全押注12月加息25个基点。", "source": "华尔街见闻", "url": "https://www.163.com/dy/article/LBTU4P2R05198NMR.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国中小学、幼儿园将聘任健康副校（园）长", "summary": "国家卫生健康委会同教育部、国家中医药局、国家疾控局11月16日印发通知，要求中小学校、幼儿园聘任健康副校（园）长，由医疗卫生机构选派中级及以上职称专业人员担任，不坐班、不占编制。健康副校长每学期到校现场指导不少于4次、组织健康科普宣讲不少于2次，推动儿童青少年健康管理服务关口前移。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202611/t20261117_2111542733.html"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "本轮巴以冲突已致加沙地带74702人死亡", "summary": "加沙地带卫生部门11月16日发布声明称，过去24小时各医院接收3名死者和7名伤员。自2023年10月7日新一轮巴以冲突爆发以来，以军在加沙的军事行动已累计造成74702人死亡、176105人受伤；停火协议生效以来累计新增死亡1650人，救援人员已在废墟中寻获850具遇难者遗体。", "source": "央视新闻/中国青年网", "url": "https://news.youth.cn/jsxw/202611/t20261117_16969711.htm"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "乌克兰首都基辅遭多枚弹道导弹袭击，响起强烈爆炸声", "summary": "当地时间11月16日23时30分许，新华社记者在乌克兰首都基辅听到两轮强烈爆炸声。乌克兰空军发文称，俄军向基辅市发射多枚弹道导弹；基辅市市长克利奇科表示，城市遭到多枚弹道导弹袭击，防空系统正在运行。俄方表示下一轮俄美乌三方会谈仍将在阿布扎比举行，时间待定。", "source": "新华网", "url": "https://news.yunnan.cn/system/2026/11/17/034196657.shtml"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "世界首次！中国完成空间站舱外激光精密切割试验", "summary": "据《人民日报》报道，我国成功完成世界首次空间站舱外激光精密切割试验，在航天器在轨维修领域取得重大突破。华中科技大学黄禹团队与上海空间电源研究所联合研制维修装置，由机械臂送达、机器视觉识别，实现毫米级定位与微米级精密切割，从设计到太空试验仅用一年，为在轨维修卫星、太空制造奠定基础。", "source": "人民日报/腾讯新闻", "url": "https://news.qq.com/rain/a/20261116A04MTG00"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "中国空间站造出“最冷人造物质”，达9.7皮开尔文", "summary": "依托中国空间站梦天舱超冷原子物理实验柜，我国科研团队制造出目前已知最冷的人造物质，将铷原子云等效温度降至9.7皮开尔文并稳定观测7秒，刷新德国团队2021年38皮开尔文的纪录。成果发表于《科学》，可助力早期宇宙模拟、超轻暗物质探测及高精度量子传感器研发。", "source": "科技日报/河北省科技厅", "url": "https://kjt.hebei.gov.cn/hebkjt/kxpj22/kxbl56/2026111611032983362/index.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "速滑世界杯北京站收官，中国队4金2银3铜创历史最佳", "summary": "2026—2027赛季速滑世界杯北京站在国家速滑馆收官，中国队收获4金2银3铜，创分站赛历史最佳。米兰冬奥会冠军宁忠岩以1分07秒43破场地纪录夺男子1000米金牌，并摘1500米金牌；廉子文获1金1银1铜，高亭宇以34秒61摘男子500米金牌，女子团体追逐获银牌创队史最佳。", "source": "中青在线", "url": "https://news.cyol.com/gb/tiyu/articles/2026-11/16/content_zxN2jPTePX.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "2026版国家医保药品目录公布，新增107种药、51个创新药", "summary": "国家医保局、人社部发布2026年版国家基本医保药品目录，这是第9次调整，新增107种药品、其中51个1类创新药再创新高，总数达3331个。原价超百万元的CAR-T疗法等纳入保障，瑞基奥仑赛谈判支付标准降至28.86万元、降幅约77.6%；商业健康险创新药目录新增12种至28种，新版目录2027年1月1日执行。", "source": "新华财经", "url": "https://www.cnfin.com/gs-lb/detail/20261117/4496462_1.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "中央气象台发布寒潮大风双蓝色预警，中东部大范围雨雪降温", "summary": "中央气象台11月17日6时发布寒潮、大风双蓝色预警：17日至20日，西北东部、内蒙古、华北、东北、黄淮至江南华南先后降温6至8℃，吉林东部、山东南部、安徽、浙江等地降温8至10℃、局地超12℃，20日早晨0℃线南压至陕南至黄淮东南部。中东部有大范围雨雪，北方阵风7至9级、局地10级以上。", "source": "中国气象局/光明网", "url": "https://m.gmw.cn/2026-11/17/content_1304586919.htm"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "组合驾驶辅助强制国标发布，2027年起强制执行", "summary": "强制性国标GB 47955—2026《智能网联汽车 组合驾驶辅助系统安全要求》已发布，2027年1月1日起对新申请型式批准车型强制执行，是我国L2级组合驾驶辅助首部强标。标准将产品分为基础单车道、基础多车道、领航辅助三档，禁止“L2.5”“高阶智驾”等非标话术。截至今年8月国内约6100万辆乘用车搭载L2级系统。", "source": "工信部/汽车行业新闻", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491047&idx=2&sn=aab42c62e09d0eb7d1e7b3bb527775a4"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "BLG夺LOL全球总决赛冠军，Knight成LPL首位大满贯中单", "summary": "2026英雄联盟全球总决赛（S16）11月15日在纽约落幕，中国LPL赛区BLG战队先失一局后连扳三局，以3∶1击败韩国GEN，队史首夺召唤师杯，也是中国战队时隔5年再夺冠。江西萍乡籍中单卓定（Knight）斩获FMVP，成为LPL史上首位大满贯中单；BLG还创下单届淘汰全部四支LCK队伍的纪录。", "source": "直播吧", "url": "https://m.zhibo8.com/news/web/other/2026-11-17/6afb9d8e4693enative.htm"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "《非遗里的中国》特展在深圳启幕，汇聚200余件精品", "summary": "由中央广播电视总台、广东省政府联合主办的亚太人文交流活动暨《非遗里的中国》特展11月15日在深圳启动，来自APEC成员经济体、国际组织及驻华使节等150余位中外嘉宾出席。特展汇聚200余件精品，涵盖中国画、书法、雕塑、瓷器、锦绣、青铜器等品类，11月15日至22日向公众开放，展现亚太文明交流互鉴。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/17/content_342013.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "新雪季开板：赴张家口机票预订增270%，冰雪航线预订翻番", "summary": "新雪季启幕，河北崇礼、内蒙古阿尔山、吉林庙香山等地滑雪场陆续开板。航旅纵横数据显示，11月前往张家口的机票预订量同比增超270%，赴阿勒泰增约50%；去哪儿平台2000公里以上“冰雪航线”预订量同比增2倍。《中国冰雪旅游发展报告（2026）》预计上一冰雪季冰雪旅游休闲达3.6亿人次、收入4500亿元。", "source": "中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261117_3296392.shtml"}]}, "yest": {"date": "2026-11-16", "generatedAt": "2026-11-16T07:22:57+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "世界互联网大会乌镇峰会聚焦AI普惠，我国开源大模型全球下载破100亿次", "summary": "2026年世界互联网大会乌镇峰会近日在浙江乌镇举行，主题为“开源开放 共建共享”。经济日报11月16日报道，我国人工智能开源大模型全球累计下载量已突破100亿次，国家级开源社区汇聚用户超1100万、托管模型超7万个；阿里千问开源超470款模型，腾讯AI办公工作台已汇聚超5万家伙伴及开发者。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/16/content_341971.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "中国开源AI模型加速落地全球产业端，欧洲企业纷纷采用", "summary": "2026年网络峰会日前在葡萄牙里斯本举行，中国开源AI模型在全球产业端加速落地。英国金融科技企业雷沃卢特将约2000名工程师的默认编程模型换为中国智谱GLM系列，平均编程耗时缩短约60%、AI调用成本下降近90%；法国Orange、雷诺及德国西门子等也已公开采用DeepSeek和通义千问等中国模型。", "source": "经济参考网", "url": "https://www.jjckb.cn/20261116/3abc43906c8841d3a83e9d187fa85533/c.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "第49届东盟峰会在马尼拉开幕，东帝汶成为第11个成员国", "summary": "第49届东盟峰会11月15日在菲律宾马尼拉开幕，各国领导人围绕能源安全、粮食安全和经济合作展开磋商。开幕式发布由11束稻穗组成的新版东盟徽标，欢迎东帝汶正式成为第11个成员国；马科斯向东盟秘书长移交《东盟数字经济框架协议》文本，协议预计2027年初生效。今年适逢《东南亚友好合作条约》签署50周年。", "source": "新华网/财联社", "url": "https://k.sina.com.cn/article_1916733321_723f078901901jram.html?kdurlshow=1"}, {"id": 4, "category": "国际时事", "scope": "国内", "title": "2026年APEC工商领导人峰会17日深圳举行，习近平出席开幕式", "summary": "2026年APEC工商领导人峰会将于11月17日至18日在深圳前海国际会议中心举办，主题为“共促繁荣，共赢未来”，习近平主席将出席开幕式并发表主旨演讲。据中国贸促会介绍，12位APEC经济体领导人出席，2000余位政商领袖、115家世界500强企业代表参会，峰会将发布《2026年APEC工商领导人峰会深圳倡议》。", "source": "新华社/新华网", "url": "https://my-h5news.app.xinhuanet.com/h5/article.html?articleId=20261116d5cad49ccb8446dba56727ffb1ab91aa"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "外汇存款准备金率上调至6%正式生效，为近五年首次", "summary": "中国人民银行上调金融机构外汇存款准备金率于11月15日正式生效，由4%提高至6%，上调2个百分点，为近五年来首次上调该工具。此举旨在促进外汇市场供求平衡、打破人民币升值预期的自我实现；今年前9个月人民币对美元累计升值4.2%，11月2日曾升破6.65元创四年多新高。", "source": "每日经济新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261116A03KVR00"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "10月国民经济数据今日公布，社融存量同比增长7.2%", "summary": "国家统计局11月16日公布10月份国民经济运行情况，发布规模以上工业增加值、社会消费品零售总额、房地产开发投资及70个大中城市房价等数据。央行数据显示，10月末社会融资规模存量达469.16万亿元、同比增长7.2%，广义货币M2余额359.06万亿元、同比增长7.1%，均高于名义GDP增速。", "source": "央广网", "url": "https://www.cnr.cn/jingji/ycbd/20261116/t20261116_527874066.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "“十五五”民生投入加码：双一流高校扩招2.4万人，140亿支持养老托育", "summary": "国家发展改革委在“奋进‘十五五’”系列发布会上介绍民生保障安排：2026年“双一流”高校扩大本科招生2.4万人，并支持地方新建若干所新型研究型大学；已下达中央预算内投资140亿元支持养老、托育设施建设，建成超10万个护理型养老床位和超3万个托位，推动养老机构护理型床位占比达73%。", "source": "21世纪经济报道", "url": "https://finance.sina.com.cn/roll/2026-11-16/doc-iniywnmk5853281.shtml"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "中东局势升级：伊朗称打击巴林美军雷达，沙特拦截胡塞导弹", "summary": "中东局势持续升级：伊朗伊斯兰革命卫队15日发布视频称，出动无人机打击了位于巴林里法直升机基地的美军防空雷达，为“回应美国侵略”的第二轮报复；巴林国防军称拦截并摧毁多个空中目标。同日沙特称拦截也门胡塞武装向利雅得发射的两枚弹道导弹，霍尔木兹海峡南部两艘油轮触雷爆炸起火。", "source": "新华社/央视新闻", "url": "http://mp.weixin.qq.com/s?__biz=MzI0NDA1MDkzNA==&mid=2247504659&idx=1&sn=10c680871f6140bc107f375341fa9fe0"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "两股冷空气接连影响我国，中东部大范围雨雪局地暴雪", "summary": "中央气象台预报，11月15日至18日两股冷空气接连影响我国，中东部大部地区气温累计下降6至10℃，局地降温超12℃。15日夜间至17日中东部现大范围雨雪，内蒙古中部、河北北部、新疆伊犁河谷等地部分地区有暴雪（10—12毫米）；17日至18日吉林东部、黑龙江东部局地有大到暴雪，气温将大面积刷新下半年新低。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261115_8143109.html"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国空间站舱外暴露实验样品回舱，揭示深空探测生命密码", "summary": "中国空间站梦天实验舱空间辐射生物学装置第四次暴露实验取得进展，纳米酶、放线菌、植物种子等样品完成为期5个月的舱外暴露后随装置回舱。神舟二十三号乘组完成样品拆取、存储及装置处置，样品下行后将研究太空辐射对生物的深层影响，为我国载人登月及辐射防护药物研发提供技术支撑。", "source": "京报网/央视网", "url": "https://news.bjd.com.cn/2026/11/15/12031246.shtml"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "速滑世界杯北京站收官：高亭宇夺金，中国队4金2银3铜创最佳", "summary": "2026—2027赛季速度滑冰世界杯北京站在国家速滑馆“冰丝带”收官。北京冬奥会冠军高亭宇在男子500米第二次决赛中以34秒61夺冠，廉子文以0.16秒之差获银牌；中国队本站共获4金2银3铜，创世界杯分站赛历史最佳战绩。国际滑联官员高度评价场馆，期待2027年2月世锦赛再聚北京。", "source": "新华社/中国网", "url": "https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-11/16/content_118775546.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "冬季养生勿盲目进补，专家提醒重在均衡饮食与保暖", "summary": "冬季养生重在顺应时节、切勿盲目进补。首都医科大学附属北京地坛医院主任医师江宇泳提醒，健康人群无需特意食用滋补药材，应注重三餐营养均衡、早睡和保暖；“三高”人群和老年人如需进补调养应提前咨询医生。供暖后室内湿度易低于30%，建议维持在40%至60%，并定时开窗通风、晨练不宜过早。", "source": "央视网/中国新闻网", "url": "http://mp.weixin.qq.com/s?__biz=MzI3MzE5MTA0OQ==&mid=2247503418&idx=1&sn=d34dae89d73a19f7c6e6b26655653b2f"}, {"id": 13, "category": "环境气候", "scope": "国际", "title": "研究显示全球冰冻圈加速退化，COP31呼吁加快气候谈判", "summary": "一项最新国际研究显示，全球冰冻圈正加速退化，部分变化具有不可逆性，可能给地球生态系统和人类社会带来长期风险。正在土耳其安塔利亚举行的《联合国气候变化框架公约》第三十一次缔约方大会（COP31）上，联合国气候变化框架公约秘书处执行秘书斯蒂尔呼吁各方聚焦核心难点、加快谈判进程。", "source": "新华社/央视新闻", "url": "https://news.qq.com/rain/a/20261116A03KAU00"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "东航新开C919“上海虹桥—郑州”航线，机队增至17架", "summary": "11月15日，东航新开国产大飞机C919“上海虹桥—郑州”航线，首航航班平稳落地郑州新郑国际机场。该航线每日1班往返，航班号MU5395/MU5396，单程飞行时长约1小时40分钟。目前东航C919机队达17架，为国内航司中规模最大。", "source": "央视新闻/大河网", "url": "https://news.dahe.cn/2026/11-16/2151641.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "BLG夺英雄联盟S16全球总决赛冠军，中国战队时隔5年登顶", "summary": "2026英雄联盟全球总决赛（S16）在美国纽约落幕，中国LPL赛区二号种子BLG战队在先失一局的情况下连扳三局，以3∶1击败韩国LCK头号种子GEN，队史首夺召唤师杯，也是中国战队自2021年后时隔5年再夺冠。BLG成为史上首支单届连续淘汰全部四支LCK队伍夺冠的战队，决赛超2000万人在线观战。", "source": "新华社/环球网", "url": "https://www.163.com/dy/article/LBRB45TK0514R9OJ.html"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "2026世界中文大会闭幕，中文水平考试考生首破100万人次", "summary": "2026世界中文大会11月13日至15日在北京举行，来自160多个国家和地区的约5000名代表参会，主题为“中文，不止于语言”。大会发布数据：今年中文水平考试（HSK）考生首次突破100万人次，考点覆盖169个国家和地区超1500个，海外学习和使用中文人数达2.1亿，92国将中文纳入国民教育体系。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=4858761386700289180&channelId=1119"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "冰雪旅游升温：从规模扩张转向深度运营，入境客流增长89%", "summary": "迈点研究院发布《2026年冰雪旅游景区运营发展报告》指出，我国冰雪旅游正由规模扩张迈向价值创造，“95后”与亲子家庭构成双主力。国家体育总局数据显示，2025—2026冰雪季全国居民冰雪运动参与人数达3.08亿、参与率21.75%，滑雪滑冰等直接参与者突破8500万；入境滑雪客流同比增长89.2%。", "source": "四川日报", "url": "https://epaper.scdaily.cn/shtml/scrb/20261116/1094509.html"}, {"id": 18, "category": "汽车出行", "scope": "国内", "title": "前10月汽车产销超2600万辆，新能源汽车销量占比达54.8%", "summary": "中国汽车工业协会数据显示，2026年前10个月我国汽车产销分别完成2631.8万辆和2628.6万辆，其中新能源汽车产销达1450.9万辆和1441.1万辆，新车销量累计占比54.8%。10月单月新能源新车销量占比升至64.3%，即每卖出10台新车超6台为新能源；新能源商用车前10月销量101.8万辆、同比增长41.7%。", "source": "东方财富/中国汽车工业协会", "url": "https://caifuhao.eastmoney.com/news/20261116002737265690870"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
