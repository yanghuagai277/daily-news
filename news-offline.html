shtml"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "上市公司年内现金分红破2万亿元，超130家企业三季报预喜", "summary": "金融街论坛年会开幕之际，数据显示上市公司年内现金分红总额已突破2万亿元，以真金白银回馈投资者；超130家企业三季报预喜，AI产业链维持高景气，公募基金三季报陆续披露、调仓聚焦产业趋势。", "source": "新华财媒", "url": "https://news.qq.com/rain/a/20261019A03GOG00"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "全国秋粮收获过七成，已收购中晚稻1800万吨", "summary": "农业农村部最新调度显示，全国秋粮收获已过七成（东北过六成、黄淮海与西南过八成）。国家粮食和物资储备局称各地秋粮旺季收购有序展开，各类经营主体已收购中晚稻1800万吨；农发行提前安排2000亿元专项信贷资金收购。", "source": "中国经济网", "url": "http://bgimg.ce.cn/xwzx/gnsz/gdxw/202610/t20261019_3262499.shtml"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "央视曝光近视防控镜片乱象，江苏丹阳立案调查", "summary": "央视《每周质量报告》曝光近视防控镜片问题：丹阳部分商户一款多点离焦镜片批发价仅30元，零售参考价却标1980元；部分产品标识不规范、发布虚假广告。丹阳市监局通报基本属实，已对4家经营主体立案调查。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261019A02SUG00"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "我国首次太空培育两代水稻取得新突破", "summary": "神舟二十三号乘组已在轨超4个月，近期完成新一批水稻实验样品采集、播种与存储，我国首次太空培育两代水稻取得新突破。实验旨在解析长期微重力对水稻遗传稳定性的作用机制，未来有望实现地外粮食“原位”生产。", "source": "央视网", "url": "https://news.cctv.com/2026/10/18/ARTI7Iv78pBBM5HaL05R6rjw261018.shtml"}, {"id": 11, "category": "体育赛事", "scope": "国际", "title": "第五届亚残运会在日本名古屋开幕，中国代表团312名运动员出征", "summary": "第五届亚洲残疾人运动会10月18日至24日在日本名古屋举行。中国体育代表团共500人，其中运动员312名，来自25个省区市，将参加17个大项335个小项，是我国参加境外亚残运会运动员规模最大的一届。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=6573430128969843587&channelId=1119"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "2026世界传统医药大会北京开幕，97国代表参会", "summary": "2026世界传统医药大会10月17日在北京开幕，以“科技赋能 融合发展”为主题，吸引97个国家和地区的代表参会，聚焦传统医药与现代科技融合，推动全球传统医药传承创新与产业高质量发展。", "source": "央视网", "url": "https://news.cctv.com/2026/10/18/ARTIMb5gld3LwOfcI2UlxxYZ261018.shtml"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "新一股较强冷空气影响中东部，长江中下游局地暴雨", "summary": "10月19日至21日，新一股较强冷空气将影响我国中东部，大部地区降温4至6℃、局地超8℃，伴4至6级偏北风、阵风7至9级；重庆、湖北、安徽、江苏等地部分地区有暴雨或大暴雨，北方最低气温将刷新下半年来新低。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=8696100960502993254"}, {"id": 14, "category": "汽车出行", "scope": "国际", "title": "特斯拉披露新款Roadster技术细节，顶配版宣称0.55秒破百", "summary": "特斯拉车辆工程副总裁披露新款Roadster技术方案：放弃四驱、采用双电机后驱，最大功率超1兆瓦，目标续航超300英里，并搭载车底主动吸地风扇与SpaceX联合开发的冷气推进器。顶配Rocket版宣称0至60英里/小时仅需0.55秒。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7698159845752488490/"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "2026北京马拉松鸣枪，托拉2:03:10破赛会纪录", "summary": "10月18日，2026北京马拉松暨全国马拉松锦标赛在天安门广场鸣枪，3.2万名跑者参赛。埃塞俄比亚名将、巴黎奥运冠军托拉以2小时03分10秒夺冠，大幅打破2019年赛会纪录并创中国境内全马最快完赛成绩。", "source": "北京日报", "url": "https://www.163.com/dy/article/L9IG9IR105568W0A.html"}, {"id": 16, "category": "战争与自然灾害", "scope": "国际", "title": "印度加尔各答宗教活动踩踏致19死35伤", "summary": "当地时间10月17日晚，印度加尔各答一处印度教节日庆祝活动现场出口处发生踩踏，至少19人死亡、约35人受伤，遇难者中含一名儿童。警方称突降大雨引发骚动，已逮捕7人；莫迪致哀并向遇难者家属发放抚恤金。", "source": "新华社", "url": "https://finance.sina.cn/2026-10-19/detail-inivsnmf6424593.d.html"}, {"id": 17, "category": "战争与自然灾害", "scope": "国际", "title": "超强台风“蔷琵”加强，21日前对我国海区无影响", "summary": "今年第30号台风“蔷琵”已加强为超强台风级，19日早晨中心附近最大风力17级（60米/秒），位于台北东偏南约2300公里洋面，预计向西偏北移动并逐渐靠近台湾以东洋面，强度还将加强，21日前对我国海区无影响，东南沿海需保持关注。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34278569"}]}, "yest": {"date": "2026-10-18", "generatedAt": "2026-10-18T07:56:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "我国首个全国产十万卡AI超集群在深圳亮相", "summary": "2026全国高性能计算学术大会上，我国首个全国产十万卡AI超集群真机亮相，发布十大应用成果。该系统走“超算+智算原生融合”路线，把超算精确仿真与智算经验归纳融为一体，可支撑数字孪生大脑乃至百亿光年宇宙演化模拟，形成科研闭环。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7697778840692621866"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "DeepSeek发布V4.1-Flash-1017开放权重模型并开放API", "summary": "DeepSeek于10月17日发布V4.1-Flash-1017开放权重模型，采用MIT许可、支持FP8，并开放搜索与抓取API。官方称其在智能体任务上优于更大规模竞品，单次调用成本大幅下降，现有deepseek-flash调用可无缝升级，加剧开源大模型的生产集成竞争。", "source": "The Decoder", "url": "https://the-decoder.com/deepseek-v4-1-flash-1017-beats-larger-rivals-in-agentic-tasks-while-once-again-massively-cutting-per-task-costs/"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "霍尔木兹海峡紧张升级：伊朗开火拦截船只、超级油轮触雷起火", "summary": "央视10月18日报道，当地时间17日伊朗武装部队在霍尔木兹海峡向试图“违规”通行的船只开火拦截；同日伊朗革命卫队称一艘载有超200万桶原油的“第二艘超级油轮”在海峡触雷后爆炸起火。巴基斯坦已暂时关闭与伊朗边境贸易通道，海湾航运与全球原油市场的风险骤然上升。", "source": "央视新闻", "url": "https://finance.sina.com.cn/jjxw/2026-10-18/doc-inivqtzw1187478.shtml"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "特朗普豁免对俄多项制裁，泽连斯基称乌美最快下周会谈", "summary": "美国总统特朗普16日签署行政令，豁免《格雷厄姆制裁俄罗斯和伊朗法案》大部分条款，俄方称此举“具历史意义”并将重启俄美经济对话，欧盟多国对此表达遗憾。与此同时，泽连斯基17日表示，乌方愿经美国渠道推动停火，乌美最快可能于下周举行新一轮会晤。", "source": "大皖新闻", "url": "https://www.toutiao.com/article/7697773415062684198"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "全年1.3万亿元超长期特别国债发行完毕", "summary": "经济日报财经早餐消息，财政部已完成2026年超长期特别国债（五期）第三次续发行招标，实际续发行面值200亿元、票面利率2.24%，标志着全年1.3万亿元超长期特别国债发行完毕，为“两重”建设、设备更新等稳增长举措提供中长期资金支撑。", "source": "经济日报", "url": "https://m.thepaper.cn/newsDetail_forward_34272803"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "第140届广交会集中展出23.5万件人工智能产品", "summary": "第140届广交会线下展进入第三天，央视新闻联播报道，本届广交会集中展出23.5万件人工智能产品，超过2万家参展企业应用了工业互联网、人工智能等新技术新模式。外骨骼机器人等产品受到海外采购商青睐，AI创新应用加速从实验室走向真实外贸场景。", "source": "央视网", "url": "https://news.cctv.com/2026/10/17/ARTI0aBLT6F9IRc2biebtQb1261017.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国牵头首个国际职教标准《北京协议》由45国发布", "summary": "2026年世界职业技术教育发展大会17日在天津闭幕，我国牵头推动研制的首个国际职业教育标准《世界职业技术教育标准框架》（《北京协议》）由45国共同发布，涵盖办学体系、终身培训、产教协同、AI赋能教学等8项育人体系，并倡议技能证书国际互认。", "source": "光明日报", "url": "https://news.gmw.cn/2026-10/18/content_39051711.htm"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "中国天眼发现世界首例尚在演化的原生脉冲星三体系统", "summary": "中国科学院国家天文台10月9日宣布，结合FAST射电观测与多波段数据，证实FAST发现的脉冲星J0435+3233属于首例尚在演化阶段的原生三体系统，也是人类确认的第二例脉冲星三体系统。该成果发表于《天体物理学杂志快报》，FAST建成以来已发现超千颗脉冲星。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.com/2026/10/10/ARTIX4CGo4aqa2SKM8sAM6hv261010.shtml"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "上海劳力士大师赛迎决赛日，多项职业赛事“以赛营城”", "summary": "2026上海劳力士大师赛10月16日至18日迎来半决赛与决赛。为期14天的赛事在旗忠网球中心累计上演162场对决，德约科维奇等名将争夺年终总决赛席位；同期上海还迎来CBA揭幕战、中超焦点战与别克LPGA锦标赛，文商旅体深度融合带动消费。", "source": "新浪财经", "url": "https://finance.sina.com.cn/jjxw/2026-10-16/doc-inivkwtm7810176.shtml"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "全国卫生与健康大会强调健康中国“六大能力”", "summary": "全国卫生与健康大会10月12日至13日在北京召开，习近平强调要建成的健康中国应具有强大的健康管理、疾病防控、医疗服务、医保支撑、医药创新、人才培养六大能力。国家税务总局介绍，今年前8个月支持卫生健康事业发展主要政策合计减税降费2454亿元。", "source": "健康报", "url": "https://www.toutiao.com/article/7696284100254433832"}, {"id": 11, "category": "环境气候", "scope": "国内", "title": "较强冷空气影响我国，北方多地气温创下半年新低", "summary": "中央气象台消息，较强冷空气16日夜间至18日影响我国，长江以北多地有大到暴雨、局地大暴雨，内蒙古东北部和黑龙江西北部局地有暴雪或大暴雪；北京、太原、石家庄等地最高气温刷新下半年低值，20日至25日还将有两股冷空气接踵而来。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=5744762874227903554&t=1792234355169"}, {"id": 12, "category": "战争与自然灾害", "scope": "国际", "title": "俄乌冲突持续：俄大规模打击乌军工能源设施", "summary": "央视《国际联播快讯》报道，俄国防部17日称俄军使用高精度武器和无人机对克里沃罗格、扎波罗热等地乌军冶金企业、能源设施实施大规模打击，并拦截或摧毁610架乌无人机；乌方则称击落或压制289架俄无人机、4枚巡航导弹，泽连斯基在欧盟峰会要求明年再提供700亿欧元援助。", "source": "央视网", "url": "https://tv.cctv.com/2026/10/17/VIDEiTn9CVibMgXpqdTkVhaq261017.shtml"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "2026世界新能源汽车大会海口举办，全球销量破9400万辆", "summary": "2026世界新能源汽车大会近日在海南海口举办。大会主席万钢表示，2026年上半年全球新能源汽车销量达1123.4万辆、渗透率24%，累计销量突破9400万辆，其中中国累计超6200万辆稳居核心地位；1-8月中国新能源车出口343.5万辆、同比增124%。", "source": "中工网", "url": "https://www.workercn.cn/c/2026-10-15/8916411.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛入围赛开打，MVK、KC晋级", "summary": "2026英雄联盟全球总决赛（S16）入围赛10月中旬在韩国开打。首轮越南赛区MVK以3比0横扫巴西FUR，欧洲KC则鏖战五局3比2险胜北美C9；LPL四支战队出征，入围赛采用双败BO5，晋级队伍将进入10月24日开打的瑞士轮。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261016A0530I00"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026天府书展成都启幕，发放500万惠民券", "summary": "2026天府书展10月16日在成都世纪城新国际会展中心开幕，恰逢《全民阅读促进条例》施行首年。200余家出版单位携3.7万余种图书参展，发放500万元惠民消费券，举办800余场文化活动，并首创银发阅享区、Z世代阅潮区等六大主题阅读空间。", "source": "人民网", "url": "https://www.163.com/dy/article/L9ETVHMU05346936.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "国庆后错峰游升温，机票较假期下降超三成", "summary": "国庆、中秋假期过后，在线旅游平台数据显示10月10日至31日机票平均支付价格较假期下降超三成，多条航线裸票价仅200至300元，国际航线也明显“跳水”，热门目的地酒店均价降约20%。张家界、新疆、西藏等地迎来客流平稳、性价比高的错峰慢旅行。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.com/2026/10/10/ARTIWGVWVI7GeECVyiyehoA9261010.shtml"}, {"id": 17, "category": "财经经济与就业", "scope": "国际", "title": "美国2026财年预算赤字近2万亿美元、同比增12%", "summary": "美国财政部16日公布数据，2026财年联邦预算赤字达1.99万亿美元，较上财年1.78万亿增长12%，为历史上金额第三高的年度赤字，联邦政府已连续25个财年赤字。总收入5.4万亿、总支出7.4万亿，债务净利息增至1.05万亿，分析称膨胀债务正拖累美财政健康。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/gj/2026/10-17/10716072.shtml"}]}};</script>

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
