<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}

.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}

<script>window.__DATA__ = {"today": {"date": "2026-11-22", "generatedAt": "2026-11-22T08:32:35+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平APEC深圳会议系列重要讲话引发全球热烈反响", "summary": "亚太经合组织第三十三次领导人非正式会议及相关活动在深圳成功举行。习近平主席出席工商领导人峰会开幕式并发表主旨演讲，主持领导人非正式会议，就建设亚太共同体提出坚持和衷共济、开放融通、开拓创新、包容发展等中国主张。多国智库人士评价，这些主张为亚太合作指明方向，在全球不确定性加剧背景下为区域经济合作与供应链稳定发挥引领作用。", "source": "新华社/经济日报", "url": "http://paper.ce.cn/pad/content/202611/22/content_342293.html"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "特朗普称将与伊朗达成永久性协议，卡塔尔代表团赴德黑兰斡旋", "summary": "美国总统特朗普11月21日在采访中称，将与伊朗达成一项永久性协议，此前他还表示不会在新年前“仓促”决定对伊行动。同日，调解方卡塔尔代表团抵达德黑兰，与伊朗方面会谈约两小时。伊朗外长强调浓缩铀不会被运出境外，伊朗副外长证实卡塔尔访问。分析认为，美伊在波斯湾持续对峙的同时，谈判渠道仍在运作。", "source": "央视新闻/新华社", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=15066787746807276868&channelId=1119"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "联合国安理会第九轮意向性投票：8位下任秘书长候选人均遭否决", "summary": "联合国安理会11月20日就下任联合国秘书长遴选举行第九轮意向性投票，8位候选人均未获得通过，僵局持续。按照程序，秘书长人选需获安理会九票赞成且五大常任理事国无一反对。遴选久拖不决，反映出 major 国在人选问题上的分歧。现任秘书长古特雷斯的任期将于2026年底结束，各方仍在就此展开磋商。", "source": "新华社", "url": "http://mp.weixin.qq.com/s?__biz=MzIwMTIyNzM5Mw==&mid=2247483730&idx=1&sn=f08df66749758cb754868e8d8cb13405"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "国产大模型累计下载破100亿次，量子计算机“高速内存”全球首次真机实现", "summary": "据11月22日公布的消息，国产大模型累计下载量已突破100亿次，引领全球开源生态。同期，我国科研团队宣布在全球首次于真机上实现量子计算机“高速内存”，为提升量子计算的数据存取效率提供关键突破。国家数据局表示，将积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范，引导行业规范发展、避免低质量重复建设。", "source": "新华社/自贡网", "url": "https://www.zgm.cn/content/6b02355c2f2f3"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌密集迭代 Gemini 4 系列，AI竞争从“拼参数”转向场景落地", "summary": "11月以来谷歌连续推出新一代大模型，18日发布的Gemini 4 Neon专为复杂软件工程、科研与知识工作流优化，在多项权威评测榜单跻身全球顶尖梯队，每百万Token输入定价3美元。此前推出的Gemini 4 Hydrogen已向免费用户开放。业界观察到，国内外AI巨头竞争重心正从参数堆叠转向场景适配、成本优化与全民普惠，落地价值成为新赛道。", "source": "今日头条", "url": "https://www.toutiao.com/a1882375357350912"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "前10月全国一般公共预算收入增长4.9%，财政运行平稳有序", "summary": "财政部数据显示，前10个月全国一般公共预算收入同比增长4.9%，财政收支运行平稳有序。支出端结构持续优化，中央本级支出增长5.4%、地方支出增长0.2%，体现中央财政主动加力、减轻地方压力的政策取向。“投资于人”的取向更加鲜明，育儿补贴、教育、住房保障等民生支出得到较好保障，专家建议进一步稳定房地产市场、释放消费潜力。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/22/content_342298.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "10月中国内地访日游客同比下滑47%，连续11个月减少", "summary": "日本政府观光局数据显示，2026年10月中国内地访日游客为37.95万人，同比下滑47%，已连续11个月减少。野村研究所测算，若中国游客数量持续低迷，日本全年将损失1.79万亿至2.2万亿日元，拖累GDP增速约0.36个百分点。今年1至10月累计访日游客3464.3万人，同比减少2.5%，赴日旅游降温对日本经济的影响正在显现。", "source": "观察者网/同花顺财经", "url": "https://news.10jqka.com.cn/20261122/c682074914.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "最高检发布性侵害未成年人指导性案例，健康副校长制度明确", "summary": "最高人民检察院发布指导性案例，强调依法严惩性侵害未成年人犯罪。教育部、国家卫健委同时明确中小学校、幼儿园健康副校（园）长制度：由医疗卫生机构选派、不占学校编制，任期3年，每学期到校现场指导不少于4次、每学年至少2次面向师生家长科普宣讲，任职前须完成不少于8学时培训，推动医校协同守护学生健康。", "source": "新华社/教育部", "url": "http://mp.weixin.qq.com/s?__biz=MzIwMTIyNzM5Mw==&mid=2247483730&idx=1&sn=f08df66749758cb754868e8d8cb13405"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "青海德令哈发生5.6级地震，中国地震局启动四级应急响应", "summary": "11月21日18时45分，青海省海西州德令哈市发生5.6级地震，震源深度10千米。当地暂未发现人员伤亡，中国地震局已启动四级应急响应，相关部门正在核查灾情、排查房屋与基础设施安全。地震发生在小雪节气前后，初冬寒冷天气给现场救援和群众安置带来一定挑战，后续震情监测仍在持续。", "source": "央视新闻/新华社", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=12174788899053980407&channelId=1119"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "伊朗革命卫队打击巴林境内美军基地，也门方向攻防持续", "summary": "当地时间11月21日晚，伊朗伊斯兰革命卫队称对巴林两处美军基地实施打击，击中两部“爱国者”防空系统雷达，称此举回应美军持续侵犯伊朗领空；巴方称一处民用工业设施遭袭。美军中央司令部否认有人员伤亡。同日，沙特主导的多国联军称拦截胡塞武装射向利雅得的导弹和无人机，也门荷台达传出爆炸声，联合国呼吁各方重返谈判桌。", "source": "央视新闻/新华社", "url": "https://www.toutiao.com/a1882511719774208"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "神舟二十四号完成最后一次全系统合练，近日择机发射", "summary": "神舟二十四号载人飞行任务21日在发射场区完成最后一次全系统合练，船箭组合体已转运至发射区，计划近日择机发射。按“打一备一、滚动备份”安排，神舟二十五号船箭处于应急救援待命状态。执行一年期任务的航天员与巴基斯坦航天员也将揭晓，神舟二十三号乘组将与二十四号乘组在“天宫”会师。", "source": "新华社/央视网", "url": "https://news.qq.com/rain/a/20261120A06SFI00"}, {"id": 12, "category": "科学探索", "scope": "国内", "title": "“考古中国”发布4项成果，聚焦长江流域人类起源与文明化进程", "summary": "国家文物局发布四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭岭头上遗址、湖北云梦老虎墩墓地4项考古成果。桃花河遗址是长江流域迄今遗物最密集的中更新世旷野中心营地；良渚反山揭示墓葬区与礼仪空间整体布局；云梦老虎墩出土简牍和大量漆木器，为研究秦汉基层治理提供最新史料。", "source": "人民网/云南网", "url": "https://news.yunnan.cn/system/2026/11/20/034198934.shtml"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "中国短道女队夺世巡赛首尔站3000米接力金牌，武大靖执教首金", "summary": "11月21日，2026—2027赛季短道速滑世巡赛首尔站女子3000米接力A组决赛，张楚桐、公俐、张延、张珈宁组成的中国队以4分12秒679夺冠，领先韩国队0.311秒。这是中国女队时隔五年再夺世巡赛分站接力金牌，也是主教练武大靖8月竞聘上任后的首枚国际赛事金牌。中国队赛季前两站仅获1银2铜，首金提振士气。", "source": "新华社/新浪体育", "url": "https://sports.sina.cn/2026-11-22/detail-inizputw1654706.d.html"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "2026版医保目录新增107种药品，51个1类创新药创历史新高", "summary": "11月14日发布的2026年国家医保药品目录新增107种药品，其中51个为1类创新药，占比接近一半，创国家医保局成立以来单次调整新高。目录含31种肿瘤药、24种慢性病药、18种罕见病药，CAR-T与双抗ADC实现“零的突破”。商保创新药目录同步扩至28种并与基本医保首次转化衔接，均自2027年1月1日起执行。", "source": "新华网", "url": "https://www.news.cn/health/20261120/ff16514b01954b96bfdc12b2662eb2d7/c.html"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "今日小雪：22日至24日冷空气自北向南影响中东部，局地降温10℃", "summary": "11月22日进入冬季第二个节气“小雪”。中央气象台预计，22日至24日较强冷空气自北向南影响我国中东部，气温先后下降4至8℃、内蒙古中东部和东北部分地区降温8至10℃，并伴有4至6级大风、阵风7至10级，已发布大风蓝色预警。内蒙古东部、东北有大到暴雪，江南华南有中到大雨；23至24日川西高原、西藏东部局地暴雪。", "source": "中央气象台/中国天气网", "url": "https://news.weather.com.cn/2026/11/4868774.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "四部门发布《绿色交通发展“十五五”规划》：2030年交通运输碳达峰", "summary": "交通运输部等四部门发布《绿色交通发展“十五五”规划》，提出到2030年实现“一达峰、二下降、三提升”，交通运输领域总体实现碳达峰。规划明确加快新能源重卡在京津冀及周边等重点区域全场景规模化应用，打造零碳货运车队；开展充电设施服务能力“三年倍增”行动，提高高速服务区大功率充电比重；机场场内车辆力争全面电动化。", "source": "交通运输部/经济日报", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491103&idx=2&sn=fef54e3f534287ade0afda704a931539"}, {"id": 17, "category": "游戏电竞", "scope": "国内", "title": "广州文交会设游戏电竞展区，国产游戏《鸣潮》斩获TGA玩家之声奖", "summary": "2026广州文化产业交易会11月20日至22日在琶洲举行，展览面积超4万平方米、500余家展商。游戏电竞展区约920平方米，集中展示精品创作、技术自研与文化出海成果，入口陈列库洛游戏《鸣潮》获得的TGA2025“玩家之声”奖杯。现场还可体验AI吉他创作、沉浸式XR设备，国产自研引擎与数字人技术一同亮相，展现大湾区数字文创实力。", "source": "广州市人民政府/南方+", "url": "https://www.gz.gov.cn/ysgz/xwdt/ysdt/content/post_11112449.html"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "“画游·千里江山”数字展在广东省博物馆开展，数字技术再现千年青绿", "summary": "\"画游·千里江山\"数字展览11月在广东省博物馆开展，运用实时分层渲染与时间变换系统，动态呈现破晓、白昼、雨后、黄昏、月夜等山水场景，让观众化身穿行画中的旅人。原画全长近12米无法一次展现全貌，展览将定期更换长卷画面。该系列此前已在澳门、重庆巡展，此次为迎接APEC会议落地，助力湾区文化融合与传统文化数字化传播。", "source": "光明日报/光明网", "url": "https://news.gmw.cn/2026-11/22/content_39113692.htm"}]}, "yest": {"date": "2026-11-21", "generatedAt": "2026-11-21T07:47:13+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "中俄美元首历史性会晤发表《和平宣言》，习近平提大国相处四点看法", "summary": "11月19日，习近平在深圳主持首次中俄美元首会晤，与普京、特朗普就乌克兰危机、核不扩散、中东局势等交换意见。三国发表《中俄美元首和平宣言》，重申核战争打不赢也打不得，计划增加精炼石油产品生产供应。习近平提出相互尊重、和平共处、合作共赢、对话协商四点看法，会晤持续约90分钟。", "source": "新华社/央广网", "url": "https://www.cnr.cn/china/news/sz/20261120/t20261120_527878298.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "特朗普称伊朗“不想达成我能接受的协议”，卡塔尔持续斡旋", "summary": "美国总统特朗普11月20日在白宫新闻发布会上表示，伊朗想达成协议但“不想达成我能接受的协议”，承认战事推高国内物价尤其是油价，但称11月初以来油价已大幅下跌。据阿克西奥斯报道，美特使威特科夫与库什纳19日在柏林会见卡塔尔首相，讨论卡方在美伊之间的斡旋工作。", "source": "新华社", "url": "https://www.xinhuanet.com/20261121/328ce2421ca54aff8f41ae96c035d857/c.html"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic数学家称借Claude证明黎曼猜想，公开1737万行代码待验证", "summary": "11月20日，Anthropic数学研究人员Levent Alpöge发布4页说明，宣称在Claude协助下证明了悬置167年的黎曼猜想，并提出广义黎曼猜想证明思路，公开14个压缩包、约1737万行Lean形式化代码。该方法借鉴1969年Stepanov在函数域的证法，关键一步由Claude提出。目前尚无独立团队完成复核，数学界未正式认可。", "source": "南华早报/财联社", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375294/anthropic-researcher-says-claude-has-solved-maths-greatest-riddle"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "腾讯混元Hy4大模型正式开源，混元LLM系列实现全量开放", "summary": "11月20日，腾讯混元团队宣布Hy4大模型正式开源，权重已在GitHub、Hugging Face、ModelScope与GitCode四平台同步上线。Hy4采用MoE架构，总参数770B、激活参数49B，上下文窗口突破100万Token，以Apache 2.0协议开放允许商用。主打性价比的Hy4 flash总参数224B。至此混元LLM系列完成全量开源。", "source": "IT之家", "url": "http://mp.weixin.qq.com/s?__biz=MzkxOTAwMjQ3OA==&mid=2247485706&idx=1&sn=61665f8307405bf5d1c4176c2fb8084b"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "政策利率换锚后首期LPR出炉：1年期3.0%、5年期以上3.5%", "summary": "11月20日，中国人民银行公布贷款市场报价利率：1年期LPR为3.0%、5年期以上LPR为3.5%，均保持不变。这是主要政策利率从7天期逆回购切换至隔夜逆回购后的首期LPR，当前主要政策利率为1.25%。专家称三季度GDP增速回升至4.5%、出口延续高增，短期内全面降息可能性不大，四季度经济动能仍有上行趋势。", "source": "每日经济新闻/新浪财经", "url": "https://finance.sina.com.cn/roll/2026-11-20/doc-inizkqie3914391.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美股AI板块遭历史性抛售，纳指跌5.28%英伟达一日蒸发近4900亿美元", "summary": "美东时间11月20日，美股三大指数集体重挫，纳指收跌5.28%至22617.73点，抹去2026年全部涨幅；标普500跌3.70%、道指跌1.93%，双双进入技术性回调。路透社称美国证交会正调查英伟达会计处理问题，成为抛售导火索，英伟达当日跌约14%、单日市值蒸发约4850亿美元，本周累计蒸发近9000亿美元。", "source": "美联社/BBC/路透社", "url": "https://news.qq.com/rain/a/20261121A00I3J00"}, {"id": 7, "category": "社会民生与教育", "scope": "国际", "title": "联合国报告：全球学前教育普及停滞，每投入1美元2035年可回报3.76美元", "summary": "联合国教科文组织11月20日发布《2026年全球儿童早期保育与教育报告》，指全球学前教育普及近十年陷入停滞，进入小学儿童仅59%接受过至少一年学前教育。报告测算每投入1美元弥补相关缺口，到2035年可为全球GDP额外贡献3.76美元；低收入国家年均资金缺口达350亿美元，2030年前全球需新增约600万名学前教育工作者。", "source": "新华社/中国网", "url": "https://news.china.com.cn/2026-11/21/content_118783617.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "江西印发“十五五”教育发展规划，严格落实每天一节体育课", "summary": "江西省政府近日印发《江西省“十五五”教育发展规划》，提出到2030年教育强省建设取得重要进展。规划部署十方面重点任务，明确严格落实中小学生“每天一节体育课”“每天综合体育活动时间不低于2小时”“课间15分钟”，实行中小学每周至少半天校外实践教学；扩大普通高中学位供给，加力支持南昌大学建设“双一流”高校。", "source": "中国教育报/中国教育网", "url": "https://www.edu.cn/xxh/focus/zc/202611/t20261120_2796829.shtml"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "以军轰炸加沙地带中部致4死多伤，称打击哈马斯武装人员", "summary": "据巴勒斯坦方面消息，当地时间11月20日，以军在加沙地带中部代尔拜拉赫和布赖杰难民营实施轰炸，造成4名巴勒斯坦人死亡、数人受伤。以军当晚声明称，在加沙中部对正在开会的哈马斯武装人员实施空中打击，指责相关人员策划针对以色列的袭击、企图在加沙恢复武装组织能力。", "source": "央视新闻", "url": "https://wap.cj.sina.cn/pc/7x24/5229049"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "乌克兰一周三袭克里米亚大桥，普京预告“更沉重打击”", "summary": "乌克兰武装部队18日夜间再度无人机袭击克里米亚大桥，为一周内第三次，未造成人员伤亡但交通中断，卫星图显示一侧拱桥坠落。普京19日表示俄方必将回应且力度更大，大桥再遭袭后不再讨论海上停火。基辅同日遭俄军大规模无人机攻击致至少1死5伤，荷兰、奥地利驻乌使馆受损，荷兰已召见俄大使。", "source": "凤凰卫视/环球网", "url": "https://news.qq.com/rain/a/20261120A06PQL00"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国科学家证实火星北部平原曾存在古海洋，获北京市自然科学一等奖", "summary": "11月20日，中科院国家空间科学中心“基于祝融号探测数据的火星水活动和地质环境演化研究”成果获2025年度北京市自然科学一等奖。研究首次证实火星北部平原曾存在古海洋，为早期火星具备适合生命起源的宜居气候提供关键证据；发现火星晚期水活动迹象，打破国际上火星晚期极度干冷的传统认知，还证认现代火星表面仍存卤水及水汽循环。", "source": "中国科学院/国家空间科学中心", "url": "https://www.nssc.cas.cn/xwdt2015/xwsd2015/202611/t20261120_8312184.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "时隔21年重返世少赛，中国U17男足首战0:5不敌西班牙", "summary": "11月20日，2026年U17男足世界杯H组首轮，时隔21年再度出战世少赛的中国队0:5不敌夺冠热门西班牙队。中国队凭U17亚洲杯亚军获得资格，上半场控球率仅24%，西班牙由巴萨球员佩斯克尔造点命中、通卡拉任意球破门。中国队23日将在小组赛第二轮对阵摩洛哥队。", "source": "新华社/央视网", "url": "https://sports.cctv.com/2026/11/21/VIDEJxC8faSl81cG3y9lINdR261121.shtml"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "原价129万元一针CAR-T抗癌药进医保，患者自付有望降至10万元内", "summary": "最新国家医保目录新增107种药品、其中51个为1类创新药，首次纳入CAR-T细胞治疗药物瑞基奥仑赛注射液。该药此前每支定价129万元，纳入医保后患者自付费用有望降至10万元以内。此次目录覆盖肿瘤、罕见病、慢病等领域，同步发布的商保创新药目录搭建起“基本医保+商业健康保险”多层次支付通道，均自2027年1月1日起执行。", "source": "央视网/中国新闻网", "url": "https://news.qq.com/rain/a/20261120A06WVU00"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "COP31原定闭幕日谈判延长，多国要求明确摆脱化石燃料", "summary": "11月20日是第31届联合国气候变化大会原定闭幕日，谈判面临延长至周末。由法国、巴拿马牵头的十余国联合要求修改协议草案，明确有序摆脱化石燃料并加强气候资金。最新草案删除了石油、天然气和煤炭相关表述，被法国生态转型部长称为“污点”。世界气象组织称2026年1至9月全球均温较工业化前高约1.47°C，年末大概率越过1.5°C。", "source": "联合国新闻/CGTN", "url": "https://news.un.org/zh/story/2026/11/1143235"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "我国电动汽车充电设施达2539.1万个，同比增长36.2%", "summary": "国家能源局11月20日发布数据，截至2026年10月底，我国电动汽车充电基础设施（枪）总数达2539.1万个，同比增长36.2%。同日中汽中心推出国内首个汽车智能座舱AI能力分级评价体系，分C1至C5五级，覆盖八大能力、九大场景。调查显示20万元以上国产新能源车座舱AI搭载率超90%，2026年国内智能座舱市场规模预计超1800亿元。", "source": "央视新闻/国家能源局", "url": "http://mp.weixin.qq.com/s?__biz=MzUzOTE2NTQxNw==&mid=2247487756&idx=1&sn=be24a4a4f859baa2fbc03af730641877"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "KSG夺2026王者荣耀电竞世俱杯冠军，移动电竞全球化提速", "summary": "2026王者荣耀电竞世俱杯（KWC at EWC26）落幕，Kuaishou Gaming（KSG）在总决赛以4:3击败AG.AL夺冠，从300万美元总奖金池中赢得最高份额，KSG.JuHao获FMVP。本届赛事迎来里程碑，王者荣耀与Arena of Valor战队首次在国际舞台同场竞技。2026王者荣耀世界冠军杯（KIC2026）将于12月迎来年度收官。", "source": "虎扑/腾讯游戏", "url": "https://voice.hupu.com/bbs/641827194"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "“宋画里的江南”上海金山特展启幕，200余件展品重现宋代风雅", "summary": "11月21日，“盛世修典——‘中国历代绘画大系’主题展·‘宋画里的江南’上海金山特展”在金山区博物馆启幕，集中呈现200余件（套）展品，通过绘画、文献图像与数字化展陈结合，展现宋代江南山川形胜、市井生活与人文风雅，持续至2027年2月21日。“中国历代绘画大系”成果展已在国内外巡展102场，同期还举办非遗市集。", "source": "上观新闻/金山区融媒体中心", "url": "https://www.jinshan.gov.cn/shfw-bmxx/20261120/879787.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "2026—2027北京冰雪文化旅游季启幕，统筹推出96项重点活动", "summary": "11月20日，由北京市文旅局主办的2026—2027北京冰雪文化旅游季在延庆奥林匹克园区启幕，以“一起趣玩雪”为主题，统筹推出96项重点冰雪文旅活动。现场发布冰雪温泉旅游主题线路与冰雪旅游地图。数据显示2025至2026冰雪季全国居民冰雪运动参与人数达3.08亿、冰雪旅游休闲人次突破3.6亿，冰雪产业规模突破万亿元。", "source": "央广网/央视财经", "url": "https://news.qq.com/rain/a/20261120A0EY3J00"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>

      <button class="tab" id="tabYest">昨天</button>

  </div>

</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
