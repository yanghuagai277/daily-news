<style>

<script>window.__DATA__ = {"today": {"date": "2026-09-16", "generatedAt": "2026-09-16T06:50:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "全球首款量产AI智能体手机努比亚NaviX Ultra开售", "summary": "9月16日14时，中兴通讯与字节跳动联合打造的努比亚NaviX Ultra（'豆包手机二代'）正式发布开售，号称全球首款完成大模型备案与终端入网双合规的量产AI智能体手机。该机将豆包大模型嵌入系统底层，支持跨App自主完成比价、下单、填表等链式任务，京东预约量已突破36万台，搭载骁龙8 Elite Gen5与7100mAh电池。", "source": "新浪科技", "url": "https://k.sina.com.cn/article_7879777300_1d5abdc14068015tbo.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "联发科发布天玑9600 Pro，全球首款2nm安卓旗舰芯片", "summary": "9月15日，联发科在深圳发布天玑9600 Pro与9600M旗舰5G智能体AI芯片，采用台积电2nm工艺，为全球首款官宣的2nm安卓移动芯片。其2+3+3全大核CPU多核功耗较上代降低61%，双NPU支持端侧30B参数大模型运行，vivo X500 Pro系列将首发搭载，安卓旗舰芯片正式进入2nm时代。", "source": "上海证券报·中国证券网", "url": "https://www.cnstock.com/commonDetail/790463"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "伊朗发布“阿尔加亚”号油轮起火视频，霍尔木兹超百艘商船改向", "summary": "央视新闻9月16日报道，伊朗发布'阿尔加亚'号油轮触雷起火后首段视频，称该船正被拖往阿曼港口、仍有2人失踪。美军中央司令部称对伊海上封锁已使103艘商船改变航向；美国国会预算办公室估算对伊战争耗资已超380亿美元，中东多国美军基地与设施受损，联合国安理会就曼德海峡局势举行紧急会议。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685889315280323072/"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "日本滨冈核电站225项地震评估数据造假，社长月底辞职", "summary": "第三方调查委员会9月14日公布报告，日本中部电力为推进滨冈核电站3、4号机组重启，在225项地震安全性评估中至少208项存在虚假说明等不当行为。公司宣布撤回机组重启审查申请，社长林欣吾与董事长胜野哲将于9月30日辞职。事件令日本核电监管公信力再遭重创。", "source": "中国新闻网", "url": "https://www.chinanews.com/gj/2026/09-15/10696552.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "8月经济“三稳两快”：工业增5.2%、失业率5.3%", "summary": "国家统计局9月15日公布，8月全国规模以上工业增加值同比增长5.2%，比上月加快0.7个百分点；城镇调查失业率5.3%，居民消费价格同比上涨0.8%。高技术制造业与数字产品制造业增加值分别增长16.7%、15.7%，货物进出口总额同比增长19.8%，经济运行呈'生产、就业、物价稳，新兴与外贸增长快'特点。", "source": "人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9286aa9c1d363452"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "《电子信息制造业发展“十五五”规划》发布，2030年营收破30万亿", "summary": "工信部、国家发改委9月15日联合印发《电子信息制造业发展'十五五'规划》，提出到2030年规上企业营业收入突破30万亿元、研发投入强度达3.5%。规划部署17项重点任务，攻关高性能处理器、高密度存储器等高端芯片，巩固能源电子优势，推进固态电池、钠电池产业化。", "source": "光明日报", "url": "https://epaper.gmw.cn/gmrb/html/content/202609/16/content_25252.html"}, {"id": 7, "category": "体育赛事", "scope": "国内", "title": "亚运男足首战！国足9月16日18:00对阵朝鲜", "summary": "爱知·名古屋亚运会男足小组赛9月16日18:00开打，中国队在刈谷体育场迎战朝鲜队，CCTV5、央视频直播。中国男足亚运队以U23亚洲杯亚军为班底，补入吴曦、张玉宁、朱辰杰3名超龄球员，与伊朗、阿联酋、朝鲜同处B组，目标小组前两名晋级八强。", "source": "懂球帝", "url": "https://www.dongqiudi.com/articles/6347731.html"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "引力一号遥三一箭九星海上发射成功，载荷破3吨创新高", "summary": "北京时间9月16日6时，我国太原卫星发射中心在东海海域用引力一号遥三运载火箭，将千帆极轨26组卫星及EUHT技术试验卫星共9颗送入预定轨道，任务成功。本次净载荷超3吨、入轨高度约800公里，创单次海上发射载荷重量与轨道高度新高，为千帆星座组网精准补位。", "source": "新浪财经（央视新闻）", "url": "https://finance.sina.com.cn/jjxw/2026-09-16/doc-inirykpe6574522.shtml"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "中国西南首次发现丹尼索瓦人化石，填补地理空白", "summary": "中科院古脊椎所付巧妹团队联合云南多家单位，从云南鹤庆蝙蝠洞6万余块碎骨中鉴定出5件丹尼索瓦人遗骸，年代距今约16.7万至13.4万年，其中1块桡骨为全球首例丹尼索瓦人桡骨化石。成果9月9日发表于《自然》，填补了中国西南地区该古人类的地理空白。", "source": "中国网", "url": "https://big5.china.com.cn/gate/big5/cul.china.com.cn/2026-09/15/content_43491451.htm"}, {"id": 10, "category": "游戏电竞", "scope": "国内", "title": "QQ飞车手游S联赛秋季赛9月16日开赛", "summary": "QQ飞车手游S联赛2026秋季赛于9月16日13时在江苏太仓市工人文化宫电竞馆开赛，AG、KZ、RSG、广州狼队等8支老牌俱乐部携休赛期新阵容亮相。赛程从9月16日持续至11月21日秋季总决赛，分赛段积分博弈、道具与竞速双线升级，全平台同步直播。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0EOI100"}, {"id": 11, "category": "娱乐影视", "scope": "国内", "title": "年度电影票房破290亿，全产业链产值超4500亿", "summary": "灯塔专业版数据显示，截至9月15日，2026年度电影总票房（含预售）突破290亿元，达290.07亿元，观影人次7.37亿、放映1.06亿场。年内已有9部影片票房破10亿，《飞驰人生3》《功夫女足》《欢迎来龙餐馆》领跑；中秋国庆档定档21部，全年票房有望冲击300亿。", "source": "证券日报", "url": "https://cj.sina.cn/articles/view/2311077472/89c03e6002002o1f4"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "国家卫健委倡议多喝白开水淡茶水，2030年人均预期寿命目标80岁", "summary": "国家卫健委在国新办'十五五'健康中国发布会上倡议居民少盐少油少糖、多喝白开水与淡茶水，目标2030年人均预期寿命从79.25岁提升至80岁；同时提出加强托育综合服务中心建设，到2030年实现地市级托育综合服务中心全覆盖，并通过优质医学本科与硕士扩招扩容基层医疗人才。", "source": "北京市人民政府门户", "url": "https://www.beijing.gov.cn/ywdt/zybwdt/202609/t20260915_4864123.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "汽车产业兼并重组将成重点，车企加速智能化整合", "summary": "车百会研究院理事长张永伟表示，未来几年汽车产业将更受市场关注，兼并重组成为重点推动方向，应在全国统一大市场基础上发挥市场机制作用。近期零跑发布世界模型智驾等5项新技术，小马智行与广汽首发第四代L4自动驾驶重卡，行业从价格战转向整合与智能化竞争。", "source": "财经早餐（今日头条）", "url": "https://www.toutiao.com/article/7685891504795107881/"}, {"id": 14, "category": "社会民生与教育", "scope": "国内", "title": "地震预警信息正沟通接入iOS，同步推进小区广播", "summary": "中国地震局在官网回应网友建议时表示，中国地震台网中心正与苹果公司沟通，力争加快推进地震预警信息接入iOS系统；目前苹果用户可通过微信小程序获取权威预警。地震局同时正配合工信部推进地震预警接入小区广播系统，扩大国家权威预警的直达渠道，减少对第三方来源的依赖。", "source": "腾讯新闻（红星新闻）", "url": "https://news.qq.com/rain/a/20260914A05E5300"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "前8月碳市场累计成交9.61亿吨，碳定价机制持续完善", "summary": "9月15日武汉2026中国碳市场大会上发布的《全国碳市场发展报告(2026)》显示，截至8月底全国碳排放权交易市场累计成交量9.61亿吨、成交额656.99亿元。2026年发电、钢铁、水泥、铝冶炼四行业纳入重点排放单位达3680家，覆盖二氧化碳排放量约83亿吨、占全国65%以上。", "source": "人民网", "url": "https://hb.people.com.cn/n2/2026/0915/c406123-41696847.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "平陆运河航区正式公布，西南出海物流成本降18%—30%", "summary": "9月15日广西海事局公布平陆运河航区：内河段（南宁横州平塘江口至G75兰海高速钦江大桥）暂定为'内河B级航区'，标志新中国成立以来首条通江达海运河的航区体系全面确立。符合A级技术条件的内河船可经运河直航钦州湾，西南货物出海缩短航程560公里以上、物流成本降18%—30%。", "source": "中国新闻网", "url": "https://www.chinanews.com/aseaninfo/2026/09-15/10696933.shtml"}, {"id": 17, "category": "科学探索", "scope": "国内", "title": "中国向联合国赠送嫦娥六号月壤，维也纳永久展出", "summary": "当地时间9月14日，中国国家航天局在维也纳联合国总部举行交接仪式，正式将嫦娥六号采集的人类首批月背月壤样品赠送联合国，并在总部永久展出，400余名各界代表出席。这是中国推动航天成果共享、践行外空非武器化立场的又一标志性举措，也是中国航天走向世界的生动注脚。", "source": "中国新闻网", "url": "https://www.chinanews.com/gn/2026/09-15/10696644.shtml"}]}, "yest": {"date": "2026-09-15", "generatedAt": "2026-09-15T07:12:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国际", "title": "伊朗宣布霍尔木兹海峡“已被封锁”，超级油轮触雷起火", "summary": "伊朗伊斯兰革命卫队海军14日宣布，超级油轮“阿尔加亚”号试图穿越霍尔木兹海峡以南禁航区时触碰水雷、爆炸起火，灭火失败致船只陷入大火；卫队宣布海峡已被封锁并处于伊方“智能管控”之下。美军中央司令部否认该油轮最近触雷，称其上月已遭伊朗导弹袭击丧失航行能力。船舶追踪数据显示，上周末海峡单日通行量骤降至个位数，远低于此前日均14艘。联合国伊朗问题独立调查团敦促美以遵守国际法。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685523386620985908/"}, {"id": 2, "category": "国际时事", "scope": "国内", "title": "外交部提醒中国公民暂勿前往塔吉克斯坦与阿富汗边境", "summary": "外交部与中国驻塔吉克斯坦使馆14日发布提醒：当前塔吉克斯坦和阿富汗边境地区安全形势复杂严峻，近期发生流弹落入塔境内及阿富汗人员非法越境事件，造成人员伤亡和财产损失。已在当地的中国公民和机构应尽快撤离或转移至相对安全区域；执意前往或驻留将面临极高安全风险。使馆同时公布了塔紧急救助电话与24小时领保热线。", "source": "外交部", "url": "https://www.toutiao.com/article/7685524874151985700/"}, {"id": 3, "category": "战争与自然灾害", "scope": "国际", "title": "尼泊尔泥石流灾害遇难人数升至1392人", "summary": "据尼泊尔警方公布的数据，截至当地时间14日11时，尼泊尔泥石流灾害造成的遇难人数已升至1392人。连日强降雨在多地引发山体滑坡与泥石流，救援与善后工作仍在持续。", "source": "央视新闻", "url": "https://news.qq.com/rain/a/20260915A0301S00"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "特朗普称俄乌已同意互不打击能源目标，泽连斯基拟纽约会晤", "summary": "美国总统特朗普14日在社交媒体称，俄罗斯和乌克兰已同意不攻击对方的能源目标；此前一天他曾批评基辅袭击俄炼油厂。乌克兰总统泽连斯基当天表示，对能源领域停火持开放态度，并计划于9月21日至23日在纽约与特朗普会晤时就此事进行讨论。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1789426474264&item_id=14900316024913496413&channelId=1119"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "芬兰宣布加入法国“前沿威慑”核计划，朝鲜举行火力打击训练", "summary": "芬兰与法国14日发布联合声明称，芬兰已决定加入法国总统马克龙此前提出的“前沿威慑”核计划。另据朝中社报道，朝鲜人民军近日进行协同火力打击训练，出动新型战斗系统。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-15/detail-ihfkhckz2205351.shtml"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "习近平将于9月24日在华盛顿会晤特朗普，钇出口管制或成筹码", "summary": "据港媒报道，中国国家主席习近平将于9月24日在美国华盛顿与特朗普举行会晤。报道称，北京对稀土元素“钇”供应的严密管控，预计将成为双方谈判中的关键筹码。此前中方已收紧多种稀土及相关技术的出口管制。", "source": "The Standard（香港）", "url": "https://www.thestandard.com.hk/news/article/342767/Morning-Recap-September-15-2026"}, {"id": 7, "category": "国际时事", "scope": "国际", "title": "武契奇宣布将于9月27日辞去塞尔维亚总统职务", "summary": "塞尔维亚总统武契奇14日表示，将于9月27日辞去总统职务。此前塞尔维亚国内因大规模抗议活动持续动荡，政局走向引发外界关注。", "source": "央视新闻", "url": "https://www.capitalfutures.com.tw/zh-tw/Financial/BreakingNewsArticle?ContentId=C26091500163"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "央行15日开展5000亿元买断式逆回购，前8月社融增量23.91万亿元", "summary": "中国人民银行公告，9月15日将开展5000亿元买断式逆回购操作，期限为6个月。最新数据显示，前8个月我国社会融资规模增量累计23.91万亿元，人民币贷款增加10.44万亿元；债券、股票融资增长较快，直接融资占比首次超过贷款，贷款提质降速成为新常态。8月末M2余额同比增长7.5%，8月新发放个人住房贷款加权平均利率为3.1%，处历史低位。", "source": "陆家嘴财经早餐（Wind）", "url": "https://www.163.com/dy/article/L6RLQID605198RSU.html"}, {"id": 9, "category": "科技互联网与AI", "scope": "国内", "title": "上海启动“明珠星座计划”，打造吉瓦级天基计算星座", "summary": "上海近日启动“明珠星座计划”，目标是打造吉瓦级天基计算星座，建设覆盖全球的近地轨道算力网，成为未来人工智能的算力底座。另据中国电信研究院报告，预计2026年我国Token年消耗量将达10亿亿，2030年超3500亿亿，年复合增长率接近12倍；未来2—3年算力需求年均增长近10倍。", "source": "陆家嘴财经早餐", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8246aa87a5c51852"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "《退役军人服务和保障“十五五”规划》印发", "summary": "近日，中共中央办公厅、国务院办公厅、中央军委办公厅印发《退役军人服务和保障“十五五”规划》，对“十五五”时期做好退役军人工作作出部署，重点是推进退役军人高质量安置就业、提升退役军人服务保障效能等方面。", "source": "央视新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34071795"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "“十五五”将建“数智”疾控，AI大模型为传染病防控赋能", "summary": "国家疾控局在国新办发布会上表示，“十五五”时期将从体系、能力和策略三方面提升疾病预防控制水平，建设“数智”疾控，开发人工智能大模型和智能体为传染病防控赋能增效。目前我国已在5万多家医疗机构部署传染病智能化监测预警前置软件。国家卫健委同时宣布，今年将新增1000家基层医疗卫生机构提供儿科诊疗服务。", "source": "人民网", "url": "https://politics.people.com.cn/n1/2026/0915/c461001-40798660.html"}, {"id": 12, "category": "国际时事", "scope": "国际", "title": "习近平指引“大金砖”筑牢务实合作根基，中国明年接任主席国", "summary": "据新华社报道，习近平主席在金砖峰会上提出“将率先建设金砖国家人工智能开源专区”“推动建立金砖国家数字产业云平台”“协助金砖国家建设智能工厂”“提议建立金砖国家工程师培养联盟”等一系列务实举措，指引“大金砖”筑牢合作根基。中国将于明年接任金砖主席国，主办金砖国家领导人第十九次会晤。", "source": "光明网（新华社）", "url": "https://news.gmw.cn/2026-09/15/content_39000151.htm"}, {"id": 13, "category": "科技互联网与AI", "scope": "国内", "title": "2026国家网络安全宣传周开幕，青少年蓝皮书揭示未成年人用网新特征", "summary": "由中央宣传部、中央网信办等10部门联合举办的2026年国家网络安全宣传周14日在山东济南开幕，主题为“智能时代网安护航”。同期发布的《青少年发展蓝皮书》显示，我国未成年网民规模达1.98亿，互联网普及率98.3%；78.5%的受访未成年网民使用AI学习、创作或娱乐，但83%的受访教师担忧学生滥用AI，23.1%担心对AI形成心理依赖。", "source": "中国青年网", "url": "https://news.youth.cn/gn/202609/t20260915_16869523.htm"}, {"id": 14, "category": "科技互联网与AI", "scope": "国内", "title": "豆包手机助手消费者版发布，将搭载努比亚NaviX Ultra", "summary": "9月14日，豆包手机助手消费者版本正式发布。相比去年底的技术预览版，消费者版更强调稳定性和日常可用性，交互能力、个人上下文与记忆能力、任务执行是新版重点。该版本将搭载在努比亚NaviX Ultra手机上，目前已开启预约，9月16日正式发售。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7685522104495997449/"}, {"id": 15, "category": "科技互联网与AI", "scope": "国际", "title": "特朗普称“AI毁灭人类是骗局”，美国内激辩AI风险硬扯中国", "summary": "特朗普近日称，所谓人工智能将接管世界、毁灭人类等说法都是“骗局”，并公开抨击Anthropic首席执行官呼吁放缓AI发展的立场，重申美国领先优势不容动摇。美媒称，围绕AI风险的密集讨论被生硬地扯上中国。值得注意的是，OpenAI首席执行官奥尔特曼与xAI创立者马斯克均表态支持“稳步推进前沿技术”。受AI开发放缓担忧影响，周一全球存储、芯片股大跌。", "source": "环球时报", "url": "https://www.toutiao.com/article/7685527736491852307/"}, {"id": 16, "category": "科技互联网与AI", "scope": "国内", "title": "智能经济活力奔涌，全栈AI能力服务千行百业", "summary": "据人民日报报道，从昆仑芯、百舸计算平台、千帆平台到深入行业的应用，全栈AI基础设施正为新兴产业、未来产业提供底座支撑，已服务80%的央企和大量中小企业。该平台2025年成功支持超过2000万辆L2级辅助驾驶新车交付，并服务北京人形机器人创新中心及智元、宇树等50余家具身智能产业链企业。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260915A02UI800"}, {"id": 17, "category": "战争与自然灾害", "scope": "国内", "title": "海南五指山遭极端特大暴雨，单日降水611.2毫米破观测史纪录", "summary": "受冷空气和热带低压共同影响，过去三天海南是全国降水最凶猛地区，大部累计雨量超100毫米，东南部超400毫米，保亭、琼中、万宁、五指山局地超600毫米。其中13日20时至14日14时，五指山降水量高达611.2毫米，打破当地观测史单日降水量纪录；14日6时至10时的5个小时就下了366.5毫米。广西南部、海南岛南部15日仍有暴雨或大暴雨。", "source": "中国天气网", "url": "https://www.tsrb.com.cn/xwzx/2026-09/15/content_300021870.html"}, {"id": 18, "category": "环境气候", "scope": "国内", "title": "昌化江形成近5年最大洪峰，大广坝水库开闸泄洪", "summary": "受南海热带低压残余环流与冷空气共同影响，海南岛东南半部普降暴雨到大暴雨，昌化江流域形成近5年最大洪峰，流域累计降雨量310毫米，大广坝水库水位迅猛上涨。电厂自12日15时启动预泄腾库，截至14日17时下泄流量由每秒1000立方米提升至5500立方米，已开启4扇弧门泄洪，同步保障电力供应。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685440817518953001/"}, {"id": 19, "category": "战争与自然灾害", "scope": "国内", "title": "2026年防汛抗洪救灾纪实：全力守护人民生命安全", "summary": "据新华社纪实报道，今年7月以来台风“美莎克”“巴威”先后登陆，7月26日台风“红霞”以14级风力登陆广东，8月9日台风“白海豚”两次登陆浙江，9月3日复活的台风“沙德尔”第三次登陆闽赣粤，多地出现大暴雨甚至特大暴雨。在以习近平同志为核心的党中央坚强领导下，各地深入排查灾害风险隐患、科学统筹抢险救灾力量，全力保障人民群众生命财产安全。", "source": "上海证券报（新华社）", "url": "https://paper.cnstock.com/html/2026-09/15/content_2269070.htm"}, {"id": 20, "category": "体育赛事", "scope": "国内", "title": "亚运男篮中国105:61胜菲律宾，三连胜晋级八强", "summary": "14日，第20届亚运会男篮小组赛末轮，中国队以105:61大胜菲律宾队，以3战全胜锁定小组头名晋级8强，报了3年前杭州亚运会半决赛不敌菲律宾的一箭之仇。全队7人得分上双，王俊杰贡献20分14个篮板的两双数据；三场小组赛场均净胜对手42.7分。八强战中国队将对阵沙特队。同日国际乒联排名公布，中国球员王曼昱首登女单世界第一。", "source": "天津日报", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-09/15/content_143092_3839603.htm"}, {"id": 21, "category": "体育赛事", "scope": "国际", "title": "名古屋亚运会陷“住宿风波”，韩方批“史上最差”", "summary": "即将开幕的爱知·名古屋亚运会陷入住宿风波。韩国体育官员14日抱怨本届赛事住宿条件堪称“史上最差”，存在“严重的房间短缺”。为压缩成本，本届亚运会未建专门的运动员村，而以邮轮、集装箱式宿舍和酒店分散安置运动员。韩国球员吐槽集装箱小屋床铺太短、洗手池漏水。本届预计接待超1.7万名运动员和体育官员，规模超过奥运会。", "source": "环球时报", "url": "https://3w.huanqiu.com/a/de583b/4TDEDyGc0Yz?agt=23"}, {"id": 22, "category": "体育赛事", "scope": "国内", "title": "中国多支队伍亮相亚运赛场，女篮男足即将登场", "summary": "第20届亚洲运动会19日将在日本爱知县名古屋市开幕，包括足篮排三大球在内的多个项目提前开赛。中国男篮已三连胜出线；中国女篮19日小组赛首战泰国队、21日对阵印度尼西亚队，主力中锋韩旭因征战WNBA无缘本届。中国亚运男足以U23亚洲杯亚军阵容为班底，征召吴曦、张玉宁、朱辰杰3名超龄球员，与伊朗、朝鲜、阿联酋同组，9月16日首战朝鲜队。", "source": "环球时报", "url": "https://www.163.com/dy/article/L6RM136S0514R9OJ.html"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
