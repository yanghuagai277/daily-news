、通义千问与智谱GLM等模型；金融科技企业雷沃卢特将约2000名工程师默认编程模型替换为智谱GLM，编程耗时缩短约60%、调用成本下降近90%。", "source": "央视网/新华网", "url": "https://news.cctv.com/2026/11/13/ARTI8jijUA0t4yQ9Pa5jznM8261113.shtml"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "五大AI巨头遭起诉 要求冻结新模型", "summary": "一个由网络安全与消费者权益组织组成的联盟周四起诉Anthropic、谷歌、Meta、OpenAI和SpaceXSI五家AI企业，请求法官阻止其进一步开发或部署新AI模型。诉状援引已有AI系统实施网络攻击等案例，指控其违反加州反不正当竞争法，并引述企业高管承认技术或毁灭人类的风险。", "source": "网易/中新经纬", "url": "https://www.163.com/dy/article/LBJL4CJU0519C6T9.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "库什纳威特科夫抵克里姆林宫与普京会谈", "summary": "俄美乌三方会谈11日在阿布扎比结束后，美特使威特科夫与总统女婿库什纳12日抵达莫斯科克里姆林宫与普京会谈，讨论纳入欧洲参与后续谈判。俄方表示愿立即就欧洲安全问题与美展开讨论，各方正协调迄今最大规模战俘交换（各自或超1000人）。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=3398325833850865941&channelId=1119"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "欧盟拟年底前推出第22轮对俄制裁", "summary": "欧盟委员会主席冯德莱恩12日表示，将在11月26-27日特别峰会前提出第22轮对俄制裁方案及2027年对乌融资措施。新方案预计加强对俄银行、加密货币及第三国规避漏洞的限制，并可能禁止白俄与俄运动员参加欧盟境内国际赛事。", "source": "Reuters/The Star", "url": "https://www.thestar.com.my/news/world/2026/11/12/eu-to-present-new-russia-sanctions-package-ukraine-funding-measures-by-year-end"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "高校毕业生秋招再推131场就业服务活动", "summary": "人社部消息，\"职引未来——2026年全国城市联合招聘高校毕业生秋季专场\"推出第三批131场就业服务活动，含87场重点行业校园招聘会、3场跨区域巡回招聘及32场直播带岗。覆盖生物医药、新能源、汽车、金融、机器人等领域，为毕业生提供精准就业支持。", "source": "光明网", "url": "https://news.gmw.cn/2026-11/12/content_39097234.htm"}, {"id": 6, "category": "社会民生与教育", "scope": "国内", "title": "十五五将盘活义务教育资源 扩容学位", "summary": "发改委\"奋进十五五\"发布会介绍，我国将盘活富余学前与义务教育资源、扩容普高与优质本科学位，推动养老托育普惠降价。2026年已下达中央预算内投资140亿元支持养老托育设施建设，并通过超长期特别国债更新公办养老机构设备11万台套。", "source": "中国西藏网/央广网", "url": "https://www.tibet.cn/cn/Instant/news/202611/t20261112_8070574.html"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "加沙纳赛尔医院遭以军空袭 至少6死", "summary": "巴勒斯坦通讯社12日报道，以军当天空袭加沙南部汗尤尼斯纳赛尔医院，造成至少6死20余伤，死者含一名外科医生。以方称精准打击哈马斯汗尤尼斯旅指挥官。自7日暴雨来袭，数万顶帐篷被淹，逾15万顶帐篷及排水设备仍未获以方批准进入，人道危机加剧。", "source": "新浪新闻/新华网", "url": "https://news.sina.com.cn/w/2026-11-12/doc-iniyntut1096664.shtml"}, {"id": 8, "category": "科学探索", "scope": "国际", "title": "火星阿尔巴山探测到异常氯化氢 火山或仍\"活\"着", "summary": "国际团队在《科学进展》发表研究，于火星阿尔巴山附近寒冷季节探测到异常聚集的氯化氢气体，并发现多条此前未识别的狭窄裂缝（宽数十厘米、长可达10公里）。异常信号指向地下仍有岩浆活动，若证实或为微生物提供热液环境，为寻找火星生命提供新方向。", "source": "新浪科技/科技日报", "url": "https://k.sina.com.cn/article_5953466437_162dab0450670bhmmc.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "中国北方旱区首次发现\"精灵圈\"现象", "summary": "中科院地理所于贵瑞团队联合兰州大学等首次在我国北方旱区记录并确认\"精灵圈\"现象，成果11日发表于《美国科学院院刊》。研究引入相变理论，揭示灌草在资源竞争中达成\"亚稳态\"空心环的空间分割机制，或为沙漠边缘生态预警提供新标尺。", "source": "搜狐/新华社", "url": "https://www.sohu.com/a/1100747012_162758"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "达喀尔青奥会中国体操混团夺历史首金", "summary": "11日达喀尔青奥会体操混合团体决赛，杨兰斌与陈紫嫣凭三轮稳定发挥助中国队夺该项目青奥会历史首金，日本、以色列分获银铜。拳击赛场张正坤获男子60公斤级铜牌；此前中国已包揽男、女团体两金，田径再添两银一铜。", "source": "新浪财经/新华社", "url": "https://finance.sina.com.cn/jjxw/2026-11-13/doc-iniypksm1089512.shtml"}, {"id": 11, "category": "健康养生", "scope": "国际", "title": "中外团队Nature研究：肥胖诊断不能只看体重", "summary": "华中科大潘安团队基于中、英、美、西四国超84万人数据研究证实，肥胖诊断不能单凭BMI\"一刀切\"。约22.7%-31.3%的体脂过多者仅处\"临床前肥胖\"，10年随访显示临床前肥胖全因死亡风险增19%、临床肥胖陡增69%。成果12日发表于《自然》。", "source": "科学网/中新网", "url": "https://news.sciencenet.cn/htmlnews/2026/11/574625.shtm"}, {"id": 12, "category": "环境气候", "scope": "国际", "title": "2026全球碳预算报告：化石燃料排放微降0.4%", "summary": "国际\"全球碳计划\"报告预计，2026年全球化石燃料二氧化碳排放量同比微降0.4%至382亿吨，主因太阳能风能扩张及能源市场动荡。但计入土地利用变化排放后总量将升至433亿吨；中国贡献了全球约一半由可再生能源和电动车避免的减排。", "source": "中国经济网/新华社", "url": "http://tech.ce.cn/yw/202611/t20261112_3291704.shtml"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "中国新能源车\"开向亚太\" 产业链本地化落地", "summary": "在APEC深化区域合作背景下，中国新能源车从深圳小漠港装船出海，在泰国、马来西亚、新加坡等地扎根。某车企在泰累计交付破13万辆、门店超160家、罗勇府工厂设计年产能15万辆，本地化生产模式带动亚太绿色出行。", "source": "云南网/央视新闻", "url": "https://news.yunnan.cn/system/2026/11/12/034194250.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "第二届莫斯科国际游戏周落幕 吸引25万人次", "summary": "第二届莫斯科国际游戏周11月1日闭幕，四天吸引25万人次参与，促成25国合作伙伴交流。CS2国际赛事956支战队预选、直播观赛200万；公众\"电子游戏之夜\"约1.5万人参与。莫斯科游戏中心与上海、阿布扎比园区并列全球竞争力前三。", "source": "网易", "url": "https://www.163.com/dy/article/LBI4Q4QU0556PAP8.html"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026广西知识大会启幕 以\"知识的长河\"为主题", "summary": "2026广西知识大会11月13-15日在广西博物馆启幕，联动书店与\"小而美\"阅读空间开设分会场。设名家对谈、万册好书3折展销、非遗市集、鲁迅诞辰145周年文学快闪及平陆运河主题专区等七大板块，把读书拆成多种打开方式。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261104A09ZYY00"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "秋假催热11月旅游淡季 主题乐园研学爆发", "summary": "各地秋假政策带动主题乐园与研学游爆发，上海海昌旗下酒店自12日起连续7天提前满房、收入同比增10%；去哪儿数据显示开封万岁山、自贡恐龙博物馆等门票预订同比增超10倍，北京景区搜索量同比大增360%领跑全国。", "source": "重庆日报/澎湃", "url": "https://www.cqrb.cn/shishi/2026-11-12/2819810_pc.html"}, {"id": 17, "category": "科技互联网与AI", "scope": "国内", "title": "工信部加强智能体终端设备进网管理", "summary": "工信部近日印发《关于加强智能体终端设备进网管理的通知》，为具备自主感知、决策、执行能力的智能体终端（含手机、穿戴设备、智能网联汽车、人形机器人）划定运行边界，防范隐私泄露、算法偏差与新型网络攻击等风险，引导AI健康发展。", "source": "中国经济网", "url": "http://ipaper.ce.cn/pad/content/202611/13/content_341816.html"}]}};</script>

  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
