权正成为云平台竞争新战线。", "source": "网易（据The Information）", "url": "https://www.163.com/dy/article/LC348GI5051288FS.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "美联储会议纪要释放鹰派信号，12月加息概率升至约95%", "summary": "美联储11月18日公布的10月底会议纪要显示，绝大多数官员认为通胀前景存在上行风险、采取进一步加息行动是合适的，部分官员称12月加息超过25个基点或合理。利率期货定价显示12月加息25个基点概率约95%。美元指数升至103.82附近，创2025年4月以来新高。", "source": "新华财经/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03VC800"}, {"id": 8, "category": "财经经济与就业", "scope": "国际", "title": "金价单日暴跌3.22%创一年多新低，伦锡跌逾8%", "summary": "受美元走强、美联储加息预期升温及大宗商品遭抛售影响，11月18日现货黄金暴跌3.22%至3724.94美元/盎司，创2025年9月以来最低，现货白银跌4.95%；伦敦铜跌逾4%、伦锡跌逾8%。高盛将2026年底金价预测从4650美元下调至4150美元。", "source": "FX168财经报社/汇通网", "url": "https://www.fx678.com/C/20261118/202611181555169111.html"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "2026全国城市联合招聘秋招：提供岗位551.5万个", "summary": "人社部数据显示，自9月20日启动的'职引未来—2026年全国城市联合招聘高校毕业生秋季专场活动'持续开展，全国2400多家公共就业人才服务机构协同发力，截至目前线上线下共举办1万余场招聘会，26.4万家用人单位提供岗位551.5万个，参与求职毕业生达529.1万人次。", "source": "教育部网站/人民日报", "url": "https://www.moe.gov.cn/jyb_xwfb/s5147/202611/t20261118_1458663.html"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "广西崇左发现中国已知最晚直立人化石，成果登《自然》", "summary": "11月19日《自然》杂志在线发表中国古人类研究成果：中科院古脊椎所联合山东大学等机构，在广西崇左岜仙洞、那线洞出土的9枚牙齿中有8枚属直立人，年代距今32.4万至18.4万年，为中国已知最晚直立人化石记录，改写了直立人仅在40万年前生存于中国的传统认知。", "source": "央视新闻/文汇报", "url": "https://news.yunnan.cn/system/2026/11/19/034198230.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国成功发射实践二十四号卫星", "summary": "北京时间11月19日6时51分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第678次飞行。", "source": "我们的太空/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03UWD00"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "西班牙1比0阿根廷夺2026世界杯冠军，梅西宣布离开国家队", "summary": "2026年美加墨世界杯决赛11月19日落幕，西班牙在加时赛凭借费兰·托雷斯第106分钟的进球以1比0击败阿根廷，夺得队史第二座世界杯冠军。39岁的梅西本届贡献8球4助攻，赛后宣布将离开国家队。本届赛事首次由32队扩军至48队，共进行104场比赛。", "source": "虎扑体育/中华云新闻", "url": "https://voice.hupu.com/bbs/641131026"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "2026版国家医保目录新增107种药，51种1类创新药创新高", "summary": "2026版国家医保药品目录正式发布，新增107种药品，其中51种为1类创新药，数量创历年新高。首个CAR-T药物瑞基奥仑赛注射液转入基本医保，价格从129万元降至28.86万元，报销后患者自付低于10万元。国家医保局要求医疗机构优先配备，不得以药占比等为由影响落地。", "source": "央视网/中国经济网", "url": "https://news.cctv.com/2026/11/19/ARTIQWt1RC6bnFxYVZ6o3ind261119.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "寒潮影响中东部，中央气象台继续发布大风蓝色预警", "summary": "中央气象台11月19日6时解除寒潮蓝色预警，但继续发布大风蓝色预警。预计19日8时至20日8时，内蒙古中东部、黑龙江、吉林等地部分地区降温4至8℃、阵风7至9级；20日早晨最低气温0℃线南压至河南北部至苏皖北部一带。国家防减救灾办已部署今冬低温雨雪冰冻灾害防范。", "source": "中央气象台/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03UT700"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "交通运输部推出首批354项'人工智能+交通运输'场景清单", "summary": "交通运输部近日推出首批354项'人工智能+交通运输'典型应用场景项目清单，覆盖智能驾驶、智慧公路、智能航运、智慧货运、智慧出行等方向，按攻关突破、创新示范、应用推广三类分层组织。清单定位为'开放场景'而非'发放补贴'，旨在为AI规模化落地提供真实业务场景。", "source": "交通运输部/中国汽车报", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491071&idx=2&sn=0ca5f304d4487f48ed53911158538fd9"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "《英雄联盟手游》首个全球赛事破晓杯进入淘汰赛", "summary": "《英雄联盟手游》首个全球性赛事破晓杯11月13日在新加坡开赛，来自全球8大赛区的10支战队角逐，包括中国大陆赛区的DKG和TT。赛事分小组赛和淘汰赛两个阶段，11月19日进入四分之一决赛，11月21日将以七局四胜制决出首个手游全球冠军。", "source": "超凡电竞", "url": "https://m.chaofan.com/news/l70snt7ik9x9fxv.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "长三角文博会江苏展区亮相：数智赋能非遗焕新", "summary": "长三角文博会江苏展区以'数智酷炫、非遗焕新、潮玩时尚'三大板块亮相，展会期间举办21场路演发布，覆盖人工智能赋能文化生产、数字视觉与沉浸交互、文博文创与城市IP等领域。南京十竹斋开设'饾版拱花'木版水印非遗体验，南京芯伴以《山海经》瑞兽打造AI潮玩。", "source": "新华日报", "url": "https://xh.xhby.net/pad/con/202611/19/content_1607559.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "2026至2027年雪具便利行服务启动，高铁滑雪更便捷", "summary": "11月10日起，2026至2027年雪具便利行服务正式启动，持续至雪季结束。国铁北京局在北京北、清河、太子城、崇礼等站点基础上新增北京朝阳、密云2站，总量达10个并增开4趟列车；国铁哈尔滨局服务车站增至15个，沈阳局覆盖26个站，旅客可通过12306预约。", "source": "河北日报/上海热线", "url": "https://news.online.sh.cn/news/gb/content/2026-11/19/content_10505659.htm"}]}, "yest": {"date": "2026-11-18", "generatedAt": "2026-11-18T11:59:05+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席2026年APEC工商领导人峰会开幕式并发表主旨演讲", "summary": "11月18日上午，国家主席习近平在深圳前海出席2026年APEC工商领导人峰会开幕式并发表主旨演讲，提出维护和平稳定、搭建开放合作桥梁、激发创新增长动力、拓展互利共赢路径四点建议。习近平指出，“十五五”规划既是自身发展蓝图，也是面向全球工商界的合作邀约，中国将提供超大规模开放市场。", "source": "央视网/新华社", "url": "https://news.cctv.cn/2026/11/18/ARTIstjyp3Dl9CyZQEi0ucOx261118.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "持续近九个月的美伊战争陷入“时间与经济耐力战”", "summary": "据路透社报道，持续近九个月的美伊战争正陷入围绕时间与经济承受能力的较量。美国总统特朗普暂缓新一轮大规模军事打击，转而依靠海上封锁和经济制裁迫使伊朗让步；德黑兰则认为美国政治变化削弱其谈判优势，坚持要求美方先解除封锁、释放冻结资产。分析人士警告，若经济压力持续累积，双方可能因误判重新爆发大规模冲突。", "source": "新浪财经（据路透社）", "url": "https://finance.sina.com.cn/roll/2026-11-18/doc-inizcmfi4873683.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "中加同意将初步联合安排相关豁免措施延长2年", "summary": "商务部新闻发言人11月17日表示，中加在初步联合安排基础上开展多轮经贸磋商，形成补充联合安排，双方同意将相关豁免措施延长2年。加方将进一步扩大对中国钢铝产品的豁免范围，中方相应调整对加方部分农水产品的反歧视措施。双方还就电子商务合作、中资银行在加设立分支机构等形成积极共识。", "source": "新华网/经济日报", "url": "https://www.news.cn/world/20261117/24ba2e6aaa7f4ed38a0cfba671506e5b/c.html"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "“人工智能+”加速规模化落地，重点行业渗透率突破80%", "summary": "新华网11月18日报道，“十五五”“人工智能+”行动部署密集落地，我国人工智能正从“点上示范”走向“规模落地”。国家发展改革委数据显示，重点行业人工智能整体渗透率已突破80%，工业领域累计建成万余家先进级智能工厂。下一阶段将点线面协同，优先聚焦矿山开采、高空作业、应急救灾等“险脏累繁难”场景。", "source": "新华网", "url": "https://www.xinhuanet.com/fortune/20261118/bf699bf6ab4e4cdab1d59bb5e359c760/c.html"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "新一代地球观测基础模型OlmoEarth v1.3发布并开放", "summary": "美国艾伦人工智能研究所近日发布新一代地球观测基础模型OlmoEarth v1.3，并开放覆盖全球的预计算数据和分析工具。该模型综合哨兵1号雷达、哨兵2号多光谱及Landsat数据，把每处地表一年的模样压缩为百余个数字，让生态学家、农业官员无需成为深度学习工程师也能开展地表变化监测。", "source": "新华网", "url": "https://www.xinhuanet.com/tech/20261118/ee972f56587444fb8c7b5de7b4242a9e/c.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "多项财政政策工具年末持续用力，新增专项债发行进度超九成", "summary": "临近年末多项财政政策工具持续发力。企业预警通数据显示，截至11月17日，今年已发行新增专项债40809亿元，发行进度超九成，超五成资金投向市政、产业园区和交通基础设施。财政部拟发行2026年中央金融机构注资特别国债（二期），11月18日招标面值总额1500亿元，全年3000亿元注资特别国债即将收官。", "source": "中国经济网/中国证券报", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261118_3297719.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "深化健康学校建设：学生近视率达49.9%，校园健康治理补短板", "summary": "人民政协网11月18日刊文指出，教育部2026年2月印发指导意见，明确2030年实现健康学校全覆盖、2035年普遍建成高质量健康学校。监测显示，2025年全国学生总体近视率达49.9%，6至17岁儿童青少年超重肥胖率约19%，6至16岁在校学生精神障碍患病率达17.5%，校园健康治理仍存标准滞后等短板。", "source": "人民政协网", "url": "https://www.rmzxw.com.cn/c/2026-11-18/4010254.shtml"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "乌方承认袭击克里米亚大桥，俄军空袭基辅致两座桥梁受损", "summary": "乌克兰总统泽连斯基11月17日称，乌国家安全局和军方使用无人机及“海王星”导弹打击克里米亚大桥公路和铁路设施，行动已持续数周。此前大桥连续两天遭袭、结构受损，俄方以“恐怖行为”立案。同一夜俄军对基辅发动新一轮空袭，南桥、北桥受损并禁止通行，部分区域供水供暖中断。", "source": "新华网/环球网", "url": "https://www.news.cn/world/20261117/4a1efd23e795454b934197027b509f0b/c.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "神舟二十四号船箭组合体转运至发射区，将首次中外航天员联合飞行", "summary": "据中国载人航天工程办公室消息，11月17日神舟二十四号载人飞船与长征二号F遥二十四运载火箭组合体已转运至酒泉发射区，计划近日择机发射，任务正式进入发射准备阶段。本次任务是我国首次中外航天员联合飞行，一名巴基斯坦航天员将以载荷专家身份短期在轨飞行后，随神舟二十三号返回地球。", "source": "央视网/云南网", "url": "https://news.yunnan.cn/system/2026/11/18/034197344.shtml"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "旅行者1号飞抵距地球“1光日”，成人类最远信使", "summary": "美国航天局表示，1977年发射的旅行者1号于11月18日10时16分（UTC）抵达距地球约259亿公里处，成为首个到达“1光日”距离的人造物体，飞行历时逾49年。它以每小时约6.1万公里飞离地球，是首个进入星际空间的探测器；因钚电池能量衰减，NASA近年正逐一关闭仪器以延长其工作寿命。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261117A05H9600"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "熊猫杯：中国U19男足2比1胜韩国，时隔8年再夺冠", "summary": "11月17日，在四川成都举行的2026CFA中国之队熊猫杯国际青年足球锦标赛中，中国U19国家男子足球队2比1战胜韩国U19队，以两胜一平积7分的战绩夺冠，这是中国队继2018年后时隔8年再度问鼎。第5分钟苗润东低射破门，第9分钟他造点、杨铭锐主罚命中，韩国队第74分钟扳回一球。", "source": "新华网/云南网", "url": "https://news.yunnan.cn/system/2026/11/18/034197605.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "三部门发文全面推行疫苗处方，“十五五”逐步实现全覆盖", "summary": "国家疾控局、国家卫健委、国家中医药局11月17日联合发布《关于全面推行疫苗处方工作的指导意见》，提出“十五五”期间逐步实现疫苗处方在二级以上医疗机构和基层机构全覆盖，构建“诊疗—评估—处方—宣教—接种”服务模式。意见明确可为老年人、慢性病患者等开具流感、肺炎球菌、带状疱疹等疫苗处方，网络诊疗不得开具。", "source": "央视新闻/云南网", "url": "https://society.yunnan.cn/system/2026/11/18/034197418.shtml"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "中央气象台继续发布寒潮蓝色预警，中东部大范围降温", "summary": "中央气象台11月18日6时继续发布寒潮、大风蓝色预警。受强冷空气影响，18日8时至20日8时，内蒙古东北部、东北中北部、黄淮、江淮、江南及华南等地先后降温6至8℃，黑龙江东南部、吉林东部、山东南部、江苏、浙江等地部分地区降温8至10℃、局地超12℃。20日早晨0℃线南压至陕西南部到黄淮东南部一带。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/weatherperday/index.htm"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "碳排放权交易市场开放联盟通过《COP31宣言》", "summary": "据新华网11月18日报道，碳排放权交易市场开放联盟在COP31相关活动中通过《COP31宣言》，呼吁加强全球碳市场互联互通与气候合作。此前COP31“中国角”聚焦全球城市可持续发展。在全球气候治理面临单边主义冲击的背景下，与会各方强调维护多边合作机制，推动绿色低碳转型与公平包容的气候治理。", "source": "新华网", "url": "https://www.news.cn/world/20261118/c788b9bf7a2646418d57d805799d88e3/c.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "工信部就动力电池“数字身份证”管理暂行规定征求意见", "summary": "工信部近日就《新能源汽车动力电池数字身份证管理暂行规定》公开征求意见。数字身份证以国家标准规定的24位编码为唯一索引，串联动力电池设计、生产、装车、维修、拆解、回收、综合利用全环节信息。数据显示，今年1至9月我国动力电池销量1086.4GWh、同比增长38.2%，新规将强化全链条监管与回收利用。", "source": "中国能源网", "url": "https://www.cnenergynews.cn/article/4U4fU0emAY0"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "Faker获电竞世界杯“选手选择奖”第一名，TGA公布年度提名", "summary": "11月18日，电竞世界杯（EWC）与电子竞技大奖联合公布本届“选手选择奖”，T1中单Faker获第一名。该奖是目前唯一由职业选手投票选出的奖项，旨在表彰赢得同行尊重的选手。反差在于，2026年Faker未获任何国际赛事冠军，却凭全年稳定发挥获同行认可。同日TGA公布了年度最佳电竞选手等提名名单。", "source": "什么值得买/EWC", "url": "https://post.m.smzdm.com/p/ae653dvk"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十一届博博会开幕：文脉交汇、科创共生，文创持续出圈", "summary": "11月18日《光明日报》报道，第十一届中国博物馆及相关产品与技术博览会（博博会）上，各大博物馆以“文脉交汇、科创共生”展现文化传承。内蒙古博物院用裸眼3D立体还原鹰顶金冠饰等国宝，广西民族博物馆开设铜鼓拓印体验；国家博物馆凤冠冰箱贴、三星堆考古盲盒等文创产品热度不减。", "source": "光明日报/光明网", "url": "https://news.gmw.cn/2026-11/18/content_39106173.htm"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "秋假点燃“追雪”热：冰雪关键词搜索量月环比增超183%", "summary": "随着11月中旬全国多省市密集放秋假，旅游市场迎来高峰。同程旅行数据显示，截至11月17日，平台“滑雪”“赏雪”“避寒”等关键词搜索量月环比增超183%。深圳秋假为11月17日至20日，深圳飞阿勒泰机票预订热度同比增超84%；首批开板雪场滑雪票预订热度涨超57%，周边酒店民宿预订热度增超45%。", "source": "深圳新闻网", "url": "https://www.sznews.com/news/content/2026-11/18/content_32217438.htm"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
