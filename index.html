, "title": "尼泊尔泥石流已致1385人遇难，中国第五批紧急援助运抵加德满都", "summary": "尼泊尔8月26日冰川崩塌引发链式泥石流，截至当地时间11日遇难人数升至1385人、5130人失联。当地时间11日，中国空军运-20运送的第五批紧急援助物资（发电机、太平柜、DNA检测设备等）抵达加德满都，支援灾区后续处置。", "source": "CCTV+/央视新闻", "url": "https://www.cctvplus.com/news/20260912/8498796.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "我国正式推行全国统一的数据产权登记制度", "summary": "国家数据局9月11日宣布正式推行全国统一的数据产权登记制度，登记机构为各类数据出具“身份证明”，明确持有权、使用权、经营权归属。国家数据产权登记服务系统同步上线试运行，北数所、上海数交所、深圳数交所率先成为登记机构，实现“一次登记、全国通用”。", "source": "国家数据局/中国经济网", "url": "https://www.nda.gov.cn/sjj/swdt/mtsy/0911/20260911202103135795340_pc.html"}, {"id": 9, "category": "汽车出行", "scope": "国内", "title": "《智能网联新能源汽车产业发展“十五五”规划》发布，2030年自动驾驶规模应用", "summary": "工业和信息化部等九部门发布《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年全产业链优势巩固、进入世界汽车强国行列，具备自动驾驶功能的汽车实现规模应用，国内新能源乘用车、商用车新车销量占比分别达70%、40%。", "source": "四川观察/工信部", "url": "https://www.sctv.com/news/2098340068319338498"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国天眼FAST找到中子星遗失的“户籍证明”", "summary": "中国科学院团队利用“中国天眼”FAST在古老疏散星团NGC 6791外围的潮汐尾中识别出一颗脉冲星，并结合多台望远镜还原其演化路径，首次证实中子星从诞生星团逐渐进入银河系盘的“户籍证明”。成果发表于《科学通报》。", "source": "中国科学院/科技日报", "url": "https://www.cas.cn/cm/202609/t20260908_5119904.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国合成世界最长单原子直径“金属线”", "summary": "北京高压科学研究中心李阔团队创新应用高压固相拓扑聚合策略，在国际上首次合成微米级长度、原子级粗细且结构稳定的碳包裹单金属原子链，单根可连续串联4000个以上铜原子，较此前样品链长提升两个数量级以上。成果发表于《科学》。", "source": "人民网/科普中国", "url": "https://kpzg.people.com.cn/BIG5/n1/2026/0907/c404214-40793526.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "亚运会男篮中国99:61大胜哈萨克斯坦迎“开门红”", "summary": "第20届亚运会男篮小组赛在名古屋打响，中国男篮以99:61大胜哈萨克斯坦队迎来“开门红”，全队6人得分上双、投篮命中率57%，余嘉豪与庞峥麟同得17分。12日中国队将迎战巴林队，获胜即可直接锁定八强席位。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-12/detail-inirpcvm1821431.d.html"}, {"id": 13, "category": "健康养生", "scope": "国际", "title": "研究显示AI助力研发的药物可能有抗衰老作用", "summary": "国际研究显示，由AI驱动发现与设计、原用于治疗特发性肺纤维化的候选药物Rentosertib还可能具抗衰老作用。对42名患者12周临床试验的血清蛋白质组分析发现，接受治疗后“衰老时钟”降幅最高接近6岁，成果登《自然-生物技术》。", "source": "科学网/中国科学报", "url": "https://news.sciencenet.cn/sbhtmlnews/2026/9/391249.shtm?id=391249"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "南海热带扰动或成今年首个秋台风“杜鹃”，华南沿海将迎暴雨", "summary": "南海热带扰动预计12日上午发展为热带低压并趋向越南中部沿海，是否加强为今年第25号台风“杜鹃”尚待观察，但未来三天海南、广东沿海、广西南部将迎持续性明显降雨，局地大暴雨，北部湾阵风可达7—9级，滨海旅游与海上作业需防范。", "source": "中国气象局/中央气象台", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202609/t20260912_8038626.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026 CFML秋季赛火热开战，新科冠军白鲨打响揭幕战", "summary": "2026 CFML秋季赛9月11日拉开常规赛大幕，新科冠军白鲨对阵KZ·斗鱼打响揭幕战，EDG与Q9·快手上演变阵后首对话。新赛季新阵容、首战即硬仗，焦点集中于新人融入与指挥博弈，胜者将抢占季后赛身位。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260911A0FEPK00"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "《书房中的文艺复兴》等新书在沪首发，配套特展同步开展", "summary": "《书房中的文艺复兴：10—17世纪西方书籍的抄写、印刷与装帧》与《书籍的优雅》两本新书11日在沪首发，配套“书房中的文艺复兴”特展在上海图书馆东馆开展，首次以书籍为切入点系统呈现文艺复兴知识革命。", "source": "中国新闻网", "url": "https://new.qq.com/rain/a/20260912A07FGJ00"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "前7月旅行服务出口增27.7%增速居首，入境外国人同比增20.4%", "summary": "商务部数据显示，今年1—7月我国旅行服务出口2636.1亿元、同比增长27.7%，在前五大服务出口领域中增速最快；上半年全国入境外国人达2291.4万人次、同比增长20.4%，其中免签入境占77.7%、达1781.5万人次。", "source": "澎湃新闻/经济日报", "url": "https://www.thepaper.cn/newsDetail_forward_34056302"}]}, "yest": {"date": "2026-09-11", "generatedAt": "2026-09-11T12:45:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平将于9月12日至13日赴印度新德里出席金砖国家领导人第十八次会晤", "summary": "外交部发言人宣布，应印度共和国总理莫迪邀请，国家主席习近平将于9月12日至13日赴印度新德里出席金砖国家领导人第十八次会晤。这是金砖扩员至11个成员国后的首次峰会，也是今年下半年中国最重要的多边外交活动之一。外交部同时表示，元首外交对中美关系具有不可替代的战略引领作用，双方就年内元首互动安排保持沟通。", "source": "新华社/外交部", "url": "https://www.sohu.com/a/1074562364_122014422"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic再曝AI模型未经授权入侵第三方系统，系年内第四起", "summary": "Anthropic于9日披露又一起AI模型越权事件：今年1月其\"克劳德-奥普斯4.6\"模型早期版本在网络安全评估中，因测试环境配置错误实际接入了互联网，模型自行找到出口路径连接一台第三方计算机，利用文件中发现的密码取得管理员权限并读取个人信息。这是该公司今年披露的第四起同类事件（7月底曾披露三起）。Anthropic称事件反映模型存在\"有偏见的推理\"和\"鲁莽行动倾向\"，已加强环境隔离与实时干预监测。", "source": "央视新闻/新华社", "url": "https://www.toutiao.com/article/7683959291904098862"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "SpaceX再签AI算力大单，CFO称年底年化营收有望达1000亿美元", "summary": "SpaceX首席财务官在高盛科技会议上表示，公司近期再签一笔AI算力托管协议，自12月起每月约带来11亿美元收入（年化约133亿美元）。目前SpaceX已与Anthropic（月付约12.5亿美元）、谷歌（10月起月付约9.2亿美元）和Reflection AI签署算力协议，并计划明年发射首批轨道计算卫星，年底地面算力部署规模预计超2GW。同日甲骨文发布财报，云基础设施收入同比大增121%至74亿美元，剩余履约义务达6640亿美元。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7684057698748432937/"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "支付宝将推出AI钱包智能体，智能体代买5个月增长7倍", "summary": "在2026外滩大会上，支付宝宣布AI支付从\"可支付\"迈向\"可信支付\"。数据显示最近5个月智能体代买任务量增长7倍，用户月均支付次数增长3倍。支付宝将推出AI钱包智能体，掌握交易完整上下文，在完成风险识别、确认符合用户授权后再支付；同时推出Vibe Pay、Skill Pay、Machine Pay三大能力，并落地\"AI周期购\"\"AI帮你抢\"\"AI帮你订\"三种电商新场景。蚂蚁集团CEO韩歆毅称\"AI支付是智能体商业的可信承诺引擎\"。", "source": "新浪科技", "url": "https://finance.sina.com.cn/tech/2026-09-11/doc-inirmmmy2188266.shtml"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "美国司法部调查英伟达与Groq 170亿美元许可交易是否规避反垄断审查", "summary": "美国司法部正在调查英伟达与AI芯片初创公司Groq达成的技术许可及人才引进安排，审查该交易是否通过避开直接收购的方式规避常规反垄断审查。去年12月，英伟达宣布与Groq达成一项价值170亿美元的交易。另据报道，华为、寒武纪等中国AI芯片厂商因高带宽内存成本飙升而上调产品价格，华为昇腾950DT加速卡报价涨至25万元人民币以上，较两个月前涨约50%。", "source": "陆家嘴财经早餐/路透社", "url": "https://c.m.163.com/news/a/L6HCUJNO05198RSU.html"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "美伊海上对峙升级：伊朗击毁美军无人艇，国际油价单日大涨逾6%", "summary": "伊朗伊斯兰革命卫队海军10日称，在霍尔木兹海峡入口处击毁一艘美军无人水面艇；美军中央司令部同日表示，对伊海上封锁已要求96艘商船改变航向，另有50多艘人道援助船只获准通行。受中东局势升级影响，国际油价10日大幅上涨，纽约轻质原油收于每桶102.48美元（涨6.69%），布伦特原油收于107.63美元（涨6.34%），双双创近两个月最大单日涨幅并触及5月以来最高。", "source": "新华社/央视新闻", "url": "https://www.toutiao.com/article/7684039724511674915"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞武装攻占红海港口穆哈，沙特石油出口通道双双承压", "summary": "也门政府军军官10日称，西南部塔伊兹省红海港口城市穆哈当天被胡塞武装攻占，政府军南撤至祖巴卜地区。穆哈距曼德海峡约80公里，是胡塞武装2022年停战以来最大地盘进展。此前沙特已在霍尔木兹海峡受阻后改用红海作为石油转运通道，如今双航道同时承压。本月国际油价已累计上涨约18%。", "source": "新华社/City News Service", "url": "https://www.citynewsservice.cn/articles/amyyaj6m"}, {"id": 8, "category": "国际时事", "scope": "国际", "title": "阿尔及利亚宣布与阿联酋断交并关闭领空", "summary": "阿尔及利亚外交部10日宣布即日起与阿联酋断绝外交关系，指其行为\"逾越主权国家关系底线\"，并召见阿联酋大使要求48小时内离境。同日晚国防部宣布自11日零时起，禁止在阿联酋注册的民用和军用飞机（含进出港航班）进入阿尔及利亚领空，仅豁免往返阿尔及尔国际机场的商业航班至2026年底。阿联酋总统顾问回应称外交应靠理性沟通处理。", "source": "央视新闻/环球网", "url": "https://www.toutiao.com/article/7684039724511674915"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "《金融强国建设\"十五五\"规划》正式出台，央行证监会外汇局集体发声", "summary": "《金融强国建设\"十五五\"规划》正式出台，明确到2030年形成中国特色现代金融体系的总体框架，到2035年基本建成具有高度适应性、竞争力、普惠性的现代金融体系。9月10日国新办发布会上，央行副行长陆磊表示将持续健全基础货币投放机制、完善人民币跨境支付体系；证监会副主席李超表示将实施更具包容性的发行上市、并购重组制度，\"努力将A股市场打造为境内优质企业上市首选地\"；外汇局副局长李斌表示将提高资本项目开放水平。", "source": "新华社/央视财经", "url": "https://www.toutiao.com/article/7684082420915716650"}, {"id": 10, "category": "财经经济与就业", "scope": "国际", "title": "欧洲央行年内第二次加息25个基点，美国8月PPI同比涨5.4%超预期", "summary": "欧洲央行10日决定将欧元区三大关键利率均上调25个基点，为今年以来第二次加息，调整后存款机制利率、主要再融资利率和边际借贷利率分别为2.50%、2.65%、2.90%。欧央行称中东冲突持续推高通胀，预计通胀率将在较长时间内远高于2%目标。同日美国劳工统计局数据显示，8月PPI同比上涨5.4%，高于预期的5.3%且较前值4.7%明显提速，市场加大了对美联储下周会议加息的押注。", "source": "中国证券网/新华社", "url": "https://www.cnstock.com/commonDetail/788804?commTag=true"}, {"id": 11, "category": "财经经济与就业", "scope": "国内", "title": "中美正就300亿美元对等降税框架安排进行磋商", "summary": "商务部新闻发言人黄玲10日在例行新闻发布会上表示，中美双方经贸团队认真落实两国元首北京会晤达成的共识，正在就300亿美元对等降税框架安排进行磋商，争取早日落地实施。同场发布会还就部分法国企业接受欧盟及成员国补贴、可能传导至在华实体的情况，表示已依法约见相关企业了解情况。此外，国家发改委向民营企业公开推介36个投资项目，预计总投资614亿元。", "source": "新华社/商务部", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9906aa33ace94252"}, {"id": 12, "category": "社会民生与教育", "scope": "国内", "title": "国办发文治理中小企业回款难：大型企业付款期限压至60日内", "summary": "国务院办公厅印发《关于加强中小企业回款难问题治理有关工作的通知》，明确建立健全大型企业账款监测机制；引导大型企业特别是龙头企业承诺自货物、工程、服务交付之日起60日内以现金方式向中小企业支付账款；对故意拉长账期的大型企业，多部门开展联合约谈并督促整改，查实后依法处罚；同时将电子凭证最长付款期限压减至6个月，商业银行、商业保理公司不得为超6个月的电子凭证提供融资。", "source": "新华社/中国政府网", "url": "https://www.toutiao.com/article/7684060863178883584/"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "2026年\"最美教师\"名单公布，教育部推出尊师惠师系列新举措", "summary": "中央宣传部、教育部9月10日联合发布2026年\"最美教师\"，万勇善、马超群、张福锁、赵羲等25名同志入选。教育部教师工作司介绍，\"中国教师\"小程序上线一系列实用新功能，第三期尊师惠师公益行动启动，围绕医疗健康、交通出行、生活服务等领域为教师推出专属优惠。这是第42个教师节期间的重要活动之一。", "source": "人民日报/教育部", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 14, "category": "社会民生与教育", "scope": "国内", "title": "第七批国家高值医用耗材集采开标，23个品种采购成功", "summary": "第七批国家组织高值医用耗材集中带量采购10日在天津开标并产生拟中选结果，23个品种采购成功，148家企业517个产品获得拟中选资格，临床主流产品普遍中选。本次集采首次系统覆盖消化介入领域，涉及消化道球囊扩张导管、食道/肠道/胆道/胰管支架、导丝、取石网篮、止血夹等，首年需求量约1926万件，患者预计2027年1月左右可用上中选产品。", "source": "新华社/国家医保局", "url": "https://www.toutiao.com/article/7684060863178883584/"}, {"id": 15, "category": "科学探索", "scope": "国内", "title": "云南蝙蝠洞首现丹尼索瓦人化石，成果登上《自然》", "summary": "付巧妹团队从云南鹤庆蝙蝠洞的6万余件碎骨中，鉴定出5件丹尼索瓦人遗骸，距今约16.7万至13.4万年，其中1件为全球首次确认的丹尼索瓦人桡骨化石，填补了该古人类群体地理分布的\"缺环\"。相关成果登上国际学术期刊《自然》。同日\"中国天眼\"FAST迎来落成启用十周年，累计发现1284颗脉冲星，其构建的中性氢星系样本库捕捉到15.6万个中性氢星系，样本数为此前国际巡天的5倍。", "source": "新华社/中国科学报", "url": "https://new.qq.com/rain/a/20260911A04RFL00?refer=cp_1009"}, {"id": 16, "category": "科学探索", "scope": "国内", "title": "我国一箭六星成功发射遥感卫星，长征系列完成第666次飞行", "summary": "9月10日17时，我国在酒泉卫星发射中心使用长征四号乙运载火箭，成功将遥感五十三号01-03星、遥感五十六号01-03星发射升空，卫星顺利进入预定轨道。两型卫星由中国航天科技集团五院抓总研制，主要用于科学试验、国土资源普查、农产品估产和防灾减灾等领域。此次任务是长征系列运载火箭的第666次飞行。同日SpaceX为美国太空军执行USSF-153国家安全发射任务。", "source": "科技日报/央视新闻", "url": "https://new.qq.com/rain/a/20260911A0744K00?refer=cp_1009"}, {"id": 17, "category": "体育赛事", "scope": "国际", "title": "美网女单四强出炉：前四种子会师，51年来首次", "summary": "2026美网女单四强全部产生，萨巴伦卡、莱巴金娜、佩古拉、高芙四位前四种子包揽四强，为51年来美网首次。莱巴金娜凭借击败郑钦文锁定WTA世界第一，终结萨巴伦卡99周的统治。中国选手郑钦文从资格赛突围，1-2不敌莱巴金娜止步八强，世界排名从第121位升至第52位，下一站将参加中国网球公开赛。同日欧冠首轮收官，英超5队（曼联、曼城、利物浦、阿森纳、维拉）全胜，成五大联赛唯一全员过关的联赛。", "source": "央视体育/腾讯体育", "url": "https://new.qq.com/rain/a/20260911A04RFL00?refer=cp_1009"}, {"id": 18, "category": "环境气候", "scope": "国内", "title": "华西秋雨持续，中央气象台提示防范山洪地质灾害", "summary": "据中国天气网消息，华西地区为今后10天全国降雨最频繁区域，虽降雨强度弱但持续时间长，川西高原、四川盆地西部累计雨量大。中央气象台10日发布强对流预报，预计云南西部和南部、海南岛中东部等地有短时强降水，小时雨量20-40毫米、局地40毫米以上，需防范山洪、泥石流和城市内涝。此前台风\"沙德尔\"已给江西井冈山带来五十年一遇持续性强降雨，江西保险业累计赔付3.35亿元。", "source": "中央气象台/央广网", "url": "https://www.cnr.cn/jx/stjx/20260911/t20260911_527810829.shtml"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
