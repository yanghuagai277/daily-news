0887"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "智能体重构云边端算力分配 英特尔至强6+可稳定部署千余智能体", "summary": "证券时报报道，智能体加速进入企业办公场景，推动AI基础设施重新分工：云侧从以GPU为核心转向GPU与CPU并行，端侧任务处理照进现实。英特尔判断智算中心CPU与GPU配比将逐步收敛至1∶1，其至强6+最高可稳定部署超1000个智能体，单颗最多支持350个沙箱并发创建。", "source": "网易（证券时报）", "url": "https://www.163.com/dy/article/LA7PM2NV053469RG.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "戈兰高地遭火箭弹袭击致12死 以色列誓言让真主党付出“沉重代价”", "summary": "黎巴嫩真主党27日向以色列占领的戈兰高地城镇迈季代勒舍姆斯发射数十枚火箭弹，一枚击中足球场造成包括儿童在内的12人死亡。以总理内塔尼亚胡提前回国，誓言让真主党付出“前所未有的代价”；联合国官员敦促双方保持最大克制，警告冲突升级可能让整个地区陷入灾难。", "source": "环球时报", "url": "https://world.huanqiu.com/article/4InhAtlBMSZ"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "泽连斯基称领土问题只能与普京谈 乌克兰战时状态再延90天", "summary": "乌克兰总统泽连斯基表示，领土问题是“红线”，只能在领导人层面与普京讨论，不做任何交换。他25日签署法案，将国家战时状态和总动员再延长90天至2027年1月。俄总统新闻秘书佩斯科夫回应称，领土议题将成为一场“非常严肃的对话”，俄方准备在11月4日后恢复三方会谈。", "source": "环球网", "url": "https://www.toutiao.com/article/7701113119937921599/"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "国际新闻早知道：美军或再打击伊朗、以议选临近、卢拉胜选获承认", "summary": "央视新闻梳理：伊朗、沙特、土耳其、巴基斯坦四国26日在德黑兰同意继续磋商加强地区和平与安全合作；美官员透露美军已准备好对伊朗新一轮大规模打击。以色列27日举行新一轮议会选举，内塔尼亚胡面临“生死战”；巴西多个支持博索纳罗的政党承认卢拉胜选；马克龙承认未能预判法国多地骚乱。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7701104922065945142/"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "印尼马拉皮火山一日4次喷发 加沙学校空袭9死、土耳其5.0级地震", "summary": "据新华社与央视消息，印尼西苏门答腊省马拉皮火山27日连续喷发4次；土耳其南部阿达纳省孔赞区当晚发生5.0级地震，暂无重大伤亡报告。加沙地带民防部门称，以军空袭北部沙提难民营一所学校造成9人死亡，含3名记者和1名儿童；埃及同日提出加沙停火两天、互换被扣押人员的方案。", "source": "每日经济新闻（央视/新华社）", "url": "https://m.nbd.com.cn/web_app/column/375"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "前三季度批发零售业增加值11.1万亿元 长三角进出口连增19个月", "summary": "据国家统计局与商务部数据，前三季度我国批发和零售业增加值11.1万亿元，同比增长4.4%，占GDP比重10.4%；长三角地区货物贸易进出口15.19万亿元，同比增长20.3%，连续19个月保持增长，占全国进出口总值比重升至38.1%。央行26日宣布设立债市非银大额赎回互换便利以维护债券市场稳定。", "source": "央视新闻（新闻早班车）", "url": "http://mp.weixin.qq.com/s?__biz=MzIzNDYxNTcxOA==&mid=2247826686&idx=1&sn=a61bb85216050087acfd84fc12e7c03e&chksm=e907d5e8e9391611a62ae0294e1b6a1f6f85bc870876ef649a5c02586d5f66c0fcab775a751a#rd"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "人社部发布11个新职业、23个新工种 康养服务进入国家职业序列", "summary": "人社部发布船舶岸基管理工程技术人员、具身智能机器人应用技术员等11个新职业，以及社区工作者、适老化改造设计师等23个新工种。其中康养服务类岗位首次系统纳入国家职业序列，呼应各地稳岗扩容与“人工智能+就业”政策，为低空经济、智能制造等新空间提供人才支撑。", "source": "家和晨报（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzU4MzQxNDY0Mw==&mid=2247520429&idx=1&sn=c02b4216877464ecbef42067295f623d&chksm=fc97acee708172e47384a74d1eae19f65fd19281ffe2d002b4571b22d81003d7560135aa001e#rd"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "2027年度国考资格审查结束 345万人过审、报录比约97:1", "summary": "中央机关及其直属机构2027年度考试录用公务员网上报名与资格审查工作结束，共有345万人通过用人单位资格审查，通过资格审查人数与录用计划数之比约为97:1。通过审查的考生可于11月1日至6日进行报名确认和缴费，未按期完成确认缴费视为自动放弃报考资格。", "source": "时政天天读（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzA3OTExNDA2Ng==&mid=2651445825&idx=1&sn=91ec5a88d03ae85e10dc1783a8c264de&chksm=8511f395c956e947fe2bcc366d7759efd0cc01d836545466035577b977848a4c9eaf712e9daf#rd"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "云南大学发现三颗“本不该存在”的系外行星 应被恒星吞噬却存活", "summary": "云南大学钱声帮团队在美国《国家科学院学报》发表论文，发现三颗本应被红巨星膨胀吞噬却“活”下来的系外行星，宿主星分别为牧夫座24、HD 12648、TYC 4282-605-1。团队以星震学确认宿主星已进入核心氦燃烧阶段，再用演化模型反推其历史最大半径，发现三颗行星轨道均落入理论吞噬区，暗示太阳系远期命运或更复杂。", "source": "中国青年网（新华社）", "url": "https://www.toutiao.com/article/7700978319541453346"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "WTT蒙彼利埃冠军赛开幕 孙颖莎林诗栋陈熠领衔国乒出战", "summary": "2026年WTT蒙彼利埃冠军赛27日拉开战幕，国乒在亚锦赛后马不停蹄转战法国，孙颖莎、林诗栋、陈熠等亮相首轮。刚结束的乒乓球亚锦赛国乒以4金4银收官，陈熠3比0击败张本美和首夺女单；王楚钦因伤继续缺阵。CCTV5+于晚间转播本站赛事，央视频全程网络直播。", "source": "搜狐体育", "url": "https://www.sohu.com/a/1093102115_585510"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "全球首个XI因子抑制剂舒华博在华获批 脑梗防复发添新药", "summary": "国家药监局26日通过优先审评审批，批准拜耳1类创新药阿舒克森片（商品名：舒华博）上市，用于降低缺血性卒中或高风险短暂性脑缺血发作成人患者的卒中风险。该药为全球首个活化凝血因子XI(FXIa)抑制剂，基于OCEANIC-STROKE研究可使卒中风险显著降低26%，且未增加大出血风险，不适用于心源性栓塞型卒中。", "source": "中国新闻网", "url": "https://www.chinanews.com/jk/2026/10-26/10721265.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "京津冀及周边霾减弱消散 江苏浙江等地局地强浓雾不足200米", "summary": "中央气象台消息，26日夜间起受冷空气影响，京津冀及周边大气扩散条件自北向南转好，霾天气减弱或消散；但26日夜间至27日上午，江苏中南部、浙江北部、安徽东南部等地部分地区有大雾，局地能见度不足200米的强浓雾。28日至30日区域北部及汾渭平原部分地区将再现轻度霾。", "source": "环球网（中新网）", "url": "https://china.huanqiu.com/article/40S1T55YxfV"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "大众中国在合肥获L3级自动驾驶路测牌照 北京新能源车保有量破153万", "summary": "大众汽车集团（中国）10月26日宣布在合肥正式获得L3级自动驾驶道路测试牌照，已启动真实道路测试与数据采集，向2027年“L3就绪”迈进。同日，北京市披露有序推动汽车“油换电”，以旧换新累计带动销售额超1400亿元，截至9月底新能源汽车保有量突破153万辆。", "source": "腾讯新闻（每日经济新闻）", "url": "https://news.qq.com/rain/a/20261027A02Q0A00"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "2026海南省电子竞技公开赛落幕 琼港澳选手同台竞技", "summary": "2026海南省电子竞技公开赛25日在海口观澜湖奥特莱斯落幕，吸引52支队伍参与，海南耍起队夺冠；随后的琼港澳电竞交流邀请赛中，冠亚军队伍与中国香港、中国澳门代表队同场比拼。赛事配套主题市集、夜市与Cosplay巡游，践行数字体育与全民健身融合，培育“跟着赛事游海南”新风尚。", "source": "海南省旅游和文化广电体育厅", "url": "https://lwt.hainan.gov.cn/ywdt/gdty/202610/t20261026_4168028.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "第十七届中国长江三峡国际旅游节在重庆万州举行 全域发放消费券", "summary": "第十七届中国长江三峡国际旅游节在重庆万州举行，整合三峡库区特色节目与川鄂优秀文艺作品打造惠民演出，活动全程全网直播并同步发放夜游、餐饮、住宿类海量惠民消费券。期间全国重点旅行商、旅游达人走进三峡核心景区踩线采风，渝东北各区县差异化推出红叶观赏、非遗展演等特色活动。", "source": "重庆市人民政府网", "url": "https://www.cq.gov.cn/ywdt/bmts/202610/t20261019_16257543.html"}, {"id": 18, "category": "汽车出行", "scope": "国内", "title": "比亚迪备案召回18.3万辆唐、秦系列 制动踏板限位垫批次异常", "summary": "国家市场监督管理总局披露，比亚迪汽车工业有限公司及比亚迪汽车有限公司已备案召回计划，合计183,211辆，涉及2014年至2022年生产的唐、秦系列多款车型。缺陷原因为制动踏板限位垫材料批次性异常，长时间使用后可能开裂脱落，极端情况下致制动灯常亮、向后车传递错误信号，将免费更换改善件。", "source": "汽车行业新闻（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247490837&idx=2&sn=a5a614837d2b2a17cbf1b7a39a81f7a9&chksm=fd1dd1fe2b023ca6548806ed796d6113b95f2d9455b7ddb142ef95820b737177961db6670b11#rd"}]}};</script>

    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
