三方。公司已投入算力让自主智能体开展红队测试、寻找训练环境漏洞。", "source": "腾讯网（彭博）", "url": "https://new.qq.com/rain/a/20261024A03CI800"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic发布个人智能体Claude Duet 由Opus 5.5驱动", "summary": "Anthropic发布个人智能体Claude Duet，由Claude Opus 5.5驱动，可调用超6000个连接器与插件，继承原账户记忆、Skills与应用连接；提供独立iOS、Android与网页端，首批面向美国Pro和Max用户开放候补。", "source": "腾讯研究院（搜狐）", "url": "https://www.sohu.com/a/1091363921_455313"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "《国家信息化“十五五”规划》发布 适时启动6G商用", "summary": "近日中央网信委印发《国家信息化“十五五”规划》，提出到2030年陆海空天立体化网络体系基本形成、新一代通信网全面建成、适时启动第六代移动通信（6G）商用，并加快构建全国一体化算力网，研制高性能AI芯片与高可用基础软件栈。", "source": "自贡网", "url": "https://www.zgm.cn/content/6adbf91b5c9bd"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "俄乌同意在奥列什基局部停火 三方会谈11月上旬阿布扎比启动", "summary": "白宫23日声明，美国促成俄乌同意自10月29日起在赫尔松地区奥列什基暂时停火、开辟人道走廊。佩斯科夫称俄美乌三方安全保障谈判将于11月上旬在阿布扎比启动、不排除欧洲参与；泽连斯基期待乌美俄三方会谈尽快举行。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7699992628745519625"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "两艘超级油轮在霍尔木兹海峡南部触雷 美称准备与伊朗长期对峙", "summary": "伊朗革命卫队海军称，两艘试图非法穿越霍尔木兹海峡南部的超级油轮触雷，共载超450万桶原油、船员弃船逃生。特朗普威胁或对伊发动小规模“史诗怒火”行动；美常驻联合国代表称已准备好与伊朗长期对峙，霍尔木兹航运或难恢复至冲突前水平。", "source": "腾讯新闻（华尔街见闻）", "url": "https://news.qq.com/rain/a/20261024A038TZ00"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "国办印发意见：构建就业友好型发展方式 减缓AI岗位替代", "summary": "国务院办公厅印发《关于适应人工智能技术发展助力构建就业友好型发展方式的意见》，部署6方面18项任务：拓展AI就业新空间、优先在劳动力紧缺与高危岗位推广、探索失业缓冲期制度、加快开发AI新职业，并健全新就业形态劳动者社会保障。", "source": "中国金融（今日头条）", "url": "https://www.toutiao.com/article/7699893699924345385"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "前三季度财政收入17.23万亿元同比增5.1% 证券交易印花税增65.1%", "summary": "财政部数据显示，今年前三季度全国一般公共预算收入17.23万亿元、同比增5.1%，税收收入14.07万亿元、增6.1%；证券交易印花税2391亿元、大增65.1%。财政支出21.02万亿元、增1%，前三季度专项债发行进度达81%。", "source": "腾讯网（陆家嘴财经早餐）", "url": "https://new.qq.com/rain/a/20261024A033VS00"}, {"id": 8, "category": "战争与自然灾害", "scope": "国内", "title": "西藏那曲巴青县7.0级地震 16人遇难76伤 救助响应升至三级", "summary": "10月22日22时33分西藏那曲巴青县发生7.0级地震、震源深度10公里，截至23日13时致16人遇难、76人受伤。国家防减救灾委、应急管理部将救助响应升至三级，中组部划拨2500万元党费，央行开通国库资金汇划绿色通道支持救灾。", "source": "央视网", "url": "https://tv.cctv.cn/2026/10/24/VIDE68eSK0N7Ln1Cn5yXDXZL261024.shtml"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "超强台风“蔷琵”逼近浙江 国家防总启动防汛防台风四级响应", "summary": "今年第30号台风“蔷琵”（超强台风级）逼近，中央气象台继续发布台风蓝色预警，不排除25日擦过浙江沿海。国家防总、应急管理部针对江苏启动防汛防台风四级响应，浙江将响应提升至三级，温州44架次航班取消、部分列车停运。", "source": "央视网", "url": "https://tv.cctv.com/2026/10/24/VIDE1TZIbAh44r0WRn2V6RHK261024.shtml"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "一批重大工程刷新进度：遥感五十号03星发射、跨海大桥合龙、硬X射线出光", "summary": "10月23日18时15分，我国在太原用长征六号改火箭成功将遥感五十号03星发射升空，用于国土普查与防灾减灾；杭州湾跨海铁路大桥北航道桥合龙，硬X射线自由电子激光装置首次出光，黄茅峡水库进入河道主体施工，多项硬科技迎关键节点。", "source": "央广网（今日头条）", "url": "https://www.toutiao.com/article/7700025428383138304"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "酒泉凌晨成功发射遥感五十三号07-09星等 一箭多星", "summary": "10月24日3时25分，我国在酒泉卫星发射中心用长征四号乙运载火箭，成功将遥感五十三号07-09星、遥感五十六号19-21星发射升空，卫星顺利入轨，主要用于科学试验、国土资源普查、农产品估产和防灾减灾等领域。", "source": "央视网", "url": "https://tv.cctv.cn/2026/10/24/VIDEt8B0kdMLhii3eN5tFXKB261024.shtml"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "全球顶级铁三IP Challenge Shanghai首次落地上海 海湾户外运动季启幕", "summary": "第四届上海湾户外运动季暨海湾红叶嘉年华10月24日至25日举行，全球顶级铁人三项IP“Challenge Shanghai”首次落地上海，汇聚20个国家和地区近1200名选手，在杭州湾北岸游泳、骑行、穿行万亩森林公园；森林半程马拉松11月29日开跑。", "source": "上观新闻", "url": "https://www.shobserver.com/sgh/detail?id=4078626"}, {"id": 13, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16瑞士轮首日 LPL的iG、TES双双告负跌入0-1", "summary": "2026英雄联盟全球总决赛瑞士轮10月24日打响，首日LPL对阵LCK两场焦点战全部失利：iG前期领先却被GEN翻盘，TES被HLE的Zeka洛克“屠杀”24分钟速败。两队落入0-1组，瑞士轮三胜晋级、三负淘汰，仍有调整空间。", "source": "腾讯新闻（雷速体育）", "url": "https://new.qq.com/rain/a/20261024A02BY100"}, {"id": 14, "category": "汽车出行", "scope": "国际", "title": "特斯拉Q3财报：FSD入华审批未落地 中国车企智能化优势凸显", "summary": "特斯拉公布2026财年第三财季财报：营收280.46亿美元、归母净利润7.87亿美元，但FSD全面入华审批仍未落地、未给新时间表。马斯克称正争取更广泛监管批准，中国车企凭借本土路况适配与数据积累已在智驾赛道建立竞争优势。", "source": "网通社汽车", "url": "https://auto.news18a.com/news/storys_307786.html"}, {"id": 15, "category": "健康养生", "scope": "国内", "title": "秋冬季流感疫苗开打 多地纳入职工医保个人账户支付", "summary": "2026秋冬季流感疫苗已可预约接种，通常11月前完成接种可筑牢免疫屏障。新疆等地自9月1日起将流感疫苗费用及注射费纳入职工医保个人账户支付范围，惠及参保人及已参保近亲属，降低接种经济负担。", "source": "阿克陶县人民政府", "url": "https://www.xjakt.gov.cn/xjakt/c104949/202610/b7a00c16b396444793803be5a4c148f6.shtml"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "厄尔尼诺发展年 今年台风编号已达30号 本世纪数量仅次于2013", "summary": "温州气象台指出今年为厄尔尼诺发展年、赤道中东太平洋海温偏高、西北太平洋远洋海温同步走高，为台风生成提供能量；今年台风编号已至30号、本世纪数量仅次于2013年的31个，“蔷琵”成超强台风逼近华东较为罕见。", "source": "温州市人民政府", "url": "https://www.wenzhou.gov.cn/col/col1217832/art_2026/art_030edf80d52b4f158b015b564af630dc.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026武汉书展启幕 熊召政、苏德超携新书首发", "summary": "2026“书香长江”阅读周·武汉书展10月23日启幕，集结15家城市出版社与李敬泽、熊召政、刘醒龙等30余位作家学者。10月24日茅奖得主熊召政携《忽必烈：南征大理国》、武大教授苏德超携哲学新书首发，全城联动惠民。", "source": "凤凰网", "url": "https://news.ifeng.com/c/8xSOsLFEz6y"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "教育部等组织长征胜利90周年思政大课 全国大中小学生同上一堂", "summary": "教育部、中央网信办、人民日报社联合组织的“长征胜利90周年”思政大课10月23日起在人民日报客户端全天滚动播出，面向全国大中小学生，以红色主题教育规模化落地，引导青少年传承长征精神、厚植家国情怀。", "source": "人民日报（微信公众号综合）", "url": "http://mp.weixin.qq.com/s?__biz=MzY5NzE2NDA5OA==&mid=2247484139&idx=1&sn=96b32e762b104295f1036cc6d889ed7e&chksm=f5031727c2f481d1ab7815e5f6ef62f1e9f6015da17a555c4e2b7cd60300f1d5202aa5203ae9#rd"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>

  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
