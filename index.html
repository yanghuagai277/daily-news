<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-11-18", "generatedAt": "2026-11-18T11:59:05+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席2026年APEC工商领导人峰会开幕式并发表主旨演讲", "summary": "11月18日上午，国家主席习近平在深圳前海出席2026年APEC工商领导人峰会开幕式并发表主旨演讲，提出维护和平稳定、搭建开放合作桥梁、激发创新增长动力、拓展互利共赢路径四点建议。习近平指出，“十五五”规划既是自身发展蓝图，也是面向全球工商界的合作邀约，中国将提供超大规模开放市场。", "source": "央视网/新华社", "url": "https://news.cctv.cn/2026/11/18/ARTIstjyp3Dl9CyZQEi0ucOx261118.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "持续近九个月的美伊战争陷入“时间与经济耐力战”", "summary": "据路透社报道，持续近九个月的美伊战争正陷入围绕时间与经济承受能力的较量。美国总统特朗普暂缓新一轮大规模军事打击，转而依靠海上封锁和经济制裁迫使伊朗让步；德黑兰则认为美国政治变化削弱其谈判优势，坚持要求美方先解除封锁、释放冻结资产。分析人士警告，若经济压力持续累积，双方可能因误判重新爆发大规模冲突。", "source": "新浪财经（据路透社）", "url": "https://finance.sina.com.cn/roll/2026-11-18/doc-inizcmfi4873683.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "中加同意将初步联合安排相关豁免措施延长2年", "summary": "商务部新闻发言人11月17日表示，中加在初步联合安排基础上开展多轮经贸磋商，形成补充联合安排，双方同意将相关豁免措施延长2年。加方将进一步扩大对中国钢铝产品的豁免范围，中方相应调整对加方部分农水产品的反歧视措施。双方还就电子商务合作、中资银行在加设立分支机构等形成积极共识。", "source": "新华网/经济日报", "url": "https://www.news.cn/world/20261117/24ba2e6aaa7f4ed38a0cfba671506e5b/c.html"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "“人工智能+”加速规模化落地，重点行业渗透率突破80%", "summary": "新华网11月18日报道，“十五五”“人工智能+”行动部署密集落地，我国人工智能正从“点上示范”走向“规模落地”。国家发展改革委数据显示，重点行业人工智能整体渗透率已突破80%，工业领域累计建成万余家先进级智能工厂。下一阶段将点线面协同，优先聚焦矿山开采、高空作业、应急救灾等“险脏累繁难”场景。", "source": "新华网", "url": "https://www.xinhuanet.com/fortune/20261118/bf699bf6ab4e4cdab1d59bb5e359c760/c.html"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "新一代地球观测基础模型OlmoEarth v1.3发布并开放", "summary": "美国艾伦人工智能研究所近日发布新一代地球观测基础模型OlmoEarth v1.3，并开放覆盖全球的预计算数据和分析工具。该模型综合哨兵1号雷达、哨兵2号多光谱及Landsat数据，把每处地表一年的模样压缩为百余个数字，让生态学家、农业官员无需成为深度学习工程师也能开展地表变化监测。", "source": "新华网", "url": "https://www.xinhuanet.com/tech/20261118/ee972f56587444fb8c7b5de7b4242a9e/c.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "多项财政政策工具年末持续用力，新增专项债发行进度超九成", "summary": "临近年末多项财政政策工具持续发力。企业预警通数据显示，截至11月17日，今年已发行新增专项债40809亿元，发行进度超九成，超五成资金投向市政、产业园区和交通基础设施。财政部拟发行2026年中央金融机构注资特别国债（二期），11月18日招标面值总额1500亿元，全年3000亿元注资特别国债即将收官。", "source": "中国经济网/中国证券报", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261118_3297719.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "深化健康学校建设：学生近视率达49.9%，校园健康治理补短板", "summary": "人民政协网11月18日刊文指出，教育部2026年2月印发指导意见，明确2030年实现健康学校全覆盖、2035年普遍建成高质量健康学校。监测显示，2025年全国学生总体近视率达49.9%，6至17岁儿童青少年超重肥胖率约19%，6至16岁在校学生精神障碍患病率达17.5%，校园健康治理仍存标准滞后等短板。", "source": "人民政协网", "url": "https://www.rmzxw.com.cn/c/2026-11-18/4010254.shtml"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "乌方承认袭击克里米亚大桥，俄军空袭基辅致两座桥梁受损", "summary": "乌克兰总统泽连斯基11月17日称，乌国家安全局和军方使用无人机及“海王星”导弹打击克里米亚大桥公路和铁路设施，行动已持续数周。此前大桥连续两天遭袭、结构受损，俄方以“恐怖行为”立案。同一夜俄军对基辅发动新一轮空袭，南桥、北桥受损并禁止通行，部分区域供水供暖中断。", "source": "新华网/环球网", "url": "https://www.news.cn/world/20261117/4a1efd23e795454b934197027b509f0b/c.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "神舟二十四号船箭组合体转运至发射区，将首次中外航天员联合飞行", "summary": "据中国载人航天工程办公室消息，11月17日神舟二十四号载人飞船与长征二号F遥二十四运载火箭组合体已转运至酒泉发射区，计划近日择机发射，任务正式进入发射准备阶段。本次任务是我国首次中外航天员联合飞行，一名巴基斯坦航天员将以载荷专家身份短期在轨飞行后，随神舟二十三号返回地球。", "source": "央视网/云南网", "url": "https://news.yunnan.cn/system/2026/11/18/034197344.shtml"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "旅行者1号飞抵距地球“1光日”，成人类最远信使", "summary": "美国航天局表示，1977年发射的旅行者1号于11月18日10时16分（UTC）抵达距地球约259亿公里处，成为首个到达“1光日”距离的人造物体，飞行历时逾49年。它以每小时约6.1万公里飞离地球，是首个进入星际空间的探测器；因钚电池能量衰减，NASA近年正逐一关闭仪器以延长其工作寿命。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261117A05H9600"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "熊猫杯：中国U19男足2比1胜韩国，时隔8年再夺冠", "summary": "11月17日，在四川成都举行的2026CFA中国之队熊猫杯国际青年足球锦标赛中，中国U19国家男子足球队2比1战胜韩国U19队，以两胜一平积7分的战绩夺冠，这是中国队继2018年后时隔8年再度问鼎。第5分钟苗润东低射破门，第9分钟他造点、杨铭锐主罚命中，韩国队第74分钟扳回一球。", "source": "新华网/云南网", "url": "https://news.yunnan.cn/system/2026/11/18/034197605.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "三部门发文全面推行疫苗处方，“十五五”逐步实现全覆盖", "summary": "国家疾控局、国家卫健委、国家中医药局11月17日联合发布《关于全面推行疫苗处方工作的指导意见》，提出“十五五”期间逐步实现疫苗处方在二级以上医疗机构和基层机构全覆盖，构建“诊疗—评估—处方—宣教—接种”服务模式。意见明确可为老年人、慢性病患者等开具流感、肺炎球菌、带状疱疹等疫苗处方，网络诊疗不得开具。", "source": "央视新闻/云南网", "url": "https://society.yunnan.cn/system/2026/11/18/034197418.shtml"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "中央气象台继续发布寒潮蓝色预警，中东部大范围降温", "summary": "中央气象台11月18日6时继续发布寒潮、大风蓝色预警。受强冷空气影响，18日8时至20日8时，内蒙古东北部、东北中北部、黄淮、江淮、江南及华南等地先后降温6至8℃，黑龙江东南部、吉林东部、山东南部、江苏、浙江等地部分地区降温8至10℃、局地超12℃。20日早晨0℃线南压至陕西南部到黄淮东南部一带。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/weatherperday/index.htm"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "碳排放权交易市场开放联盟通过《COP31宣言》", "summary": "据新华网11月18日报道，碳排放权交易市场开放联盟在COP31相关活动中通过《COP31宣言》，呼吁加强全球碳市场互联互通与气候合作。此前COP31“中国角”聚焦全球城市可持续发展。在全球气候治理面临单边主义冲击的背景下，与会各方强调维护多边合作机制，推动绿色低碳转型与公平包容的气候治理。", "source": "新华网", "url": "https://www.news.cn/world/20261118/c788b9bf7a2646418d57d805799d88e3/c.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "工信部就动力电池“数字身份证”管理暂行规定征求意见", "summary": "工信部近日就《新能源汽车动力电池数字身份证管理暂行规定》公开征求意见。数字身份证以国家标准规定的24位编码为唯一索引，串联动力电池设计、生产、装车、维修、拆解、回收、综合利用全环节信息。数据显示，今年1至9月我国动力电池销量1086.4GWh、同比增长38.2%，新规将强化全链条监管与回收利用。", "source": "中国能源网", "url": "https://www.cnenergynews.cn/article/4U4fU0emAY0"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "Faker获电竞世界杯“选手选择奖”第一名，TGA公布年度提名", "summary": "11月18日，电竞世界杯（EWC）与电子竞技大奖联合公布本届“选手选择奖”，T1中单Faker获第一名。该奖是目前唯一由职业选手投票选出的奖项，旨在表彰赢得同行尊重的选手。反差在于，2026年Faker未获任何国际赛事冠军，却凭全年稳定发挥获同行认可。同日TGA公布了年度最佳电竞选手等提名名单。", "source": "什么值得买/EWC", "url": "https://post.m.smzdm.com/p/ae653dvk"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十一届博博会开幕：文脉交汇、科创共生，文创持续出圈", "summary": "11月18日《光明日报》报道，第十一届中国博物馆及相关产品与技术博览会（博博会）上，各大博物馆以“文脉交汇、科创共生”展现文化传承。内蒙古博物院用裸眼3D立体还原鹰顶金冠饰等国宝，广西民族博物馆开设铜鼓拓印体验；国家博物馆凤冠冰箱贴、三星堆考古盲盒等文创产品热度不减。", "source": "光明日报/光明网", "url": "https://news.gmw.cn/2026-11/18/content_39106173.htm"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "秋假点燃“追雪”热：冰雪关键词搜索量月环比增超183%", "summary": "随着11月中旬全国多省市密集放秋假，旅游市场迎来高峰。同程旅行数据显示，截至11月17日，平台“滑雪”“赏雪”“避寒”等关键词搜索量月环比增超183%。深圳秋假为11月17日至20日，深圳飞阿勒泰机票预订热度同比增超84%；首批开板雪场滑雪票预订热度涨超57%，周边酒店民宿预订热度增超45%。", "source": "深圳新闻网", "url": "https://www.sznews.com/news/content/2026-11/18/content_32217438.htm"}]}, "yest": {"date": "2026-11-17", "generatedAt": "2026-11-17T09:46:21+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "阿里发布新一代基座大模型Qwen4-Max，单任务平均费用降约六成", "summary": "11月16日，阿里巴巴发布新一代基座大模型Qwen4-Max，总参数2.4万亿，具备原生视觉能力并支持百万上下文，采用基于Qwen稀疏注意力的全新MoE架构。该模型已在千问AI平台开放API，缓存命中每百万Tokens低至0.5元，完成单任务的平均费用较上代大降约六成，中小尺寸模型将陆续开源。", "source": "每日经济新闻", "url": "https://www.163.com/dy/article/LBTSLB6Q0512B07B.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "AMD完成收购World Labs，李飞飞出任执行副总裁兼首席科学家", "summary": "11月16日，AMD宣布完成对AI研究公司World Labs的收购，以增强其在AI模型领域的研发能力。World Labs专注于可创建和模拟交互式3D环境的AI模型及机器人学习仿真技术。创始人李飞飞加入AMD出任执行副总裁兼首席科学家，直接向董事长兼首席执行官苏姿丰汇报。", "source": "界面新闻", "url": "https://www.163.com/dy/article/LBU3EL6D0534A4SC.html"}, {"id": 3, "category": "国际时事", "scope": "国内", "title": "中俄美三国元首将在深圳举行历史上首次面对面会晤", "summary": "外交部发言人毛宁11月16日宣布，中俄美三国元首将在深圳举行历史上首次面对面会晤，围绕维护世界和平、促进大国关系战略稳定深入交换意见，具有开创性意义。毛宁表示，三国均为联合国创始会员国和安理会常任理事国，历史上曾并肩赢得世界反法西斯战争胜利，加强沟通、管控分歧符合三国利益和国际社会期待。", "source": "外交部/腾讯新闻", "url": "https://news.qq.com/rain/a/20261117A02Q4400"}, {"id": 4, "category": "国际时事", "scope": "国内", "title": "2026年APEC工商领导人峰会在深圳开幕，习近平出席开幕式", "summary": "2026年APEC工商领导人峰会11月17日至18日在深圳前海国际会议中心举行，主题为“共促繁荣，共赢未来”，习近平主席出席开幕式并发表主旨演讲。据中国贸促会介绍，2000余位政商领袖参会，涵盖21个APEC经济体及115家世界500强企业，峰会将发布《2026年APEC工商领导人峰会深圳倡议》。", "source": "央广网", "url": "https://www.cnr.cn/jingji/ycbd/20261117/t20261117_527875333.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "10月经济运行总体平稳：工业增4.8%，城镇调查失业率降至5.1%", "summary": "国家统计局在11月16日国新办发布会上介绍，10月份我国经济延续总体平稳、向新向优态势：规模以上工业增加值同比增长4.8%，服务业生产指数增长4.6%，全国城镇调查失业率5.1%、连续两个月下降。前10月服务零售额增长4.9%，10月进出口总额同比增长31.2%，CPI同比上涨0.7%。", "source": "人民日报", "url": "https://finance.sina.com.cn/jjxw/2026-11-17/doc-iniyyrkt2424637.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美联储主席沃什：正为AI三种影响制定预案，市场押注12月加息", "summary": "北京时间11月17日凌晨，美联储主席沃什在旧金山生产率与就业会议致辞，称已就AI对经济的潜在影响制定应急预案，涵盖生产力繁荣、大规模失业、技术泡沫破裂三种路径，并警示AI预期回报下降或引发股市走弱与失业上升。此前美国10月CPI超预期，利率期货市场已完全押注12月加息25个基点。", "source": "华尔街见闻", "url": "https://www.163.com/dy/article/LBTU4P2R05198NMR.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国中小学、幼儿园将聘任健康副校（园）长", "summary": "国家卫生健康委会同教育部、国家中医药局、国家疾控局11月16日印发通知，要求中小学校、幼儿园聘任健康副校（园）长，由医疗卫生机构选派中级及以上职称专业人员担任，不坐班、不占编制。健康副校长每学期到校现场指导不少于4次、组织健康科普宣讲不少于2次，推动儿童青少年健康管理服务关口前移。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202611/t20261117_2111542733.html"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "本轮巴以冲突已致加沙地带74702人死亡", "summary": "加沙地带卫生部门11月16日发布声明称，过去24小时各医院接收3名死者和7名伤员。自2023年10月7日新一轮巴以冲突爆发以来，以军在加沙的军事行动已累计造成74702人死亡、176105人受伤；停火协议生效以来累计新增死亡1650人，救援人员已在废墟中寻获850具遇难者遗体。", "source": "央视新闻/中国青年网", "url": "https://news.youth.cn/jsxw/202611/t20261117_16969711.htm"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "乌克兰首都基辅遭多枚弹道导弹袭击，响起强烈爆炸声", "summary": "当地时间11月16日23时30分许，新华社记者在乌克兰首都基辅听到两轮强烈爆炸声。乌克兰空军发文称，俄军向基辅市发射多枚弹道导弹；基辅市市长克利奇科表示，城市遭到多枚弹道导弹袭击，防空系统正在运行。俄方表示下一轮俄美乌三方会谈仍将在阿布扎比举行，时间待定。", "source": "新华网", "url": "https://news.yunnan.cn/system/2026/11/17/034196657.shtml"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "世界首次！中国完成空间站舱外激光精密切割试验", "summary": "据《人民日报》报道，我国成功完成世界首次空间站舱外激光精密切割试验，在航天器在轨维修领域取得重大突破。华中科技大学黄禹团队与上海空间电源研究所联合研制维修装置，由机械臂送达、机器视觉识别，实现毫米级定位与微米级精密切割，从设计到太空试验仅用一年，为在轨维修卫星、太空制造奠定基础。", "source": "人民日报/腾讯新闻", "url": "https://news.qq.com/rain/a/20261116A04MTG00"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "中国空间站造出“最冷人造物质”，达9.7皮开尔文", "summary": "依托中国空间站梦天舱超冷原子物理实验柜，我国科研团队制造出目前已知最冷的人造物质，将铷原子云等效温度降至9.7皮开尔文并稳定观测7秒，刷新德国团队2021年38皮开尔文的纪录。成果发表于《科学》，可助力早期宇宙模拟、超轻暗物质探测及高精度量子传感器研发。", "source": "科技日报/河北省科技厅", "url": "https://kjt.hebei.gov.cn/hebkjt/kxpj22/kxbl56/2026111611032983362/index.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "速滑世界杯北京站收官，中国队4金2银3铜创历史最佳", "summary": "2026—2027赛季速滑世界杯北京站在国家速滑馆收官，中国队收获4金2银3铜，创分站赛历史最佳。米兰冬奥会冠军宁忠岩以1分07秒43破场地纪录夺男子1000米金牌，并摘1500米金牌；廉子文获1金1银1铜，高亭宇以34秒61摘男子500米金牌，女子团体追逐获银牌创队史最佳。", "source": "中青在线", "url": "https://news.cyol.com/gb/tiyu/articles/2026-11/16/content_zxN2jPTePX.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "2026版国家医保药品目录公布，新增107种药、51个创新药", "summary": "国家医保局、人社部发布2026年版国家基本医保药品目录，这是第9次调整，新增107种药品、其中51个1类创新药再创新高，总数达3331个。原价超百万元的CAR-T疗法等纳入保障，瑞基奥仑赛谈判支付标准降至28.86万元、降幅约77.6%；商业健康险创新药目录新增12种至28种，新版目录2027年1月1日执行。", "source": "新华财经", "url": "https://www.cnfin.com/gs-lb/detail/20261117/4496462_1.html"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "中央气象台发布寒潮大风双蓝色预警，中东部大范围雨雪降温", "summary": "中央气象台11月17日6时发布寒潮、大风双蓝色预警：17日至20日，西北东部、内蒙古、华北、东北、黄淮至江南华南先后降温6至8℃，吉林东部、山东南部、安徽、浙江等地降温8至10℃、局地超12℃，20日早晨0℃线南压至陕南至黄淮东南部。中东部有大范围雨雪，北方阵风7至9级、局地10级以上。", "source": "中国气象局/光明网", "url": "https://m.gmw.cn/2026-11/17/content_1304586919.htm"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "组合驾驶辅助强制国标发布，2027年起强制执行", "summary": "强制性国标GB 47955—2026《智能网联汽车 组合驾驶辅助系统安全要求》已发布，2027年1月1日起对新申请型式批准车型强制执行，是我国L2级组合驾驶辅助首部强标。标准将产品分为基础单车道、基础多车道、领航辅助三档，禁止“L2.5”“高阶智驾”等非标话术。截至今年8月国内约6100万辆乘用车搭载L2级系统。", "source": "工信部/汽车行业新闻", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491047&idx=2&sn=aab42c62e09d0eb7d1e7b3bb527775a4"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "BLG夺LOL全球总决赛冠军，Knight成LPL首位大满贯中单", "summary": "2026英雄联盟全球总决赛（S16）11月15日在纽约落幕，中国LPL赛区BLG战队先失一局后连扳三局，以3∶1击败韩国GEN，队史首夺召唤师杯，也是中国战队时隔5年再夺冠。江西萍乡籍中单卓定（Knight）斩获FMVP，成为LPL史上首位大满贯中单；BLG还创下单届淘汰全部四支LCK队伍的纪录。", "source": "直播吧", "url": "https://m.zhibo8.com/news/web/other/2026-11-17/6afb9d8e4693enative.htm"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "《非遗里的中国》特展在深圳启幕，汇聚200余件精品", "summary": "由中央广播电视总台、广东省政府联合主办的亚太人文交流活动暨《非遗里的中国》特展11月15日在深圳启动，来自APEC成员经济体、国际组织及驻华使节等150余位中外嘉宾出席。特展汇聚200余件精品，涵盖中国画、书法、雕塑、瓷器、锦绣、青铜器等品类，11月15日至22日向公众开放，展现亚太文明交流互鉴。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/17/content_342013.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "新雪季开板：赴张家口机票预订增270%，冰雪航线预订翻番", "summary": "新雪季启幕，河北崇礼、内蒙古阿尔山、吉林庙香山等地滑雪场陆续开板。航旅纵横数据显示，11月前往张家口的机票预订量同比增超270%，赴阿勒泰增约50%；去哪儿平台2000公里以上“冰雪航线”预订量同比增2倍。《中国冰雪旅游发展报告（2026）》预计上一冰雪季冰雪旅游休闲达3.6亿人次、收入4500亿元。", "source": "中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261117_3296392.shtml"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
