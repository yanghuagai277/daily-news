<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-09-15", "generatedAt": "2026-09-15T07:12:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国际", "title": "伊朗宣布霍尔木兹海峡“已被封锁”，超级油轮触雷起火", "summary": "伊朗伊斯兰革命卫队海军14日宣布，超级油轮“阿尔加亚”号试图穿越霍尔木兹海峡以南禁航区时触碰水雷、爆炸起火，灭火失败致船只陷入大火；卫队宣布海峡已被封锁并处于伊方“智能管控”之下。美军中央司令部否认该油轮最近触雷，称其上月已遭伊朗导弹袭击丧失航行能力。船舶追踪数据显示，上周末海峡单日通行量骤降至个位数，远低于此前日均14艘。联合国伊朗问题独立调查团敦促美以遵守国际法。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685523386620985908/"}, {"id": 2, "category": "国际时事", "scope": "国内", "title": "外交部提醒中国公民暂勿前往塔吉克斯坦与阿富汗边境", "summary": "外交部与中国驻塔吉克斯坦使馆14日发布提醒：当前塔吉克斯坦和阿富汗边境地区安全形势复杂严峻，近期发生流弹落入塔境内及阿富汗人员非法越境事件，造成人员伤亡和财产损失。已在当地的中国公民和机构应尽快撤离或转移至相对安全区域；执意前往或驻留将面临极高安全风险。使馆同时公布了塔紧急救助电话与24小时领保热线。", "source": "外交部", "url": "https://www.toutiao.com/article/7685524874151985700/"}, {"id": 3, "category": "战争与自然灾害", "scope": "国际", "title": "尼泊尔泥石流灾害遇难人数升至1392人", "summary": "据尼泊尔警方公布的数据，截至当地时间14日11时，尼泊尔泥石流灾害造成的遇难人数已升至1392人。连日强降雨在多地引发山体滑坡与泥石流，救援与善后工作仍在持续。", "source": "央视新闻", "url": "https://news.qq.com/rain/a/20260915A0301S00"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "特朗普称俄乌已同意互不打击能源目标，泽连斯基拟纽约会晤", "summary": "美国总统特朗普14日在社交媒体称，俄罗斯和乌克兰已同意不攻击对方的能源目标；此前一天他曾批评基辅袭击俄炼油厂。乌克兰总统泽连斯基当天表示，对能源领域停火持开放态度，并计划于9月21日至23日在纽约与特朗普会晤时就此事进行讨论。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1789426474264&item_id=14900316024913496413&channelId=1119"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "芬兰宣布加入法国“前沿威慑”核计划，朝鲜举行火力打击训练", "summary": "芬兰与法国14日发布联合声明称，芬兰已决定加入法国总统马克龙此前提出的“前沿威慑”核计划。另据朝中社报道，朝鲜人民军近日进行协同火力打击训练，出动新型战斗系统。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-15/detail-ihfkhckz2205351.shtml"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "习近平将于9月24日在华盛顿会晤特朗普，钇出口管制或成筹码", "summary": "据港媒报道，中国国家主席习近平将于9月24日在美国华盛顿与特朗普举行会晤。报道称，北京对稀土元素“钇”供应的严密管控，预计将成为双方谈判中的关键筹码。此前中方已收紧多种稀土及相关技术的出口管制。", "source": "The Standard（香港）", "url": "https://www.thestandard.com.hk/news/article/342767/Morning-Recap-September-15-2026"}, {"id": 7, "category": "国际时事", "scope": "国际", "title": "武契奇宣布将于9月27日辞去塞尔维亚总统职务", "summary": "塞尔维亚总统武契奇14日表示，将于9月27日辞去总统职务。此前塞尔维亚国内因大规模抗议活动持续动荡，政局走向引发外界关注。", "source": "央视新闻", "url": "https://www.capitalfutures.com.tw/zh-tw/Financial/BreakingNewsArticle?ContentId=C26091500163"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "央行15日开展5000亿元买断式逆回购，前8月社融增量23.91万亿元", "summary": "中国人民银行公告，9月15日将开展5000亿元买断式逆回购操作，期限为6个月。最新数据显示，前8个月我国社会融资规模增量累计23.91万亿元，人民币贷款增加10.44万亿元；债券、股票融资增长较快，直接融资占比首次超过贷款，贷款提质降速成为新常态。8月末M2余额同比增长7.5%，8月新发放个人住房贷款加权平均利率为3.1%，处历史低位。", "source": "陆家嘴财经早餐（Wind）", "url": "https://www.163.com/dy/article/L6RLQID605198RSU.html"}, {"id": 9, "category": "科技互联网与AI", "scope": "国内", "title": "上海启动“明珠星座计划”，打造吉瓦级天基计算星座", "summary": "上海近日启动“明珠星座计划”，目标是打造吉瓦级天基计算星座，建设覆盖全球的近地轨道算力网，成为未来人工智能的算力底座。另据中国电信研究院报告，预计2026年我国Token年消耗量将达10亿亿，2030年超3500亿亿，年复合增长率接近12倍；未来2—3年算力需求年均增长近10倍。", "source": "陆家嘴财经早餐", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8246aa87a5c51852"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "《退役军人服务和保障“十五五”规划》印发", "summary": "近日，中共中央办公厅、国务院办公厅、中央军委办公厅印发《退役军人服务和保障“十五五”规划》，对“十五五”时期做好退役军人工作作出部署，重点是推进退役军人高质量安置就业、提升退役军人服务保障效能等方面。", "source": "央视新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34071795"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "“十五五”将建“数智”疾控，AI大模型为传染病防控赋能", "summary": "国家疾控局在国新办发布会上表示，“十五五”时期将从体系、能力和策略三方面提升疾病预防控制水平，建设“数智”疾控，开发人工智能大模型和智能体为传染病防控赋能增效。目前我国已在5万多家医疗机构部署传染病智能化监测预警前置软件。国家卫健委同时宣布，今年将新增1000家基层医疗卫生机构提供儿科诊疗服务。", "source": "人民网", "url": "https://politics.people.com.cn/n1/2026/0915/c461001-40798660.html"}, {"id": 12, "category": "国际时事", "scope": "国际", "title": "习近平指引“大金砖”筑牢务实合作根基，中国明年接任主席国", "summary": "据新华社报道，习近平主席在金砖峰会上提出“将率先建设金砖国家人工智能开源专区”“推动建立金砖国家数字产业云平台”“协助金砖国家建设智能工厂”“提议建立金砖国家工程师培养联盟”等一系列务实举措，指引“大金砖”筑牢合作根基。中国将于明年接任金砖主席国，主办金砖国家领导人第十九次会晤。", "source": "光明网（新华社）", "url": "https://news.gmw.cn/2026-09/15/content_39000151.htm"}, {"id": 13, "category": "科技互联网与AI", "scope": "国内", "title": "2026国家网络安全宣传周开幕，青少年蓝皮书揭示未成年人用网新特征", "summary": "由中央宣传部、中央网信办等10部门联合举办的2026年国家网络安全宣传周14日在山东济南开幕，主题为“智能时代网安护航”。同期发布的《青少年发展蓝皮书》显示，我国未成年网民规模达1.98亿，互联网普及率98.3%；78.5%的受访未成年网民使用AI学习、创作或娱乐，但83%的受访教师担忧学生滥用AI，23.1%担心对AI形成心理依赖。", "source": "中国青年网", "url": "https://news.youth.cn/gn/202609/t20260915_16869523.htm"}, {"id": 14, "category": "科技互联网与AI", "scope": "国内", "title": "豆包手机助手消费者版发布，将搭载努比亚NaviX Ultra", "summary": "9月14日，豆包手机助手消费者版本正式发布。相比去年底的技术预览版，消费者版更强调稳定性和日常可用性，交互能力、个人上下文与记忆能力、任务执行是新版重点。该版本将搭载在努比亚NaviX Ultra手机上，目前已开启预约，9月16日正式发售。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7685522104495997449/"}, {"id": 15, "category": "科技互联网与AI", "scope": "国际", "title": "特朗普称“AI毁灭人类是骗局”，美国内激辩AI风险硬扯中国", "summary": "特朗普近日称，所谓人工智能将接管世界、毁灭人类等说法都是“骗局”，并公开抨击Anthropic首席执行官呼吁放缓AI发展的立场，重申美国领先优势不容动摇。美媒称，围绕AI风险的密集讨论被生硬地扯上中国。值得注意的是，OpenAI首席执行官奥尔特曼与xAI创立者马斯克均表态支持“稳步推进前沿技术”。受AI开发放缓担忧影响，周一全球存储、芯片股大跌。", "source": "环球时报", "url": "https://www.toutiao.com/article/7685527736491852307/"}, {"id": 16, "category": "科技互联网与AI", "scope": "国内", "title": "智能经济活力奔涌，全栈AI能力服务千行百业", "summary": "据人民日报报道，从昆仑芯、百舸计算平台、千帆平台到深入行业的应用，全栈AI基础设施正为新兴产业、未来产业提供底座支撑，已服务80%的央企和大量中小企业。该平台2025年成功支持超过2000万辆L2级辅助驾驶新车交付，并服务北京人形机器人创新中心及智元、宇树等50余家具身智能产业链企业。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260915A02UI800"}, {"id": 17, "category": "战争与自然灾害", "scope": "国内", "title": "海南五指山遭极端特大暴雨，单日降水611.2毫米破观测史纪录", "summary": "受冷空气和热带低压共同影响，过去三天海南是全国降水最凶猛地区，大部累计雨量超100毫米，东南部超400毫米，保亭、琼中、万宁、五指山局地超600毫米。其中13日20时至14日14时，五指山降水量高达611.2毫米，打破当地观测史单日降水量纪录；14日6时至10时的5个小时就下了366.5毫米。广西南部、海南岛南部15日仍有暴雨或大暴雨。", "source": "中国天气网", "url": "https://www.tsrb.com.cn/xwzx/2026-09/15/content_300021870.html"}, {"id": 18, "category": "环境气候", "scope": "国内", "title": "昌化江形成近5年最大洪峰，大广坝水库开闸泄洪", "summary": "受南海热带低压残余环流与冷空气共同影响，海南岛东南半部普降暴雨到大暴雨，昌化江流域形成近5年最大洪峰，流域累计降雨量310毫米，大广坝水库水位迅猛上涨。电厂自12日15时启动预泄腾库，截至14日17时下泄流量由每秒1000立方米提升至5500立方米，已开启4扇弧门泄洪，同步保障电力供应。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685440817518953001/"}, {"id": 19, "category": "战争与自然灾害", "scope": "国内", "title": "2026年防汛抗洪救灾纪实：全力守护人民生命安全", "summary": "据新华社纪实报道，今年7月以来台风“美莎克”“巴威”先后登陆，7月26日台风“红霞”以14级风力登陆广东，8月9日台风“白海豚”两次登陆浙江，9月3日复活的台风“沙德尔”第三次登陆闽赣粤，多地出现大暴雨甚至特大暴雨。在以习近平同志为核心的党中央坚强领导下，各地深入排查灾害风险隐患、科学统筹抢险救灾力量，全力保障人民群众生命财产安全。", "source": "上海证券报（新华社）", "url": "https://paper.cnstock.com/html/2026-09/15/content_2269070.htm"}, {"id": 20, "category": "体育赛事", "scope": "国内", "title": "亚运男篮中国105:61胜菲律宾，三连胜晋级八强", "summary": "14日，第20届亚运会男篮小组赛末轮，中国队以105:61大胜菲律宾队，以3战全胜锁定小组头名晋级8强，报了3年前杭州亚运会半决赛不敌菲律宾的一箭之仇。全队7人得分上双，王俊杰贡献20分14个篮板的两双数据；三场小组赛场均净胜对手42.7分。八强战中国队将对阵沙特队。同日国际乒联排名公布，中国球员王曼昱首登女单世界第一。", "source": "天津日报", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-09/15/content_143092_3839603.htm"}, {"id": 21, "category": "体育赛事", "scope": "国际", "title": "名古屋亚运会陷“住宿风波”，韩方批“史上最差”", "summary": "即将开幕的爱知·名古屋亚运会陷入住宿风波。韩国体育官员14日抱怨本届赛事住宿条件堪称“史上最差”，存在“严重的房间短缺”。为压缩成本，本届亚运会未建专门的运动员村，而以邮轮、集装箱式宿舍和酒店分散安置运动员。韩国球员吐槽集装箱小屋床铺太短、洗手池漏水。本届预计接待超1.7万名运动员和体育官员，规模超过奥运会。", "source": "环球时报", "url": "https://3w.huanqiu.com/a/de583b/4TDEDyGc0Yz?agt=23"}, {"id": 22, "category": "体育赛事", "scope": "国内", "title": "中国多支队伍亮相亚运赛场，女篮男足即将登场", "summary": "第20届亚洲运动会19日将在日本爱知县名古屋市开幕，包括足篮排三大球在内的多个项目提前开赛。中国男篮已三连胜出线；中国女篮19日小组赛首战泰国队、21日对阵印度尼西亚队，主力中锋韩旭因征战WNBA无缘本届。中国亚运男足以U23亚洲杯亚军阵容为班底，征召吴曦、张玉宁、朱辰杰3名超龄球员，与伊朗、朝鲜、阿联酋同组，9月16日首战朝鲜队。", "source": "环球时报", "url": "https://www.163.com/dy/article/L6RM136S0514R9OJ.html"}]}, "yest": {"date": "2026-09-14", "generatedAt": "2026-09-14T07:20:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席金砖国家领导人第十八次会晤第二阶段会议并发表重要讲话", "summary": "当地时间9月13日上午，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第二阶段会议，发表题为《筑牢金砖合作根基 壮大全球南方力量》的重要讲话，就深化金砖合作提出人工智能开源普惠、贸易投资便利化等5项倡议。会议通过《新德里宣言》，中国将于2027年接任金砖轮值主席国。当晚习近平圆满结束与会行程返回北京。", "source": "人民日报", "url": "https://politics.people.com.cn/n1/2026/0914/c1024-40797886.html"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "美伊冲突持续：伊朗锡里克传出爆炸巨响，沙特关键输油管道中断", "summary": "据伊朗方面14日凌晨消息，霍尔木兹甘省锡里克地区传出数声爆炸巨响，性质尚未明确。美国总统特朗普13日重申，伊朗战事将在11月中期选举后结束，并称伊方“非常希望达成协议”。交易商及消息人士称，上周无人机袭击迫使沙特关闭大型东西向输油管道，若数日内不能恢复，全球石油供应恐损失4%。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7685157196400820790/"}, {"id": 3, "category": "财经经济与就业", "scope": "国内", "title": "央行连续4个工作日开展隔夜逆回购，单日操作上限6000亿元", "summary": "中国人民银行近日公告，9月14日至17日将连续四个工作日开展隔夜逆回购操作，每日操作量不超过6000亿元，采用固定利率、数量招标。这是今年6月新设的短期工具继8月后再次覆盖税期前后关键时点。分析认为，此举旨在熨平日间资金波动、守住短端利率，并非降准降息式“大水漫灌”。", "source": "每日经济新闻", "url": "https://www.nbd.com.cn/articles/2026-09-13/4580169.html"}, {"id": 4, "category": "财经经济与就业", "scope": "国际", "title": "中东局势推升油价，布伦特原油涨超3%重回107美元/桶", "summary": "北京时间9月14日，受中东冲突升级、沙特输油管道中断影响，国际油价集体拉升，布伦特原油期货涨超3%重回107美元/桶，纽约原油涨近3%；美股股指期货全线下跌，纳指期货跌超1%，比特币跌破7.7万美元。本周迎来“央行超级周”，市场预计美联储将开启年内首次加息。", "source": "21世纪经济报道", "url": "https://news.qq.com/rain/a/20260914A034MC00"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "AI三巨头罕见齐声呼吁放缓前沿AI研发，警示失控风险", "summary": "Anthropic首席执行官阿莫代伊12日发文警告AI风险“严峻”，须放慢模型能力提升步伐，并建议引入具员工同等权限的第三方评估团队。OpenAI首席执行官奥尔特曼与xAI创始人马斯克均公开表示支持。美媒称，这一立场一致凸显对AI的担忧正从行业边缘走向中心，但合作限发展或触及反垄断争议。", "source": "环球时报", "url": "https://www.toutiao.com/article/7685155521159594550/"}, {"id": 6, "category": "汽车出行", "scope": "国内", "title": "九部门发布智能网联新能源汽车“十五五”规划，2030年新能源乘用车占比70%", "summary": "工信部等九部门近日印发《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年新能源乘用车、商用车新车销量占比分别达70%、40%，高速公路等场景实现高度自动驾驶。2020—2025年我国新能源汽车年销量从136.7万辆增至1649万辆，渗透率由5.4%升至47.9%，已超额完成前期目标。", "source": "环球网", "url": "https://www.toutiao.com/article/768515548875277828/"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "也门胡塞称沙特24小时58次空袭；印尼客轮倾覆6死上百失踪", "summary": "也门胡塞武装13日称，过去24小时沙特对塔伊兹、荷台达等6省发动58次空袭；也门政府军称与胡塞在一个月冲突中伤亡约2000人，胡塞方面1000多人死亡。另据印尼方面消息，一艘载约243人的客轮13日倾覆沉没，截至14日上午已致6死、110人获救，仍有上百人失踪，船上无中国公民。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685148948562067983/"}, {"id": 8, "category": "战争与自然灾害", "scope": "国内", "title": "海南持续强降雨 多地发布暴雨红色预警，约4500艘渔船回港避风", "summary": "受南海热带低压残余环流与冷空气共同影响，海南岛13日以来普降暴雨到大暴雨、局地特大暴雨，保亭毛感乡12小时降雨量达362毫米。气象台继续发布暴雨红色预警，水利部针对海南启动洪水防御Ⅳ级应急响应，约4500余艘渔船已回港避风，预计14日南部部分地区仍有大暴雨。", "source": "国家气象中心", "url": "https://www.nmc.cn/publish/alarm/46902941600000_20260914020905.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "引力一号遥三火箭预计9月16日东海发射；北京6G空天地一体实验室发布", "summary": "据“海阳发布”消息，预计9月16日上午，由海阳东方航天港总装出厂的引力一号（遥三）运载火箭将搭乘发射船在东海海域发射。作为全球运力最大的固体火箭，其成功将进一步验证批量化发射能力。此外，中国联通研究院联合多家企业发布北京6G空天地一体实验室，国家超算互联网注册用户已突破170万。", "source": "每日经济新闻", "url": "https://news.qq.com/rain/a/20260914A0363800"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "SpaceX完成第700次猎鹰火箭发射，为SES送最后3颗卫星", "summary": "北京时间9月14日2时49分，SpaceX从佛罗里达发射猎鹰9号，为商业客户SES运送3颗卫星，这是其第700次猎鹰发射（含687次猎鹰9号、13次重型）。执行任务的B1080助推器完成第29次飞行并成功海上回收；2026年至今SpaceX已执行107次猎鹰发射，O3b mPOWER星座在中地球轨道卫星增至13颗。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260914A034PK00"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "LPL总决赛AL 3:1击败BLG夺队史首冠，Tarzan当选FMVP", "summary": "在《英雄联盟》LPL2026年总决赛中，AL以3比1击败BLG，捧起队史首座银龙杯，并以赛区一号种子身份直接晋级2026全球总决赛。总决赛系列赛结束后，Tarzan当选FMVP。对一支此前从未在LPL登顶的队伍而言，从“无冠”到“一号种子”仅隔一个总决赛系列赛。", "source": "网易", "url": "https://www.163.com/dy/article/L6P2409705561FZL.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "中网参赛阵容出炉，郑钦文、辛纳、德约科维奇等名将确认参赛", "summary": "随着2026美国网球公开赛临近尾声，中国网球公开赛参赛阵容渐完整，郑钦文、辛纳、德约科维奇、莱巴金娜、萨巴伦卡等名将均确认参赛，新科美网青少年女单冠军孙心然也将持外卡首次亮相中网女单正赛。同期，中国选手包揽2026年WDSF世界霹雳舞3V3混合团体锦标赛冠亚军。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-14/detail-ihfizwvu6760267.shtml"}, {"id": 13, "category": "游戏电竞", "scope": "国内", "title": "2026DFPL夏季赛季后赛车轮战开打，16支队伍角逐", "summary": "《三角洲行动》2026 DFPL夏季赛常规赛结束，季后赛于9月11日至13日开启。16支队伍率先进行六场车轮赛：常规赛前6名在首场交手，其余10队两两进入后续场次，每场结束后后4名落位下一场，直至六场全部结束。首场由EGG、eStar、SYG、JXG、杭州LGD、IBG同场竞技。", "source": "腾讯游戏", "url": "https://df.qq.com/cp/a20240906main/newsdetail.html?id=13198094453735269962"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "研究提示：腹型肥胖者或更缺维生素D，二者可能互为因果", "summary": "英国伦敦大学学院等发表于《糖尿病、肥胖与代谢》的研究显示，腹型肥胖与维生素D缺乏均升高死亡风险，二者并存时风险大幅攀升。专家解释，维生素D为脂溶性，会被大量脂肪“封存”难以释放；而缺乏维D又易致脂肪堆积、腰围增粗，形成恶性循环。男性腰围≥90厘米、女性≥85厘米即属腹型肥胖。", "source": "中国经济网", "url": "http://fashion.ce.cn/yw/202609/t20260914_3210836.shtml"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "财税与绿色金融推动经济“向绿”转型，清洁能源发电销售收入同比增17.1%", "summary": "最新税收数据显示，上半年生态保护和环境治理业销售收入同比增6.9%，以风、光、水、核为代表的清洁能源发电销售收入同比增17.1%，占电力生产销售收入38.8%。“十四五”中央财政累计下达污染防治和生态文明建设资金超2.3万亿元；挥发性有机物环境保护税试点将于2027年1月1日启动。", "source": "经济日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1436aa7280281952"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "“百社千校新疆行”走进和田，推动优质阅读资源下沉基层", "summary": "9月6日至8日，“百社千校新疆行”阅读推广活动在新疆和田举办，聚焦青少年阅读素养提升。出版单位代表、作家与阅读推广人走进多所中小学，开展图书捐赠与讲座。作家刘亮程在和田学院与师生探讨阅读与文学创作，库尔班大叔曾孙女如克亚木等也参与推广，助力书香校园建设。", "source": "人民日报海外版", "url": "https://paper.people.com.cn/rmrbhwb/pc/content/202609/14/content_30180928.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "“请3休13”拼假带火中秋国庆长线游，赏秋目的地订单翻倍", "summary": "2026年中秋、国庆仅隔3天，“请3休13”拼假方案走红，形成近年少有超长出行窗口。途牛数据显示，超35%游客提前出发、超10%错峰出行，6天以上中长线占预订31%，10天以上超长行程占26%。九寨沟、伊春等赏秋目的地民宿订单同比涨超3倍，家庭及三代同游占比超七成。", "source": "中工网", "url": "https://www.workercn.cn/papers/grrb/2026/09/14/4/news-9.html"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "中央组织部等5部委修订印发“5个办法”加强事业单位领导人员管理", "summary": "日前，中央组织部分别会同中央宣传部、教育部、科技部、国家卫生健康委，修订印发宣传思想文化、高校、中小学校、科研事业单位、公立医院等5个领导人员管理办法，进一步完善事业单位领导人员管理制度体系，为建设高素质专业化队伍提供制度保障。同时，中央网信办等三部门印发数字乡村高质量发展行动计划。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685151246822490664/"}]}};</script>

    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
