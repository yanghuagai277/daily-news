<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-11-23", "generatedAt": "2026-11-23T12:01:55+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI首席科学家呼吁为前沿AI研发设限，预警2027年或自我加速", "summary": "OpenAI首席科学家帕霍茨基呼吁全行业为前沿AI研发设立共同限制，在研究人员具备可靠监测模型行为的能力前不突破约定门槛，并以“困惑度”等指标衡量进展。CEO奥尔特曼表示支持，称这是OpenAI一段时间以来发布的最重要内容，并警示AI最快2027年就可能进入自我加速迭代阶段。", "source": "腾讯新闻/彭博社", "url": "https://news.qq.com/rain/a/20261123A042T000"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "AI参与黎曼猜想证明通过Lean社区形式化验证认可", "summary": "11月21日，开源形式化证明社区Lean与数学库Mathlib发布联合声明，确认Anthropic数学家阿尔珀格借助AI模型Claude完成的黎曼猜想证明通过形式化验证，代码库约1700万行，团队对正确性“完全有信心”。MIT数学家萨瑟兰更新核验记录称部分完整检查仍在运行，强调机器验证尚不等于数学界同行评审程序结束。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261123A03T9T00"}, {"id": 3, "category": "科学探索", "scope": "国内", "title": "量子计算机“高速内存”全球首次真机实现，浙大“天目2号”立功", "summary": "浙江大学团队在国际期刊《自然·物理》发表成果，其自主设计的“天目2号”超导量子芯片全球首次实现QRAM（量子随机存储器）真机应用，相当于给量子计算机装上“高速内存”。芯片成功运行4位和8位数据QRAM原型，准确率分别达80.9%和60.4%，线路深度降低30%以上，有望用于金融分析、AI训练与新药研发。", "source": "证券时报/人民日报", "url": "https://www.stcn.com/article/detail/4347080.html"}, {"id": 4, "category": "国际时事", "scope": "国内", "title": "中俄美元首会晤发表《和平宣言》，国际社会高度评价", "summary": "新华社报道，中俄美元首在深圳举行历史性会晤并发表面向世界的《和平宣言》，国际社会给予高度评价。多国政要与学者认为，三国元首坐下来探讨大国相处与维护世界和平之道，缓解了国际社会诸多忧虑，为构建更稳定的国际环境迈出建设性一步，呼吁将会晤共识转化为具体行动。", "source": "新华社", "url": "http://ipaper.ce.cn/pad/content/202611/23/content_342334.html"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "肯尼亚与刚果(金)同意全面恢复外交关系", "summary": "肯尼亚总统鲁托与刚果(金)总统齐塞克迪11月22日在刚果(布)奥约四方峰会上达成共识，同意通过恢复大使往来等措施全面恢复外交关系，加强贸易、投资等领域经济合作，并深化埃博拉疫情防控协作，共同维护大湖地区和平稳定。此前两国因2023年“刚果河联盟”事件一度关系紧张。", "source": "新华网", "url": "https://news.yunnan.cn/system/2026/11/23/034200726.shtml"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "COP31气候大会延期两天闭幕，未达成全面成果文件", "summary": "当地时间11月22日，《联合国气候变化框架公约》第三十一次缔约方大会在土耳其安塔利亚延期两天后闭幕，因各方在逐步摆脱化石燃料与气候资金议题上分歧严重，未能达成全面成果文件。中国代表团团长李高对结果深感失望，呼吁各方展现妥协精神、勿失对多边进程的信心，中国代表团全程参与165项议题磋商。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=11491571874829073433&channelId=1119"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "融资保证金比例下限降至80%，理论带来近4000亿元增量资金", "summary": "经中国证监会批准，沪深北交易所将融资保证金比例下限从100%降低至80%，自2026年11月30日起实施，据测算理论上可带来近4000亿元增量资金。同日沪深交易所推出新一批降费措施并将多项减免延长至2028年，深交所就创业板引入做市商制度征求意见，共同构成一组“稳市”组合拳。", "source": "财联社", "url": "https://www.cls.cn/detail/2541124"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "前10月全国一般公共预算收入19.57万亿元，同比增长4.9%", "summary": "财政部数据显示，1至10月全国一般公共预算收入19.57万亿元，同比增长4.9%，其中税收收入16.26万亿元、增长6%，非税收入下降0.2%。支出22.8万亿元、增长1%，社会保障和就业、卫生健康支出分别增长4.8%和7.8%，呈现“税收提质、民生优先、中央加力”特征。", "source": "新华网", "url": "https://www.news.cn/fortune/20261123/caac6a4a6f3e42f8b6ec7b913b412243/c.html"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "两部门实施数据领域高技能人才集群培养计划", "summary": "国家数据局、教育部11月23日宣布成立全国数据职业教育教学指导委员会，实施数据领域高技能人才集群培养计划等系列行动。未来五年将推进教学关键要素联动改革等七项重点任务，目标是到2030年基本形成适应人工智能时代的数据领域高技能人才培养范式，建成政府统筹、行业指导、企业参与的职业教育生态。", "source": "央视新闻", "url": "https://news.yunnan.cn/system/2026/11/23/034200472.shtml"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "美以伊局势升级：内塔尼亚胡被曝考虑单独对伊动武", "summary": "央视新闻11月23日报道，以色列看守政府总理内塔尼亚胡正考虑在未经美国批准情况下单独对伊朗动武，以军情报局警告可能引发多条战线冲突。伊朗革命卫队称24小时内在霍尔木兹海峡以东击落第4架美军无人机，重申领空是“红线”；美国驻巴林使馆提醒公民提高警惕，称敌对行动或迅速升级。", "source": "极目新闻/央视新闻", "url": "https://www.ctdsb.net/c1679_202611/2911661.html"}, {"id": 11, "category": "战争与自然灾害", "scope": "国际", "title": "印尼糖果厂大火，已寻获24个尸袋约30人仍失联", "summary": "印尼西爪哇省万丹一处糖果工厂11月21日晚发生火灾，救援部门11月23日继续搜寻失踪员工。警方已寻获24个装殓遗骸的尸袋，约30人仍失联，遇难者遗体难以辨认需依靠DNA鉴定。厂方称火灾发生时约有300人在厂，起火原因正在调查，部分建筑仍有坍塌风险。", "source": "新华网", "url": "https://english.news.cn/20261123/c1579a6754e1419ba6c6d54200210a62/c.html"}, {"id": 12, "category": "文化读书", "scope": "国内", "title": "湖北云梦老虎墩战国秦汉墓地考古取得重大收获", "summary": "国家文物局“考古中国”重大项目发布进展，湖北云梦老虎墩战国秦汉墓地已清理秦汉墓葬113座，出土漆木器、金属器等1200余件/套，其中三座墓出土622个编号简牍，含秦始皇三十五年历谱。团队首次从饱水稻壳残留胚组织提取古代水稻DNA并鉴定亚种，还检测出中国南方地区最早的炒钢制品。", "source": "湖北文明网", "url": "http://www.hbwmw.gov.cn/c/2026/11/88680.shtml"}, {"id": 13, "category": "体育赛事", "scope": "国际", "title": "阿尔卡拉斯击败兹维列夫，首夺ATP年终总决赛冠军", "summary": "在都灵举行的ATP年终总决赛决赛中，23岁的西班牙选手阿尔卡拉斯以6比2、7比6（9/7）击败世界第一兹维列夫夺冠。这是他本赛季初夺澳网、成为最年轻完成职业生涯全满贯选手后的又一冠，他也由此跻身费德勒、阿加西、德约科维奇之后集齐四大满贯与总决赛冠军的球员之列。", "source": "海峡时报/路透社", "url": "https://www.straitstimes.com/world/while-you-were-sleeping-5-stories-you-might-have-missed-nov-23-2026"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "流感升至中流行水平，甲型H1N1取代H3N2成主流毒株", "summary": "中国疾控中心最新监测显示，全国流感活动整体已进入中流行水平，聚集性疫情增多。2026年甲型H1N1、H3N2与乙型Victoria系三种毒株同时活跃，11月优势毒株“换班”，甲型H1N1正取代H3N2成为主流。5至14岁儿童阳性率最高，专家强调儿童“早识别”、老年人“防重症”，疫苗整个流行季仍可接种。", "source": "央视网/中国青年网", "url": "https://qnzs.youth.cn/tsxq/202611/t20261123_16979584.htm"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "冷空气继续影响中东部，中央气象台发布大风蓝色预警", "summary": "中央气象台11月23日继续发布大风蓝色预警，23日至24日冷空气继续影响中东部，大部地区降温4至6℃，内蒙古东部、黑龙江东部、吉林东部等地降温8至10℃。内蒙古、华北、东北等地伴4至6级风、阵风7至9级，东部和南部海域阵风8至10级，西藏东部、川西高原局地有暴雪。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261123_8154841.html"}, {"id": 16, "category": "汽车出行", "scope": "国际", "title": "特斯拉FSD V15在北美开始推送，安全场景处理能力提升25倍", "summary": "当地时间11月21日，特斯拉宣布辅助驾驶FSD V15版本在北美开始向早期体验计划用户推送，马斯克称12月将大范围推送。新版本升级端到端自动驾驶网络，官方称关键安全场景处理能力提升25倍，并上线“Tesla Reality View”实景可视化界面，马斯克称新版本将带来“特别的东西”。", "source": "每日经济新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261123A03JJD00"}, {"id": 17, "category": "游戏电竞", "scope": "国际", "title": "LOUD夺2026无畏契约全球冠军赛冠军，成史上首个双冠王", "summary": "在上海梅赛德斯-奔驰文化中心举行的2026无畏契约全球冠军赛决赛中，美洲赛区LOUD以3比1击败EMEA豪门Team Vitality，继2022年后再次捧杯，成为赛事史上首支两夺冠军的战队。18岁指挥Erde拿下赛事MVP，100万美元冠军奖金花落LOUD，VIT则收获队史最佳亚军。", "source": "虎扑体育", "url": "https://voice.hupu.com/bbs/643062445"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "“雪假”撬动冰雪经济，多地推出中小学生冰雪假期", "summary": "随着2026年新雪季开启，吉林、新疆阿勒泰、内蒙古呼伦贝尔、河北张家口等地中小学生迎来特色“雪假”，多为3个工作日叠加周末形成5天小长假。去哪儿数据显示崇礼滑雪场搜索量环比激增140%，新雪季张家口酒店预订量同比增六成；12岁及以下儿童机票预订量同比涨91%，冰雪消费向日常化、普惠化延伸。", "source": "央广网/河北文旅", "url": "https://news.yunnan.cn/system/2026/11/23/034200597.shtml"}]}, "yest": {"date": "2026-11-22", "generatedAt": "2026-11-22T08:32:35+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平APEC深圳会议系列重要讲话引发全球热烈反响", "summary": "亚太经合组织第三十三次领导人非正式会议及相关活动在深圳成功举行。习近平主席出席工商领导人峰会开幕式并发表主旨演讲，主持领导人非正式会议，就建设亚太共同体提出坚持和衷共济、开放融通、开拓创新、包容发展等中国主张。多国智库人士评价，这些主张为亚太合作指明方向，在全球不确定性加剧背景下为区域经济合作与供应链稳定发挥引领作用。", "source": "新华社/经济日报", "url": "http://paper.ce.cn/pad/content/202611/22/content_342293.html"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "特朗普称将与伊朗达成永久性协议，卡塔尔代表团赴德黑兰斡旋", "summary": "美国总统特朗普11月21日在采访中称，将与伊朗达成一项永久性协议，此前他还表示不会在新年前“仓促”决定对伊行动。同日，调解方卡塔尔代表团抵达德黑兰，与伊朗方面会谈约两小时。伊朗外长强调浓缩铀不会被运出境外，伊朗副外长证实卡塔尔访问。分析认为，美伊在波斯湾持续对峙的同时，谈判渠道仍在运作。", "source": "央视新闻/新华社", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=15066787746807276868&channelId=1119"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "联合国安理会第九轮意向性投票：8位下任秘书长候选人均遭否决", "summary": "联合国安理会11月20日就下任联合国秘书长遴选举行第九轮意向性投票，8位候选人均未获得通过，僵局持续。按照程序，秘书长人选需获安理会九票赞成且五大常任理事国无一反对。遴选久拖不决，反映出 major 国在人选问题上的分歧。现任秘书长古特雷斯的任期将于2026年底结束，各方仍在就此展开磋商。", "source": "新华社", "url": "http://mp.weixin.qq.com/s?__biz=MzIwMTIyNzM5Mw==&mid=2247483730&idx=1&sn=f08df66749758cb754868e8d8cb13405"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "国产大模型累计下载破100亿次，量子计算机“高速内存”全球首次真机实现", "summary": "据11月22日公布的消息，国产大模型累计下载量已突破100亿次，引领全球开源生态。同期，我国科研团队宣布在全球首次于真机上实现量子计算机“高速内存”，为提升量子计算的数据存取效率提供关键突破。国家数据局表示，将积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范，引导行业规范发展、避免低质量重复建设。", "source": "新华社/自贡网", "url": "https://www.zgm.cn/content/6b02355c2f2f3"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌密集迭代 Gemini 4 系列，AI竞争从“拼参数”转向场景落地", "summary": "11月以来谷歌连续推出新一代大模型，18日发布的Gemini 4 Neon专为复杂软件工程、科研与知识工作流优化，在多项权威评测榜单跻身全球顶尖梯队，每百万Token输入定价3美元。此前推出的Gemini 4 Hydrogen已向免费用户开放。业界观察到，国内外AI巨头竞争重心正从参数堆叠转向场景适配、成本优化与全民普惠，落地价值成为新赛道。", "source": "今日头条", "url": "https://www.toutiao.com/a1882375357350912"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "前10月全国一般公共预算收入增长4.9%，财政运行平稳有序", "summary": "财政部数据显示，前10个月全国一般公共预算收入同比增长4.9%，财政收支运行平稳有序。支出端结构持续优化，中央本级支出增长5.4%、地方支出增长0.2%，体现中央财政主动加力、减轻地方压力的政策取向。“投资于人”的取向更加鲜明，育儿补贴、教育、住房保障等民生支出得到较好保障，专家建议进一步稳定房地产市场、释放消费潜力。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/22/content_342298.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "10月中国内地访日游客同比下滑47%，连续11个月减少", "summary": "日本政府观光局数据显示，2026年10月中国内地访日游客为37.95万人，同比下滑47%，已连续11个月减少。野村研究所测算，若中国游客数量持续低迷，日本全年将损失1.79万亿至2.2万亿日元，拖累GDP增速约0.36个百分点。今年1至10月累计访日游客3464.3万人，同比减少2.5%，赴日旅游降温对日本经济的影响正在显现。", "source": "观察者网/同花顺财经", "url": "https://news.10jqka.com.cn/20261122/c682074914.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "最高检发布性侵害未成年人指导性案例，健康副校长制度明确", "summary": "最高人民检察院发布指导性案例，强调依法严惩性侵害未成年人犯罪。教育部、国家卫健委同时明确中小学校、幼儿园健康副校（园）长制度：由医疗卫生机构选派、不占学校编制，任期3年，每学期到校现场指导不少于4次、每学年至少2次面向师生家长科普宣讲，任职前须完成不少于8学时培训，推动医校协同守护学生健康。", "source": "新华社/教育部", "url": "http://mp.weixin.qq.com/s?__biz=MzIwMTIyNzM5Mw==&mid=2247483730&idx=1&sn=f08df66749758cb754868e8d8cb13405"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "青海德令哈发生5.6级地震，中国地震局启动四级应急响应", "summary": "11月21日18时45分，青海省海西州德令哈市发生5.6级地震，震源深度10千米。当地暂未发现人员伤亡，中国地震局已启动四级应急响应，相关部门正在核查灾情、排查房屋与基础设施安全。地震发生在小雪节气前后，初冬寒冷天气给现场救援和群众安置带来一定挑战，后续震情监测仍在持续。", "source": "央视新闻/新华社", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=12174788899053980407&channelId=1119"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "伊朗革命卫队打击巴林境内美军基地，也门方向攻防持续", "summary": "当地时间11月21日晚，伊朗伊斯兰革命卫队称对巴林两处美军基地实施打击，击中两部“爱国者”防空系统雷达，称此举回应美军持续侵犯伊朗领空；巴方称一处民用工业设施遭袭。美军中央司令部否认有人员伤亡。同日，沙特主导的多国联军称拦截胡塞武装射向利雅得的导弹和无人机，也门荷台达传出爆炸声，联合国呼吁各方重返谈判桌。", "source": "央视新闻/新华社", "url": "https://www.toutiao.com/a1882511719774208"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "神舟二十四号完成最后一次全系统合练，近日择机发射", "summary": "神舟二十四号载人飞行任务21日在发射场区完成最后一次全系统合练，船箭组合体已转运至发射区，计划近日择机发射。按“打一备一、滚动备份”安排，神舟二十五号船箭处于应急救援待命状态。执行一年期任务的航天员与巴基斯坦航天员也将揭晓，神舟二十三号乘组将与二十四号乘组在“天宫”会师。", "source": "新华社/央视网", "url": "https://news.qq.com/rain/a/20261120A06SFI00"}, {"id": 12, "category": "科学探索", "scope": "国内", "title": "“考古中国”发布4项成果，聚焦长江流域人类起源与文明化进程", "summary": "国家文物局发布四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭岭头上遗址、湖北云梦老虎墩墓地4项考古成果。桃花河遗址是长江流域迄今遗物最密集的中更新世旷野中心营地；良渚反山揭示墓葬区与礼仪空间整体布局；云梦老虎墩出土简牍和大量漆木器，为研究秦汉基层治理提供最新史料。", "source": "人民网/云南网", "url": "https://news.yunnan.cn/system/2026/11/20/034198934.shtml"}, {"id": 13, "category": "体育赛事", "scope": "国内", "title": "中国短道女队夺世巡赛首尔站3000米接力金牌，武大靖执教首金", "summary": "11月21日，2026—2027赛季短道速滑世巡赛首尔站女子3000米接力A组决赛，张楚桐、公俐、张延、张珈宁组成的中国队以4分12秒679夺冠，领先韩国队0.311秒。这是中国女队时隔五年再夺世巡赛分站接力金牌，也是主教练武大靖8月竞聘上任后的首枚国际赛事金牌。中国队赛季前两站仅获1银2铜，首金提振士气。", "source": "新华社/新浪体育", "url": "https://sports.sina.cn/2026-11-22/detail-inizputw1654706.d.html"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "2026版医保目录新增107种药品，51个1类创新药创历史新高", "summary": "11月14日发布的2026年国家医保药品目录新增107种药品，其中51个为1类创新药，占比接近一半，创国家医保局成立以来单次调整新高。目录含31种肿瘤药、24种慢性病药、18种罕见病药，CAR-T与双抗ADC实现“零的突破”。商保创新药目录同步扩至28种并与基本医保首次转化衔接，均自2027年1月1日起执行。", "source": "新华网", "url": "https://www.news.cn/health/20261120/ff16514b01954b96bfdc12b2662eb2d7/c.html"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "今日小雪：22日至24日冷空气自北向南影响中东部，局地降温10℃", "summary": "11月22日进入冬季第二个节气“小雪”。中央气象台预计，22日至24日较强冷空气自北向南影响我国中东部，气温先后下降4至8℃、内蒙古中东部和东北部分地区降温8至10℃，并伴有4至6级大风、阵风7至10级，已发布大风蓝色预警。内蒙古东部、东北有大到暴雪，江南华南有中到大雨；23至24日川西高原、西藏东部局地暴雪。", "source": "中央气象台/中国天气网", "url": "https://news.weather.com.cn/2026/11/4868774.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "四部门发布《绿色交通发展“十五五”规划》：2030年交通运输碳达峰", "summary": "交通运输部等四部门发布《绿色交通发展“十五五”规划》，提出到2030年实现“一达峰、二下降、三提升”，交通运输领域总体实现碳达峰。规划明确加快新能源重卡在京津冀及周边等重点区域全场景规模化应用，打造零碳货运车队；开展充电设施服务能力“三年倍增”行动，提高高速服务区大功率充电比重；机场场内车辆力争全面电动化。", "source": "交通运输部/经济日报", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491103&idx=2&sn=fef54e3f534287ade0afda704a931539"}, {"id": 17, "category": "游戏电竞", "scope": "国内", "title": "广州文交会设游戏电竞展区，国产游戏《鸣潮》斩获TGA玩家之声奖", "summary": "2026广州文化产业交易会11月20日至22日在琶洲举行，展览面积超4万平方米、500余家展商。游戏电竞展区约920平方米，集中展示精品创作、技术自研与文化出海成果，入口陈列库洛游戏《鸣潮》获得的TGA2025“玩家之声”奖杯。现场还可体验AI吉他创作、沉浸式XR设备，国产自研引擎与数字人技术一同亮相，展现大湾区数字文创实力。", "source": "广州市人民政府/南方+", "url": "https://www.gz.gov.cn/ysgz/xwdt/ysdt/content/post_11112449.html"}, {"id": 18, "category": "文化读书", "scope": "国内", "title": "“画游·千里江山”数字展在广东省博物馆开展，数字技术再现千年青绿", "summary": "\"画游·千里江山\"数字展览11月在广东省博物馆开展，运用实时分层渲染与时间变换系统，动态呈现破晓、白昼、雨后、黄昏、月夜等山水场景，让观众化身穿行画中的旅人。原画全长近12米无法一次展现全貌，展览将定期更换长卷画面。该系列此前已在澳门、重庆巡展，此次为迎接APEC会议落地，助力湾区文化融合与传统文化数字化传播。", "source": "光明日报/光明网", "url": "https://news.gmw.cn/2026-11/22/content_39113692.htm"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
