27809513.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "8月CPI同比上涨0.8%，PPI涨幅扩大至3.8%", "summary": "国家统计局数据显示，8月份全国居民消费价格（CPI）环比上涨0.4%、同比上涨0.8%，其中能源价格上涨4.1%、影响CPI约0.28个百分点；工业生产者出厂价格（PPI）同比上涨3.8%、环比上涨0.4%。数据反映内需温和修复、工业品价格继续回暖。", "source": "国家统计局/陆家嘴财经早餐", "url": "https://www.163.com/dy/article/L6EQ6DNM05198RSU.html"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "我国发布第八批新职业：11个新职业、23个新工种", "summary": "9月9日人社部等部门向社会发布第八批新职业，包括船舶岸基管理工程技术人员、具身智能机器人应用技术员、运动数据分析师等11个新职业，以及社区工作者、低空物流员、适老化改造设计师等23个新工种。其中5个数字职业、3个绿色职业，至此我国数字职业达113个、绿色职业达142个。", "source": "中国蓝新闻", "url": "https://www.toutiao.com/article/7683665810568626728/"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "第42个教师节到来，我国专任教师达1870.1万人", "summary": "在第四十二个教师节之际，习近平总书记向全国广大教师和教育工作者致以节日祝贺和诚挚问候。人民日报指出，当前全国各级各类学校专任教师达1870.1万人，支撑起世界规模最大的教育体系；《教育发展“十五五”规划》提出建设1000所以上优质普通高中，夯实教育强国之基。", "source": "人民日报", "url": "https://new.qq.com/rain/a/20260910A02MRD00"}, {"id": 10, "category": "科学探索", "scope": "国际", "title": "哈勃望远镜发现土星南极“十边形”大气波", "summary": "NASA公布，哈勃太空望远镜在土星南极发现一个巨大的、不断演化的十边形象限大气波（decagon），这是首次在该行星南半球观测到规则多边的急流结构，与其北半球著名的“六边形”遥相呼应但明显不同。研究结果9月2日发表于《Science Advances》，科学家仍在探究其成因与稳定性。", "source": "ScienceDaily/NASA", "url": "https://www.sciencedaily.com/releases/2026/09/260903064229.htm"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "中国女篮75比72胜波多黎各，晋级世界杯八强", "summary": "北京时间9月10日凌晨，2026年柏林女篮世界杯12进8附加赛，中国队75比72险胜波多黎各，晋级八强，并成为本届赛事八强中唯一的亚洲球队。韩旭砍下21分11篮板，杨舒予贡献15分11助攻，张子宇替补13分。球队将于10日20:30对阵法国队争夺四强席位。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-10/detail-inirhezn8286198.d.html"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "郑钦文美网止步八强，莱巴金娜登顶世界第一", "summary": "北京时间9月10日，2026美网女单1/4决赛，从资格赛打起的郑钦文以1比2不敌2号种子莱巴金娜，三盘比分6-3、1-6、4-6，遗憾止步八强；此役后其即时排名从第101位升至TOP60。莱巴金娜则凭借这场胜利职业生涯首次登顶WTA世界第一。", "source": "今日头条", "url": "https://www.toutiao.com/article/7683646270107402786/"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "四部门规范医疗机构麻醉和精神药品管理", "summary": "国家卫健委、国家中医药局等四部门联合印发《医疗机构麻醉药品和精神药品管理规定》，共11章73条，扩大适用范围至全部药用类麻精药品，细化采购、储存、开具、使用、回收、销毁等关键环节管理，明确未成年人处方需监护人书面同意，将于10月1日起实施。", "source": "健康界/腾讯新闻", "url": "https://new.qq.com/rain/a/20260910A02LDS00"}, {"id": 14, "category": "健康养生", "scope": "国际", "title": "日本梅毒感染超1.3万例，青霉素药物短缺", "summary": "据日本共同社报道，日本梅毒感染人数持续攀升：2013年报告1000余例，2021年近8000例，2025年已超过1.3万例，其中约三分之二为男性。与此同时，治疗用药青霉素出现短缺，预计最早明年下半年才能缓解，当局正加强检测、保障用药与疫情预警。", "source": "新华社", "url": "https://new.qq.com/rain/a/20260910A02L4B00"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "前8月乘用车出口破600万辆，全年有望达1200万辆", "summary": "乘联分会数据显示，8月我国乘用车出口88.8万辆、同比增长77.8%，1至8月累计出口609.8万辆、同比增长75.7%，为同期首次站上600万辆台阶。分析师崔东树预计，2026年全年汽车出口有望达1150万至1200万辆，2030年或突破2000万辆，出海成为车市重要托底力量。", "source": "每日经济新闻", "url": "https://new.qq.com/rain/a/20260910A029XS00"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "第五届气象经济论坛开幕，聚焦“十五五”绿色能源韧性协同", "summary": "9月10日，作为2026服贸会主题论坛之一的第五届气象经济论坛在北京首钢园举办，主题为“‘十五五’启航：气候变化与绿色能源的韧性协同”。论坛围绕AI气象融合、新型电力系统安全、全球气候治理合作展开研讨，并发布面向碳中和的全国风光资源普查计划等成果。", "source": "环球网", "url": "https://capital.huanqiu.com/article/4SVnkMsCCee"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026服贸会开幕，文旅专题413家单位首发亮像", "summary": "2026年中国国际服务贸易交易会9月9日至13日在北京首钢园举办，共有90个国家和地区参展。文旅服务专题以“文旅融合 数智赋能”为主题，汇聚413家参展单位，推出多项全球首发首展；北京文博展区集中展示200余款文创，AI具身智能机器人化身“掌柜”为观众提供讲解与导览。", "source": "人民日报海外版", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1686aa1e20379752"}]}, "yest": {"date": "2026-09-09", "generatedAt": "2026-09-09T22:20:49+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "外交部：中美都是人工智能大国，应加强合作", "summary": "9月9日外交部发言人毛宁回应美方指责中国AI企业“复制”美企技术时表示，中国人工智能发展是高水平科技自立自强成果，中美都是人工智能大国、应当加强合作。同日科创热点还包括DeepSeek筹备科创板IPO、京东APP全面AI化改版、2026年服贸会多款人形机器人与AI应用集中展出。", "source": "新华社/腾讯新闻", "url": "https://news.qq.com/rain/a/20260909A0DGR500"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "亚马逊与高通达成最高600亿美元AI芯片合作", "summary": "亚马逊与高通9月8日宣布建立多代际合作，共同开发面向AI数据中心的定制推理芯片及最高1.6T光互联方案；高通将向亚马逊发行最多2500万股认股权证（行权价161.26美元），采购上限达600亿美元。同日OpenAI称企业业务7月年化营收环比增32%，Meta推出个人AI智能体Muse。", "source": "每日经济新闻", "url": "https://www.toutiao.com/article/7683315035841577499/"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "英法加宣布制裁以色列，谴责其破坏“两国方案”", "summary": "英国首相伯纳姆、法国总统马克龙、加拿大总理卡尼8日发表联合声明，谴责以色列在约旦河西岸扩张定居点、破坏“两国方案”，并宣布对以制裁。同日法国等12国发表联合声明限制与以定居点商品贸易，欧盟称以扩张违反国际法。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7683514337431929386/"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "美袭伊朗油轮，伊朗警告反击，霍尔木兹紧张升级", "summary": "当地时间8日，美军在阿曼湾、哈尔克岛附近摧毁5艘伊朗油轮并袭击相关目标；伊朗革命卫队警告将打击科威特及巴林港口油轮，并称已捕获一艘美军无人潜艇。霍尔木兹海峡航运安全与全球能源供应风险持续升高，伊朗亦就美新一轮制裁表态将报复。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7683287105270792744/"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "前8个月我国货物贸易进出口同比增17.6%", "summary": "海关总署数据显示，今年前8个月我国货物贸易进出口总值34.78万亿元，同比增长17.6%；8月当月进出口4.65万亿元、同比增19.8%，出口、进口分别增长18.6%、21.7%，连续4个月保持两位数增长。进口月度增速连续6个月超过出口，外需与内需同步回暖。", "source": "陆家嘴财经早餐/网易", "url": "https://www.163.com/dy/article/L6C7INMS05198RSU.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "国际油价突破100美元/桶，创7月以来新高", "summary": "9月9日受中东紧张局势升级影响，布伦特原油期货自7月24日以来首次突破每桶100美元，日内涨2.12%；WTI亦同步走高。地缘冲突持续搅动全球能源市场，汇丰同步上调今明两年布油价格预测，全球通胀预期随之升温。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0AZHN00"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "第42个教师节来临，基础教育扩优提质持续推进", "summary": "在第四十二个教师节到来之际，习近平向全国广大教师和教育工作者致以节日祝贺和诚挚问候。人民日报刊文指出，近期出台的《教育发展“十五五”规划》提出建设1000所以上优质普通高中，实施新一轮义务教育薄弱环节改善与能力提升工作，夯实教育强国之基。", "source": "人民日报", "url": "https://news.qq.com/rain/a/20260909A033P400"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "人大聚焦教育就业医疗养老立法，新就业群体派单改善", "summary": "9月9日国新办发布会介绍，全国人大常委会已通过社会救助法、医疗保障法，正推进托育服务法、教师法修改等民生立法，统筹教育、就业、医疗、养老、社保法治保障。中央社会工作部称新就业群体关注的派单不合理、计价不透明等问题已得到改善。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A093UR00"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "我国发布第八批新职业，含11个新职业23个新工种", "summary": "9月9日《新闻联播》披露，我国发布第八批新职业，包括11个新职业、23个新工种，覆盖数字经济发展与新业态用工需求。同期中秋国庆假期铁路运输方案公布，今年丰收节全国将举办47项重点活动，全国工商联发布民营企业创新状况报告。", "source": "央视网", "url": "https://ysxw.cctv.cn/video.html?item_id=5416679928736466035&t=1788954318110"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国天眼绘就最大宇宙气体图谱", "summary": "依托中国天眼FAST中性氢巡天项目（FASHI）第二期数据集，科研团队构建起当今世界规模最大的中性氢星系样本库，共捕捉到15.6万个中性氢星系，覆盖近半个天穹。团队把近邻宇宙中性氢密度测量精度提升至0.6%，创下人类观测该物理量的精度新高。", "source": "科技日报/中国科学院", "url": "https://www.cas.cn/cm/202609/t20260909_5119993.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "“天宫课堂·港澳专场”开讲，神舟二十三号乘组天地对话", "summary": "9月9日“天宫课堂·港澳专场”太空授课活动举行，神舟二十三号乘组朱杨柱、张志远及香港首位载荷专家黎家盈，展示了太空厨房烘烤蛋糕、拧湿毛巾、飞翔的紫荆花等科学演示，并介绍香港载荷“天韵相机”。全港与全澳中小学生同步观看直播。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0DGEK00"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "新赛季欧冠开幕，皇马曼城携手开门红", "summary": "北京时间9月9日凌晨，2026-27赛季欧冠联赛阶段第1轮，皇家马德里主场2比1击败国际米兰取得新赛季开门红，穆里尼奥对阵“老东家”取胜；曼城客场2比0击败波尔图，哈兰德梅开二度。同日金球奖公布30人候选名单，梅西、姆巴佩、亚马尔在列。", "source": "红星新闻", "url": "https://www.toutiao.com/article/7683309097344631346/"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "中疾控发布9月健康防护提示", "summary": "中国疾控中心9月9日提示，9月需关注登革热、基孔肯雅热、寨卡等蚊媒传染病及埃博拉、猴痘、霍乱、疟疾等；学校和托幼机构应重点预防手足口病、水痘、诺如病毒胃肠炎、流感、新冠等。建议公众防蚊叮咬、清理积水、注意饮食饮水卫生，孩子发热不带病上学。", "source": "中国疾控中心/中新网", "url": "https://new.qq.com/rain/a/20260909A093VZ00"}, {"id": 14, "category": "健康养生", "scope": "国内", "title": "我国托育机构达12.6万家，GLP-1类药物或延缓衰老", "summary": "健康早闻显示，我国共有托育机构12.6万家、托位数666万个，托育服务供给持续扩大。科技方面，美国加州大学伯克利分校等机构研究发现，老年小鼠服用GLP-1类药物司美格鲁肽后寿命延长12%，相关成果发表于《自然》，但仍需临床研究验证。", "source": "健康早闻/网易", "url": "https://www.163.com/dy/article/L6C58S4N05149LPQ.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "8月新能源渗透率65.2%创历史新高，燃油车前十清零", "summary": "乘联分会数据显示，8月新能源乘用车零售渗透率65.2%创历史新高，自主品牌达83.9%；当月零售前十车型全部为新能源，燃油车同比大跌40%，高油价加速“油电替代”。8月新能源乘用车出口51.8万辆、同比增154.7%，出海成为车市托底主力。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A08DNF00"}, {"id": 16, "category": "环境气候", "scope": "国内", "title": "中央气象台发布暴雨蓝色预警，四川盆地有较强降水", "summary": "中央气象台9月9日18时继续发布暴雨蓝色预警：9日20时至10日20时，青海、甘肃、陕西、四川、贵州、云南、广西、广东等地部分地区有大雨或暴雨，四川盆地南部、贵州西北部、云南东北部局地大暴雨（100至150毫米），需防范山洪、地质灾害及城市内涝。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34038246"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十九届“汉语桥”世界中学生中文比赛全球决赛启动", "summary": "第十九届“汉语桥”世界中学生中文比赛全球决赛9月9日启动，以“追梦中文，不负韶华”为主题，分为文化体验和赛事角逐两部分，持续至22日。“汉语桥”创办25年来已成为覆盖160多个国家和地区的综合性中文赛事品牌，吸引180多万名海外青少年参与。", "source": "央视网", "url": "https://tv.cctv.cn/2026/09/09/VIDEis5dFHe3qSZpSGlKIMwi260909.shtml"}]}};</script>

  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
