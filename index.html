<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-09-17", "generatedAt": "2026-09-17T06:00:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "上海AI实验室发布书生·星河智能体，科研人机协同实证AI使用率96.5%", "summary": "上海人工智能实验室联合复旦、中科院软件所等研发的“书生·星河”智能体模型（AtriaDawnPreview）近日发布。团队基于56名研发人员769条任务记录的实证显示，该科研场景中AI辅助使用率高达96.5%，但85.5%的技术路线选择、93.4%的研究目标界定仍由人类决策，印证“AI执行、人类掌舵”的可控协同范式；该模型在8项权威基准中获两项第一。", "source": "新民晚报 / 上海人工智能实验室", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_0956aab07b460352"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "谷歌发布Gemini 3.8 Live实时对话模型，并成立DeepMind Institute专攻AGI", "summary": "9月16日，谷歌DeepMind同日推出两项重磅动作：发布Gemini 3.8 Live及Extended Thinking两款端到端语音大模型，支持实时多模态交互与并行后台推理，开发者即日起可通过Gemini API调用；同时联合成立DeepMind Institute，由Shane Legg领衔，系统研究AGI对经济与社会的影响。行业解读认为其“学术+产业”双轮驱动策略为模型能力提供理论背书。", "source": "新浪科技（AI热点小时报）", "url": "https://k.sina.com.cn/article_7857201856_1d45362c001908noyi.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "联合国秘书长古特雷斯敦促中东和乌克兰紧张局势降级", "summary": "联合国秘书长古特雷斯9月16日在联大高级别周前记者会上呼吁中东和乌克兰紧张局势降级，强调“降级必须是第一、第二、第三优先”。他要求各方停止伤害平民、确保人道救援无障碍，并依照国际法全面恢复霍尔木兹与曼德海峡航行自由；就乌克兰冲突，他呼吁立即停火，作为迈向公正持久和平的第一步。", "source": "中国网 / 新华社", "url": "https://www.china.org.cn/world/Off_the_Wire/2026-09/17/content_118699585.shtml"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "俄无人机击中乌客车与火车致5死，交通与能源设施互袭延续", "summary": "乌克兰官员9月16日称，俄罗斯无人机当天击中乌南部一辆客运巴士和一列火车，造成5人死亡。随着莫斯科持续打击交通与基础设施，俄军同时发动对基辅等地的无人机袭击。乌方则打击俄萨马拉锡兹兰炼油厂及无人机设施，特朗普所称“停打能源目标”次日即被打破，双方能源设施互袭态势延续。", "source": "The Financial Express（路透社）", "url": "https://today.thefinancialexpress.com.bd/world/news-in-brief-2026-09-17-1789577616"}, {"id": 5, "category": "财经经济与就业", "scope": "国际", "title": "美联储时隔三年重启加息，将利率上调25个基点至3.75%—4.00%", "summary": "北京时间9月17日凌晨，美联储宣布加息25个基点，将联邦基金利率目标区间上调至3.75%—4.00%，为2023年7月以来首次加息，FOMC以12票赞成、0票反对通过。最新点阵图显示多数官员预计年内还将再加息一次；受此影响美股尾盘跳水，道指跌1.21%，现货黄金跌约1%，美元指数重上100关口。", "source": "东方财富网 / 中国证券报", "url": "https://finance.eastmoney.com/a/202609173876452677.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "8月经济“三稳两快”：工业增5.2%、失业率5.3%、高技术制造涨16.7%", "summary": "国家统计局9月15日公布，8月全国规模以上工业增加值同比增长5.2%，较上月加快0.7个百分点；城镇调查失业率5.3%，居民消费价格同比上涨0.8%。高技术制造业与数字产品制造业增加值分别增长16.7%、15.7%，货物进出口总额同比增长19.8%，经济运行呈“生产、就业、物价稳，新兴与外贸增长快”特点。", "source": "人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9286aa9c1d363452"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国将首次制定全国统一医保医疗服务项目目录，首批覆盖13类", "summary": "9月16日，国家医保局正式印发《国家基本医疗保险医疗服务项目目录（第一批）制定工作方案》，我国将首次制定全国统一的医保医疗服务项目目录。方案坚持“保基本”定位，首批覆盖心血管、呼吸、眼科、妇科、放疗、麻醉、护理、康复、口腔种植、辅助生殖等13类，落地后将率先应用于跨省异地就医结算，再逐步与各省支付范围衔接。", "source": "中国新闻网 / 金普新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_3546aab0bd874252"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "引力一号遥三一箭九星海上发射成功，载荷破3吨创新高", "summary": "北京时间9月16日6时，我国太原卫星发射中心在东海海域使用引力一号遥三运载火箭，将千帆极轨26组卫星及EUHT技术试验卫星共9颗送入预定轨道，任务成功。本次净载荷超3吨、入轨高度约800公里，创单次海上发射载荷重量与轨道高度新高，为千帆星座组网精准补位。此为引力一号第4次飞行。", "source": "光明网", "url": "https://www.toutiao.com/article/7686220673458405930/"}, {"id": 9, "category": "科学探索", "scope": "国际", "title": "美军官称需为月球周边空间作战做准备，太空军事化提速", "summary": "据美联社9月16日报道，美军参谋长联席会议主席丹·凯恩表示，美军不仅需要为地球轨道作战做好准备，还需为月球周边空间作战做准备。此前美国空军部长已公开证实美军在轨部署“太空控制武器”，标志美国太空军事政策重大变化，引发对《外层空间条约》框架下常规太空武器扩张的关注。", "source": "新华社", "url": "https://www.toutiao.com/article/7686243305792733742/"}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "亚运男篮中国87:78力克沙特晋级四强，半决赛9月18日战日本", "summary": "2026名古屋亚运会男篮1/4决赛，中国男篮以87:78击败沙特阿拉伯队，晋级四强。廖三宁砍下30分7篮板4助攻，余嘉豪16分9篮板，胡金秋14分。四强对阵为：中国对日本、韩国对伊朗；中国男篮半决赛将于9月18日18:20打响，争冠热门菲律宾、约旦均提前出局。", "source": "新浪体育（CBA）", "url": "https://k.sina.com.cn/article_5559864694_14b64cd7600101cok2.html?subch=cba"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "亚运男足开门红：中国2:1逆转朝鲜，吴曦张玉宁联袂破门", "summary": "9月16日，名古屋亚运会男足小组赛B组，中国男足亚运队2:1逆转战胜朝鲜队。吴曦送出精准助攻并由张玉宁头球扳平，终场前吴曦挑射反超比分，两名超龄球员“相互成全”奉献精彩配合。中国队在“死亡之组”拼下宝贵3分，9月20日将迎战小组赛第二个对手伊朗队。", "source": "天津日报 / 新浪财经", "url": "https://www.163.com/dy/article/L70L4MG405568W0A.html"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "教育部部署第12个全国近视防控宣传教育月，主题聚焦高度近视", "summary": "教育部近日发布通知，决定今年9月开展第12个全国近视防控宣传教育月，主题为“落实健康第一理念，科学防控高度近视”，要求以健康学校建设为统领，在秋季学期持续推进近视防控宣传教育，至少组织1次主题宣传活动。同期国家中医药局在福建三明举办培训班，推广三明医改中医药经验。", "source": "腾讯新闻 / 教育部", "url": "https://news.qq.com/rain/a/20260917A029D000"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "中国累计淘汰约72万吨消耗臭氧层物质，氢氟碳化物减排超额", "summary": "9月16日国际保护臭氧层日纪念大会上，生态环境部披露：自加入《蒙特利尔议定书》以来，中国累计淘汰约72万吨消耗臭氧层物质；接受《基加利修正案》后，氢氟碳化物生产和使用总量已累计比国家履约目标分别减少11.85亿和7.59亿吨二氧化碳当量以上，为全球环境治理作出重要贡献。", "source": "人民日报海外版", "url": "https://paper.people.com.cn/rmrbhwb/pc/content/202609/17/content_30181590.html"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "九部门发布智能网联新能源车“十五五”规划，中国汽车迈向由大到强", "summary": "工信部等九部门联合发布《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年全产业链优势进一步巩固、进入世界汽车强国行列。2025年我国汽车产销连续17年全球第一，新能源汽车产销连续11年居首、出口同比激增103.7%；L2级辅助驾驶新车渗透率已升至70%，L3级迈入商业化应用，技术领先成为核心竞争力。", "source": "经济参考报 / 新浪汽车", "url": "https://k.sina.com.cn/article_7517400647_1c0126e47059098sn0.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026英雄联盟全球总决赛LPL资格赛9月17日开赛，决出最后两席", "summary": "2026 LPL全球总决赛资格赛（冒泡赛）于9月17日至19日在上海联盟竞技场举行，每日17:00一场BO5。赛程为：17日TES对阵IG（M1，争三号种子），18日WE对阵JDG（M2），19日M1败者对M2胜者争夺四号种子。胜者将代表LPL赛区出征S16全球总决赛，赛事门票与直播同步开放。", "source": "腾讯网 / 腾竞体育", "url": "https://new.qq.com/rain/a/20260909A0DZC900"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "2026“我与地坛”北京书市开幕，展期11天设九大展区", "summary": "9月17日，2026“我与地坛”北京书市启幕，作为北京文化论坛会客厅活动之一，展期11天覆盖中秋小长假。地坛公园主展场面积突破2万平方米，设九大展区、500余展位，汇聚400多家出版机构；同期举办150余场讲座、签售与对谈，濮存昕、赵冬梅等数十位作家到场，并走出北京联动保定、天津办展。", "source": "新浪财经 / 北京日报", "url": "https://finance.sina.com.cn/jjxw/2026-09-17/doc-inisaawt3644615.shtml"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "“双节”出游预订火爆，机票酒店预订量大幅攀升", "summary": "今年中秋与国庆仅隔三天，“请3休13”拼假方案打造全年最长出游窗口。同程数据显示截至9月14日，“中秋”“国庆”搜索热度月环比增278%，国内热门城市机票预订同比增超40%；携程称机票订单同比增约五成、酒店订单增近两倍。航旅纵横显示9月25日至10月7日国内航线机票预订超606万张，同比增约14%。", "source": "东方财富网 / 经济参考报", "url": "https://finance.eastmoney.com/a/202609173876466332.html"}, {"id": 18, "category": "国际时事", "scope": "国内", "title": "香港公布首个五年规划，对接国家“十五五”迈上由治及兴新阶段", "summary": "9月16日，香港特区行政长官李家超在立法会公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》并发表施政报告。规划共7篇28章约6万字，明确经济发展新突破、北部都会区提速、民生福祉改善等5大目标，制定105项指标，是香港主动对接国家“十五五”、由治及兴的行动纲领。", "source": "新浪财经 / 新华社", "url": "https://k.sina.com.cn/article_3167104922_bcc62f9a02001vg6g.html"}]}, "yest": {"date": "2026-09-16", "generatedAt": "2026-09-16T06:50:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "全球首款量产AI智能体手机努比亚NaviX Ultra开售", "summary": "9月16日14时，中兴通讯与字节跳动联合打造的努比亚NaviX Ultra（'豆包手机二代'）正式发布开售，号称全球首款完成大模型备案与终端入网双合规的量产AI智能体手机。该机将豆包大模型嵌入系统底层，支持跨App自主完成比价、下单、填表等链式任务，京东预约量已突破36万台，搭载骁龙8 Elite Gen5与7100mAh电池。", "source": "新浪科技", "url": "https://k.sina.com.cn/article_7879777300_1d5abdc14068015tbo.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "联发科发布天玑9600 Pro，全球首款2nm安卓旗舰芯片", "summary": "9月15日，联发科在深圳发布天玑9600 Pro与9600M旗舰5G智能体AI芯片，采用台积电2nm工艺，为全球首款官宣的2nm安卓移动芯片。其2+3+3全大核CPU多核功耗较上代降低61%，双NPU支持端侧30B参数大模型运行，vivo X500 Pro系列将首发搭载，安卓旗舰芯片正式进入2nm时代。", "source": "上海证券报·中国证券网", "url": "https://www.cnstock.com/commonDetail/790463"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "伊朗发布“阿尔加亚”号油轮起火视频，霍尔木兹超百艘商船改向", "summary": "央视新闻9月16日报道，伊朗发布'阿尔加亚'号油轮触雷起火后首段视频，称该船正被拖往阿曼港口、仍有2人失踪。美军中央司令部称对伊海上封锁已使103艘商船改变航向；美国国会预算办公室估算对伊战争耗资已超380亿美元，中东多国美军基地与设施受损，联合国安理会就曼德海峡局势举行紧急会议。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7685889315280323072/"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "日本滨冈核电站225项地震评估数据造假，社长月底辞职", "summary": "第三方调查委员会9月14日公布报告，日本中部电力为推进滨冈核电站3、4号机组重启，在225项地震安全性评估中至少208项存在虚假说明等不当行为。公司宣布撤回机组重启审查申请，社长林欣吾与董事长胜野哲将于9月30日辞职。事件令日本核电监管公信力再遭重创。", "source": "中国新闻网", "url": "https://www.chinanews.com/gj/2026/09-15/10696552.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "8月经济“三稳两快”：工业增5.2%、失业率5.3%", "summary": "国家统计局9月15日公布，8月全国规模以上工业增加值同比增长5.2%，比上月加快0.7个百分点；城镇调查失业率5.3%，居民消费价格同比上涨0.8%。高技术制造业与数字产品制造业增加值分别增长16.7%、15.7%，货物进出口总额同比增长19.8%，经济运行呈'生产、就业、物价稳，新兴与外贸增长快'特点。", "source": "人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9286aa9c1d363452"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "《电子信息制造业发展“十五五”规划》发布，2030年营收破30万亿", "summary": "工信部、国家发改委9月15日联合印发《电子信息制造业发展'十五五'规划》，提出到2030年规上企业营业收入突破30万亿元、研发投入强度达3.5%。规划部署17项重点任务，攻关高性能处理器、高密度存储器等高端芯片，巩固能源电子优势，推进固态电池、钠电池产业化。", "source": "光明日报", "url": "https://epaper.gmw.cn/gmrb/html/content/202609/16/content_25252.html"}, {"id": 7, "category": "体育赛事", "scope": "国内", "title": "亚运男足首战！国足9月16日18:00对阵朝鲜", "summary": "爱知·名古屋亚运会男足小组赛9月16日18:00开打，中国队在刈谷体育场迎战朝鲜队，CCTV5、央视频直播。中国男足亚运队以U23亚洲杯亚军为班底，补入吴曦、张玉宁、朱辰杰3名超龄球员，与伊朗、阿联酋、朝鲜同处B组，目标小组前两名晋级八强。", "source": "懂球帝", "url": "https://www.dongqiudi.com/articles/6347731.html"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "引力一号遥三一箭九星海上发射成功，载荷破3吨创新高", "summary": "北京时间9月16日6时，我国太原卫星发射中心在东海海域用引力一号遥三运载火箭，将千帆极轨26组卫星及EUHT技术试验卫星共9颗送入预定轨道，任务成功。本次净载荷超3吨、入轨高度约800公里，创单次海上发射载荷重量与轨道高度新高，为千帆星座组网精准补位。", "source": "新浪财经（央视新闻）", "url": "https://finance.sina.com.cn/jjxw/2026-09-16/doc-inirykpe6574522.shtml"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "中国西南首次发现丹尼索瓦人化石，填补地理空白", "summary": "中科院古脊椎所付巧妹团队联合云南多家单位，从云南鹤庆蝙蝠洞6万余块碎骨中鉴定出5件丹尼索瓦人遗骸，年代距今约16.7万至13.4万年，其中1块桡骨为全球首例丹尼索瓦人桡骨化石。成果9月9日发表于《自然》，填补了中国西南地区该古人类的地理空白。", "source": "中国网", "url": "https://big5.china.com.cn/gate/big5/cul.china.com.cn/2026-09/15/content_43491451.htm"}, {"id": 10, "category": "游戏电竞", "scope": "国内", "title": "QQ飞车手游S联赛秋季赛9月16日开赛", "summary": "QQ飞车手游S联赛2026秋季赛于9月16日13时在江苏太仓市工人文化宫电竞馆开赛，AG、KZ、RSG、广州狼队等8支老牌俱乐部携休赛期新阵容亮相。赛程从9月16日持续至11月21日秋季总决赛，分赛段积分博弈、道具与竞速双线升级，全平台同步直播。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20260909A0EOI100"}, {"id": 11, "category": "娱乐影视", "scope": "国内", "title": "年度电影票房破290亿，全产业链产值超4500亿", "summary": "灯塔专业版数据显示，截至9月15日，2026年度电影总票房（含预售）突破290亿元，达290.07亿元，观影人次7.37亿、放映1.06亿场。年内已有9部影片票房破10亿，《飞驰人生3》《功夫女足》《欢迎来龙餐馆》领跑；中秋国庆档定档21部，全年票房有望冲击300亿。", "source": "证券日报", "url": "https://cj.sina.cn/articles/view/2311077472/89c03e6002002o1f4"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "国家卫健委倡议多喝白开水淡茶水，2030年人均预期寿命目标80岁", "summary": "国家卫健委在国新办'十五五'健康中国发布会上倡议居民少盐少油少糖、多喝白开水与淡茶水，目标2030年人均预期寿命从79.25岁提升至80岁；同时提出加强托育综合服务中心建设，到2030年实现地市级托育综合服务中心全覆盖，并通过优质医学本科与硕士扩招扩容基层医疗人才。", "source": "北京市人民政府门户", "url": "https://www.beijing.gov.cn/ywdt/zybwdt/202609/t20260915_4864123.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "汽车产业兼并重组将成重点，车企加速智能化整合", "summary": "车百会研究院理事长张永伟表示，未来几年汽车产业将更受市场关注，兼并重组成为重点推动方向，应在全国统一大市场基础上发挥市场机制作用。近期零跑发布世界模型智驾等5项新技术，小马智行与广汽首发第四代L4自动驾驶重卡，行业从价格战转向整合与智能化竞争。", "source": "财经早餐（今日头条）", "url": "https://www.toutiao.com/article/7685891504795107881/"}, {"id": 14, "category": "社会民生与教育", "scope": "国内", "title": "地震预警信息正沟通接入iOS，同步推进小区广播", "summary": "中国地震局在官网回应网友建议时表示，中国地震台网中心正与苹果公司沟通，力争加快推进地震预警信息接入iOS系统；目前苹果用户可通过微信小程序获取权威预警。地震局同时正配合工信部推进地震预警接入小区广播系统，扩大国家权威预警的直达渠道，减少对第三方来源的依赖。", "source": "腾讯新闻（红星新闻）", "url": "https://news.qq.com/rain/a/20260914A05E5300"}, {"id": 15, "category": "环境气候", "scope": "国内", "title": "前8月碳市场累计成交9.61亿吨，碳定价机制持续完善", "summary": "9月15日武汉2026中国碳市场大会上发布的《全国碳市场发展报告(2026)》显示，截至8月底全国碳排放权交易市场累计成交量9.61亿吨、成交额656.99亿元。2026年发电、钢铁、水泥、铝冶炼四行业纳入重点排放单位达3680家，覆盖二氧化碳排放量约83亿吨、占全国65%以上。", "source": "人民网", "url": "https://hb.people.com.cn/n2/2026/0915/c406123-41696847.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "平陆运河航区正式公布，西南出海物流成本降18%—30%", "summary": "9月15日广西海事局公布平陆运河航区：内河段（南宁横州平塘江口至G75兰海高速钦江大桥）暂定为'内河B级航区'，标志新中国成立以来首条通江达海运河的航区体系全面确立。符合A级技术条件的内河船可经运河直航钦州湾，西南货物出海缩短航程560公里以上、物流成本降18%—30%。", "source": "中国新闻网", "url": "https://www.chinanews.com/aseaninfo/2026/09-15/10696933.shtml"}, {"id": 17, "category": "科学探索", "scope": "国内", "title": "中国向联合国赠送嫦娥六号月壤，维也纳永久展出", "summary": "当地时间9月14日，中国国家航天局在维也纳联合国总部举行交接仪式，正式将嫦娥六号采集的人类首批月背月壤样品赠送联合国，并在总部永久展出，400余名各界代表出席。这是中国推动航天成果共享、践行外空非武器化立场的又一标志性举措，也是中国航天走向世界的生动注脚。", "source": "中国新闻网", "url": "https://www.chinanews.com/gn/2026/09-15/10696644.shtml"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
