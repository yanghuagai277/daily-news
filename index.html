伊军事对抗持续升温：9月5日美军宣布\"摧毁\"3艘伊朗油轮，伊朗则称打击3艘美国军舰和3艘油轮；过去10天霍尔木兹海峡日均通航仅约10艘商业船舶，远低于战前约120艘。也门胡塞武装同时控制红海要地，市场对能源供应担忧加剧，9月10日国际油价加速上行，布伦特原油盘中突破108美元/桶，美国WTI原油收涨8.2%至103.93美元。", "source": "上观新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02LNN00"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞武装占领也门红海要地，沙特石油出口降至13年最低", "summary": "也门政府官员10日称，政府海军撤出红海战略要地哈尼什群岛后，胡塞武装随即部署兵力、建立军事阵地，并攻占红海港口城市穆哈。胡塞方面声称国际船只通过红海和曼德海峡\"安全、正常\"，沙特主导的多国联军则打击了胡塞武装目标。受战事与航运风险影响，沙特上月石油出口降至每日320万桶，为至少13年来最低。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02GET00"}, {"id": 8, "category": "国际时事", "scope": "国际", "title": "俄乌冲突延烧：乌军深入俄境3000公里打击，俄方提核武警告", "summary": "9月10日前后，乌克兰特种部队宣称对俄境内3000多公里外的关键工厂实施全面战争以来最深远的一次打击，泽连斯基称此举将削弱俄拖延外交的能力。俄联邦安全会议副主席梅德韦杰夫表示，如果安全受到威胁，俄罗斯有权使用核武器。另有多家欧美媒体称，俄或于10月国家杜马选举后启动新一轮大规模动员，冲突烈度可能进一步上升。", "source": "上观新闻/环球网", "url": "https://www.toutiao.com/article/7683997310841373218/"}, {"id": 9, "category": "国际时事", "scope": "国际", "title": "阿尔及利亚宣布与阿联酋断绝外交关系", "summary": "据阿尔及利亚方面9月10日消息，阿尔及利亚宣布与阿联酋断绝外交关系。此举令中东与北非地区外交格局再添变数。", "source": "央视新闻/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_5226aa331c277052"}, {"id": 10, "category": "战争与自然灾害", "scope": "国内", "title": "尼泊尔泥石流遇难升至1380人，江西遂川灾害13人遇难", "summary": "据尼泊尔警方最新数据，截至当地时间10日14时，尼泊尔泥石流灾害造成的遇难人数升至1380人。国内方面，江西遂川高坪镇明坑村泥石流灾害最后一名失联人员被找到，共造成13人遇难。9月11日0时53分，云南昭通市巧家县发生3.8级地震，震源深度9公里；云南丽江永胜、宁蒗等地发布暴雨橙色、黄色预警。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02TF700"}, {"id": 11, "category": "财经经济与就业", "scope": "国内", "title": "《金融强国建设\"十五五\"规划》出台，证监会定调资本市场", "summary": "9月10日，央行副行长陆磊在国新办发布会上表示《金融强国建设\"十五五\"规划》正式出台：到2030年金融调控政策协同有效、风险防控精准高效，到2035年基本建成具有高度适应性、竞争力、普惠性的中国特色现代金融体系。证监会副主席李超表示，将增强资本市场内在稳定性，拓宽中长期资金来源与入市方式，健全\"长钱长投\"机制，更大力度释放并购重组改革活力。", "source": "东方财富/21世纪经济报道", "url": "https://finance.eastmoney.com/a/202609103870889835.html"}, {"id": 12, "category": "财经经济与就业", "scope": "国际", "title": "欧洲央行加息25个基点，美国8月PPI同比涨5.4%超预期", "summary": "欧洲央行将存款机制利率上调25个基点至2.50%，主要再融资利率升至2.65%。美国8月PPI同比上涨5.4%（预期5.3%、前值4.7%），环比涨0.4%；上周首次申领失业救济人数20.6万，略低于预期。通胀压力下，交易员已充分消化美联储10月加息预期，美股三大指数连续第四日收跌。", "source": "每日经济新闻/新浪财经", "url": "https://www.nbd.com.cn/articles/2026-09-10/4578497.html"}, {"id": 13, "category": "社会民生与教育", "scope": "国内", "title": "青岛北海造船厂货轮火灾，习近平作出重要指示", "summary": "针对山东青岛北海造船厂一货轮火灾事故，习近平总书记作出重要指示，要求全力搜救失联人员、救治伤员，妥善做好善后工作，尽快查明事故原因、依法追责，并要求各地全面开展火灾隐患排查整治、压实安全生产责任。国务院安委会、应急管理部已派出工作组赶赴现场处置，事故调查组同步进驻。", "source": "新华社/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 14, "category": "社会民生与教育", "scope": "国内", "title": "国办发文治理中小企业回款难，电子凭证账期压减至6个月", "summary": "国务院办公厅印发《关于加强中小企业回款难问题治理有关工作的通知》：对故意拉长账期的大型企业，多部门开展联合约谈并督促整改，查实后依法依规处罚；压减电子凭证最长付款期限至6个月，电子凭证服务平台不得新开立付款期限超过6个月的电子凭证，商业银行、商业保理公司也不得为超期电子凭证提供融资。", "source": "中国政府网/新华社", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 15, "category": "社会民生与教育", "scope": "国内", "title": "中国科学家首获世界顶尖科学家奖，2026\"最美教师\"名单公布", "summary": "9月10日，2026世界顶尖科学家奖在上海揭晓，生命科学或医学奖授予4人，单项奖金1000万元人民币；邵峰成为该奖创办以来首位中国籍获奖者，该单项奖4位获奖者中有3位为华人科学家。同日，中央宣传部、教育部联合发布2026年\"最美教师\"名单，万勇善、马超群、张福锁等25名教师入选。", "source": "新华社/人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8166aa3312375952"}, {"id": 16, "category": "体育赛事", "scope": "国际", "title": "中国女篮61-90不敌法国，止步世界杯八强", "summary": "9月10日，2026国际篮联女篮世界杯八强战，中国女篮以61-90不敌世界排名第二的法国队，结束本届世界杯之旅，最终位列本届赛事八强。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260911A02TF700"}]}, "yest": {"date": "2026-09-10", "generatedAt": "2026-09-10T10:52:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "商务部回应美AI蒸馏公告：指控无据、是科技霸权", "summary": "针对美东时间9月8日美国家安全局等联合发布公告、指责中国AI企业从事\"工业规模\"蒸馏美模型，商务部新闻发言人9日回应称，蒸馏是AI领域模型间互相学习的通行中性技术手段，美方指控\"于事无凭、于法无据\"，是将正常技术商业问题政治化、工具化并搞双重标准、推行科技霸权与算力垄断。中方坚决反对。", "source": "中国金融信息网/新华社", "url": "https://www.cnfin.com/hg-lb/detail/20260910/4467657_1.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI深化与三星合作，自研芯片从模型走向算力", "summary": "OpenAI韩国总经理9月9日在首尔表示，与三星电子在下一代芯片研发与联合生产上取得最大进展；此前6月OpenAI已推出与博通共同设计的首款定制AI芯片。分析认为这标志ChatGPT开发商从模型层向底层算力延伸，若跑通自研芯片，AI算力供应链权力结构或迎洗牌。", "source": "腾讯新闻/每日经济新闻", "url": "https://news.qq.com/rain/a/20260910A02RWS00"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "DeepSeek筹备科创板IPO，V4.1 Flash将发布", "summary": "财联社9月10日早间报道，据知情人士确认，DeepSeek已委托中信证券筹备科创板IPO，双方进入尽职调查阶段、尚未签正式辅导协议；DeepSeek官网亦宣布计划于9月10日前后发布V4.1 Flash模型，经内外测试该模型在性能、费用、速度等指标上全面超越V4 Pro。", "source": "财联社/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8366aa1f3e655052"}, {"id": 4, "category": "科技互联网与AI", "scope": "国际", "title": "苹果发布首款折叠屏iPhone Duo，15999元起", "summary": "苹果发布首款折叠屏旗舰iPhone Duo，国行起售价15999元、顶配26499元；同步推出iPhone 18 Pro（1199美元起），新机均搭载A20芯片。折叠屏入场被视为苹果在高端市场对抗安卓阵营的关键落子，未发布标准版iPhone。", "source": "四川网络广播电视台", "url": "https://www.sctv.com/news/2097705443349626882"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "美称或与俄举行双边会晤，俄乌谈判前景受关注", "summary": "特朗普9月9日称与普京进行了\"很好的交谈\"、可能举行双边会晤；俄总统新闻秘书佩斯科夫表示当前无成型调解路线图，但希望俄美乌三方谈判在可预见期限内重启。外界关注美俄互动对俄乌局势及美俄关系调整的影响。", "source": "腾讯新闻/央视新闻", "url": "https://news.qq.com/rain/a/20260910A02LF700"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "伊朗设海上\"制裁区域\"，油价破百、美伊冲突升级", "summary": "伊朗革命卫队9日宣布将从恰巴哈尔港延伸至阿曼湾及阿拉伯海设立海上\"制裁区域\"；作为对美军袭击油轮的回应，伊朗称已打击美舰船与基地，美军在伊战事累计伤亡838人（18死820伤）。布伦特原油收于101美元上方，霍尔木兹供应风险紧绷。", "source": "腾讯新闻/新华财经", "url": "https://new.qq.com/rain/a/20260910A031DC00?refer=cp_1009"}, {"id": 7, "category": "国际时事", "scope": "国际", "title": "塞尔维亚总统解散议会，10月25日提前大选", "summary": "当地时间9月9日，塞尔维亚总统武契奇宣布解散国民议会，并决定于10月25日举行提前议会选举。此举被视为应对国内政治僵局，选情与巴尔干地区走向受关注。", "source": "央视新闻/腾讯新闻", "url": "https://new.qq.com/rain/a/20260910A02P4000?refer=cp_1009"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "国新办今日15时举行金融\"十五五\"发布会", "summary": "国务院新闻办公室9月10日15时将举行\"开局起步'十五五'\"发布会，央行副行长陆磊、金融监管总局副局长丛林、证监会副主席李超、外汇局副局长李斌介绍金融领域落实\"十五五\"规划、推动金融强国建设情况并答问。市场关注货币政策与资本市场改革信号。", "source": "21世纪经济报道", "url": "https://www.toutiao.com/article/7683679769027805759/"}, {"id": 9, "category": "财经经济与就业", "scope": "国内", "title": "8月CPI同比涨0.8%、PPI涨幅扩至3.8%", "summary": "国家统计局数据显示，8月CPI环比涨0.4%、同比回升至0.8%，核心CPI同比升至1.0%；PPI环比由降转涨0.4%、同比涨幅扩大至3.8%，受国际大宗商品价格上行传导与国内产业升级带动。物价呈温和回升态势。", "source": "新华财经/新浪财经", "url": "https://finance.sina.com.cn/money/bond/2026-09-10/doc-inirhvxe7972028.shtml"}, {"id": 10, "category": "财经经济与就业", "scope": "国内", "title": "人社部发布11个新职业、23个新工种", "summary": "人社部9月9日发布船舶岸基管理工程技术人员、具身智能机器人应用技术员、运动数据分析师等11个新职业，及社区工作者、低空物流员、适老化改造设计师等23个新工种，并调整变更6个职业信息，反映数字经济与新业态用工需求。", "source": "新华财经/新浪财经", "url": "https://finance.sina.com.cn/money/bond/2026-09-10/doc-inirhvxe7972028.shtml"}, {"id": 11, "category": "社会民生与教育", "scope": "国内", "title": "第42个教师节，习近平向全国教师致以问候", "summary": "在第四十二个教师节之际，习近平向全国教师致以节日祝贺与诚挚问候，勉励牢记\"为党育人、为国育才\"初心使命。我国现有各级各类学校专任教师1870.1万人，支撑起世界规模最大的教育体系。", "source": "人民日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_5856aa215d850652"}, {"id": 12, "category": "战争与自然灾害", "scope": "国内", "title": "台风\"沙德尔\"强降雨致闽浙赣洪涝，电网全力保供", "summary": "受台风\"沙德尔\"持续强降雨影响，福建、江西、浙江等地发生洪涝、泥石流，部分供电设施受损。国网启动应急响应，跨区调配1187名抢修人员，依托配电自动化实现故障秒级隔离、发电车保电，保障民生用电。", "source": "国家电网/网易", "url": "https://www.163.com/dy/article/L6E5HAGV0514S0EB.html"}, {"id": 13, "category": "战争与自然灾害", "scope": "国内", "title": "中央气象台暴雨蓝色预警，川滇黔等地局地大暴雨", "summary": "中央气象台继续发布暴雨蓝色预警：9日20时至10日20时，青海、甘肃、陕西、四川、贵州、云南、广西、广东等地有大雨或暴雨，四川盆地南部、贵州西北部、云南东北部局地大暴雨（100-150毫米），需防山洪地灾与城市内涝。", "source": "央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_8456aa1e01750052"}, {"id": 14, "category": "体育赛事", "scope": "国际", "title": "郑钦文止步美网8强，中国女篮晋级世界杯八强", "summary": "2026美网女单1/4决赛，郑钦文1-2不敌2号种子莱巴金娜止步8强；同日在女篮世界杯资格赛，中国女篮75-72胜波多黎各晋级八强，下一战对法国。中国男篮将于11日亮相，首战哈萨克斯坦。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260910A02LF700"}, {"id": 15, "category": "科学探索", "scope": "国际", "title": "AI发现设计的候选药物或具抗衰老作用", "summary": "《自然-生物技术》刊登国际研究：一种由AI驱动发现与设计、用于治疗特发性肺纤维化的候选药物，还显示出潜在抗衰老作用，为\"以治代防\"的衰老干预提供新线索，但尚需更多临床验证。", "source": "新华财经", "url": "https://www.cnfin.com/hs-lb/detail/20260910/4467722_1.html"}, {"id": 16, "category": "财经经济与就业", "scope": "国际", "title": "中东局势推升大宗商品：油价破百、铜与欧气齐创新高", "summary": "受中东紧张升级推动，布伦特原油自7月以来首破100美元/桶；伦敦、纽约铜价同步刷新历史纪录；欧洲基准天然气期货突破每兆瓦时80欧元、创2023年来新高，库存创15年新低，全球通胀预期升温。", "source": "华尔街见闻/腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_4906aa1e99406052"}, {"id": 17, "category": "科技互联网与AI", "scope": "国内", "title": "北京印发\"十五五\"高精尖规划，发力商业航天", "summary": "北京市政府印发\"十五五\"高精尖产业发展规划，提出加快发展商业航天，突破可重复使用火箭与大推力发动机技术，强化卫星及关键部组件批产配套，参与国家大型星座建设，发展差异化商业星座。", "source": "21世纪经济报道/四川网络广播电视台", "url": "https://www.toutiao.com/article/7683679769027805759/"}]}};</script>

<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
