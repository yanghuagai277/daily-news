<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-11-21", "generatedAt": "2026-11-21T07:47:13+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "中俄美元首历史性会晤发表《和平宣言》，习近平提大国相处四点看法", "summary": "11月19日，习近平在深圳主持首次中俄美元首会晤，与普京、特朗普就乌克兰危机、核不扩散、中东局势等交换意见。三国发表《中俄美元首和平宣言》，重申核战争打不赢也打不得，计划增加精炼石油产品生产供应。习近平提出相互尊重、和平共处、合作共赢、对话协商四点看法，会晤持续约90分钟。", "source": "新华社/央广网", "url": "https://www.cnr.cn/china/news/sz/20261120/t20261120_527878298.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "特朗普称伊朗“不想达成我能接受的协议”，卡塔尔持续斡旋", "summary": "美国总统特朗普11月20日在白宫新闻发布会上表示，伊朗想达成协议但“不想达成我能接受的协议”，承认战事推高国内物价尤其是油价，但称11月初以来油价已大幅下跌。据阿克西奥斯报道，美特使威特科夫与库什纳19日在柏林会见卡塔尔首相，讨论卡方在美伊之间的斡旋工作。", "source": "新华社", "url": "https://www.xinhuanet.com/20261121/328ce2421ca54aff8f41ae96c035d857/c.html"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic数学家称借Claude证明黎曼猜想，公开1737万行代码待验证", "summary": "11月20日，Anthropic数学研究人员Levent Alpöge发布4页说明，宣称在Claude协助下证明了悬置167年的黎曼猜想，并提出广义黎曼猜想证明思路，公开14个压缩包、约1737万行Lean形式化代码。该方法借鉴1969年Stepanov在函数域的证法，关键一步由Claude提出。目前尚无独立团队完成复核，数学界未正式认可。", "source": "南华早报/财联社", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375294/anthropic-researcher-says-claude-has-solved-maths-greatest-riddle"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "腾讯混元Hy4大模型正式开源，混元LLM系列实现全量开放", "summary": "11月20日，腾讯混元团队宣布Hy4大模型正式开源，权重已在GitHub、Hugging Face、ModelScope与GitCode四平台同步上线。Hy4采用MoE架构，总参数770B、激活参数49B，上下文窗口突破100万Token，以Apache 2.0协议开放允许商用。主打性价比的Hy4 flash总参数224B。至此混元LLM系列完成全量开源。", "source": "IT之家", "url": "http://mp.weixin.qq.com/s?__biz=MzkxOTAwMjQ3OA==&mid=2247485706&idx=1&sn=61665f8307405bf5d1c4176c2fb8084b"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "政策利率换锚后首期LPR出炉：1年期3.0%、5年期以上3.5%", "summary": "11月20日，中国人民银行公布贷款市场报价利率：1年期LPR为3.0%、5年期以上LPR为3.5%，均保持不变。这是主要政策利率从7天期逆回购切换至隔夜逆回购后的首期LPR，当前主要政策利率为1.25%。专家称三季度GDP增速回升至4.5%、出口延续高增，短期内全面降息可能性不大，四季度经济动能仍有上行趋势。", "source": "每日经济新闻/新浪财经", "url": "https://finance.sina.com.cn/roll/2026-11-20/doc-inizkqie3914391.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美股AI板块遭历史性抛售，纳指跌5.28%英伟达一日蒸发近4900亿美元", "summary": "美东时间11月20日，美股三大指数集体重挫，纳指收跌5.28%至22617.73点，抹去2026年全部涨幅；标普500跌3.70%、道指跌1.93%，双双进入技术性回调。路透社称美国证交会正调查英伟达会计处理问题，成为抛售导火索，英伟达当日跌约14%、单日市值蒸发约4850亿美元，本周累计蒸发近9000亿美元。", "source": "美联社/BBC/路透社", "url": "https://news.qq.com/rain/a/20261121A00I3J00"}, {"id": 7, "category": "社会民生与教育", "scope": "国际", "title": "联合国报告：全球学前教育普及停滞，每投入1美元2035年可回报3.76美元", "summary": "联合国教科文组织11月20日发布《2026年全球儿童早期保育与教育报告》，指全球学前教育普及近十年陷入停滞，进入小学儿童仅59%接受过至少一年学前教育。报告测算每投入1美元弥补相关缺口，到2035年可为全球GDP额外贡献3.76美元；低收入国家年均资金缺口达350亿美元，2030年前全球需新增约600万名学前教育工作者。", "source": "新华社/中国网", "url": "https://news.china.com.cn/2026-11/21/content_118783617.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "江西印发“十五五”教育发展规划，严格落实每天一节体育课", "summary": "江西省政府近日印发《江西省“十五五”教育发展规划》，提出到2030年教育强省建设取得重要进展。规划部署十方面重点任务，明确严格落实中小学生“每天一节体育课”“每天综合体育活动时间不低于2小时”“课间15分钟”，实行中小学每周至少半天校外实践教学；扩大普通高中学位供给，加力支持南昌大学建设“双一流”高校。", "source": "中国教育报/中国教育网", "url": "https://www.edu.cn/xxh/focus/zc/202611/t20261120_2796829.shtml"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "以军轰炸加沙地带中部致4死多伤，称打击哈马斯武装人员", "summary": "据巴勒斯坦方面消息，当地时间11月20日，以军在加沙地带中部代尔拜拉赫和布赖杰难民营实施轰炸，造成4名巴勒斯坦人死亡、数人受伤。以军当晚声明称，在加沙中部对正在开会的哈马斯武装人员实施空中打击，指责相关人员策划针对以色列的袭击、企图在加沙恢复武装组织能力。", "source": "央视新闻", "url": "https://wap.cj.sina.cn/pc/7x24/5229049"}, {"id": 10, "category": "战争与自然灾害", "scope": "国际", "title": "乌克兰一周三袭克里米亚大桥，普京预告“更沉重打击”", "summary": "乌克兰武装部队18日夜间再度无人机袭击克里米亚大桥，为一周内第三次，未造成人员伤亡但交通中断，卫星图显示一侧拱桥坠落。普京19日表示俄方必将回应且力度更大，大桥再遭袭后不再讨论海上停火。基辅同日遭俄军大规模无人机攻击致至少1死5伤，荷兰、奥地利驻乌使馆受损，荷兰已召见俄大使。", "source": "凤凰卫视/环球网", "url": "https://news.qq.com/rain/a/20261120A06PQL00"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国科学家证实火星北部平原曾存在古海洋，获北京市自然科学一等奖", "summary": "11月20日，中科院国家空间科学中心“基于祝融号探测数据的火星水活动和地质环境演化研究”成果获2025年度北京市自然科学一等奖。研究首次证实火星北部平原曾存在古海洋，为早期火星具备适合生命起源的宜居气候提供关键证据；发现火星晚期水活动迹象，打破国际上火星晚期极度干冷的传统认知，还证认现代火星表面仍存卤水及水汽循环。", "source": "中国科学院/国家空间科学中心", "url": "https://www.nssc.cas.cn/xwdt2015/xwsd2015/202611/t20261120_8312184.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "时隔21年重返世少赛，中国U17男足首战0:5不敌西班牙", "summary": "11月20日，2026年U17男足世界杯H组首轮，时隔21年再度出战世少赛的中国队0:5不敌夺冠热门西班牙队。中国队凭U17亚洲杯亚军获得资格，上半场控球率仅24%，西班牙由巴萨球员佩斯克尔造点命中、通卡拉任意球破门。中国队23日将在小组赛第二轮对阵摩洛哥队。", "source": "新华社/央视网", "url": "https://sports.cctv.com/2026/11/21/VIDEJxC8faSl81cG3y9lINdR261121.shtml"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "原价129万元一针CAR-T抗癌药进医保，患者自付有望降至10万元内", "summary": "最新国家医保目录新增107种药品、其中51个为1类创新药，首次纳入CAR-T细胞治疗药物瑞基奥仑赛注射液。该药此前每支定价129万元，纳入医保后患者自付费用有望降至10万元以内。此次目录覆盖肿瘤、罕见病、慢病等领域，同步发布的商保创新药目录搭建起“基本医保+商业健康保险”多层次支付通道，均自2027年1月1日起执行。", "source": "央视网/中国新闻网", "url": "https://news.qq.com/rain/a/20261120A06WVU00"}, {"id": 14, "category": "环境气候", "scope": "国际", "title": "COP31原定闭幕日谈判延长，多国要求明确摆脱化石燃料", "summary": "11月20日是第31届联合国气候变化大会原定闭幕日，谈判面临延长至周末。由法国、巴拿马牵头的十余国联合要求修改协议草案，明确有序摆脱化石燃料并加强气候资金。最新草案删除了石油、天然气和煤炭相关表述，被法国生态转型部长称为“污点”。世界气象组织称2026年1至9月全球均温较工业化前高约1.47°C，年末大概率越过1.5°C。", "source": "联合国新闻/CGTN", "url": "https://news.un.org/zh/story/2026/11/1143235"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "我国电动汽车充电设施达2539.1万个，同比增长36.2%", "summary": "国家能源局11月20日发布数据，截至2026年10月底，我国电动汽车充电基础设施（枪）总数达2539.1万个，同比增长36.2%。同日中汽中心推出国内首个汽车智能座舱AI能力分级评价体系，分C1至C5五级，覆盖八大能力、九大场景。调查显示20万元以上国产新能源车座舱AI搭载率超90%，2026年国内智能座舱市场规模预计超1800亿元。", "source": "央视新闻/国家能源局", "url": "http://mp.weixin.qq.com/s?__biz=MzUzOTE2NTQxNw==&mid=2247487756&idx=1&sn=be24a4a4f859baa2fbc03af730641877"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "KSG夺2026王者荣耀电竞世俱杯冠军，移动电竞全球化提速", "summary": "2026王者荣耀电竞世俱杯（KWC at EWC26）落幕，Kuaishou Gaming（KSG）在总决赛以4:3击败AG.AL夺冠，从300万美元总奖金池中赢得最高份额，KSG.JuHao获FMVP。本届赛事迎来里程碑，王者荣耀与Arena of Valor战队首次在国际舞台同场竞技。2026王者荣耀世界冠军杯（KIC2026）将于12月迎来年度收官。", "source": "虎扑/腾讯游戏", "url": "https://voice.hupu.com/bbs/641827194"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "“宋画里的江南”上海金山特展启幕，200余件展品重现宋代风雅", "summary": "11月21日，“盛世修典——‘中国历代绘画大系’主题展·‘宋画里的江南’上海金山特展”在金山区博物馆启幕，集中呈现200余件（套）展品，通过绘画、文献图像与数字化展陈结合，展现宋代江南山川形胜、市井生活与人文风雅，持续至2027年2月21日。“中国历代绘画大系”成果展已在国内外巡展102场，同期还举办非遗市集。", "source": "上观新闻/金山区融媒体中心", "url": "https://www.jinshan.gov.cn/shfw-bmxx/20261120/879787.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "2026—2027北京冰雪文化旅游季启幕，统筹推出96项重点活动", "summary": "11月20日，由北京市文旅局主办的2026—2027北京冰雪文化旅游季在延庆奥林匹克园区启幕，以“一起趣玩雪”为主题，统筹推出96项重点冰雪文旅活动。现场发布冰雪温泉旅游主题线路与冰雪旅游地图。数据显示2025至2026冰雪季全国居民冰雪运动参与人数达3.08亿、冰雪旅游休闲人次突破3.6亿，冰雪产业规模突破万亿元。", "source": "央广网/央视财经", "url": "https://news.qq.com/rain/a/20261120A0EY3J00"}]}, "yest": {"date": "2026-11-20", "generatedAt": "2026-11-20T07:41:09+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "中俄美元首历史上首次聚首深圳，发表《和平宣言》", "summary": "11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，这是三国最高领导人历史上首次面对面会晤。三国围绕维护世界和平、促进大国关系战略稳定深入讨论，会后发表《中俄美元首和平宣言》。王毅称此次会晤具有开创意义，向世界发出积极信号。", "source": "新华社/央视网", "url": "https://news.cctv.com/2026/11/20/ARTINtxSogscjFOH09SeIkMX261120.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "普京称克里米亚大桥遭袭后俄方不再讨论海上停火", "summary": "俄罗斯总统普京11月19日表示，在克里米亚大桥遭袭后，俄方不会再就海上停火或停止攻击能源设施与有关方面谈判，并称将作出力度更大的回应。据俄媒报道，克里米亚大桥16日至18日连续三天遭乌军无人机和导弹袭击，交通受影响。这座全长19公里的桥梁连接克里米亚半岛与俄克拉斯诺达尔地区。", "source": "新华社/央视网", "url": "https://news.cctv.com/2026/11/20/ARTIEQmlEDhF1MKnmzezTZsR261120.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美方赴柏林磋商俄乌和谈，欧盟拟追加最高450亿欧元援乌", "summary": "美国总统特朗普的特使威特科夫和女婿库什纳11月19日前往柏林，与乌克兰总统泽连斯基及欧洲多国领导人会谈，讨论下一轮俄乌和谈安排与战后安全保障。英国宣布2.6亿英镑新一轮军援，欧盟委员会通过立法提案拟向乌追加最高450亿欧元贷款以弥补2027年资金缺口，但内部分歧明显。", "source": "环球时报/路透社", "url": "https://www.163.com/dy/article/LC5M8HLR0514R9OJ.html"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "以军越过加沙停火\"黄线\"发动袭击，造成3名平民死亡", "summary": "据巴勒斯坦方面消息，以色列军队11月19日在加沙地带北部、中部和南部多地区发动袭击，造成3名巴勒斯坦平民死亡、多人受伤。以军自18日起推进至军事控制线\"黄线\"以西，为2025年10月停火协议生效以来首次。据加沙卫生部数据，\"停火\"以来以军行动已致超1600人死亡，停火机制严重弱化。", "source": "央视新闻/环球网", "url": "https://news.qq.com/rain/a/20261120A03K3P00"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic登陆纳斯达克，首日市值达1.3万亿美元", "summary": "AI公司Anthropic以每股83美元登陆纳斯达克，完成约810亿美元募资，创史上最大IPO纪录。上市首日股价盘中较发行价冲高约39%，收盘涨幅收窄至17%左右，市值达1.3万亿美元。作为首家上市的纯大模型厂商，其表现被视为检验AI交易热度的关键指标，也引发对AI泡沫的议论。", "source": "新浪财经/环球市场播报", "url": "https://finance.sina.com.cn/stock/usstock/c/2026-11-20/doc-inizinvp5782425.shtml"}, {"id": 6, "category": "科技互联网与AI", "scope": "国内", "title": "DeepSeek千亿级B轮融资落地，投后估值约6155亿元", "summary": "据媒体报道，DeepSeek运营主体杭州深度求索的持股平台完成工商变更，新增31家合伙人，本轮募资约1000亿至1055亿元，投后估值约6155亿元，或创国内AI单轮融资纪录。腾讯、宁德时代、中国移动、中信证券等产业与机构资本入局，两轮累计融资或超1500亿元。", "source": "证券时报/红星资本局", "url": "https://news.qq.com/rain/a/20261120A03JQH00"}, {"id": 7, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI披露用自家模型重新设计芯片，运算单元面积缩减约15%", "summary": "OpenAI发布文章披露，其将自家模型用于\"Jalapeño\"芯片及与AMD合作处理器的设计工作，模型给出的乘法器重设计方案使该电路块预估面积缩减约15%，并将一个原本需两个时钟周期的计算压缩为一个。这被视为AI参与芯片设计、反哺算力效率的新尝试。", "source": "BYOBot AI News/科技媒体", "url": "https://byobot.ai/ai-news/ai-daily-newsstand-november-20-2026"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "广西崇左发现我国迄今年代最晚直立人化石，登上《自然》", "summary": "11月19日，山东大学考古学院联合中国科学院古脊椎动物与古人类研究所等机构在国际学术期刊《自然》在线发表两篇论文，报道广西崇左出土的古人类牙齿化石研究。研究首次在东亚南部亚热带雨林地区确认直立人化石，年代距今约32.4万年至18.4万年，是我国迄今已知年代最晚的直立人化石记录。", "source": "新华社/腾讯新闻", "url": "https://news.qq.com/rain/a/20261120A03G0700"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国成功发射实践二十四号卫星，长征系列第678次飞行", "summary": "北京时间11月19日6时51分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第678次飞行，我国航天发射频次与任务稳定性继续保持高位。", "source": "科技日报/央视新闻", "url": "https://www.stdaily.com/web/gdxw/2026-11/19/content_615623.html"}, {"id": 10, "category": "财经经济与就业", "scope": "国内", "title": "2027届普通高校毕业生规模预计1299万人，就业会议部署稳就业", "summary": "11月19日，教育部等多部门在京联合召开2027届全国普通高校毕业生就业创业工作会议。会议指出，2027届高校毕业生规模预计1299万人，将用好政策\"先手棋\"、拿出拓岗\"关键招\"、抓实服务\"着力点\"，拓展先进制造业和现代服务业就业空间，推动国有企业稳岗扩岗，全力确保就业总体稳定。", "source": "教育部/央视新闻", "url": "https://www.moe.gov.cn/jyb_zzjg/huodong/202611/t20261119_1458891.html"}, {"id": 11, "category": "财经经济与就业", "scope": "国内", "title": "商务部：前10个月消费市场规模稳步扩大，服务零售增4.9%", "summary": "商务部发言人何亚东11月19日表示，今年以来我国消费市场规模稳步扩大，呈现商品消费\"稳\"、服务消费\"旺\"、新型消费\"热\"三大特点。1至10月社会消费品零售总额同比增长1%，服务零售额同比增长4.9%，增速高于商品零售4个百分点；智能眼镜、具身智能机器人等新品销售额高速增长。", "source": "新华社/人民日报", "url": "http://m2.people.cn/news/default.html?s=MV8xXzQwODM3Mjk3XzEwMDRfMTc5NTEyNjU4Nw==&from=tencent"}, {"id": 12, "category": "社会民生与教育", "scope": "国内", "title": "职称评审管理新规明年施行，公务员及离退休人员不得申报", "summary": "人社部11月19日印发关于修改《职称评审管理暂行规定》的决定，共修改条文10条、新增条文5条，自2027年1月1日起施行。新规明确申报人须为本单位在职专业技术人才，公务员、离退休人员不得申报；评审通过门槛提高，并新增信用管理与四类失信行为认定，同时畅通自由职业者申报渠道。", "source": "人社部/北京青年报", "url": "https://news.qq.com/rain/a/20261119A0EMAU00"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "三部门发文全面推行疫苗处方工作，推动预防关口前移", "summary": "国家疾控局、国家卫健委、国家中医药局联合印发《关于全面推行疫苗处方工作的指导意见》，提出构建\"诊疗—评估—处方—宣教—接种\"服务模式。\"十五五\"期间将逐步实现疫苗处方在二级及以上医疗机构、基层医疗卫生机构全覆盖，为老年人、慢性病患者等重点人群开具流感、带状疱疹、HPV等疫苗处方。", "source": "央视网健康/健康报", "url": "https://jiankang.cctv.cn/2026/11/19/ARTIxfGJXR2GqARrP9x9Q4gC261119.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "冷空气影响趋于结束，中东部多地气温创新低", "summary": "中央气象台消息，本轮冷空气影响已趋于尾声，但中东部气温仍较低，南北方多地陆续降至近期低点、大范围创立秋后新低。20日早晨最低气温0℃线南压至河南北部至苏皖北部一带，山东半岛等地部分地区有大到暴雪。未来三天全国大部降水稀少，23日前后南方将迎新一轮降水。", "source": "中央气象台/人民网", "url": "https://society.people.com.cn/n1/2026/1119/c1008-40836928.html"}, {"id": 15, "category": "体育赛事", "scope": "国际", "title": "西班牙加时1比0击败阿根廷，时隔16年再夺世界杯冠军", "summary": "2026年美加墨世界杯决赛在纽约新泽西体育场进行，西班牙队凭借费兰·托雷斯在加时赛的进球，以1比0击败卫冕冠军阿根廷，队史第二次捧起大力神杯。这届世界杯首次扩军至48队、共进行104场比赛。39岁的梅西可能已最后一次站在世界杯决赛舞台，西班牙则成为首座同时拥有男、女世界杯冠军的国家。", "source": "BBC/虎扑体育", "url": "https://voice.hupu.com/bbs/641084737"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "乘联分会：11月新能源乘用车渗透率预计达70.6%", "summary": "乘联分会11月19日披露数据，11月狭义乘用车零售市场仍将低位运行，全月销量预计163万辆，其中新能源乘用车零售销量约115万辆，渗透率预计达70.6%，首次突破七成关口。10月新能源零售渗透率已达67.6%再创新高，电动化替代持续深化，燃油车赛道承压。", "source": "每日经济新闻/网易", "url": "https://www.163.com/dy/article/LC5LM1DU0512B07B.html"}, {"id": 17, "category": "游戏电竞", "scope": "国内", "title": "BLG一穿四夺2026英雄联盟全球总决赛冠军，LPL时隔五年登顶", "summary": "11月15日，BLG在纽约巴克莱中心以3比1逆转LCK一号种子GEN，夺得2026英雄联盟全球总决赛冠军，这是队史首座世界冠军，也是LPL赛区时隔五年再度夺冠。BLG从瑞士轮起连续淘汰HLE、DK、T1、GEN四支LCK队伍，成为世界赛史上首支\"一穿四\"战队，中路Knight获决赛MVP。", "source": "腾讯英雄联盟/新识界", "url": "https://lol.qq.com/news/space-detail.shtml?docid=11406121366672590823"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "吉林新雪季拉开帷幕，多地雪场升级迎接冰雪旅游热", "summary": "连日来随着吉林新雪季拉开帷幕，各地雪场纷纷升级：北大湖雪道由74条增至81条、总长86.5公里，新增索道后运力将达每小时3.5万人次；中旅松花湖度假区11月20日开板，新增30万平方米雪道。全省新雪季将举办雪博会、长春冰雪节等文旅活动400余项，冰雪旅游热度全面升温。", "source": "新华社/新华网", "url": "https://www.xinhuanet.com/local/20261119/32a455895ba14a72a6a7a7356c325edc/c.html"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
