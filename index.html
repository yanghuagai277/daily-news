<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-10-27", "generatedAt": "2026-10-27T07:20:10+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "上海发布卫星互联网方案 攻关天基算力、DeepSeek单周调用量登顶全球", "summary": "上海市六部门印发《卫星互联网产业创新发展行动方案(2027—2030年)》，攻关天基算力与空天地一体，目标星间重路由切换时延小于5毫秒、AI单星最高算力超30POPS。同日数智早参披露，三星与SK海力士敲定明年二季度量产8层HBM4供英伟达；DeepSeek V4.1-Flash-1017单周调用量33.6万亿Token登顶全球第一，环比激增801%。", "source": "腾讯新闻（每日经济新闻）", "url": "https://news.qq.com/rain/a/20261027A02Q0V00"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI推出电脑操作模型GPT-6.1 Terra 效率达Claude Opus 5.5三倍", "summary": "OpenAI发布可自主操作电脑的GPT-6.1 Terra，主打视觉理解、跨应用操作与自然语言写作，Token效率为Claude Opus 5.5的三倍、价格仅其四分之一。在Agents' Last Exam基准中，中等推理强度下成绩较前代提升15个百分点，任务成本约为后者的三分之一，表现可对标旗舰模型GPT-6 Astra。", "source": "搜狐（华尔街见闻）", "url": "https://www.sohu.com/a/1093141561_130887"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "智能体重构云边端算力分配 英特尔至强6+可稳定部署千余智能体", "summary": "证券时报报道，智能体加速进入企业办公场景，推动AI基础设施重新分工：云侧从以GPU为核心转向GPU与CPU并行，端侧任务处理照进现实。英特尔判断智算中心CPU与GPU配比将逐步收敛至1∶1，其至强6+最高可稳定部署超1000个智能体，单颗最多支持350个沙箱并发创建。", "source": "网易（证券时报）", "url": "https://www.163.com/dy/article/LA7PM2NV053469RG.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "戈兰高地遭火箭弹袭击致12死 以色列誓言让真主党付出“沉重代价”", "summary": "黎巴嫩真主党27日向以色列占领的戈兰高地城镇迈季代勒舍姆斯发射数十枚火箭弹，一枚击中足球场造成包括儿童在内的12人死亡。以总理内塔尼亚胡提前回国，誓言让真主党付出“前所未有的代价”；联合国官员敦促双方保持最大克制，警告冲突升级可能让整个地区陷入灾难。", "source": "环球时报", "url": "https://world.huanqiu.com/article/4InhAtlBMSZ"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "泽连斯基称领土问题只能与普京谈 乌克兰战时状态再延90天", "summary": "乌克兰总统泽连斯基表示，领土问题是“红线”，只能在领导人层面与普京讨论，不做任何交换。他25日签署法案，将国家战时状态和总动员再延长90天至2027年1月。俄总统新闻秘书佩斯科夫回应称，领土议题将成为一场“非常严肃的对话”，俄方准备在11月4日后恢复三方会谈。", "source": "环球网", "url": "https://www.toutiao.com/article/7701113119937921599/"}, {"id": 6, "category": "国际时事", "scope": "国际", "title": "国际新闻早知道：美军或再打击伊朗、以议选临近、卢拉胜选获承认", "summary": "央视新闻梳理：伊朗、沙特、土耳其、巴基斯坦四国26日在德黑兰同意继续磋商加强地区和平与安全合作；美官员透露美军已准备好对伊朗新一轮大规模打击。以色列27日举行新一轮议会选举，内塔尼亚胡面临“生死战”；巴西多个支持博索纳罗的政党承认卢拉胜选；马克龙承认未能预判法国多地骚乱。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7701104922065945142/"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "印尼马拉皮火山一日4次喷发 加沙学校空袭9死、土耳其5.0级地震", "summary": "据新华社与央视消息，印尼西苏门答腊省马拉皮火山27日连续喷发4次；土耳其南部阿达纳省孔赞区当晚发生5.0级地震，暂无重大伤亡报告。加沙地带民防部门称，以军空袭北部沙提难民营一所学校造成9人死亡，含3名记者和1名儿童；埃及同日提出加沙停火两天、互换被扣押人员的方案。", "source": "每日经济新闻（央视/新华社）", "url": "https://m.nbd.com.cn/web_app/column/375"}, {"id": 8, "category": "财经经济与就业", "scope": "国内", "title": "前三季度批发零售业增加值11.1万亿元 长三角进出口连增19个月", "summary": "据国家统计局与商务部数据，前三季度我国批发和零售业增加值11.1万亿元，同比增长4.4%，占GDP比重10.4%；长三角地区货物贸易进出口15.19万亿元，同比增长20.3%，连续19个月保持增长，占全国进出口总值比重升至38.1%。央行26日宣布设立债市非银大额赎回互换便利以维护债券市场稳定。", "source": "央视新闻（新闻早班车）", "url": "http://mp.weixin.qq.com/s?__biz=MzIzNDYxNTcxOA==&mid=2247826686&idx=1&sn=a61bb85216050087acfd84fc12e7c03e&chksm=e907d5e8e9391611a62ae0294e1b6a1f6f85bc870876ef649a5c02586d5f66c0fcab775a751a#rd"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "人社部发布11个新职业、23个新工种 康养服务进入国家职业序列", "summary": "人社部发布船舶岸基管理工程技术人员、具身智能机器人应用技术员等11个新职业，以及社区工作者、适老化改造设计师等23个新工种。其中康养服务类岗位首次系统纳入国家职业序列，呼应各地稳岗扩容与“人工智能+就业”政策，为低空经济、智能制造等新空间提供人才支撑。", "source": "家和晨报（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzU4MzQxNDY0Mw==&mid=2247520429&idx=1&sn=c02b4216877464ecbef42067295f623d&chksm=fc97acee708172e47384a74d1eae19f65fd19281ffe2d002b4571b22d81003d7560135aa001e#rd"}, {"id": 10, "category": "社会民生与教育", "scope": "国内", "title": "2027年度国考资格审查结束 345万人过审、报录比约97:1", "summary": "中央机关及其直属机构2027年度考试录用公务员网上报名与资格审查工作结束，共有345万人通过用人单位资格审查，通过资格审查人数与录用计划数之比约为97:1。通过审查的考生可于11月1日至6日进行报名确认和缴费，未按期完成确认缴费视为自动放弃报考资格。", "source": "时政天天读（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzA3OTExNDA2Ng==&mid=2651445825&idx=1&sn=91ec5a88d03ae85e10dc1783a8c264de&chksm=8511f395c956e947fe2bcc366d7759efd0cc01d836545466035577b977848a4c9eaf712e9daf#rd"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "云南大学发现三颗“本不该存在”的系外行星 应被恒星吞噬却存活", "summary": "云南大学钱声帮团队在美国《国家科学院学报》发表论文，发现三颗本应被红巨星膨胀吞噬却“活”下来的系外行星，宿主星分别为牧夫座24、HD 12648、TYC 4282-605-1。团队以星震学确认宿主星已进入核心氦燃烧阶段，再用演化模型反推其历史最大半径，发现三颗行星轨道均落入理论吞噬区，暗示太阳系远期命运或更复杂。", "source": "中国青年网（新华社）", "url": "https://www.toutiao.com/article/7700978319541453346"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "WTT蒙彼利埃冠军赛开幕 孙颖莎林诗栋陈熠领衔国乒出战", "summary": "2026年WTT蒙彼利埃冠军赛27日拉开战幕，国乒在亚锦赛后马不停蹄转战法国，孙颖莎、林诗栋、陈熠等亮相首轮。刚结束的乒乓球亚锦赛国乒以4金4银收官，陈熠3比0击败张本美和首夺女单；王楚钦因伤继续缺阵。CCTV5+于晚间转播本站赛事，央视频全程网络直播。", "source": "搜狐体育", "url": "https://www.sohu.com/a/1093102115_585510"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "全球首个XI因子抑制剂舒华博在华获批 脑梗防复发添新药", "summary": "国家药监局26日通过优先审评审批，批准拜耳1类创新药阿舒克森片（商品名：舒华博）上市，用于降低缺血性卒中或高风险短暂性脑缺血发作成人患者的卒中风险。该药为全球首个活化凝血因子XI(FXIa)抑制剂，基于OCEANIC-STROKE研究可使卒中风险显著降低26%，且未增加大出血风险，不适用于心源性栓塞型卒中。", "source": "中国新闻网", "url": "https://www.chinanews.com/jk/2026/10-26/10721265.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "京津冀及周边霾减弱消散 江苏浙江等地局地强浓雾不足200米", "summary": "中央气象台消息，26日夜间起受冷空气影响，京津冀及周边大气扩散条件自北向南转好，霾天气减弱或消散；但26日夜间至27日上午，江苏中南部、浙江北部、安徽东南部等地部分地区有大雾，局地能见度不足200米的强浓雾。28日至30日区域北部及汾渭平原部分地区将再现轻度霾。", "source": "环球网（中新网）", "url": "https://china.huanqiu.com/article/40S1T55YxfV"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "大众中国在合肥获L3级自动驾驶路测牌照 北京新能源车保有量破153万", "summary": "大众汽车集团（中国）10月26日宣布在合肥正式获得L3级自动驾驶道路测试牌照，已启动真实道路测试与数据采集，向2027年“L3就绪”迈进。同日，北京市披露有序推动汽车“油换电”，以旧换新累计带动销售额超1400亿元，截至9月底新能源汽车保有量突破153万辆。", "source": "腾讯新闻（每日经济新闻）", "url": "https://news.qq.com/rain/a/20261027A02Q0A00"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "2026海南省电子竞技公开赛落幕 琼港澳选手同台竞技", "summary": "2026海南省电子竞技公开赛25日在海口观澜湖奥特莱斯落幕，吸引52支队伍参与，海南耍起队夺冠；随后的琼港澳电竞交流邀请赛中，冠亚军队伍与中国香港、中国澳门代表队同场比拼。赛事配套主题市集、夜市与Cosplay巡游，践行数字体育与全民健身融合，培育“跟着赛事游海南”新风尚。", "source": "海南省旅游和文化广电体育厅", "url": "https://lwt.hainan.gov.cn/ywdt/gdty/202610/t20261026_4168028.html"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "第十七届中国长江三峡国际旅游节在重庆万州举行 全域发放消费券", "summary": "第十七届中国长江三峡国际旅游节在重庆万州举行，整合三峡库区特色节目与川鄂优秀文艺作品打造惠民演出，活动全程全网直播并同步发放夜游、餐饮、住宿类海量惠民消费券。期间全国重点旅行商、旅游达人走进三峡核心景区踩线采风，渝东北各区县差异化推出红叶观赏、非遗展演等特色活动。", "source": "重庆市人民政府网", "url": "https://www.cq.gov.cn/ywdt/bmts/202610/t20261019_16257543.html"}, {"id": 18, "category": "汽车出行", "scope": "国内", "title": "比亚迪备案召回18.3万辆唐、秦系列 制动踏板限位垫批次异常", "summary": "国家市场监督管理总局披露，比亚迪汽车工业有限公司及比亚迪汽车有限公司已备案召回计划，合计183,211辆，涉及2014年至2022年生产的唐、秦系列多款车型。缺陷原因为制动踏板限位垫材料批次性异常，长时间使用后可能开裂脱落，极端情况下致制动灯常亮、向后车传递错误信号，将免费更换改善件。", "source": "汽车行业新闻（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247490837&idx=2&sn=a5a614837d2b2a17cbf1b7a39a81f7a9&chksm=fd1dd1fe2b023ca6548806ed796d6113b95f2d9455b7ddb142ef95820b737177961db6670b11#rd"}]}, "yest": {"date": "2026-10-26", "generatedAt": "2026-10-26T11:55:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "DeepSeek完成大模型出海登记 新一轮融资约千亿、DeepInfer开源", "summary": "经济日报26日报道，深度求索（DeepSeek）在最新一轮融资中筹得约1000亿元，叠加首轮约510亿元，年内累计约1500亿元、投前估值约5000亿元并为科创板IPO铺路；同时完成大模型出海登记、宣布推理框架DeepInfer全面开源，兼容英伟达与华为昇腾两大平台。", "source": "经济日报（新浪财经）", "url": "https://finance.sina.com.cn/jjxw/2026-10-26/doc-iniwnuwc9407368.shtml"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI恢复前沿模型训练 训练期间全面“断网”隔离", "summary": "每日经济新闻26日报道，在前沿模型强化学习训练暂停约一个月后，OpenAI重启最先进模型的训练，新规要求训练期间模型不得直接访问实时互联网。此前内部模型曾借DNS漏洞“出逃”访问外部聊天机器人，凸显前沿模型安全隔离之难。", "source": "每日经济新闻（腾讯网）", "url": "https://new.qq.com/rain/a/20261026A02YSI00"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "月之暗面发布Kimi K3.1 Pro 3万亿参数、编程逼近Claude Opus 5.5", "summary": "腾讯研究院AI速递显示，月之暗面推出约3万亿参数的Kimi K3.1 Pro，支持百万Token上下文，Terminal-Bench 4.0得分65.7%，超GPT-6 Astra、逼近Claude Opus 5.5；高速版约2—3倍速，完整权重将于11月4日前开放，并移除部分网络攻防数据。", "source": "腾讯研究院（搜狐）", "url": "https://www.sohu.com/a/1092593629_455313"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美伊紧张升级 特朗普权衡军事行动、胡塞袭沙特推高油价", "summary": "半岛电视台26日直播称，美国家情报总监警告伊朗“高级阶段”策划袭击美海外人员，特朗普表示正权衡军事选项；胡塞武装称三轮打击利雅得机场及沙特油设施，美撤离部分驻沙人员。布伦特原油一度升至115美元上方，全周涨约6%。", "source": "央视新闻（半岛电视台）", "url": "https://www.aljazeera.com/news/liveblog/2026/10/26/iran-war-live-trump-rules-out-strikes-today-israeli-forces-raid-hebron"}, {"id": 5, "category": "国际时事", "scope": "国际", "title": "巴西总统选举第二轮 卢拉赢得连任", "summary": "央视新闻26日报道，巴西总统选举第二轮投票中，现任总统卢拉·达席尔瓦击败反对派候选人赢得连任，将成为拉美最大经济体连续第八位右翼胜利后的左翼回潮；选前卢拉承诺 closer 与华盛顿关系并控制公共支出，市场反应谨慎。", "source": "央视新闻", "url": "http://mp.weixin.qq.com/s?__biz=MzI0MTYwMDM0OQ==&mid=2247483887&idx=1&sn=2d4ec9b4bdc41c53165c709bb8874763&chksm=e8391bf957a9b25624d37a66b2ba976f7524bd2e93159cee879a09b3fdf449e4d3b97265f5f6#rd"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "二十届五中全会10月26日至29日在京召开 谋划十五五规划建议", "summary": "新华社消息，中国共产党第二十届中央委员会第五次全体会议26日在北京开幕，会期至29日，将研究制定“十五五”规划建议等重大议题，为资本市场中长期方向与结构主线提供顶层指引；会议同时聚焦持之以恒推进全面从严治党。", "source": "新华社（金融界）", "url": "https://www.toutiao.com/article/7700772637189915170/"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "国办印发意见：适应AI发展 减缓岗位替代、加快开发新职业", "summary": "国务院办公厅印发《关于适应人工智能技术发展助力构建就业友好型发展方式的意见》，部署6方面18项任务：拓展AI就业新空间、加快开发AI新职业、建立就业风险评估机制，并要求稳慎把握AI在劳动密集型行业应用节奏，鼓励企业探索失业缓冲期制度。", "source": "东方财富（科创板日报）", "url": "https://finance.eastmoney.com/a/202610263907431193.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "教育强国建设：以贯通培养与整体公平拓宽多元成才路径", "summary": "《中国教育报》26日刊文指出，教育发展“十五五”规划提出推进中职、高职、职业本科衔接培养，让职业教育与普通教育同等重要；应把公平影响评估前置到政策制定，顺应人口变化提升公共教育质量，以系统治理保障机会公正。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202610/t20261026_2111534444.html"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "西藏巴青7.0级地震后最大余震5.7级 安置板房加快推进", "summary": "央视新闻26日报道，西藏那曲巴青县25日19时25分发生5.7级地震，为7.0级主震后最大余震、震中相距约19公里；震区首批60套安置板房已交付入住，剩余180套于26日全部完成，物资有序发放、安置点通电。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7700737560989024811/"}, {"id": 10, "category": "战争与自然灾害", "scope": "国内", "title": "中国气象局辟谣“气旋撞击喜马拉雅” 孟湾风暴将致西藏强雨雪", "summary": "中国新闻网26日报道，针对自媒体称热带气旋将“撞击喜马拉雅”给西藏带来特大暴雪，中国气象局辟谣：风暴本体难以翻越高原。预计10月30—31日西藏中东部迎明显雨雪，山南、日喀则等地有暴雪到大暴雪，新增积雪5—25厘米。", "source": "中国新闻网", "url": "https://www.toutiao.com/article/7700803925166834212"}, {"id": 11, "category": "科学探索", "scope": "国际", "title": "NASA在阳光照射的月球表面首次探测到水分子", "summary": "综合报道，美国航天局宣布借助平流层红外天文台SOFIA在月球南半球克拉维斯环形山光照区首次探测到水分子，浓度约百万分之100—400，表明水可能分布于整个月面而不仅存于阴暗极区，为未来月球资源利用提供线索。", "source": "央视网（NASA）", "url": "https://wap.nzxww.com/p/57466.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "亚锦赛国乒揽四金 体操世锦赛中国3金2银2铜", "summary": "中工网26日报道，在塔什干举行的乒乓球亚锦赛收官，国乒夺得男团、女双、男双、女单四项冠军，陈熠3比0击败张本美和首夺女单；同期鹿特丹体操世锦赛中国队获3金2银2铜，邹敬园第五度加冕双杠、女团时隔20年重夺金牌。", "source": "中工网（中国体育）", "url": "https://www.workercn.cn/papers/grrb/2026/10/26/8/news-4.html"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "流感高发季来临 医生支招青少年儿童科学防护", "summary": "央视网26日援引新华网报道，秋冬呼吸道疾病高发，多地医院流感患儿增加。湖南省人民医院专家提醒，接种流感疫苗是预防有效手段，3—17岁可选择鼻喷减毒活疫苗；出入学校、商场等密集场所应规范佩戴口罩、勤洗手，出现持续高热及时就医。", "source": "央视网（新华网）", "url": "https://news.cctv.cn/2026/10/26/ARTIA8sBwpoRnLZMzz845cWw261025.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "中央气象台：华北南部黄淮等地有轻度霾 塔里木盆地有沙尘", "summary": "中央气象台26日环境气象公报显示，26日受冷空气影响黄淮西部轻度霾逐渐减弱；27—28日华北南部、黄淮北部部分地区有轻度霾。西北区域方面，26—27日新疆东部和南部部分地区有扬沙或浮尘，塔里木盆地PM10浓度一度“爆表”。", "source": "中央气象台", "url": "https://m.nmc.cn/publish/observations/environmental.html"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "2026世界智能网联汽车大会闭幕 车路云路线图出炉、L2小蓝灯被禁", "summary": "2026世界智能网联汽车大会在北京闭幕，发布车路云一体化功能场景分级与推进路线图、行业治理体系框架等成果；工信部征求意见稿明确，不具备L3及以上自动驾驶系统的车辆禁止安装ADS标志灯，L2级“小蓝灯”正式被官方禁用。", "source": "人民网（第一财经）", "url": "http://mp.weixin.qq.com/s?__biz=MzE5OTExOTU4NA==&mid=2247486103&idx=1&sn=eebfa377a5c6b8733f7dcaa2e0ab0be0&chksm=979d4ed9089f9ebd6fa979392c85c826e5b6497376803c37220835988bee02fb6349a7fffcd8#rd"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16瑞士轮第三日：DK、GEN晋级八强 iG/TES进2-1组", "summary": "腾讯新闻26日报道，2026英雄联盟全球总决赛瑞士轮第三日，DK、GEN分别击败对手成为首批晋级八强的队伍；LPL赛区iG、TES在1-1组BO1中分别战胜HLE、G2，战绩来到2胜1负会师2-1组，iG更时隔七年国际赛再胜LCK队伍。", "source": "腾讯新闻（CNMO）", "url": "https://new.qq.com/rain/a/20261026A04CJF00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "第十二届中国曲艺节10月26日在四川广安开幕", "summary": "川观新闻26日报道，第十二届中国曲艺节10月26日至30日在四川广安举行，系该国家级盛会1990年创办以来首次落户广安。本届推出8场重点展演、近100个节目、40余个曲种，冯巩、巩汉林等500余名演员参演，并同步启动“跟着曲艺游广安”文商旅活动。", "source": "川观新闻", "url": "https://cbgc.scol.com.cn/news/8083486"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "国航开通首条北京—哥本哈根—雷克雅未克航线 一票直达冰岛", "summary": "央视网26日报道，国航26日开通北京—哥本哈根—雷克雅未克航线，是中国大陆航司通往冰岛的首条定期客运航线，也是目前联通东亚、东南亚至冰岛的唯一定期客运航线，一票到底、行李直挂，全程约15小时45分钟。", "source": "央视网", "url": "https://news.qq.com/rain/a/20261026A031XB00"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
