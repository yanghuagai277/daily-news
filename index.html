修起火，25人遇难", "summary": "9月10日11时15分许，中国船舶集团青岛北海造船有限公司一艘外籍货轮靠港维修期间起火，船上42人中12人安全撤出、5人受伤，25名失联人员于当晚19时24分全部找到、均无生命体征；习近平作出重要指示，事故原因正调查。", "source": "人民网/人民日报", "url": "https://sd.people.com.cn/BIG5/n2/2026/0911/c166192-41693788.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "“红通人员”、瑞金市原扶贫办主任曾能贵被引渡回国", "summary": "近日，在中央追逃办统筹协调下，经国际执法司法合作，“红通人员”、江西省瑞金市原扶贫和移民办主任曾能贵被引渡回国。其涉嫌在扶贫项目中受贿，2024年1月外逃，今年1月被国际刑警组织发布红色通报，系“天网2026”行动成果。", "source": "中国新闻网/央视", "url": "https://m.chinanews.com/wap/detail/cht/zw/10695307.shtml"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "周伯文浦江论坛提出“科学研究是下一个编程”", "summary": "9月12日浦江创新论坛主论坛上，上海人工智能实验室主任周伯文提出“科学研究是下一个编程”，指出AI与科学将形成双轮驱动——单克隆抗体研发从4年压缩至90天，AI正从工具变为科研常驻参与者，但科学探索的罗盘仍应由人类掌握。", "source": "上观新闻/文汇报", "url": "https://www.jfdaily.com/staticsg/res/html/web/newsDetail.html?id=1175891&sid=11"}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "亚运会男篮中国105:59胜巴林，两连胜提前锁定八强", "summary": "9月12日名古屋亚运会男篮小组赛，中国队以105:59大胜巴林队豪取两连胜，凭借净胜84分提前锁定八强席位；全队11人登场全部得分，廖三宁23分6助攻、李悦洲6投全中18分，下一场将冲击小组第一。", "source": "新华网/新华社", "url": "https://www.news.cn/20260913/bedd5a42310f45d19871feb606ef1e70/c.html"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "研究：走路护心有“黄金组合”，每日7500至1万步+快走最佳", "summary": "《英国运动医学杂志》9月刊登一项追踪超6.4万人、历时8年的研究：每日7500—10000步且峰值步频约100步/分钟时，全因死亡风险最低（降43%）；步数不足者提速同样获益，超1万步性价比反而下降，“过犹不及”。", "source": "人民日报健康客户端/腾讯", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6076aa4fcb584952"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "国家防总针对海南启动防汛四级应急响应", "summary": "受南海热带低压（或成今年首个秋台风“杜鹃”）影响，9月13日至15日海南岛等地有大到暴雨、局地大暴雨，山洪地质灾害及城市内涝风险高。国家防总于9月12日19时对海南启动防汛四级应急响应。", "source": "央视新闻/应急管理部", "url": "https://news.qq.com/rain/a/20260912A0B4H800"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "九部门印发智能网联新能源汽车“十五五”规划", "summary": "工信部等九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年新能源乘用车、商用车新车销量占比分别达70%、40%，具备自动驾驶功能汽车规模应用，并首次将“产能预警调控”写入规划，推动落后产能有序退出。", "source": "第一财经/腾讯证券", "url": "https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?_tentrees_trans=0&id=SN20260911133201b624342d"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "2026暴雪嘉年华重启，魔兽/暗黑/星际/守望重磅前瞻", "summary": "暌违两年，暴雪嘉年华于9月12日至13日在美国阿纳海姆重启。开幕式对应北京时间13日凌晨1:30免费直播；四款核心IP成焦点——《魔兽世界》新资料片《最后的泰坦》、暗黑30周年回顾、星际神秘新作及守望先锋新英雄预告，并举办多项电竞赛事总决赛。", "source": "游民星空", "url": "https://www.gamersky.com/news/202609/2208376.shtml"}, {"id": 15, "category": "文化读书", "scope": "国际", "title": "第28届圣保罗国际图书双年展9月13日闭幕", "summary": "拉丁美洲最大书展——第28届圣保罗国际图书双年展于9月4日至13日在巴西圣保罗举行，以“情感盛宴”为主题，展览面积8.6万平方米（较上届增28%），汇聚350位作家、269家展商，西班牙首次担任主宾国，预计吸引超70万人次。", "source": "百度百科/北青网", "url": "https://baike.baidu.com/item/%E7%AC%AC28%E5%B1%8A%E5%9C%A3%E4%BF%9D%E7%BD%97%E5%9B%BD%E9%99%85%E5%9B%BE%E4%B9%A6%E5%8F%8C%E5%B9%B4%E5%B1%95/68521282"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "京雄快线开启全线贯通试运行，雄安可直达北京草桥", "summary": "9月12日，京雄快线正式启动全线贯通试运行。该线起自雄安城际站、全长约86公里，是国内首条设计时速200公里、公交化运营的轨道快线，接入北京地铁大兴机场线贯通至草桥，未来从雄安“半小时到大兴机场、一小时到北京丽泽”。", "source": "中国新闻网/央视", "url": "https://www.chinanews.com/cj/2026/09-12/10695252.shtml"}, {"id": 17, "category": "国际时事", "scope": "国际", "title": "欧盟委员会批准61亿欧元援乌资金", "summary": "欧盟委员会11日批准向乌克兰提供61亿欧元资金，用于采购防空反导系统、弹药、无人机和电子战设备等，乌克兰可借此采购“爱国者”PAC-3导弹。该笔资金来自900亿欧元援乌贷款，至此2026年度283亿欧元国防援助已全部分配完毕。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=4982214393469695162"}]}, "yest": {"date": "2026-09-12", "generatedAt": "2026-09-12T15:21:55+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平将赴印度新德里出席金砖国家领导人第十八次会晤", "summary": "应印度总理莫迪邀请，国家主席习近平于9月12日至13日赴印度新德里出席金砖国家领导人第十八次会晤，这是金砖扩员至11国后的首次峰会。中印双方正安排两国领导人双边会晤，将是继喀山、天津会晤后连续第三年会晤。", "source": "央视新闻/外交部", "url": "https://www.toutiao.com/article/7684410374938001920/"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic推进IPO拟募资最高千亿美元，AI安全警报同步升级", "summary": "人工智能公司Anthropic正推进IPO，拟募资最高1000亿美元、估值约2万亿美元，并洽谈英伟达作为基石投资者最多投100亿美元。同日AI安全警报升级：专家称10年内AI致人类灭绝概率超10%，Altman表态对放慢研发持开放态度。", "source": "领潮新闻/央视", "url": "https://www.toutiao.com/article/7684538033072390696/"}, {"id": 3, "category": "科技互联网与AI", "scope": "国内", "title": "九部门发布《“人工智能+软件”专项行动实施方案》", "summary": "工业和信息化部等九部门发布《“人工智能+软件”专项行动实施方案》，提出到2030年智能编程、智能体软件及智能服务等新业态成为产业新增长极。方案旨在推动软件产业与AI深度融合，培育新质生产力，加快软件自主创新发展。", "source": "新华财经", "url": "https://www.cnfin.com/yw-lb/detail/20260912/4469033_1.html"}, {"id": 4, "category": "财经经济与就业", "scope": "国内", "title": "国常会部署算力网建设与老旧水库改造，通过基金会管理条例修订草案", "summary": "国务院总理李强9月11日主持召开国务院常务会议，部署加强安全生产、研究算力网建设有关工作、全面系统推进老旧水库改造提升，并审议通过《基金会管理条例（修订草案）》。会议还听取贯彻落实全国教育大会精神、加快建设教育强国情况汇报。", "source": "央视网/每日经济新闻", "url": "https://www.toutiao.com/article/7684417942469804578"}, {"id": 5, "category": "财经经济与就业", "scope": "国际", "title": "美国8月CPI超预期，市场预计下周美联储加息概率升至约90%", "summary": "美国8月CPI同比上涨3.4%、核心CPI环比上升0.3%略超预期，数据发布后交易员预计下周美联储加息概率升至约90%。美股三大指数集体收涨结束四连跌，道指涨509点；市场加大了对联储收紧政策的押注。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-09-12/detail-ihfizwvu6759491.shtml"}, {"id": 6, "category": "战争与自然灾害", "scope": "国际", "title": "沙特东西输油管道遭无人机袭击关闭，胡塞称已控制曼德海峡佩里姆岛", "summary": "沙特东西输油管道遭来自伊拉克方向的无人机袭击后采取预防性关闭，造成人员受伤与设施受损；胡塞武装称除沙特外各国船只红海航行安全，并称已控制曼德海峡战略岛屿佩里姆岛。伊拉克已就袭击展开紧急调查并关闭与伊朗边境口岸。", "source": "央广网/央视新闻", "url": "https://www.toutiao.com/article/7684414372155867674"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "尼泊尔泥石流已致1385人遇难，中国第五批紧急援助运抵加德满都", "summary": "尼泊尔8月26日冰川崩塌引发链式泥石流，截至当地时间11日遇难人数升至1385人、5130人失联。当地时间11日，中国空军运-20运送的第五批紧急援助物资（发电机、太平柜、DNA检测设备等）抵达加德满都，支援灾区后续处置。", "source": "CCTV+/央视新闻", "url": "https://www.cctvplus.com/news/20260912/8498796.shtml"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "我国正式推行全国统一的数据产权登记制度", "summary": "国家数据局9月11日宣布正式推行全国统一的数据产权登记制度，登记机构为各类数据出具“身份证明”，明确持有权、使用权、经营权归属。国家数据产权登记服务系统同步上线试运行，北数所、上海数交所、深圳数交所率先成为登记机构，实现“一次登记、全国通用”。", "source": "国家数据局/中国经济网", "url": "https://www.nda.gov.cn/sjj/swdt/mtsy/0911/20260911202103135795340_pc.html"}, {"id": 9, "category": "汽车出行", "scope": "国内", "title": "《智能网联新能源汽车产业发展“十五五”规划》发布，2030年自动驾驶规模应用", "summary": "工业和信息化部等九部门发布《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年全产业链优势巩固、进入世界汽车强国行列，具备自动驾驶功能的汽车实现规模应用，国内新能源乘用车、商用车新车销量占比分别达70%、40%。", "source": "四川观察/工信部", "url": "https://www.sctv.com/news/2098340068319338498"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国天眼FAST找到中子星遗失的“户籍证明”", "summary": "中国科学院团队利用“中国天眼”FAST在古老疏散星团NGC 6791外围的潮汐尾中识别出一颗脉冲星，并结合多台望远镜还原其演化路径，首次证实中子星从诞生星团逐渐进入银河系盘的“户籍证明”。成果发表于《科学通报》。", "source": "中国科学院/科技日报", "url": "https://www.cas.cn/cm/202609/t20260908_5119904.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国合成世界最长单原子直径“金属线”", "summary": "北京高压科学研究中心李阔团队创新应用高压固相拓扑聚合策略，在国际上首次合成微米级长度、原子级粗细且结构稳定的碳包裹单金属原子链，单根可连续串联4000个以上铜原子，较此前样品链长提升两个数量级以上。成果发表于《科学》。", "source": "人民网/科普中国", "url": "https://kpzg.people.com.cn/BIG5/n1/2026/0907/c404214-40793526.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "亚运会男篮中国99:61大胜哈萨克斯坦迎“开门红”", "summary": "第20届亚运会男篮小组赛在名古屋打响，中国男篮以99:61大胜哈萨克斯坦队迎来“开门红”，全队6人得分上双、投篮命中率57%，余嘉豪与庞峥麟同得17分。12日中国队将迎战巴林队，获胜即可直接锁定八强席位。", "source": "新浪体育", "url": "https://sports.sina.cn/2026-09-12/detail-inirpcvm1821431.d.html"}, {"id": 13, "category": "健康养生", "scope": "国际", "title": "研究显示AI助力研发的药物可能有抗衰老作用", "summary": "国际研究显示，由AI驱动发现与设计、原用于治疗特发性肺纤维化的候选药物Rentosertib还可能具抗衰老作用。对42名患者12周临床试验的血清蛋白质组分析发现，接受治疗后“衰老时钟”降幅最高接近6岁，成果登《自然-生物技术》。", "source": "科学网/中国科学报", "url": "https://news.sciencenet.cn/sbhtmlnews/2026/9/391249.shtm?id=391249"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "南海热带扰动或成今年首个秋台风“杜鹃”，华南沿海将迎暴雨", "summary": "南海热带扰动预计12日上午发展为热带低压并趋向越南中部沿海，是否加强为今年第25号台风“杜鹃”尚待观察，但未来三天海南、广东沿海、广西南部将迎持续性明显降雨，局地大暴雨，北部湾阵风可达7—9级，滨海旅游与海上作业需防范。", "source": "中国气象局/中央气象台", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202609/t20260912_8038626.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026 CFML秋季赛火热开战，新科冠军白鲨打响揭幕战", "summary": "2026 CFML秋季赛9月11日拉开常规赛大幕，新科冠军白鲨对阵KZ·斗鱼打响揭幕战，EDG与Q9·快手上演变阵后首对话。新赛季新阵容、首战即硬仗，焦点集中于新人融入与指挥博弈，胜者将抢占季后赛身位。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20260911A0FEPK00"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "《书房中的文艺复兴》等新书在沪首发，配套特展同步开展", "summary": "《书房中的文艺复兴：10—17世纪西方书籍的抄写、印刷与装帧》与《书籍的优雅》两本新书11日在沪首发，配套“书房中的文艺复兴”特展在上海图书馆东馆开展，首次以书籍为切入点系统呈现文艺复兴知识革命。", "source": "中国新闻网", "url": "https://new.qq.com/rain/a/20260912A07FGJ00"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "前7月旅行服务出口增27.7%增速居首，入境外国人同比增20.4%", "summary": "商务部数据显示，今年1—7月我国旅行服务出口2636.1亿元、同比增长27.7%，在前五大服务出口领域中增速最快；上半年全国入境外国人达2291.4万人次、同比增长20.4%，其中免签入境占77.7%、达1781.5万人次。", "source": "澎湃新闻/经济日报", "url": "https://www.thepaper.cn/newsDetail_forward_34056302"}]}};</script>

  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
