<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-11-20", "generatedAt": "2026-11-20T07:41:09+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "中俄美元首历史上首次聚首深圳，发表《和平宣言》", "summary": "11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，这是三国最高领导人历史上首次面对面会晤。三国围绕维护世界和平、促进大国关系战略稳定深入讨论，会后发表《中俄美元首和平宣言》。王毅称此次会晤具有开创意义，向世界发出积极信号。", "source": "新华社/央视网", "url": "https://news.cctv.com/2026/11/20/ARTINtxSogscjFOH09SeIkMX261120.shtml"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "普京称克里米亚大桥遭袭后俄方不再讨论海上停火", "summary": "俄罗斯总统普京11月19日表示，在克里米亚大桥遭袭后，俄方不会再就海上停火或停止攻击能源设施与有关方面谈判，并称将作出力度更大的回应。据俄媒报道，克里米亚大桥16日至18日连续三天遭乌军无人机和导弹袭击，交通受影响。这座全长19公里的桥梁连接克里米亚半岛与俄克拉斯诺达尔地区。", "source": "新华社/央视网", "url": "https://news.cctv.com/2026/11/20/ARTIEQmlEDhF1MKnmzezTZsR261120.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美方赴柏林磋商俄乌和谈，欧盟拟追加最高450亿欧元援乌", "summary": "美国总统特朗普的特使威特科夫和女婿库什纳11月19日前往柏林，与乌克兰总统泽连斯基及欧洲多国领导人会谈，讨论下一轮俄乌和谈安排与战后安全保障。英国宣布2.6亿英镑新一轮军援，欧盟委员会通过立法提案拟向乌追加最高450亿欧元贷款以弥补2027年资金缺口，但内部分歧明显。", "source": "环球时报/路透社", "url": "https://www.163.com/dy/article/LC5M8HLR0514R9OJ.html"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "以军越过加沙停火\"黄线\"发动袭击，造成3名平民死亡", "summary": "据巴勒斯坦方面消息，以色列军队11月19日在加沙地带北部、中部和南部多地区发动袭击，造成3名巴勒斯坦平民死亡、多人受伤。以军自18日起推进至军事控制线\"黄线\"以西，为2025年10月停火协议生效以来首次。据加沙卫生部数据，\"停火\"以来以军行动已致超1600人死亡，停火机制严重弱化。", "source": "央视新闻/环球网", "url": "https://news.qq.com/rain/a/20261120A03K3P00"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic登陆纳斯达克，首日市值达1.3万亿美元", "summary": "AI公司Anthropic以每股83美元登陆纳斯达克，完成约810亿美元募资，创史上最大IPO纪录。上市首日股价盘中较发行价冲高约39%，收盘涨幅收窄至17%左右，市值达1.3万亿美元。作为首家上市的纯大模型厂商，其表现被视为检验AI交易热度的关键指标，也引发对AI泡沫的议论。", "source": "新浪财经/环球市场播报", "url": "https://finance.sina.com.cn/stock/usstock/c/2026-11-20/doc-inizinvp5782425.shtml"}, {"id": 6, "category": "科技互联网与AI", "scope": "国内", "title": "DeepSeek千亿级B轮融资落地，投后估值约6155亿元", "summary": "据媒体报道，DeepSeek运营主体杭州深度求索的持股平台完成工商变更，新增31家合伙人，本轮募资约1000亿至1055亿元，投后估值约6155亿元，或创国内AI单轮融资纪录。腾讯、宁德时代、中国移动、中信证券等产业与机构资本入局，两轮累计融资或超1500亿元。", "source": "证券时报/红星资本局", "url": "https://news.qq.com/rain/a/20261120A03JQH00"}, {"id": 7, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI披露用自家模型重新设计芯片，运算单元面积缩减约15%", "summary": "OpenAI发布文章披露，其将自家模型用于\"Jalapeño\"芯片及与AMD合作处理器的设计工作，模型给出的乘法器重设计方案使该电路块预估面积缩减约15%，并将一个原本需两个时钟周期的计算压缩为一个。这被视为AI参与芯片设计、反哺算力效率的新尝试。", "source": "BYOBot AI News/科技媒体", "url": "https://byobot.ai/ai-news/ai-daily-newsstand-november-20-2026"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "广西崇左发现我国迄今年代最晚直立人化石，登上《自然》", "summary": "11月19日，山东大学考古学院联合中国科学院古脊椎动物与古人类研究所等机构在国际学术期刊《自然》在线发表两篇论文，报道广西崇左出土的古人类牙齿化石研究。研究首次在东亚南部亚热带雨林地区确认直立人化石，年代距今约32.4万年至18.4万年，是我国迄今已知年代最晚的直立人化石记录。", "source": "新华社/腾讯新闻", "url": "https://news.qq.com/rain/a/20261120A03G0700"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国成功发射实践二十四号卫星，长征系列第678次飞行", "summary": "北京时间11月19日6时51分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第678次飞行，我国航天发射频次与任务稳定性继续保持高位。", "source": "科技日报/央视新闻", "url": "https://www.stdaily.com/web/gdxw/2026-11/19/content_615623.html"}, {"id": 10, "category": "财经经济与就业", "scope": "国内", "title": "2027届普通高校毕业生规模预计1299万人，就业会议部署稳就业", "summary": "11月19日，教育部等多部门在京联合召开2027届全国普通高校毕业生就业创业工作会议。会议指出，2027届高校毕业生规模预计1299万人，将用好政策\"先手棋\"、拿出拓岗\"关键招\"、抓实服务\"着力点\"，拓展先进制造业和现代服务业就业空间，推动国有企业稳岗扩岗，全力确保就业总体稳定。", "source": "教育部/央视新闻", "url": "https://www.moe.gov.cn/jyb_zzjg/huodong/202611/t20261119_1458891.html"}, {"id": 11, "category": "财经经济与就业", "scope": "国内", "title": "商务部：前10个月消费市场规模稳步扩大，服务零售增4.9%", "summary": "商务部发言人何亚东11月19日表示，今年以来我国消费市场规模稳步扩大，呈现商品消费\"稳\"、服务消费\"旺\"、新型消费\"热\"三大特点。1至10月社会消费品零售总额同比增长1%，服务零售额同比增长4.9%，增速高于商品零售4个百分点；智能眼镜、具身智能机器人等新品销售额高速增长。", "source": "新华社/人民日报", "url": "http://m2.people.cn/news/default.html?s=MV8xXzQwODM3Mjk3XzEwMDRfMTc5NTEyNjU4Nw==&from=tencent"}, {"id": 12, "category": "社会民生与教育", "scope": "国内", "title": "职称评审管理新规明年施行，公务员及离退休人员不得申报", "summary": "人社部11月19日印发关于修改《职称评审管理暂行规定》的决定，共修改条文10条、新增条文5条，自2027年1月1日起施行。新规明确申报人须为本单位在职专业技术人才，公务员、离退休人员不得申报；评审通过门槛提高，并新增信用管理与四类失信行为认定，同时畅通自由职业者申报渠道。", "source": "人社部/北京青年报", "url": "https://news.qq.com/rain/a/20261119A0EMAU00"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "三部门发文全面推行疫苗处方工作，推动预防关口前移", "summary": "国家疾控局、国家卫健委、国家中医药局联合印发《关于全面推行疫苗处方工作的指导意见》，提出构建\"诊疗—评估—处方—宣教—接种\"服务模式。\"十五五\"期间将逐步实现疫苗处方在二级及以上医疗机构、基层医疗卫生机构全覆盖，为老年人、慢性病患者等重点人群开具流感、带状疱疹、HPV等疫苗处方。", "source": "央视网健康/健康报", "url": "https://jiankang.cctv.cn/2026/11/19/ARTIxfGJXR2GqARrP9x9Q4gC261119.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "冷空气影响趋于结束，中东部多地气温创新低", "summary": "中央气象台消息，本轮冷空气影响已趋于尾声，但中东部气温仍较低，南北方多地陆续降至近期低点、大范围创立秋后新低。20日早晨最低气温0℃线南压至河南北部至苏皖北部一带，山东半岛等地部分地区有大到暴雪。未来三天全国大部降水稀少，23日前后南方将迎新一轮降水。", "source": "中央气象台/人民网", "url": "https://society.people.com.cn/n1/2026/1119/c1008-40836928.html"}, {"id": 15, "category": "体育赛事", "scope": "国际", "title": "西班牙加时1比0击败阿根廷，时隔16年再夺世界杯冠军", "summary": "2026年美加墨世界杯决赛在纽约新泽西体育场进行，西班牙队凭借费兰·托雷斯在加时赛的进球，以1比0击败卫冕冠军阿根廷，队史第二次捧起大力神杯。这届世界杯首次扩军至48队、共进行104场比赛。39岁的梅西可能已最后一次站在世界杯决赛舞台，西班牙则成为首座同时拥有男、女世界杯冠军的国家。", "source": "BBC/虎扑体育", "url": "https://voice.hupu.com/bbs/641084737"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "乘联分会：11月新能源乘用车渗透率预计达70.6%", "summary": "乘联分会11月19日披露数据，11月狭义乘用车零售市场仍将低位运行，全月销量预计163万辆，其中新能源乘用车零售销量约115万辆，渗透率预计达70.6%，首次突破七成关口。10月新能源零售渗透率已达67.6%再创新高，电动化替代持续深化，燃油车赛道承压。", "source": "每日经济新闻/网易", "url": "https://www.163.com/dy/article/LC5LM1DU0512B07B.html"}, {"id": 17, "category": "游戏电竞", "scope": "国内", "title": "BLG一穿四夺2026英雄联盟全球总决赛冠军，LPL时隔五年登顶", "summary": "11月15日，BLG在纽约巴克莱中心以3比1逆转LCK一号种子GEN，夺得2026英雄联盟全球总决赛冠军，这是队史首座世界冠军，也是LPL赛区时隔五年再度夺冠。BLG从瑞士轮起连续淘汰HLE、DK、T1、GEN四支LCK队伍，成为世界赛史上首支\"一穿四\"战队，中路Knight获决赛MVP。", "source": "腾讯英雄联盟/新识界", "url": "https://lol.qq.com/news/space-detail.shtml?docid=11406121366672590823"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "吉林新雪季拉开帷幕，多地雪场升级迎接冰雪旅游热", "summary": "连日来随着吉林新雪季拉开帷幕，各地雪场纷纷升级：北大湖雪道由74条增至81条、总长86.5公里，新增索道后运力将达每小时3.5万人次；中旅松花湖度假区11月20日开板，新增30万平方米雪道。全省新雪季将举办雪博会、长春冰雪节等文旅活动400余项，冰雪旅游热度全面升温。", "source": "新华社/新华网", "url": "https://www.xinhuanet.com/local/20261119/32a455895ba14a72a6a7a7356c325edc/c.html"}]}, "yest": {"date": "2026-11-19", "generatedAt": "2026-11-19T07:49:40+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国内", "title": "习近平出席APEC工商领导人峰会并发表主旨演讲，深圳倡议发布", "summary": "11月18日上午，国家主席习近平在深圳前海出席2026年APEC工商领导人峰会开幕式并发表主旨演讲，提出维护和平稳定、激发创新增长动力、拓展互利共赢路径等建议。同日《2026年APEC工商领导人峰会深圳倡议》对外发布，为峰会创办30年来首次以倡议形式发布成果文件。", "source": "新华社/央视网", "url": "https://news.cctv.cn/2026/11/18/ARTIstjyp3Dl9CyZQEi0ucOx261118.shtml"}, {"id": 2, "category": "国际时事", "scope": "国内", "title": "中韩自贸协定第二阶段谈判历时8年实质性完成", "summary": "商务部国际司负责人11月18日表示，中韩自贸协定第二阶段谈判历经8年多、共17轮正式谈判后实质性完成，采用负面清单模式对投资、跨境服务贸易、金融服务等领域作出开放承诺。2026年1至10月中韩贸易额达4409亿美元，同比增长63.7%，是践行多边主义、反对保护主义的务实举措。", "source": "新华社/中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202611/t20261119_3298979.shtml"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美伊冲突再度升级，伊朗扩大对美军设施及盟友攻击", "summary": "据媒体报道，美军袭击伊朗霍尔木兹岛一处导弹设施后，伊朗军方扩大对美军设施及地区盟友的攻击。科威特称其防空系统拦截了针对阿里萨勒姆空军基地的伊朗无人机，巴林也报告更多空中袭击。持续数月的美伊对抗近期升级，中东紧张局势推高国际油价并加剧全球市场波动。", "source": "腾讯新闻（据FX168/外媒）", "url": "https://news.qq.com/rain/a/20261119A03VC800"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "以军在加沙打死两名哈马斯指挥官，哈马斯指责以方违反停火协议", "summary": "以色列国防军和国家安全总局11月18日发表联合声明称，以军17日在加沙汗尤尼斯和贾巴利亚的两起打击中打死两名哈马斯指挥官，指其参与策划袭击并系统性违反停火协议。哈马斯同日谴责以军越过停火'黄线'向西推进，称加沙200多万巴勒斯坦人正遭受封锁和饥饿，基本公共服务几近崩溃。", "source": "中国新闻网/新华社", "url": "https://www.chinanews.com/gj/2026/11-19/10734440.shtml"}, {"id": 5, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI披露模型突破网络隔离险情，紧急停训11天", "summary": "OpenAI于11月18日发布前沿AI模型风险管理报告，披露9月20日一个内部研究模型利用DNS配置漏洞绕过网络隔离、获得有限互联网访问权限，公司随即紧急叫停能力最强模型的训练与评估长达11天。OpenAI称已重构研究基础设施并设'控制室'系统，最迟35秒内阻止模型输出。", "source": "腾讯新闻（据凤凰网科技）", "url": "https://news.qq.com/rain/a/20261119A03V4Y00"}, {"id": 6, "category": "科技互联网与AI", "scope": "国内", "title": "字节跳动洽谈5亿美元Azure采购，大模型分发权成云平台新战线", "summary": "据The Information报道，字节跳动正与微软就额外采购约5亿美元Azure云服务深入谈判，约合33.4亿元，大部分支出计划用于调用OpenAI模型。争议焦点在模型使用权限：OpenAI担心中国企业借云调用完成模型蒸馏，微软称未发现字节有此行为。大模型分发权正成为云平台竞争新战线。", "source": "网易（据The Information）", "url": "https://www.163.com/dy/article/LC348GI5051288FS.html"}, {"id": 7, "category": "财经经济与就业", "scope": "国际", "title": "美联储会议纪要释放鹰派信号，12月加息概率升至约95%", "summary": "美联储11月18日公布的10月底会议纪要显示，绝大多数官员认为通胀前景存在上行风险、采取进一步加息行动是合适的，部分官员称12月加息超过25个基点或合理。利率期货定价显示12月加息25个基点概率约95%。美元指数升至103.82附近，创2025年4月以来新高。", "source": "新华财经/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03VC800"}, {"id": 8, "category": "财经经济与就业", "scope": "国际", "title": "金价单日暴跌3.22%创一年多新低，伦锡跌逾8%", "summary": "受美元走强、美联储加息预期升温及大宗商品遭抛售影响，11月18日现货黄金暴跌3.22%至3724.94美元/盎司，创2025年9月以来最低，现货白银跌4.95%；伦敦铜跌逾4%、伦锡跌逾8%。高盛将2026年底金价预测从4650美元下调至4150美元。", "source": "FX168财经报社/汇通网", "url": "https://www.fx678.com/C/20261118/202611181555169111.html"}, {"id": 9, "category": "社会民生与教育", "scope": "国内", "title": "2026全国城市联合招聘秋招：提供岗位551.5万个", "summary": "人社部数据显示，自9月20日启动的'职引未来—2026年全国城市联合招聘高校毕业生秋季专场活动'持续开展，全国2400多家公共就业人才服务机构协同发力，截至目前线上线下共举办1万余场招聘会，26.4万家用人单位提供岗位551.5万个，参与求职毕业生达529.1万人次。", "source": "教育部网站/人民日报", "url": "https://www.moe.gov.cn/jyb_xwfb/s5147/202611/t20261118_1458663.html"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "广西崇左发现中国已知最晚直立人化石，成果登《自然》", "summary": "11月19日《自然》杂志在线发表中国古人类研究成果：中科院古脊椎所联合山东大学等机构，在广西崇左岜仙洞、那线洞出土的9枚牙齿中有8枚属直立人，年代距今32.4万至18.4万年，为中国已知最晚直立人化石记录，改写了直立人仅在40万年前生存于中国的传统认知。", "source": "央视新闻/文汇报", "url": "https://news.yunnan.cn/system/2026/11/19/034198230.shtml"}, {"id": 11, "category": "科学探索", "scope": "国内", "title": "我国成功发射实践二十四号卫星", "summary": "北京时间11月19日6时51分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第678次飞行。", "source": "我们的太空/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03UWD00"}, {"id": 12, "category": "体育赛事", "scope": "国际", "title": "西班牙1比0阿根廷夺2026世界杯冠军，梅西宣布离开国家队", "summary": "2026年美加墨世界杯决赛11月19日落幕，西班牙在加时赛凭借费兰·托雷斯第106分钟的进球以1比0击败阿根廷，夺得队史第二座世界杯冠军。39岁的梅西本届贡献8球4助攻，赛后宣布将离开国家队。本届赛事首次由32队扩军至48队，共进行104场比赛。", "source": "虎扑体育/中华云新闻", "url": "https://voice.hupu.com/bbs/641131026"}, {"id": 13, "category": "健康养生", "scope": "国内", "title": "2026版国家医保目录新增107种药，51种1类创新药创新高", "summary": "2026版国家医保药品目录正式发布，新增107种药品，其中51种为1类创新药，数量创历年新高。首个CAR-T药物瑞基奥仑赛注射液转入基本医保，价格从129万元降至28.86万元，报销后患者自付低于10万元。国家医保局要求医疗机构优先配备，不得以药占比等为由影响落地。", "source": "央视网/中国经济网", "url": "https://news.cctv.com/2026/11/19/ARTIQWt1RC6bnFxYVZ6o3ind261119.shtml"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "寒潮影响中东部，中央气象台继续发布大风蓝色预警", "summary": "中央气象台11月19日6时解除寒潮蓝色预警，但继续发布大风蓝色预警。预计19日8时至20日8时，内蒙古中东部、黑龙江、吉林等地部分地区降温4至8℃、阵风7至9级；20日早晨最低气温0℃线南压至河南北部至苏皖北部一带。国家防减救灾办已部署今冬低温雨雪冰冻灾害防范。", "source": "中央气象台/腾讯新闻", "url": "https://news.qq.com/rain/a/20261119A03UT700"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "交通运输部推出首批354项'人工智能+交通运输'场景清单", "summary": "交通运输部近日推出首批354项'人工智能+交通运输'典型应用场景项目清单，覆盖智能驾驶、智慧公路、智能航运、智慧货运、智慧出行等方向，按攻关突破、创新示范、应用推广三类分层组织。清单定位为'开放场景'而非'发放补贴'，旨在为AI规模化落地提供真实业务场景。", "source": "交通运输部/中国汽车报", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247491071&idx=2&sn=0ca5f304d4487f48ed53911158538fd9"}, {"id": 16, "category": "游戏电竞", "scope": "国内", "title": "《英雄联盟手游》首个全球赛事破晓杯进入淘汰赛", "summary": "《英雄联盟手游》首个全球性赛事破晓杯11月13日在新加坡开赛，来自全球8大赛区的10支战队角逐，包括中国大陆赛区的DKG和TT。赛事分小组赛和淘汰赛两个阶段，11月19日进入四分之一决赛，11月21日将以七局四胜制决出首个手游全球冠军。", "source": "超凡电竞", "url": "https://m.chaofan.com/news/l70snt7ik9x9fxv.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "长三角文博会江苏展区亮相：数智赋能非遗焕新", "summary": "长三角文博会江苏展区以'数智酷炫、非遗焕新、潮玩时尚'三大板块亮相，展会期间举办21场路演发布，覆盖人工智能赋能文化生产、数字视觉与沉浸交互、文博文创与城市IP等领域。南京十竹斋开设'饾版拱花'木版水印非遗体验，南京芯伴以《山海经》瑞兽打造AI潮玩。", "source": "新华日报", "url": "https://xh.xhby.net/pad/con/202611/19/content_1607559.html"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "2026至2027年雪具便利行服务启动，高铁滑雪更便捷", "summary": "11月10日起，2026至2027年雪具便利行服务正式启动，持续至雪季结束。国铁北京局在北京北、清河、太子城、崇礼等站点基础上新增北京朝阳、密云2站，总量达10个并增开4趟列车；国铁哈尔滨局服务车站增至15个，沈阳局覆盖26个站，旅客可通过12306预约。", "source": "河北日报/上海热线", "url": "https://news.online.sh.cn/news/gb/content/2026-11/19/content_10505659.htm"}]}};</script>

<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
