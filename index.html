备出人类已知最冷人造物质，纪录登《科学》", "summary": "中科院团队利用梦天舱超冷原子物理实验柜，以全光阱冷却将铷原子云降至9.7皮开尔文（比室温低14个数量级），可稳定观测7秒，刷新此前38皮开尔文的世界纪录，成果6日在线发表于《科学》。", "source": "光明日报 / 央视网", "url": "https://news.gmw.cn/2026-11/07/content_39089783.htm"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "力箭二号遥二发射成功，一箭18星组网低轨卫星互联网", "summary": "北京时间11月3日，中科宇航力箭二号遥二运载火箭在东风商业航天创新试验区升空，将千帆极轨21组共18颗卫星送入预定轨道。该火箭500公里太阳同步轨道运力达8吨，标志我国商业航天大运力组网再进一步。", "source": "新华网", "url": "https://www.xinhuanet.com/video/20261103/b50e8aefe896475d9bd4a92d975bd4ce/c.html"}, {"id": 9, "category": "战争与自然灾害", "scope": "国际", "title": "日本茨城县附近海域发生5.6级地震", "summary": "据央视报道，当地时间11月8日凌晨，日本茨城县附近海域发生5.6级地震。目前暂无人员伤亡与重大财产损失报告，日本气象厅未发布海啸预警。", "source": "央视网", "url": "https://tv.cctv.cn/2026/11/08/VIDEfJzA3OfQKg1ArMX3maj6261108.shtml"}, {"id": 10, "category": "战争与自然灾害", "scope": "国内", "title": "水利部：今年为有监测以来最强厄尔尼诺，31个台风生成7个登陆", "summary": "水利部5日通气会介绍，今年汛期气候异常突出：西北太平洋和南海共生成31个台风、7个登陆我国；全国1004条河流发生超警洪水，49条创实测最大洪水纪录。当前超强厄尔尼诺预计秋末冬初达峰值，2027年极端天气概率加大。", "source": "中国网 / 水利部", "url": "https://news.china.com.cn/2026-11/05/content_118762934.shtml"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "中超收官日：成都蓉城打平即夺队史首冠，大连英博争逆转", "summary": "2026赛季中超11月8日15:30八场同开迎来收官。成都蓉城52分领跑、打平即可夺队史首冠；大连英博49分需在客场胜天津且蓉城输球才能逆转。奥斯卡、卡迪斯同以21球领跑金靴榜，青岛海牛、武汉三镇已降级。", "source": "天津日报 / 新浪体育", "url": "https://epaper.tianjinwe.com/tjrb/html/2026-11/08/content_143084_3994199.htm"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "立冬养生提醒：专家提示过度进补、久坐不动等误区", "summary": "江西11月6日举行立冬专场健康发布会，专家提醒冬季养生常见误区为“过度进补、过度保暖、久坐不动”，宜早睡晚起、颈部背部足部保暖、饮食清补温润。慢病患者须规律用药、监测指标，面瘫发病72小时内应尽早就诊。", "source": "央广网", "url": "https://www.sohu.com/a/1098376985_362042"}, {"id": 13, "category": "环境气候", "scope": "国内", "title": "寒潮大风蓝色预警：15省份部分地区降温超10℃", "summary": "中央气象台8日6时继续发布寒潮与大风蓝色预警，预计8日至10日华北大部、西南地区东部和南部等地降温6—10℃，四川西部、贵州西部等15省份部分地区降温10—12℃、局地超14℃。北京、河北北部等地有大到暴雪。", "source": "川观新闻", "url": "https://www.toutiao.com/article/7705584023024550436/"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "Momenta获日产全球创新奖，高阶智驾加速普惠落地", "summary": "11月6日Momenta荣获日产2026年度全球创新奖。双方已在N7、N6、NX8等多款车型合作辅助驾驶，近90%的NX8车主选择搭载Momenta强化学习大模型的MAX及以上版本，超50%车主每天使用辅助驾驶。", "source": "腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_6536aeec94097852"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "2026 CRL皇室战争全球总决赛上海收官，中国选手止步", "summary": "2026皇室战争职业联赛（CRL）全球总决赛11月8日在上海黄浦里滩文化中心收官，系时隔多年重回中国大陆并首次落地中国。中国选手飞行雪绒、Midnight双败淘汰赛拼至最后一刻遗憾止步，加冕时刻于当日决出。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261107A0E2ZN00"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "北京11月逛展攻略：景泰蓝宫廷艺术特展、龟兹文化艺术展上新", "summary": "北京11月多家博物馆推出重磅展览：恭王府“御器凝辉”景泰蓝宫廷艺术特展展出近58件复刻与大师作品；中国工艺美术馆“龟兹文化艺术展”呈现丝路文明；国博“大河之东”展运城200余件出土文物，溯源中华文明肇兴。", "source": "今日头条", "url": "https://www.toutiao.com/article/7703858336961233448"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "成都上榜《国家地理》2027全球最佳旅行目的地，为中国唯一入选城市", "summary": "美国《国家地理》发布“2027年全球最佳旅行目的地”榜单，从六大洲甄选25个目的地，成都成为唯一上榜中国城市。推荐理由聚焦三星堆、金沙等3000年古蜀文明与昼夜不息的烟火生活，恰逢2027年三星堆发现百年。", "source": "成都日报 / 腾讯新闻", "url": "https://kuaibao.qq.com/s/20261105A0DMHA00?refer=cp_1009"}, {"id": 18, "category": "社会民生与教育", "scope": "国内", "title": "四川中小学教辅材料进校园划出十五条红线，12月5日起施行", "summary": "四川省教育厅等三部门11月5日印发《中小学教辅材料进校园管理实施细则（试行）》，明确教辅须进评议目录、执行“一科一辅”、自愿购买且学校代购不得牟利，并列出15条严禁事项（含不得向小学一二年级推荐、不得入校推销），12月5日起施行。", "source": "央广网 / 四川日报", "url": "https://www.cnr.cn/scfw/scpd/yw201/20261108/t20261108_527865859.shtml"}]}, "yest": {"date": "2026-11-07", "generatedAt": "2026-11-07T07:54:22.000000+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "进博会黑科技集中亮相：人形机器人对打乒乓球、高通全球首展6G原型机", "summary": "第九届进博会在上海进入展期后半程，机械工业信息研究院从万余件展品遴选25项代表性黑科技与硬科技。全尺寸人形机器人自主对打乒乓球，须在约0.3秒内完成感知、决策与挥拍；高通全球首展符合3GPP最新定义的6G终端原型机，测试下行带宽400MHz；特斯拉赛博无人驾驶电动车等集中亮相。", "source": "经济日报", "url": "https://www.163.com/dy/article/LB46D3OS0514CQIE.html"}, {"id": 2, "category": "财经经济与就业", "scope": "国际", "title": "美股AI板块遭集中抛售，纳指跌5.52%进入技术调整", "summary": "受美国中期选举后AI监管预期升温影响，纽约股市5日遭遇暴跌，三大股指创2025年4月以来最大单日跌幅。纳斯达克跌5.52%进入技术性调整，英伟达跌超9%，美股“七巨头”单日市值蒸发约1万亿美元；抛售潮6日蔓延至日韩，日经跌近6%、韩国综指跌6%。", "source": "环球时报", "url": "https://www.163.com/dy/article/LB44N3040514R9OJ.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "外交部回应高市早苗涉台谬论满一周年：日本当局仍在“原地打转”", "summary": "外交部发言人郭嘉昆6日回应称，高市早苗一年前发表涉台谬论、公然发出武力介入台湾问题的错误信号，当前中日关系面临严重困难，责任完全在日方。他指日本当局“仍在原地打转”，缺乏对错误言行的反思纠错诚意，并重申中方在台湾问题上的严正立场。", "source": "腾讯新闻", "url": "https://new.qq.com/rain/a/20261107A03ATW00"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "法国爆发今秋最大规模抗议，至少57.5万人上街", "summary": "法国爆发今秋最大规模抗议，至少57.5万人上街。抗议由退休制度改革、财政支出等多重议题引发，多地出现罢工与游行；七国集团外长会议因此改址巴黎。政府面临较大的舆论与工会压力，后续或影响冬季社会运行与政策推进。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17182002740829893985&channelId=1119"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "国务院常务会议部署稳就业稳外贸、提振消费与化解风险", "summary": "国务院总理李强6日主持召开国务院常务会议，学习贯彻习近平总书记关于前三季度经济形势的重要讲话精神。会议部署加快重大项目和“六张网”建设、支持企业设备更新投资、加强消费城乡联动，要求完善资本市场稳市机制、化解地方债务与中小金融机构风险，并扎实做好稳就业与民生保障。", "source": "新华社", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_7956aee510c76752"}, {"id": 6, "category": "社会民生与教育", "scope": "国内", "title": "网信部门严查AI假冒公众人物：清理4.7万条信息、处置3961个账号", "summary": "针对利用AI技术假冒仿冒知名公众人物、虚假带货吸粉引流等问题，网信部门督促平台开展集中整治，累计清理违法违规信息4.7万余条、处置账号3961个。同期广电总局部署新一轮微短剧低俗化同质化专项治理，军地部门亦关闭一批涉军虚假信息账号。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17182002740829893985&channelId=1119"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "中国空间站制备出已知最冷人造物质，等效温度降至9.7皮开尔文", "summary": "中国科学院团队利用中国空间站梦天舱超冷原子物理实验柜，率先以全光阱冷却将铷原子云等效温度降至9.7皮开尔文，较室温降14个数量级，可持续观测7秒，制备出目前已知最冷人造物质，成果6日在线发表于《科学》，向绝对零度再进一步。", "source": "光明日报", "url": "https://news.gmw.cn/2026-11/07/content_39089783.htm"}, {"id": 8, "category": "体育赛事", "scope": "国际", "title": "WTT法兰克福冠军赛爆冷：男单世界冠军雨果1-3不敌21岁德国小将", "summary": "2026WTT法兰克福冠军赛冷门频出：男单世界冠军、巴西名将雨果1比3不敌世界排名第40的21岁德国小将维姆，止步八强；国乒周启豪1比3不敌中国台北林昀儒出局，仅剩温瑞博守全区。日本队张本智和、张本美和等顺利晋级，外协会年轻选手加速崛起。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A006MY00"}, {"id": 9, "category": "健康养生", "scope": "国内", "title": "立冬进补有讲究，广东多家中医院启动膏方节，专家提示辨证适度", "summary": "11月7日立冬，广东多家中医院启动膏方节，广东省中医院五大院区同步开展名医义诊与体质辨识、免费品膏。国家卫健委此前以“时令节气与健康”为主题提示，冬令进补应“因人而异、适度平衡”，并建议重点人群尽早接种流感疫苗以预防呼吸道传染病。", "source": "广州日报", "url": "https://news.dayoo.com/gzrbrmt/202611/05/170638_55020741.htm"}, {"id": 10, "category": "环境气候", "scope": "国际", "title": "COP31中国角边会“跨界聚力 气候同行”将办，聚焦气候教育与同一健康", "summary": "COP31将于土耳其安塔利亚举行，中国角边会“跨界聚力 气候同行”定于11月9日举办，聚焦气候教育与公众参与、“同一健康”三大亮点，分享中国气候预警与适应实践。同期欧盟哥白尼监测显示，2026年10月为有记录以来最热10月，全年升温超1.5℃概率逾99%。", "source": "微言环保", "url": "https://www.163.com/dy/article/LB3LKNNE051493C2.html"}, {"id": 11, "category": "汽车出行", "scope": "国内", "title": "小米汽车10月销量突破5万台，增程车型拉动新势力格局重塑", "summary": "小米汽车10月销量突破5万台，较9月的4万台再上台阶，由新上市的澎程增程车型（上市30天锁单超7万辆）拉动，与零跑、小鹏构成新势力第一梯队，改写“蔚小理”格局。小米前10个月累计交付超31.9万台，全年55万辆目标仍具挑战。", "source": "象视汽车", "url": "https://www.163.com/dy/article/LB2A3HFK0547ESEH.html"}, {"id": 12, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16八强收官，7日T1对阵KC，决赛15日纽约打响", "summary": "2026英雄联盟全球总决赛八强单败淘汰赛进入收官：6日DK对阵BLG、GEN 3比0零封LYON率先晋级四强；7日迎来T1对阵KC的焦点战，半决赛8至9日进行，冠亚军决赛15日在纽约布鲁克林巴克莱中心打响，LPL四队AL、BLG、TES、iG出征。", "source": "今日头条", "url": "https://www.toutiao.com/a7704514898801312290"}, {"id": 13, "category": "文化读书", "scope": "国内", "title": "第九届中国非物质文化遗产博览会在重庆开幕，890个非遗项目亮相", "summary": "第九届中国非物质文化遗产博览会6日在重庆开幕，来自全国31个省区市的890个非遗项目集中亮相，特设“百味山河”非遗美食风物集，持续至11月10日。同期重庆第二十届老年产业博览会开幕，“银龄”模特将地标“穿”在身上走秀，聚焦银发经济。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A038RM00"}, {"id": 14, "category": "旅行出行", "scope": "国内", "title": "成都—九寨黄龙机场7日起复航，川航每周六直飞约55分钟", "summary": "九寨黄龙机场7日起恢复成都航线，由四川航空执飞，每周六往返各一班，成都天府至九寨单程飞行约55分钟、不含税参考价300元，适合周末短途错峰游。该机场10月25日起季节性停航，复航后冬春航季暂仅保留成都航线，落地需接驳至景区。", "source": "四川省中国青年旅行社", "url": "http://www.woyts.com/gt/14111.html"}, {"id": 15, "category": "战争与自然灾害", "scope": "国际", "title": "中东紧张持续，欧洲再遭民航客机炸弹威胁（一周内第三波）", "summary": "中东紧张持续：伊朗革命卫队6日宣布在格什姆岛上空击落第16架美军无人机，美方称数千美军已在中东就绪；霍尔木兹海峡附近一艘油轮爆炸，今年以来已记录155起相关海上安全事件。与此同时欧洲再遭民航客机炸弹威胁，为一周内第三波。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=17182002740829893985&channelId=1119"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "杭州十所小学开家长非暴力沟通课，四句话改善亲子关系", "summary": "杭州临平十所小学为家长开设非暴力沟通课程，引导家长开口前先在心里过“四句话”：说看见的、说感受、表达期望、提出请求，以改善亲子关系和家庭教育质量，受到家长广泛关注。同期杭州多地推出购房补贴，最高20万元。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261107A038S000"}, {"id": 17, "category": "社会民生与教育", "scope": "国内", "title": "第二艘国产大型邮轮“爱达·花城号”在上海交付，月底商业首航", "summary": "第二艘国产大型邮轮“爱达·花城号”6日在上海正式交付，按计划9日从上海启航赴广州，月底开启商业首航。该轮是国产大型邮轮又一里程碑，标志着我国邮轮自主建造能力持续夯实，将为冬季滨海旅游与邮轮经济注入新动能。", "source": "搜狐新闻", "url": "https://www.sohu.com/a/1098299522_267106"}]}};</script>

      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
