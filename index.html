che 2.0许可的Clef模型，声称AI智能体可无需人工干预做结构化决策。", "source": "The Decoder/Slashpage", "url": "https://slashpage.com/ixtj-dev/y9e1xp2x6ng1p27k35vz"}, {"id": "n3", "category": "国际时事", "scope": "国际", "title": "七国集团将释放1亿桶战略石油储备以压低燃油价格", "summary": "七国集团领导人10月2日召开视频会议，应对油价飙升与能源供应压力，同意在国际能源署协调下四个月内释放1亿桶原油和柴油储备，并承诺不在G7国家间实施能源出口限制。法国总统马克龙称此举应可拉低燃料价格，特朗普表示不会实施柴油出口禁令。", "source": "新华网", "url": "http://www.chinaview.cn/20261003/d5ddd03d3d724edbba27c15369aac885/c.html"}, {"id": "n4", "category": "国际时事", "scope": "国际", "title": "美向中东派第三艘航母，霍尔木兹海峡一油轮遭不明发射物击中", "summary": "美媒援引官员报道，五角大楼正向中东派遣第三个航母打击群及两栖舰艇，新增约9000至1万名士兵，11月底前抵达。与此同时，英国海事贸易行动办公室通报，一艘油轮在霍尔木兹海峡出港时遭不明发射物击中起火并全船停电，火势随后被扑灭。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7692195469539181075/"}, {"id": "n5", "category": "财经经济与就业", "scope": "国际", "title": "美国9月非农仅增2.9万、失业率升至4.2%，美联储10月加息概率骤降", "summary": "美国劳工部10月2日公布，9月非农就业岗位仅增2.9万个，远低于预期，失业率升至4.2%；7、8两月数据合计下修6万个。 Healthcare新增1.7万、金融业减少7000。数据公布后，市场预计美联储10月维持利率不变概率升至逾八成，美股期货与美债收益率应声回落。", "source": "中新社/新浪财经", "url": "https://finance.sina.com.cn/roll/2026-10-03/doc-initwvkm4171641.shtml"}, {"id": "n6", "category": "社会民生与教育", "scope": "国内", "title": "“十五五”教育规划首提小班化教学，撤校省钱转向提质", "summary": "随着生源减少，2025年全国小学一年减少约8000所。“十五五”教育规划首次将“结合实际有序推进小班化教学”写入国家层面文件，上海已出台《小班化教学指导纲要》。专家指出现有资源不缩、班额自然下降的窗口期难得，经费拨款方式也需从“按人头”转向保障留校学生。", "source": "网易", "url": "https://www.163.com/dy/article/L89KQO8R0556E2W2.html"}, {"id": "n7", "category": "科学探索", "scope": "国际", "title": "谷歌将自研AI芯片TPU送入近地轨道，启动“太阳捕手”太空算力验证", "summary": "10月1日，谷歌首颗在轨AI计算验证卫星随Transporter-18任务入轨，搭载4颗自研Trillium TPU，由PlanetLabs制造、经SpaceX发射。受太空散热限制，芯片每次仅能连续运行约15分钟。这是人类首次将专为AI设计的芯片送上太空实测，为未来星上数据中心探路。", "source": "新浪科技", "url": "https://k.sina.com.cn/article_7879923515_1d5ae173b06801kpbc.html"}, {"id": "n8", "category": "科学探索", "scope": "国内", "title": "中国天问三号将绘全火星地质图，2028年取回500克样本", "summary": "中国探火工程稳步推进：天问一号实现绕落巡、祝融号获取地面数据，下一步天问三号计划取回500克火星样本。2028年底，中国将完成1:500万全火星地质图，划分地质单元、搭建年代框架，为未来火星探测与资源利用建立全球基准框架。", "source": "腾讯新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_9026ac03f1885252"}, {"id": "n9", "category": "体育赛事", "scope": "国内", "title": "中网：德约科维奇逆转布云朝克特晋级八强", "summary": "2026中国网球公开赛10月2日继续在国家门球中心进行。六届赛会冠军德约科维奇鏖战三盘，以2:1逆转中国选手布云朝克特，中网连胜纪录扩至31场。女单2号种子萨巴伦卡、男单3号种子梅德韦杰夫均2:0横扫对手迎来“开门红”。", "source": "中国新闻网", "url": "https://www.toutiao.com/article/7692205657835028992"}, {"id": "n10", "category": "体育赛事", "scope": "国内", "title": "亚运收官日：中国女垒争金、吴易昺冲男单冠军", "summary": "10月3日名古屋亚运会迎来倒数第二个比赛日，除马术外所有项目收官，将产生47金。女子垒球决赛中国队若胜日本，将时隔28年再夺亚运金牌；网球男单吴易昺闯入决赛，将与香港选手黄泽林争冠，力争个人首枚亚运男单金牌。", "source": "环球网/央视体育", "url": "https://www.163.com/dy/article/L8A73MCJ0514R9OJ.html"}, {"id": "n11", "category": "战争与自然灾害", "scope": "国内", "title": "10月及国庆假期全国自然灾害风险形势发布：1—2个台风或影响我国", "summary": "国家防灾减灾救灾委员会办公室、应急管理部会商研判，10月华中、华南、西南等地洪涝和风雹风险较高，西北太平洋和南海或有3—4个台风生成，其中1—2个可能登陆或明显影响我国，强度总体偏强、主要影响华南沿海，局地地质灾害与森林火险等级亦较高。", "source": "新浪财经/应急管理部", "url": "https://k.sina.com.cn/article_5953466437_162dab0450670be408.html"}, {"id": "n12", "category": "战争与自然灾害", "scope": "国际", "title": "沙特拟对也门胡塞武装发动攻势，目标直指曼德海峡", "summary": "据媒体报道，沙特正考虑两套作战方案，拟对也门胡塞武装发动军事攻势，目标直指连接红海与亚丁湾的战略咽喉曼德海峡，以重开受冲击的红海航运通道；行动最早或数周内启动。美国未直接下场，但已向沙特提供情报支持，地区紧张持续升级。", "source": "华尔街见闻", "url": "https://www.toutiao.com/article/7692225011545047552/"}, {"id": "n13", "category": "健康养生", "scope": "国内", "title": "研究：水煮沸可降微塑料摄入70%—80%，卫健委倡导多喝白开水", "summary": "《Science of the Total Environment》刊发研究显示，将饮用水煮沸5分钟并静置冷却，其中微塑料浓度可降70%以上，按成人、儿童、婴儿估算摄入量减少约70%—80%，因硬水析出的水垢会把部分颗粒裹挟沉底。国家卫健委亦倡导少喝含糖饮料、多喝白开水与淡茶水。", "source": "腾讯新闻/梅斯医学", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_4866ac026b456852"}, {"id": "n14", "category": "环境气候", "scope": "国际", "title": "瑞士冰川五年减近20%，2026年再失5.5%冰量创史上第二高", "summary": "瑞士科学院10月1日援引冰川监测网数据称，受冬季降雪稀少与5—9月强热浪叠加，2026年瑞士冰川冰量减少5.5%，为有记录以来第二高；过去五年总冰量缩减近五分之一。单座冰川平均变薄2.5至4米，7—9月融水流失约2.2万亿升，专家警告阿尔卑斯冰川长期恐难存续。", "source": "经济日报/新华社", "url": "http://intl.ce.cn/sjjj/qy/202610/t20261003_3247244.shtml"}, {"id": "n15", "category": "汽车出行", "scope": "国内", "title": "国庆首日高速充电量同比增60.4%创历史节假日单日新高", "summary": "国家能源局测算，国庆假期首日全国高速公路充电量达2804.69万千瓦时，同比增长60.4%，创节假日单日历史新高；6.27万个高速充电设施（枪）纳入国家监测平台。新能源汽车自驾出游激增，各地增配移动充电桩与充电机器人、加派引导缓解补能压力。", "source": "网易/陆家嘴财经早餐", "url": "https://c.m.163.com/news/a/L8A2LTA005198RSU.html"}, {"id": "n16", "category": "游戏电竞", "scope": "国内", "title": "亚运电竞中国队三金一银，广东原创游戏闪耀赛场", "summary": "名古屋亚运会电竞项目，由王者荣耀、和平精英、第五人格、永劫无间组成中国集训队获三金一银。其中《第五人格》中日决赛中国队2:0夺亚运史上首枚非对称竞技金牌，《永劫无间》为中式武侠广东研发产品。2026年上半年我国电竞产业收入131.15亿元，同比增长2.78%。", "source": "南方都市报", "url": "https://www.toutiao.com/article/7692217943022682665/"}, {"id": "n17", "category": "文化读书", "scope": "国内", "title": "故宫“典则：唐宋书画展”引观展热潮，107件书画亮相", "summary": "国庆假期故宫文华殿“典则：唐宋书画展”持续火爆，展出书画文物107件，其中24件为近30年首次展出，含褚遂良摹《兰亭序》、传阎立本《步辇图》宋摹本等。观众凌晨排队、全程耗时约7小时，折射大众对高品质文化生活的井喷式需求。", "source": "齐鲁壹点/潮新闻", "url": "https://www.toutiao.com/article/7692229783375168040/"}, {"id": "n18", "category": "旅行出行", "scope": "国内", "title": "国庆首日跨区域人员流动量预计3.34亿人次，铁路发送2520万创新高", "summary": "交通运输部消息，国庆假期第一天全社会跨区域人员流动量预计达3.34亿人次，公路出行占比近九成。国铁集团数据显示10月1日全国铁路发送旅客2520.4万人次，创单日发送量历史新高，加开列车2324列；民航、水路同步迎来高峰，交通部门全力保障出行。", "source": "央视网", "url": "https://news.cctv.cn/2026/10/02/ARTIbcyMkcqU8h7uBBqthgxy261002.shtml"}]}};</script>

<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
