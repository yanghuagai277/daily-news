x/bmdt/202611/t20261112_7363840.html"}, {"id": 7, "category": "科学探索", "scope": "国内", "title": "中欧“微笑”卫星发布首批观测图像 多项成果属全球首次", "summary": "近日中欧联合发布“微笑”（SMILE）卫星首批观测图像与探测数据，多项成果属全球首次。该卫星5月19日发射，旨在从远距离给地球磁层拍摄动态全景图，揭示太阳风如何撞击地球“防护盾”，提升空间天气预警能力，是我国空间科学从参与走向贡献关键能力的缩影。", "source": "央视网/光明日报", "url": "https://news.cctv.cn/2026/11/12/ARTIuOBAbUOnh7hYuDuBpHFe261112.shtml"}, {"id": 8, "category": "体育赛事", "scope": "国内", "title": "熊猫杯中国U19男足3:1击败越南 收获开门红", "summary": "11日成都熊猫杯首轮，中国U19男足3:1力克越南U19。杨展彭第15分钟任意球直接破门、第74分钟点射梅开二度，彭子鸣造点并终场前助攻击杀，越南由莫里奇头球扳回一城。本届熊猫杯为U20亚洲杯备战，中国队14日、17日将迎战塔吉克斯坦与韩国。", "source": "人民网", "url": "https://ent.people.com.cn/n1/2026/1112/c1012-40832411.html"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "大连英博中超神奇夺冠 从1%概率逆袭登顶", "summary": "8日中超末轮，大连英博3:1力克天津津门虎，而成都蓉城客场2:3不敌山东泰山，大连以21年等待上演“二年级生”夺冠奇迹。数据网站统计其夺冠概率长期在1%，收官战前才升至13%；路透社称成都“史诗级崩盘”，西班牙《马卡报》感叹足球永远充满惊喜。", "source": "沈阳日报", "url": "https://epaper.syd.com.cn/syrb/h5/html5/2026-11/12/content_121056_20016265.htm"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "我国科学家领衔84万人研究在《自然》重新定义全球肥胖标准", "summary": "北京时间12日凌晨，华中科技大学潘安教授团队联合多国专家在《自然》发表重磅研究，基于四大国家队列、超84万人数据验证“临床前/临床肥胖”框架。研究显示仅约22.7%—31.3%体脂过多者出现器官损伤；临床肥胖全因死亡风险达69%，但77%—91%临床前者十年内未恶化。", "source": "中国青年网", "url": "https://news.youth.cn/jsxw/202611/t20261112_16963015.htm"}, {"id": 11, "category": "环境气候", "scope": "国际", "title": "世界气象组织：厄尔尼诺将于12月达有记录以来最强水平", "summary": "世界气象组织报告称，超强厄尔尼诺自8月持续增强，预计12月达有记录以来最强，影响持续至2027年。今年1—9月全球平均地表温度较工业化前高约1.47℃，2026年料为有记录最暖四年之一；海洋热含量与海平面均创历史新高，冰川持续退缩。", "source": "光明日报", "url": "https://news.gmw.cn/2026-11/12/content_39097326.htm"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "中东部雨雪发展 华南局地暴雨 北方多地降雪 华北黄淮有雾霾", "summary": "中央气象台12日预报：12—13日西南、江淮、江南、华南有中到大雨，广西、广东、海南局地暴雨或大暴雨；12—15日新疆北部山区局地暴雪或大暴雪。12—14日华北中南部、黄淮等地有轻至中度霾、局地重度霾，12日晨多省发布大雾黄色预警，局地能见度低于200米。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261112_8138616.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "中国新能源车“开向亚太” 产业链本地化落地泰国等国", "summary": "在APEC深化区域可持续合作背景下，满载新能源汽车的滚装船从深圳启航驶向世界。在泰国，某中国车企本地组装推进、罗勇府海外基地设计年产能15万辆，已累计交付突破13万辆、门店超160家覆盖全部77府，并引入闪充技术，从“卖车”走向整条产业链扎根。", "source": "央视新闻/云南网", "url": "https://news.yunnan.cn/system/2026/11/12/034194250.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "任天堂《塞尔达传说:时之笛》重制首发四天破520万份 BLAST香港开赛", "summary": "任天堂公布，11月5日发售的Switch 2独占《塞尔达传说：时之笛》重制版首四天全球销量突破520万份，刷新该平台首发纪录。同日，BLAST.tv主办的顶级CS2职业赛“BLAST Premier Rivals香港2026”开赛，汇全球一线战队落地中国香港，带动区域电竞与文旅消费。", "source": "每日经济新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261112A0352K00"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "第十三届上海国际童书展13日揭幕 501家展商齐聚、首设漫画周", "summary": "第十三届上海国际童书展将于13—15日在上海世博展览馆举办，吸引37个国家和地区501家参展商，其中海外152家，期间举办300余场活动。首届“上海漫画周”全新亮相，蔡皋、曹文轩、罗杰·米罗等国际安徒生奖得主将到场，全球童书首发平台呈现260部年度新书。", "source": "新闻晨报/网易", "url": "https://www.163.com/dy/article/LBHRPMEE0514A42S.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "2026旅游出行大会在银川启幕 发布多项行业报告", "summary": "11日，由中国旅游车船协会主办的2026旅游出行大会在宁夏银川启幕，以“洞察新消费 智行创未来”为主题，汇聚旅游客运、自驾房车、租赁、邮轮游艇等主体。会上发布《中国旅游客运行业发展报告》等四项年度成果，并集中展示银川交旅融合路与智慧出行体系建设成效。", "source": "新华网宁夏频道", "url": "https://www.nx.news.cn/20261112/55686331eefe4dd4a759c878ca0a6464/c.html"}, {"id": 17, "category": "战争与自然灾害", "scope": "国际", "title": "加沙再遭以军空袭 纳赛尔医疗中心6死 过冬物资仍受阻", "summary": "加沙地带民防部门12日称，以军凌晨空袭南部汗尤尼斯纳赛尔医疗中心，造成包括一名外科医生在内的至少6死约20伤。连日暴雨致数万顶帐篷被淹，联合国称超15万顶帐篷及排水水泵已就绪却未获以方批准进入；以方否认阻碍物资并继续指责哈马斯。", "source": "新华社/网易", "url": "https://www.163.com/dy/article/LBHPQ74505346RC6.html"}]}, "yest": {"date": "2026-11-11", "generatedAt": "2026-11-11T12:02:24.214525+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic启动最高643.5亿美元IPO 估值约1至1.4万亿美元", "summary": "Anthropic 11月10日启动IPO路演，拟发行8.25亿股、募资最高643.5亿美元，叠加260亿美元私募配售后总融资达904亿美元，估值区间1至1.4万亿美元，谷歌、英伟达等七家认购私募。公司同步发布前沿模型Claude Fable 5.2，编码与推理显著跃升。", "source": "IT之家", "url": "https://www.ithome.com/1/025/224.htm"}, {"id": 2, "category": "科技互联网与AI", "scope": "国内", "title": "华为详解麒麟9050系列「逻辑折叠」τ芯片 晶体管密度涨53.5%", "summary": "华为麒麟官方公众号11月10日发文介绍首款「逻辑折叠」技术τ芯片——麒麟9050系列，围绕计算、AI、图形、影像、通信、音视频、显示与安全八大核心单元升级，晶体管密度较上代暴涨53.5%，主打端侧高密集成与能效。", "source": "IT之家", "url": "https://www.ithome.com/1/025/224.htm"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "俄美乌三方会谈在阿布扎比重启 首日磋商近4小时", "summary": "当地时间10日，俄罗斯、美国、乌克兰三方会谈在阿联酋阿布扎比启动，系今年2月谈判停滞9个月后首次面对面磋商，首日持续近4小时。泽连斯基称会谈“富有建设性和实质意义”，优先讨论被俘人员释放与安全保障机制。", "source": "央视网/腾讯新闻", "url": "https://news.qq.com/rain/a/20261111A01V2300"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "英法主导“志愿联盟”在波兰启动首次联合军演 俄方强烈反对", "summary": "英法主导的“志愿联盟”9日在波兰启动首次联合军演，代号“联盟”，持续至22日，来自11国约5000名军人参演，意在为俄乌冲突结束后向乌部署部队“做准备”。俄外交部表示绝不接受在乌部署外国武装力量，称将视其为合法攻击目标。", "source": "新浪财经/新华社", "url": "https://k.sina.com.cn/article_1784473157_6a5ce645020040cqk.html"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "海关总署：前10月我国货物贸易进出口44.81万亿元 同比增20%", "summary": "海关总署10日公布，2026年前10个月我国货物贸易进出口总值44.81万亿元、同比增20%；其中出口25.99万亿元增17.6%、进口18.82万亿元增23.6%。10月单月进出口4.87万亿元增31.2%，出口、进口分别增28.7%、34.7%，外需与内需同步走强。", "source": "央广网", "url": "https://www.cnr.cn/jingji/ycbd/20261111/t20261111_527868598.shtml"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "央行加力股票回购增持再贷款 月内32家公司获贷款承诺函", "summary": "人民银行11月4日加力实施股票回购增持再贷款政策，再贷款利率下调0.25个百分点至1%，并由阶段性政策转为长期制度安排。截至10日，月内已有32家公司取得贷款承诺函，其中青鸟智控上限不超12亿元、三环集团不超8.1亿元。", "source": "中国经济网", "url": "https://www.163.com/dy/article/LBELHJ9I0514CQIE.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "“十五五”民生图景上新：盘活义务教育资源、扩容普高与优质本科", "summary": "国家发改委10日举行“奋进‘十五五’”发布会，提出适应学龄人口变化：统筹调配富余学前与义务教育资源、推进小班化教学，扩容普高与优质本科学位，推动托育养老普惠降价。2026年已下达中央预算内投资140亿元支持养老托育设施建设。", "source": "中国青年报", "url": "https://zqb.cyol.com/pad/content/202611/11/content_432841.html"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "我国天文学家用“刹车模型”破解低质量X射线双星演化之谜", "summary": "中科院云南天文台联合南京大学等提出新磁制动模型，揭示低质量X射线双星中中子星吸积加热伴星、增强星风与磁制动的互动反馈，用一套机制解释持续发光、间歇爆发与不同轨道周期三类现象，成果发表于《科学通报》。", "source": "新华网", "url": "https://www.163.com/dy/article/LB7PVO6M0514R9OJ.html"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "中国U17女足世界杯首进八强 点球淘汰法国", "summary": "在摩洛哥进行的U17女足世界杯上，中国队小组赛三连胜头名出线，点球大战淘汰法国队，历史首次闯入八强；四分之一决赛1:2不敌巴西。国际足联技术研究小组称赞球队战术灵活务实，展现亚洲女足新势力。", "source": "微信体育日报/中新网", "url": "http://mp.weixin.qq.com/s?__biz=MzY5NTM1MTQ4Mw==&mid=2247484445&idx=1&sn=1058789cb6fca3e83a3e45588c4b2486"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "WTA年终总决赛郭涵煜组合四救赛点 惊天逆转开门红", "summary": "印第安维尔斯WTA年终双打首轮，中国金花郭涵煜与梅拉德诺维奇在抢十0:6、2:8落后下连救四个赛点，最终以3:6、6:1、12:10逆转5号种子谢淑薇/奥斯塔彭科，斩获开门红，展现极强韧性。", "source": "新浪体育", "url": "https://k.sina.com.cn/article_6207555777_171ffc8c102001kpfu.html"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "我国肿瘤登记系统覆盖全国2847个县区 上报人口首破10亿", "summary": "第十三届国家癌症中心学术年会披露，我国肿瘤登记系统已覆盖全国2847个县（区），实现县区全覆盖，成为全球最大肿瘤登记系统；2026年数据上报覆盖人口首次突破10亿，为癌症早筛与防控提供坚实底座。", "source": "腾讯新闻健康早闻", "url": "https://news.qq.com/rain/a/20261111A0323Z00"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "寒潮结束大部回暖 11至14日华北黄淮有轻至重度霾", "summary": "中央气象台11日提示，下半年首场寒潮影响基本结束，我国大部掀起回暖浪潮；但11至14日华北中南部、黄淮及汾渭平原大气扩散条件转差，部分地区有轻至中度霾、局地重度霾。同期新疆北部有暴雪，云南、华南降雨增多增强。", "source": "中央气象台", "url": "https://www.nmc.cn/publish/weatherperday/index.htm"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "乘联分会：10月国内狭义乘用车零售164.3万辆 同比降27.1%", "summary": "乘联分会10日数据，10月国内狭义乘用车市场零售164.3万辆、同比降27.1%、环比增1.5%，1至10月累计1497.8万辆降22.3%，“金九银十”成色偏弱。新能源厂商榜比亚迪194.5万辆、吉利104.6万辆、零跑59.1万辆居前三。", "source": "每日经济新闻", "url": "https://kuaibao.qq.com/s/20261111A0371800"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "2026三角洲行动烽火世界杯11月27日斯德哥尔摩开赛", "summary": "《三角洲行动》烽火世界杯将于11月27日至29日在瑞典斯德哥尔摩DreamHack举办，全球六大赛区12支顶尖战队角逐50万美元总奖金，系该项赛事首次走出亚洲。同期多款二次元大作定档年底，年末电竞总决赛密集来袭。", "source": "GameRes游资网", "url": "https://www.gameres.com/chanpindongtai_905.html"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "第39届中国电影金鸡奖揭晓 《南京照相馆》获最佳故事片", "summary": "第39届中国电影金鸡奖10日晚在厦门揭晓，《南京照相馆》获最佳故事片，郑大圣凭《密档》获最佳导演，梁家辉、高叶分获最佳男女主角，吾守尔·赛来、兰西雅分获最佳男女配角，《浪浪山小妖怪》获最佳动画片。", "source": "人民网", "url": "https://ent.people.com.cn/n1/2026/1110/c1012-40831533.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "哈尔滨2026-2027冰雪季发布 冰雪大世界扩至125万㎡历届最大", "summary": "哈尔滨11日启动新冰雪季，第28届冰雪大世界园区扩至125万平方米、规模创历届之最，首次与迪士尼（中国）合作引入《冰雪奇缘》主题冰雕，全园冰滑道约100条、西区新增7条400米超长冰滑梯；太阳岛雪博会主塑定名《春暖花开》。", "source": "中国新闻网/哈尔滨发布", "url": "http://mp.weixin.qq.com/s?__biz=MzU5NzY3NzkzMA==&mid=2247484954&idx=1&sn=7a08d001be37cff3d3a76bdece610b95"}, {"id": 17, "category": "战争与自然灾害", "scope": "国内", "title": "江苏扬州江都区发生3.9级地震 中国地震局启动四级应急响应", "summary": "中国地震台网测定，11日6时15分江苏扬州市江都区发生3.9级地震、震源深度20公里，扬州、南京、泰州、常州等多地网友称有震感。中国地震局启动四级应急响应，调度会商加强震情监测与趋势研判，暂未收到人员伤亡报告。", "source": "中国地震台网/扬子晚报", "url": "https://kuaibao.qq.com/s/20261111A052VG00"}]}};</script>

    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
