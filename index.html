 "央视网", "url": "https://news.cctv.com/2026/10/17/ARTI0aBLT6F9IRc2biebtQb1261017.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "我国牵头首个国际职教标准《北京协议》由45国发布", "summary": "2026年世界职业技术教育发展大会17日在天津闭幕，我国牵头推动研制的首个国际职业教育标准《世界职业技术教育标准框架》（《北京协议》）由45国共同发布，涵盖办学体系、终身培训、产教协同、AI赋能教学等8项育人体系，并倡议技能证书国际互认。", "source": "光明日报", "url": "https://news.gmw.cn/2026-10/18/content_39051711.htm"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "中国天眼发现世界首例尚在演化的原生脉冲星三体系统", "summary": "中国科学院国家天文台10月9日宣布，结合FAST射电观测与多波段数据，证实FAST发现的脉冲星J0435+3233属于首例尚在演化阶段的原生三体系统，也是人类确认的第二例脉冲星三体系统。该成果发表于《天体物理学杂志快报》，FAST建成以来已发现超千颗脉冲星。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.com/2026/10/10/ARTIX4CGo4aqa2SKM8sAM6hv261010.shtml"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "上海劳力士大师赛迎决赛日，多项职业赛事“以赛营城”", "summary": "2026上海劳力士大师赛10月16日至18日迎来半决赛与决赛。为期14天的赛事在旗忠网球中心累计上演162场对决，德约科维奇等名将争夺年终总决赛席位；同期上海还迎来CBA揭幕战、中超焦点战与别克LPGA锦标赛，文商旅体深度融合带动消费。", "source": "新浪财经", "url": "https://finance.sina.com.cn/jjxw/2026-10-16/doc-inivkwtm7810176.shtml"}, {"id": 10, "category": "健康养生", "scope": "国内", "title": "全国卫生与健康大会强调健康中国“六大能力”", "summary": "全国卫生与健康大会10月12日至13日在北京召开，习近平强调要建成的健康中国应具有强大的健康管理、疾病防控、医疗服务、医保支撑、医药创新、人才培养六大能力。国家税务总局介绍，今年前8个月支持卫生健康事业发展主要政策合计减税降费2454亿元。", "source": "健康报", "url": "https://www.toutiao.com/article/7696284100254433832"}, {"id": 11, "category": "环境气候", "scope": "国内", "title": "较强冷空气影响我国，北方多地气温创下半年新低", "summary": "中央气象台消息，较强冷空气16日夜间至18日影响我国，长江以北多地有大到暴雨、局地大暴雨，内蒙古东北部和黑龙江西北部局地有暴雪或大暴雪；北京、太原、石家庄等地最高气温刷新下半年低值，20日至25日还将有两股冷空气接踵而来。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?item_id=5744762874227903554&t=1792234355169"}, {"id": 12, "category": "战争与自然灾害", "scope": "国际", "title": "俄乌冲突持续：俄大规模打击乌军工能源设施", "summary": "央视《国际联播快讯》报道，俄国防部17日称俄军使用高精度武器和无人机对克里沃罗格、扎波罗热等地乌军冶金企业、能源设施实施大规模打击，并拦截或摧毁610架乌无人机；乌方则称击落或压制289架俄无人机、4枚巡航导弹，泽连斯基在欧盟峰会要求明年再提供700亿欧元援助。", "source": "央视网", "url": "https://tv.cctv.com/2026/10/17/VIDEiTn9CVibMgXpqdTkVhaq261017.shtml"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "2026世界新能源汽车大会海口举办，全球销量破9400万辆", "summary": "2026世界新能源汽车大会近日在海南海口举办。大会主席万钢表示，2026年上半年全球新能源汽车销量达1123.4万辆、渗透率24%，累计销量突破9400万辆，其中中国累计超6200万辆稳居核心地位；1-8月中国新能源车出口343.5万辆、同比增124%。", "source": "中工网", "url": "https://www.workercn.cn/c/2026-10-15/8916411.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛入围赛开打，MVK、KC晋级", "summary": "2026英雄联盟全球总决赛（S16）入围赛10月中旬在韩国开打。首轮越南赛区MVK以3比0横扫巴西FUR，欧洲KC则鏖战五局3比2险胜北美C9；LPL四支战队出征，入围赛采用双败BO5，晋级队伍将进入10月24日开打的瑞士轮。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261016A0530I00"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026天府书展成都启幕，发放500万惠民券", "summary": "2026天府书展10月16日在成都世纪城新国际会展中心开幕，恰逢《全民阅读促进条例》施行首年。200余家出版单位携3.7万余种图书参展，发放500万元惠民消费券，举办800余场文化活动，并首创银发阅享区、Z世代阅潮区等六大主题阅读空间。", "source": "人民网", "url": "https://www.163.com/dy/article/L9ETVHMU05346936.html"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "国庆后错峰游升温，机票较假期下降超三成", "summary": "国庆、中秋假期过后，在线旅游平台数据显示10月10日至31日机票平均支付价格较假期下降超三成，多条航线裸票价仅200至300元，国际航线也明显“跳水”，热门目的地酒店均价降约20%。张家界、新疆、西藏等地迎来客流平稳、性价比高的错峰慢旅行。", "source": "央视网", "url": "https://big5.cctv.com/gate/big5/news.cctv.com/2026/10/10/ARTIWGVWVI7GeECVyiyehoA9261010.shtml"}, {"id": 17, "category": "财经经济与就业", "scope": "国际", "title": "美国2026财年预算赤字近2万亿美元、同比增12%", "summary": "美国财政部16日公布数据，2026财年联邦预算赤字达1.99万亿美元，较上财年1.78万亿增长12%，为历史上金额第三高的年度赤字，联邦政府已连续25个财年赤字。总收入5.4万亿、总支出7.4万亿，债务净利息增至1.05万亿，分析称膨胀债务正拖累美财政健康。", "source": "中国新闻网", "url": "https://www.chinanews.com.cn/gj/2026/10-17/10716072.shtml"}]}, "yest": {"date": "2026-10-16", "generatedAt": "2026-10-16T07:05:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国际", "title": "Meta发布8160亿参数开放权重大模型Muse Spark Open 联手苹果跑上Mac", "summary": "Meta 15日发布开放权重大模型 Muse Spark Open，总参数8160亿（活跃420亿），支持100万Token上下文，主攻编程与智能体任务，并携手苹果优化至 Mac Studio 本地运行；能力更强的 Muse Wonder 系列仍保持闭源。", "source": "华尔街见闻", "url": "https://www.163.com/dy/article/L9B0N2PF05198NMR.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "Google调整AI搜索呈现方式 强化链接展示回应出版商流量担忧", "summary": "Google宣布升级AI搜索，在AI Overviews与AI Mode中提高内联链接展示频率并前置，新闻结果以轮播呈现，同时把'News AI'新闻授权试点扩大至超400家媒体，以回应出版商与创作者流量被截留的担忧。", "source": "cnBeta", "url": "https://www.163.com/dy/article/L9B7U0S70511BLFD.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美以就打击伊朗预案磋商 美军或动用“炸弹之母” 伊朗动员备战", "summary": "多家媒体披露，美军已制定新的对伊朗打击方案，考虑动用重约9.8吨的“炸弹之母”（MOAB）打击其能源与核设施；伊朗重建导弹无人机设施、动员民众备战，以色列亦就打击预案与美磋商。胡塞同日公布击落沙特“台风”战机画面。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7697031402059072034/"}, {"id": 4, "category": "战争与自然灾害", "scope": "国际", "title": "胡塞袭击利雅得机场致17死333伤 安理会强烈谴责跨境袭击", "summary": "沙特主导的多国联军15日通报，胡塞武装10月以来对利雅得哈立德国王国际机场的袭击共造成17人死亡、333人受伤；同日胡塞袭击也门亚丁总统府致5死16伤。联合国安理会以最强烈措辞谴责胡塞持续跨境袭击民用设施。", "source": "新华社", "url": "https://k.sina.com.cn/article_1699432410_654b47da02001x13u.html?subch=onews"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "潘功胜在G20财金会议：继续实施好适度宽松的货币政策", "summary": "15日G20财长和央行行长会议在曼谷举行，央行行长潘功胜表示全球失衡不能仅靠汇率调节，逆差与顺差国应共同努力实现动态平衡，中方将继续实施好适度宽松的货币政策，为经济稳定增长与金融市场平稳运行营造环境。", "source": "证券时报", "url": "https://www.toutiao.com/article/7697019400628535843"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美国9月PPI同比涨6.3%创四年新高 日韩股市暴跌触发熔断", "summary": "美国9月PPI同比涨6.3%创逾四年最高、环比涨1.3%，零售销售环比增0.8%超预期但剔除汽车与汽油仅增0.2%；AI融资链担忧升温，日韩股市遭遇“黑色星期四”，韩国综合指数盘中跌超8%、年内第十次触发熔断。", "source": "华尔街见闻", "url": "https://www.sohu.com/a/1088367974_130887"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "中朝新鸭绿江大桥正式开通 进一步促进双边经贸与人员往来", "summary": "10月15日，中朝新鸭绿江大桥正式开通，成为两国互联互通的重要基础设施。该桥将进一步促进中朝经贸交流与人员往来，便利边民互市与跨境合作，增进两国人民福祉，是双边务实合作的新节点。", "source": "凤凰卫视", "url": "https://www.sohu.com/a/1088154406_516458"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "朱雀二号改进型遥四一箭十星发射成功 推进太空算力验证", "summary": "14日19时40分，朱雀二号改进型遥四运载火箭在东风商业航天创新试验区以一箭十星方式将10颗卫星送入轨道，开展太空算力、星间/星地高速激光通信等前沿验证，系该系列第10次飞行，距上次任务仅隔29天。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&t=1791987320653&item_id=10856644951740151142&channelId=1119"}, {"id": 9, "category": "体育赛事", "scope": "国内", "title": "2026-2027赛季CBA揭幕战打响 升降级时隔二十余年回归", "summary": "2026-2027赛季CBA 16日晚拉开战幕，卫冕冠军上海久事主场迎战深圳马可波罗，赛前举行升总冠军旗、发戒指仪式。新赛季最大变化是时隔二十余年恢复升降级，常规赛末两名将与NBL前两名打附加赛。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261015A0DK6B00"}, {"id": 10, "category": "体育赛事", "scope": "国际", "title": "欧联杯疯狂之夜 米兰4-0萨尔茨堡 19岁小将西塞戴帽", "summary": "欧联杯联赛阶段第2轮，AC米兰客场4比0大胜萨尔茨堡红牛，19岁小将西塞完成帽子戏法、成欧战最年轻意大利戴帽者；勒沃库森同样4比0取胜，尤文图斯则在补时阶段2比1绝杀塞尔塔逆转。", "source": "搜狐体育", "url": "https://www.sohu.com/a/1088361182_121894857"}, {"id": 11, "category": "健康养生", "scope": "国际", "title": "刚果（金）本轮埃博拉确诊超9000例 肯尼亚现第二例", "summary": "刚果（金）卫生部13日通报，本轮本迪布焦型埃博拉疫情累计确诊升至9066例、死亡4381例，波及7省、病死率约48.3%；肯尼亚14日确认第二例病例。目前两国的该型病毒均无获批疫苗或特异性疗法。", "source": "新华社", "url": "https://finance.sina.com.cn/wm/2026-10-15/doc-inivhaww4409384.shtml"}, {"id": 12, "category": "环境气候", "scope": "国内", "title": "生态环境部印发全国碳市场配额分配方案 覆盖四行业", "summary": "生态环境部近日印发《全国碳排放权交易市场2025、2026年度发电行业及2026年度钢铁、水泥、铝冶炼行业配额总量和分配方案》，明确四行业延续基于碳强度的免费分配，并逐步与产能置换、产量调控衔接，为后续推行有偿分配打基础。", "source": "中国电力报", "url": "https://finance.sina.com.cn/roll/2026-10-15/doc-inivhyai8064911.shtml"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "世界新能源汽车大会海口举行 全球上半年销量破1123万辆", "summary": "2026世界新能源汽车大会在海口举办，数据显示上半年全球新能源车销量1123.4万辆、同比增14%、渗透率24%，累计破9400万辆；中国累计超6200万辆稳居核心，1-8月出口343.5万辆同比增124%，成为拉动产业增长引擎。", "source": "央广网", "url": "https://www.cnr.cn/2013qcpd/2015xc/20261016/t20261016_527843195.shtml"}, {"id": 14, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛开打 入围赛四队争瑞士轮席位", "summary": "2026英雄联盟全球总决赛（S16）16日凌晨在洛杉矶开打，首日入围赛由KC、C9、FURIA、MVK四队争夺唯一一张瑞士轮门票；LPL四队AL、BLG、TES、iG将于24日瑞士轮直接登场，赛事持续至11月15日纽约总决赛。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261016A019JV00"}, {"id": 15, "category": "文化读书", "scope": "国内", "title": "2026天府书展成都启幕 3.7万种图书500万惠民券", "summary": "2026天府书展16日至19日在成都举行，2.2万平方米展馆、200余家出版单位携3.7万余种图书参展，发放500万元惠民券、配套800余场活动，首设台湾地区图书专区并引入河洛文化AI大模型，恰逢《全民阅读促进条例》施行首年。", "source": "四川省政府", "url": "https://www.sc.gov.cn/10462/10464/10797/2026/10/11/62edc9b42f3c401589b7be0167002374.shtml"}, {"id": 16, "category": "旅行出行", "scope": "国内", "title": "新疆罗布人村寨沙漠文化旅游节10月16日启幕", "summary": "2026罗布人村寨沙漠文化旅游节16日至17日在新疆尉犁启幕，串联红色达西、罗布人村寨、罗布湖等线路，推出千人烟火市集、非遗快闪、骆驼骑行与沙漠越野，巴州全州联动释放金秋胡杨文旅消费活力。", "source": "新疆日报", "url": "https://www.xjmty.com/dz/2026/10-09/nav-42-01q49eWk.html"}, {"id": 17, "category": "娱乐影视", "scope": "国内", "title": "2026年10月总票房突破15亿元 三部影片领跑", "summary": "据猫眼专业版，2026年10月总票房突破15亿元，《神探之痕迹》《什么意思夫妇》《生化危机：爆发夜》分列月票房榜前三位，国庆档后市场热度延续，多元类型片支撑大盘。", "source": "猫眼专业版", "url": "https://finance.sina.cn/7x24/2026-10-14/detail-inivevcq1313834.d.html"}]}};</script>

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
