统特朗普表示美伊正进行“富有成效的磋商”，美方不会在11月3日中期选举前攻击伊朗；同日普京在土库曼斯坦与伊朗总统会晤，称已准备好采取一切措施结束伊朗冲突，中东局势出现外交缓和信号。", "source": "新浪财经/央视", "url": "https://k.sina.com.cn/article_5952915720_162d2490806704yvyg.html"}, {"id": "n5", "category": "国际时事", "scope": "国际", "title": "世贸组织上调2026年全球货物贸易增长预期至3.9%", "summary": "世界贸易组织10月8日发布最新《全球贸易展望与统计》报告，将2026年全球货物贸易增长预期从3月预测的1.9%上调至3.9%，预计2027年增长4.1%。报告称上半年全球货物贸易增长3.5%、超出预期，供应链展现出应对中东战事冲击的韧性。", "source": "腾讯新闻/央视", "url": "https://news.qq.com/rain/a/20261009A02ETQ00"}, {"id": "n6", "category": "财经经济与就业", "scope": "国内", "title": "国庆假期跨区人员流动21.42亿人次，服务消费增19.5%", "summary": "2026年国庆假期（10月1日至7日）全社会跨区域人员流动量达21.42亿人次，日均3.06亿；增值税发票显示服务消费相关行业日均销售收入同比增19.5%。高速公路新能源汽车充电671.1万次、充电量1.63亿千瓦时，日均同比增51.42%。", "source": "新华社/国家能源局", "url": "https://www.cnfin.com/zs-lb/detail/20261009/4478331_1.html"}, {"id": "n7", "category": "财经经济与就业", "scope": "国内", "title": "新就业形态劳动者权益保障办法公开征求意见", "summary": "人力资源社会保障部10月8日发布《新就业形态劳动者权益保障办法（征求意见稿）》，即日起至11月8日向社会公开征求意见。这是我国首次以规章形式，将平台企业实施劳动管理、不完全符合确立劳动关系的骑手、网约车司机等新业态劳动者纳入劳动法律制度保障。", "source": "新华社/腾讯新闻", "url": "https://news.qq.com/rain/a/20261009A02FT000"}, {"id": "n8", "category": "社会民生与教育", "scope": "国内", "title": "2026年银龄讲学计划招募6000名退休教师", "summary": "教育部、财政部近日部署实施2026年银龄讲学计划，面向脱贫县、民族县、革命老区县、边境县等，计划招募义务教育阶段银龄讲学教师6000名，以校长、教研员、特级和骨干教师为主，工作经费由中央与地方按年人均2万元标准共同分担。", "source": "中国经济网/新华社", "url": "http://edu.ce.cn/hp/zx/202610/t20261009_3250300.shtml"}, {"id": "n9", "category": "战争与自然灾害", "scope": "国际", "title": "胡塞称一天两次袭利雅得机场，巴以冲突三周年持续", "summary": "央视《新闻直播间》10月9日报道，也门胡塞武装称一天两次袭击利雅得机场；“林肯”号航母返回圣迭戈母港；国际能源署成员国同意加快释放石油储备。新一轮巴以冲突爆发三周年，以军军事行动仍在继续，加沙地带民众仍处惊恐之中。", "source": "央视新闻", "url": "https://tv.cctv.cn/2026/10/09/VIDEZMBYTp6qZhacJxJ9XcEo261009.shtml"}, {"id": "n10", "category": "科学探索", "scope": "国内", "title": "“天关”卫星联手“拉索”破解宇宙线百年谜题", "summary": "中科院团队“天关”卫星与四川稻城高海拔宇宙线观测站“拉索”联手，捕捉到一条长约42光年的宇宙线“长尾”，锁定其可能出发地，破解宇宙线起源这一困扰物理学界的“百年谜题”。这是两大国产大科学装置首次联合挑战基础科学重大问题。", "source": "中国科学院/光明日报", "url": "https://www.cas.cn/cm/202610/t20261008_5121510.shtml"}, {"id": "n11", "category": "科学探索", "scope": "国际", "title": "韦布望远镜发现行星级碰撞迹象，或揭示月球成因", "summary": "NASA 10月7日公布，詹姆斯·韦布空间望远镜在一批年轻恒星周围发现21个罕见的“极端碎片盘”，其尘埃揭示出行星级碰撞的规模与强度，让天文学家得以一窥可能塑造过太阳系的剧烈撞击——包括被认为造就月球的那次巨型碰撞。", "source": "ScienceDaily/NASA", "url": "https://www.sciencedaily.com/releases/2026/10/261007042108.htm"}, {"id": "n12", "category": "体育赛事", "scope": "国内", "title": "郑钦文中网女单1/4决赛迎战斯维托丽娜争四强", "summary": "2026中国网球公开赛10月9日进入女单1/4决赛，郑钦文将在钻石球场迎战6号种子斯维托丽娜争夺四强席位；两人职业生涯此前无正式交手记录。前四轮郑钦文全部打满三盘过关，能否减少消耗、以更主动方式晋级成为本场关键。", "source": "新浪体育", "url": "https://k.sina.com.cn/article_2834321443_a8f0502300102aj7o.html"}, {"id": "n13", "category": "体育赛事", "scope": "国内", "title": "德约中网成就七冠王，赛事单日客流破4万创新高", "summary": "2026中网男单决赛10月6日晚，德约科维奇战胜德米纳尔成就“七冠王”，中网战绩改写为34胜0负。赛事火爆带动观赛热：截至10月4日累计入园超27万人、较去年同期增37%，单日客流两度破4万刷新历史纪录，带动周边消费近1.5亿元。", "source": "新京报/网易", "url": "https://www.163.com/dy/article/L8MBITMV05568W0A.html"}, {"id": "n14", "category": "健康养生", "scope": "国内", "title": "2026世界传统医药大会将于10月17日至18日在北京举行", "summary": "据2026世界传统医药大会组委会消息，由北京市政府、国家卫健委、国家中医药管理局、国家药监局主办，世界卫生组织共同举办的2026世界传统医药大会将于10月17日至18日在北京举行，聚焦传统医药传承创新与全球卫生合作。", "source": "人民网", "url": "https://health.people.com.cn/n1/2026/0924/c14739-40805108.html"}, {"id": "n15", "category": "环境气候", "scope": "国内", "title": "10月自然灾害风险形势发布：1—2个台风或影响我国", "summary": "应急管理部会同多部门会商研判，发布10月及国庆假期全国自然灾害风险形势：预计10月华中、华南、西南等地洪涝和风雹风险较高，西北太平洋和南海有3—4个台风生成、1—2个登陆或明显影响我国（强度总体偏强），部分区域地质灾害与森林火险等级较高。", "source": "应急管理部/央视", "url": "https://big5.cctv.com/gate/big5/news.cctv.cn/2026/10/02/ARTIBs87XTXQMvpb1dVRZBbU261002.shtml"}, {"id": "n16", "category": "汽车出行", "scope": "国内", "title": "中国一汽、丰田、广汽三方签约，南北丰田走向协同", "summary": "10月8日，中国一汽、丰田汽车、广汽集团在广州签署全新战略合作框架协议。广汽集团拟以发行股份方式购买中国一汽持有的一汽丰田50%股权，交易完成后一汽丰田仍独立运营、一汽成为广汽重要战略股东，南北丰田将在研发、采购、生产、销售等环节协同。", "source": "第一电动网", "url": "https://d1ev.com/news/qiye/313392"}, {"id": "n17", "category": "游戏电竞", "scope": "国内", "title": "英雄联盟S16全球总决赛10月16日开战，LPL四队出征", "summary": "《英雄联盟》2026全球总决赛（S16）将于10月16日在美国洛杉矶打响入围赛，11月15日纽约总决赛。LPL赛区派出AL、BLG、TES、iG四支队伍直接晋级瑞士轮；受北美时差影响，瑞士轮与决赛多在北京时间凌晨，仅八强与半决赛为早6点档。", "source": "网易", "url": "https://www.163.com/dy/article/L8JLSJ010553TF8P.html"}, {"id": "n18", "category": "文化读书", "scope": "国际", "title": "第78届法兰克福书展开幕，中国精品图书集中亮相", "summary": "第78届法兰克福书展10月7日在德国法兰克福会展中心开幕，来自100多个国家和地区超4000家出版机构参展。中国图书进出口集团组织80余家国内出版文化单位以“阅读中国”形象亮相，设336平方米联合展台，展出3000余种、4600余册精品图书。", "source": "中国新闻网", "url": "https://www.jwview.cn/cul/2026/10-08/10708957.shtml"}]}};</script>

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
