<style>
:root{--blue:#1f6feb;--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#7b8698;--line:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.refresh{border:1px solid var(--line);background:#fff;color:var(--blue);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subbar{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:0 14px 8px}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.tab{border:none;background:transparent;color:#6b7587;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.stat{font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5b6577;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:12px 0;box-shadow:0 2px 10px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px}
.scope{font-size:11.5px;color:var(--muted);margin-left:8px}
.card h2{font-size:17px;margin:10px 0 7px;line-height:1.45}
.card p{font-size:14.5px;color:#39445a;margin:0 0 11px}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.read{color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 10px 6px}
</style>
<script>window.__DATA__ = {"today": {"date": "2026-11-16", "generatedAt": "2026-11-16T07:22:57+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "世界互联网大会乌镇峰会聚焦AI普惠，我国开源大模型全球下载破100亿次", "summary": "2026年世界互联网大会乌镇峰会近日在浙江乌镇举行，主题为“开源开放 共建共享”。经济日报11月16日报道，我国人工智能开源大模型全球累计下载量已突破100亿次，国家级开源社区汇聚用户超1100万、托管模型超7万个；阿里千问开源超470款模型，腾讯AI办公工作台已汇聚超5万家伙伴及开发者。", "source": "经济日报", "url": "http://paper.ce.cn/pad/content/202611/16/content_341971.html"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "中国开源AI模型加速落地全球产业端，欧洲企业纷纷采用", "summary": "2026年网络峰会日前在葡萄牙里斯本举行，中国开源AI模型在全球产业端加速落地。英国金融科技企业雷沃卢特将约2000名工程师的默认编程模型换为中国智谱GLM系列，平均编程耗时缩短约60%、AI调用成本下降近90%；法国Orange、雷诺及德国西门子等也已公开采用DeepSeek和通义千问等中国模型。", "source": "经济参考网", "url": "https://www.jjckb.cn/20261116/3abc43906c8841d3a83e9d187fa85533/c.html"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "第49届东盟峰会在马尼拉开幕，东帝汶成为第11个成员国", "summary": "第49届东盟峰会11月15日在菲律宾马尼拉开幕，各国领导人围绕能源安全、粮食安全和经济合作展开磋商。开幕式发布由11束稻穗组成的新版东盟徽标，欢迎东帝汶正式成为第11个成员国；马科斯向东盟秘书长移交《东盟数字经济框架协议》文本，协议预计2027年初生效。今年适逢《东南亚友好合作条约》签署50周年。", "source": "新华网/财联社", "url": "https://k.sina.com.cn/article_1916733321_723f078901901jram.html?kdurlshow=1"}, {"id": 4, "category": "国际时事", "scope": "国内", "title": "2026年APEC工商领导人峰会17日深圳举行，习近平出席开幕式", "summary": "2026年APEC工商领导人峰会将于11月17日至18日在深圳前海国际会议中心举办，主题为“共促繁荣，共赢未来”，习近平主席将出席开幕式并发表主旨演讲。据中国贸促会介绍，12位APEC经济体领导人出席，2000余位政商领袖、115家世界500强企业代表参会，峰会将发布《2026年APEC工商领导人峰会深圳倡议》。", "source": "新华社/新华网", "url": "https://my-h5news.app.xinhuanet.com/h5/article.html?articleId=20261116d5cad49ccb8446dba56727ffb1ab91aa"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "外汇存款准备金率上调至6%正式生效，为近五年首次", "summary": "中国人民银行上调金融机构外汇存款准备金率于11月15日正式生效，由4%提高至6%，上调2个百分点，为近五年来首次上调该工具。此举旨在促进外汇市场供求平衡、打破人民币升值预期的自我实现；今年前9个月人民币对美元累计升值4.2%，11月2日曾升破6.65元创四年多新高。", "source": "每日经济新闻/腾讯新闻", "url": "https://news.qq.com/rain/a/20261116A03KVR00"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "10月国民经济数据今日公布，社融存量同比增长7.2%", "summary": "国家统计局11月16日公布10月份国民经济运行情况，发布规模以上工业增加值、社会消费品零售总额、房地产开发投资及70个大中城市房价等数据。央行数据显示，10月末社会融资规模存量达469.16万亿元、同比增长7.2%，广义货币M2余额359.06万亿元、同比增长7.1%，均高于名义GDP增速。", "source": "央广网", "url": "https://www.cnr.cn/jingji/ycbd/20261116/t20261116_527874066.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "“十五五”民生投入加码：双一流高校扩招2.4万人，140亿支持养老托育", "summary": "国家发展改革委在“奋进‘十五五’”系列发布会上介绍民生保障安排：2026年“双一流”高校扩大本科招生2.4万人，并支持地方新建若干所新型研究型大学；已下达中央预算内投资140亿元支持养老、托育设施建设，建成超10万个护理型养老床位和超3万个托位，推动养老机构护理型床位占比达73%。", "source": "21世纪经济报道", "url": "https://finance.sina.com.cn/roll/2026-11-16/doc-iniywnmk5853281.shtml"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "中东局势升级：伊朗称打击巴林美军雷达，沙特拦截胡塞导弹", "summary": "中东局势持续升级：伊朗伊斯兰革命卫队15日发布视频称，出动无人机打击了位于巴林里法直升机基地的美军防空雷达，为“回应美国侵略”的第二轮报复；巴林国防军称拦截并摧毁多个空中目标。同日沙特称拦截也门胡塞武装向利雅得发射的两枚弹道导弹，霍尔木兹海峡南部两艘油轮触雷爆炸起火。", "source": "新华社/央视新闻", "url": "http://mp.weixin.qq.com/s?__biz=MzI0NDA1MDkzNA==&mid=2247504659&idx=1&sn=10c680871f6140bc107f375341fa9fe0"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "两股冷空气接连影响我国，中东部大范围雨雪局地暴雪", "summary": "中央气象台预报，11月15日至18日两股冷空气接连影响我国，中东部大部地区气温累计下降6至10℃，局地降温超12℃。15日夜间至17日中东部现大范围雨雪，内蒙古中部、河北北部、新疆伊犁河谷等地部分地区有暴雪（10—12毫米）；17日至18日吉林东部、黑龙江东部局地有大到暴雪，气温将大面积刷新下半年新低。", "source": "中国气象局", "url": "https://www.cma.gov.cn/2011xwzx/2011xqxxw/2011xzytq/202611/t20261115_8143109.html"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "中国空间站舱外暴露实验样品回舱，揭示深空探测生命密码", "summary": "中国空间站梦天实验舱空间辐射生物学装置第四次暴露实验取得进展，纳米酶、放线菌、植物种子等样品完成为期5个月的舱外暴露后随装置回舱。神舟二十三号乘组完成样品拆取、存储及装置处置，样品下行后将研究太空辐射对生物的深层影响，为我国载人登月及辐射防护药物研发提供技术支撑。", "source": "京报网/央视网", "url": "https://news.bjd.com.cn/2026/11/15/12031246.shtml"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "速滑世界杯北京站收官：高亭宇夺金，中国队4金2银3铜创最佳", "summary": "2026—2027赛季速度滑冰世界杯北京站在国家速滑馆“冰丝带”收官。北京冬奥会冠军高亭宇在男子500米第二次决赛中以34秒61夺冠，廉子文以0.16秒之差获银牌；中国队本站共获4金2银3铜，创世界杯分站赛历史最佳战绩。国际滑联官员高度评价场馆，期待2027年2月世锦赛再聚北京。", "source": "新华社/中国网", "url": "https://big5.china.com.cn/gate/big5/news.china.com.cn/2026-11/16/content_118775546.shtml"}, {"id": 12, "category": "健康养生", "scope": "国内", "title": "冬季养生勿盲目进补，专家提醒重在均衡饮食与保暖", "summary": "冬季养生重在顺应时节、切勿盲目进补。首都医科大学附属北京地坛医院主任医师江宇泳提醒，健康人群无需特意食用滋补药材，应注重三餐营养均衡、早睡和保暖；“三高”人群和老年人如需进补调养应提前咨询医生。供暖后室内湿度易低于30%，建议维持在40%至60%，并定时开窗通风、晨练不宜过早。", "source": "央视网/中国新闻网", "url": "http://mp.weixin.qq.com/s?__biz=MzI3MzE5MTA0OQ==&mid=2247503418&idx=1&sn=d34dae89d73a19f7c6e6b26655653b2f"}, {"id": 13, "category": "环境气候", "scope": "国际", "title": "研究显示全球冰冻圈加速退化，COP31呼吁加快气候谈判", "summary": "一项最新国际研究显示，全球冰冻圈正加速退化，部分变化具有不可逆性，可能给地球生态系统和人类社会带来长期风险。正在土耳其安塔利亚举行的《联合国气候变化框架公约》第三十一次缔约方大会（COP31）上，联合国气候变化框架公约秘书处执行秘书斯蒂尔呼吁各方聚焦核心难点、加快谈判进程。", "source": "新华社/央视新闻", "url": "https://news.qq.com/rain/a/20261116A03KAU00"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "东航新开C919“上海虹桥—郑州”航线，机队增至17架", "summary": "11月15日，东航新开国产大飞机C919“上海虹桥—郑州”航线，首航航班平稳落地郑州新郑国际机场。该航线每日1班往返，航班号MU5395/MU5396，单程飞行时长约1小时40分钟。目前东航C919机队达17架，为国内航司中规模最大。", "source": "央视新闻/大河网", "url": "https://news.dahe.cn/2026/11-16/2151641.html"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "BLG夺英雄联盟S16全球总决赛冠军，中国战队时隔5年登顶", "summary": "2026英雄联盟全球总决赛（S16）在美国纽约落幕，中国LPL赛区二号种子BLG战队在先失一局的情况下连扳三局，以3∶1击败韩国LCK头号种子GEN，队史首夺召唤师杯，也是中国战队自2021年后时隔5年再夺冠。BLG成为史上首支单届连续淘汰全部四支LCK队伍夺冠的战队，决赛超2000万人在线观战。", "source": "新华社/环球网", "url": "https://www.163.com/dy/article/LBRB45TK0514R9OJ.html"}, {"id": 16, "category": "文化读书", "scope": "国内", "title": "2026世界中文大会闭幕，中文水平考试考生首破100万人次", "summary": "2026世界中文大会11月13日至15日在北京举行，来自160多个国家和地区的约5000名代表参会，主题为“中文，不止于语言”。大会发布数据：今年中文水平考试（HSK）考生首次突破100万人次，考点覆盖169个国家和地区超1500个，海外学习和使用中文人数达2.1亿，92国将中文纳入国民教育体系。", "source": "央视新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=4858761386700289180&channelId=1119"}, {"id": 17, "category": "旅行出行", "scope": "国内", "title": "冰雪旅游升温：从规模扩张转向深度运营，入境客流增长89%", "summary": "迈点研究院发布《2026年冰雪旅游景区运营发展报告》指出，我国冰雪旅游正由规模扩张迈向价值创造，“95后”与亲子家庭构成双主力。国家体育总局数据显示，2025—2026冰雪季全国居民冰雪运动参与人数达3.08亿、参与率21.75%，滑雪滑冰等直接参与者突破8500万；入境滑雪客流同比增长89.2%。", "source": "四川日报", "url": "https://epaper.scdaily.cn/shtml/scrb/20261116/1094509.html"}, {"id": 18, "category": "汽车出行", "scope": "国内", "title": "前10月汽车产销超2600万辆，新能源汽车销量占比达54.8%", "summary": "中国汽车工业协会数据显示，2026年前10个月我国汽车产销分别完成2631.8万辆和2628.6万辆，其中新能源汽车产销达1450.9万辆和1441.1万辆，新车销量累计占比54.8%。10月单月新能源新车销量占比升至64.3%，即每卖出10台新车超6台为新能源；新能源商用车前10月销量101.8万辆、同比增长41.7%。", "source": "东方财富/中国汽车工业协会", "url": "https://caifuhao.eastmoney.com/news/20261116002737265690870"}]}, "yest": {"date": "2026-11-15", "generatedAt": "2026-11-15T07:00:00+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "第十一届中国开源年会首次落地杭州，聚焦AI时代开源生态", "summary": "11月14—15日，第十一届中国开源年会（COSCon'26）首次在杭州云谷中心举行，主题定为“开源下一代”。大会集中展示大模型开源权重、开源治理与社区商业化，并发布《中国人工智能开源生态蓝皮书》；杭州已把开源生态列为人工智能创新发展核心战略之一。", "source": "腾讯新闻/开源社", "url": "https://news.qq.com/rain/a/20261115A0191300"}, {"id": 2, "category": "国际时事", "scope": "国际", "title": "欧盟领导人首次就AI举行专题峰会，并就乌克兰和谈代表安排达成一致", "summary": "欧盟领导人11月13日在爱尔兰都柏林举行首次AI专题峰会，讨论以人工智能提升欧洲竞争力与安全监管国际合作，冯德莱恩称实现技术自主需至少5000亿欧元投资。会后欧盟就参与乌克兰和平谈判的代表安排达成一致，团队由欧盟机构及英法德意波五国组成。", "source": "新华社", "url": "https://www.toutiao.com/article/7708124603175961131/"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "美国因空管通信故障发布全国地面停飞令，超1.5万架次航班受影响", "summary": "因空中交通管制通信故障，美国联邦航空管理局（FAA）11月13日发布全国性地面停飞令，停飞超4小时，约1.5万架次航班延误或取消，系2001年以来持续时间最长的一次。故障发生时承包商正将铜缆更换为光纤，FAA局长预计15日晚运输恢复正常。", "source": "澎湃新闻/新华社", "url": "https://www.thepaper.cn/expressNews/2026-11-15"}, {"id": 4, "category": "财经经济与就业", "scope": "国内", "title": "央行今起上调外汇存款准备金率2个百分点，稳汇率防超调", "summary": "为加强金融机构外汇流动性管理，中国人民银行决定自2026年11月15日起将外汇存款准备金率由4%上调至6%，为近5年来首次上调。政策目标指向减缓人民币升值压力、防范汇率短期超调，消息发布后离岸人民币对美元应声回落，接连跌破6.65、6.66关口。", "source": "新华财经/东方财富", "url": "https://forex.eastmoney.com/a/202611033920372393.html"}, {"id": 5, "category": "健康养生", "scope": "国内", "title": "2026版国家医保药品目录发布，新增107种药品创历史新高", "summary": "国家医保局、人社部11月14日发布2026年版国家医保药品目录，共新增107种药品，其中51个为1类创新药，再创历史新高；百万元级的CAR-T类药品、血友病非因子类药物首次纳入基本医保。新版目录将于2027年1月1日落地执行，药品总数达3331个。", "source": "光明日报", "url": "https://news.gmw.cn/2026-11/15/content_39101243.htm"}, {"id": 6, "category": "社会民生与教育", "scope": "国内", "title": "2027年全国硕士研究生招生考试报名347万，连降三年后回升", "summary": "教育部公布，2027年全国硕士研究生招生考试报名人数为347万，在连续三年下降后回升；考试将于2026年12月19—20日举行。教育部已会同联席会议成员单位召开安全工作视频会，部署命题安全、考场安防与防舞弊等，全力实现“平安研考”。", "source": "中国新闻网", "url": "https://www.chinanews.com/sh/2026/11-13/10731427.shtml"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "昆明推出50余项秋假校外公益实践活动，全程免费向中小学生开放", "summary": "昆明市教育体育局推出“观山海·护生态，爱运动·爱生活”春城青少年秋假校外实践系列活动（11月13—15日），覆盖滇池绿道东西岸等点位，设8个主题体验营与城市生态研学打卡，全程免费、自愿实名预约，不与学业评价挂钩。", "source": "中国教育报/微博", "url": "https://m.weibo.cn/status/5363727004074066"}, {"id": 8, "category": "科学探索", "scope": "国内", "title": "广东平远发现植物新种“平远景天”，系丹霞地貌特有物种", "summary": "平远县林业局联合中山大学生命科学学院团队在国际植物分类学期刊正式发表景天科景天属新种“平远景天”，目前仅在平远五指石、南台山两地发现，是当地丹霞地貌特有种。团队跨两个生长季采集标本并提取DNA测序确认，具观赏与园艺开发价值。", "source": "梅州日报", "url": "https://mzrb.meizhou.cn/html/2026-11/15/content_416463.htm"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "我国完成空间站舱外激光“微创”试验，在轨运维获突破", "summary": "人民日报报道，我国空间站舱外激光“微创”试验近期在轨成功完成，系国际上首次在数百公里太空极端环境下通过遥操作开展激光精密切割。该试验由华中科技大学团队与上海空间电源研究所联合研制的舱外激光维修装置完成，标志在轨运维技术取得重大突破。", "source": "人民网", "url": "http://m2.people.cn/news/default.html?s=MV8xXzQwODMzNjY5XzEwMDRfMTc5NDYwNjQ1MA=="}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "宁忠岩速滑世界杯北京站加冕“双冠王”，连夺1000米与1500米金牌", "summary": "2026—2027赛季速度滑冰世界杯北京站，米兰冬奥会冠军宁忠岩先以1分07秒43打破“冰丝带”男子1000米场地纪录夺金，次日又以1分43秒64再夺1500米金牌，加冕本站双冠王；队友廉子文获1000米铜牌，取得新赛季开门红。", "source": "人民网/中新社", "url": "https://ent.people.com.cn/n1/2026/1114/c1012-40833763.html"}, {"id": 11, "category": "体育赛事", "scope": "国内", "title": "国足2-0击败马来西亚，终结友谊赛三连败", "summary": "11月14日晚，在肇庆国际足球邀请赛中，中国男足凭借王钰栋第10分钟头球、张玉宁第19分钟单刀，主场2-0战胜马来西亚队，终结近期三连败。邵佳一赛后称胜利重要但“没有乐观的资本”，17日球队将迎战巴林队。", "source": "新华社", "url": "https://www.toutiao.com/article/7708061700003545600/"}, {"id": 12, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16全球总决赛今晨打响，BLG迎战GEN", "summary": "北京时间11月15日凌晨3点，2026英雄联盟全球总决赛在纽约巴克莱中心打响，中国LPL赛区BLG对阵韩国LCK一号种子GEN。BLG淘汰赛连克HLE、DK、T1三支韩队，GEN则近乎全胜晋级；全国110余城、300余家影院开通凌晨直播，影院直播规模创历史新高。", "source": "腾讯新闻/英雄联盟赛事", "url": "https://news.qq.com/rain/a/20261113A0DZX200"}, {"id": 13, "category": "战争与自然灾害", "scope": "国际", "title": "17国外长强烈谴责以色列空袭加沙医疗中心，霍尔木兹海域局势紧张", "summary": "巴基斯坦、埃及、沙特、土耳其等17国外长11月14日发表声明，以最强烈措辞谴责以色列对加沙汗尤尼斯纳赛尔医疗中心发动空袭，指其违反国际人道法。同日伊朗通报至少4艘油轮在霍尔木兹海峡触雷起火，联合国称该海域已发生134起商船袭击、致25名海员死亡。", "source": "新浪财经/CCTV国际时讯", "url": "https://finance.sina.com.cn/jjxw/2026-11-15/doc-iniytsqv3759980.shtml"}, {"id": 14, "category": "战争与自然灾害", "scope": "国内", "title": "两股冷空气接力南下，东北局地暴雪到大暴雪甚至特大暴雪", "summary": "中央气象台预报，14日至18日两股冷空气接连影响中东部，大部地区气温累计下降6—10℃、局地超12℃，19日凌晨0℃线将南压至淮河流域。17—18日辽宁、吉林、黑龙江东部有暴雪，局地大暴雪或特大暴雪，新增积雪可达30厘米以上，需防道路结冰。", "source": "中国天气网/中央气象台", "url": "https://www.topicbeat.com/news/article-1794682647330935047"}, {"id": 15, "category": "环境气候", "scope": "国际", "title": "COP31上的中国答卷：2035年NDC首提全经济范围绝对量减排目标", "summary": "在土耳其安塔利亚举行的COP31上，中国展示气候行动进展：2035年国家自主贡献（NDC）首次覆盖全经济范围、含所有温室气体并提出绝对量减排目标；2025年中国单位GDP二氧化碳排放下降5.0%，新能源汽车产销量连续11年全球第一，全国碳市场配额累计成交破9.17亿吨。", "source": "中国网/中新社", "url": "https://news.china.com.cn/2026-11/15/content_118774921.shtml"}, {"id": 16, "category": "汽车出行", "scope": "国内", "title": "2026重庆汽车消费节启幕，80余品牌千余款车型集中亮相", "summary": "11月12—15日，2026（第十七届）重庆汽车消费节暨第七届房车生活节在重庆国际博览中心举行，规划8万平方米展区，汇聚80余个主流品牌、1000余款车型，新能源与智能化成核心看点。现场可叠加国家报废更新、置换更新及重庆购新三项补贴，单车最高可享2万元。", "source": "重庆市人民政府网", "url": "https://wap.cq.gov.cn/ykbzt/yhyshj/hzhd/202611/t20261110_16392896.html"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026广西知识大会在自治区博物馆举办，推动“书+展”深度融合", "summary": "11月13—15日，以“知识的长河”为主题的2026广西知识大会在广西壮族自治区博物馆主会场开启，设作家分享、书展市集、潮玩文创、文化沙龙四大板块，并联动多家“小而美”阅读空间。“博物馆NPC奇遇记”、古籍装订体验等让文物“开口说话”，打造城市知识嘉年华。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261114A0CP2G00"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "A级景区“有进有出”成常态，今年全国百余家景区被摘牌", "summary": "随着多地开启A级景区集中清退，今年以来全国22个省份100多家A级景区被摘牌或降级。从“一评到手、长期享用”到常态化复核、不合格即清退，释放行业监管标准持续收紧的信号，倒逼景区补齐配套短板、创新文旅产品，从追求数量规模转向质量效益。", "source": "光明日报", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_2666af8a94d71552"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
