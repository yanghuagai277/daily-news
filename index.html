济与就业", "scope": "国内", "title": "央行将于9月28日至10月8日开展隔夜逆回购 单日上限1万亿元", "summary": "中国人民银行公告，为匹配银行体系短期流动性需求，将在9月28日至10月8日开展隔夜逆回购操作，采用固定利率、数量招标，每日操作量不超过1万亿元，以平稳跨节资金面。", "source": "新华网", "url": "https://www.toutiao.com/article/7688717318951584298/"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "中国天眼FAST迎来落成十周年 累计发现脉冲星超1300颗", "summary": "9月25日，500米口径球面射电望远镜FAST迎来落成十周年。十年来它累计发现脉冲星超1300颗，超过同期全球其他望远镜总和，并构建世界最大中性氢星系样本库，二期阵列工程同步推进。", "source": "新浪财经", "url": "https://finance.sina.com.cn/jjxw/2026-09-26/doc-initahrr7558192.shtml"}, {"id": 10, "category": "科学探索", "scope": "国内", "title": "“雪龙2”号在北纬86度以北密集冰区捕获极鳕幼鱼", "summary": "中国第16次北冰洋考察队披露，“雪龙2”号在北纬86度以北的加拿大海盆北部高纬度密集冰区，于人工钻通的冰洞中先后发现并捕获5尾1至2年育龄的极鳕幼鱼，为极地生态研究提供新样本。", "source": "光明网", "url": "https://www.toutiao.com/w/1877351149003776/"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "全球首款侵入式脑机接口在华获批并开出首张处方", "summary": "博睿康植入式脑机接口手部运动功能代偿系统今年3月获国家药监局批准，成为全球首款获批侵入式脑机接口医疗器械；7月上海开出首张处方并完成首例植入手术，已纳入“沪惠保”保障。", "source": "证券时报", "url": "https://www.stcn.com/article/detail/4027197.html"}, {"id": 12, "category": "汽车出行", "scope": "国际", "title": "特斯拉Semi电动卡车开启量产交付", "summary": "9月25日，特斯拉宣布Semi电动卡车开启量产交付。该车搭载辅助驾驶功能，配套Megacharger兆瓦级充电功率，标志着电动重卡从示范运行迈向规模化商用，剑指长途货运脱碳。", "source": "每日经济新闻", "url": "https://cd.nbd.com.cn/articles/2026-09-25/4592090.html"}, {"id": 13, "category": "汽车出行", "scope": "国内", "title": "吉利发布AI智充 12C神盾金砖电池4分半充至70%", "summary": "9月23日吉利发布新一代AI智充技术，单枪峰值功率2250千瓦，配合12C神盾金砖电池，实测10%至70%充电仅需4分30秒、至97%约8分40秒，刷新全球量产车型补能速度纪录。", "source": "新浪财经", "url": "https://k.sina.com.cn/article_7879848959_1d5acf3ff06801l5xo.html"}, {"id": 14, "category": "文化影视", "scope": "国内", "title": "2026中秋档票房破亿 《复联4》加码臻享版领跑", "summary": "据灯塔专业版，9月25日中秋节全国电影票房达1.19亿元，2026中秋档总票房突破1亿元。《复仇者联盟4：终局之战（加码臻享版）》以4041万元夺冠，多部国产新片上座率偏低遇冷。", "source": "搜狐", "url": "https://www.sohu.com/a/1080993475_114941"}, {"id": 15, "category": "旅行出行", "scope": "国内", "title": "中秋国庆假期全社会跨区域人员流动量预计达27.8亿人次", "summary": "国新办发布会研判，今年中秋三天跨区域人员流动量约6.5亿人次，国庆七天达21.3亿人次，合计27.8亿；国庆首日或达3.4亿创同期新高，公路自驾占九成以上，铁路预计发送2.84亿人次。", "source": "中国经济网", "url": "https://www.ce.cn/xwzx/gnsz/gdxw/202609/t20260924_3234565.shtml"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "海南“四城同办”校招收官 提供优质岗位7726个", "summary": "2026年“百万英才兴海南·四城同办”校招活动9月22日收官，组织284家用人单位携7726个岗位走进西安、成都、沈阳、北京四地高校，覆盖工程、AI、生物医药等方向，掀起引才热潮。", "source": "人民网", "url": "https://www.163.com/dy/article/L7O5I27705346936.html"}, {"id": 17, "category": "环境气候", "scope": "国际", "title": "台风“杜鹃”已致日本12死3失踪 多地发布警报", "summary": "据日方消息，今年第25号台风“杜鹃”已在日本造成12人死亡、3人下落不明。台风带来强风暴雨与山体滑坡风险，日本气象部门对多地区发布警报，救援与灾情核查工作持续进行。", "source": "央视新闻", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_1566ab702ee56852"}]}, "yest": {"date": "2026-09-25", "generatedAt": "2026-09-25T08:12:39.178433+08:00", "method": "混合（搜索引擎实时抓取 + RSS）", "items": [{"id": 1, "category": "国际时事", "scope": "国际", "title": "中美元首白宫会谈，第八轮经贸磋商达成多项共识", "summary": "当地时间9月24日，国家主席习近平同美国总统特朗普在白宫举行会谈，并出席欢迎仪式。双方经贸团队在纽约完成第八轮磋商，围绕对等降税、设立贸易与投资理事会等深入交流，达成多项共识；何立峰与贝森特在磋商机制下就人工智能议题举行首次对话。两国元首还就中东局势、乌克兰危机等交换意见，特朗普称这是一次“伟大的会晤”。", "source": "央视新闻/新华社", "url": "https://www.toutiao.com/article/7689234562810987035/"}, {"id": 2, "category": "战争与自然灾害", "scope": "国际", "title": "以军决定在约旦河西岸部署精锐部队，胡塞再袭沙特", "summary": "以色列国防军23日称决定在约旦河西岸部署一支精锐部队，并继续破坏当地农户橄榄树，多国在联大谴责并呼吁维护“两国方案”。24日，以色列总理内塔尼亚胡联大发言时多国代表集体退场。与此同时，也门胡塞武装称对沙特首都利雅得及延布阿美石油设施发动导弹与无人机袭击，沙特主导联军称拦截6枚导弹。", "source": "央视新闻/新华社", "url": "https://www.toutiao.com/article/7689230380741739048/"}, {"id": 3, "category": "科技互联网与AI", "scope": "国际", "title": "Anthropic用Claude集群自主发现类CRISPR新型酶系统ART", "summary": "Anthropic新分子生物学实验室公布首个成果：950个Claude集群并联运行21小时、消耗约2.1亿Token，扫描超20万个逆转录酶后，在巨型噬菌体DNA中自主发现人类此前从未记录的全新酶系统ART（阵列关联逆转录酶系统），其结构与CRISPR高度神似，被视作“上帝手术刀”式突破。", "source": "腾讯新闻/华尔街见闻", "url": "https://news.qq.com/rain/a/20260925A02NWA00"}, {"id": 4, "category": "科技互联网与AI", "scope": "国内", "title": "国产AI硬件密集迭代，乐奇AI眼镜数贸会首秀、小米公开MiMo-V3", "summary": "第二届数贸会上，第二代乐奇AI眼镜完成全球首秀，主打实时翻译与端侧AI，计划10月27日正式发布；小米正式公开MiMo-V3大模型核心架构HySparse2，针对长程多轮Agent优化推理效率。同期OpenAI个人智能体Aeon代码曝光、最快9月29日前发布，国产与全球AI硬件、Agent竞速同步升温。", "source": "网易/前沿在线", "url": "https://www.163.com/dy/article/L7KORVJ005569XIR.html"}, {"id": 5, "category": "财经经济与就业", "scope": "国际", "title": "全球债市抛售潮加剧，美日德国债收益率齐创数十年新高", "summary": "9月24日全球政府债券遭抛售，美国7年期国债发行中标收益率5.085%创2009年来新高，30年期一度升至5.47%创2004年来新高；日本10年期国债收益率冲上1996年来新高，德国10年期创2009年来新高，全球政府债务平均收益率近4%、为2007年来最高，引发对财政与利率前景的担忧。", "source": "网易/陆家嘴财经早餐", "url": "https://www.163.com/dy/article/L7LDS30605198RSU.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国际", "title": "美国上周首申失业金降至19.7万，为1969年来最低水平之一", "summary": "美国劳工部公布，截至9月19日当周初请失业金人数减少1000人至19.7万，为7月以来最低、也是1969年以来的历史最低读数之一；四周移动均值降至20.225万。但同期8月新屋销售环比增6.4%至年化68.4万套，房价中位数同比降5.8%创逾一年最大跌幅，“以价换量”特征明显，30年房贷利率又升破7%。", "source": "网易/华尔街见闻", "url": "https://www.163.com/dy/article/L7LFNK2J05198NMR.html"}, {"id": 7, "category": "战争与自然灾害", "scope": "国际", "title": "泰国披集府暴雨山洪，7县被淹274户民宅受灾", "summary": "泰国中文社报道，受持续强降雨与山洪暴发影响，披集府7个县、13个镇、48个村被淹，274户民宅受灾、1200莱农田果园被淹，13处渠坝与13条道路受损；塔克洛县与东乍伦县两所学校因洪水暂时停课，工作人员正加紧救援转移受灾民众。", "source": "腾讯新闻/泰国中文社", "url": "https://news.qq.com/rain/a/20260924A0B9G500"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "越南多地强降雨引发暴雨洪涝，总理指示主动应对", "summary": "越南政府总理9月21日颁布通知，指导主动应对暴雨洪涝。农业与环境部汇总显示，近日大范围强降雨致3人死亡、111间房屋受损、近2万间房屋被淹；河内与宁平仍有5000多间房屋被淹。预计未来降雨仍达120至250毫米、局地超400毫米，总理要求动员力量向受困地区运送粮食物资、及时转移居民。", "source": "越南人民报网", "url": "https://cn.nhandan.vn/article-post160167.html"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "“中国天眼”FAST迎落成十周年，启动十年来首次全面体检", "summary": "9月25日，500米口径球面射电望远镜FAST迎来落成启用十周年。运行十年来它全天候不间断观测，此次首次停机三天开展大规模维护，全面检修反射镜面、馈源支撑等系统。十年间FAST新发现脉冲星超1300颗、构建15.6万个中性氢星系样本库，并精准验证广义相对论、捕捉纳赫兹引力波关键证据。", "source": "中科院/新浪", "url": "https://k.sina.com.cn/article_5953189932_162d6782c06704z6wq.html"}, {"id": 10, "category": "体育赛事", "scope": "国内", "title": "名古屋亚运会：张展硕加冕“六金王”，国乒女团六连冠男团失金", "summary": "当地时间24日，爱知·名古屋亚运会决出55金。游泳张展硕连夺两金、本届已揽6金追平单届纪录；中国羽毛球女团3:0日本时隔12年重夺冠军，乒乓球女团3:0日本实现六连冠。但乒乓球与羽毛球男团双双2:3惜败，中国男乒自1974年参赛以来首次亚运男团不敌日本、八连冠终结。目前中国以80金30银20铜领跑奖牌榜。", "source": "中国新闻网/中新社", "url": "https://www.toutiao.com/article/7689208541248373282/"}, {"id": 11, "category": "健康养生", "scope": "国内", "title": "中秋月饼高糖高油，专家提醒过量食用诱发急性胰腺炎", "summary": "中秋将至，56岁长沙市民一天进食3个月饼后诱发急性胰腺炎入院。医生提醒月饼属典型高糖、高油、高热量食物，既往有胰腺炎、高脂血症人群更需节制。同期2026年全国食品安全宣传周9月22日在京启动，国务院食安办等27部门将举办40余场“部委主题日”活动，涵盖法规宣贯、典型案例发布与科普。", "source": "腾讯搜一搜/新华社", "url": "https://so.html5.qq.com/page/real/search_news?docid=70000021_4726ab44d5a89052"}, {"id": 12, "category": "环境气候", "scope": "国际", "title": "超强厄尔尼诺持续，报告预警全球或额外增加45.1万例高温死亡", "summary": "芝加哥大学“气候影响实验室”9月23日发布报告称，本轮厄尔尼诺已达“超强”级别并朝创纪录强度发展，预计今年6月至明年2月全球或因高温额外增加45.1万例死亡，未来数月陆地气温或比正常高出1.2℃，极端高温天数增44%。世界气象组织此前警告该事件将持续至2027年，极端天气风险加剧。", "source": "澎湃新闻/世界气象组织", "url": "https://www.thepaper.cn/newsDetail_forward_34145545"}, {"id": 13, "category": "旅行出行", "scope": "国内", "title": "中秋国庆两节跨区域人员流动量预计达27.8亿人次", "summary": "9月24日国新办发布会介绍，中秋3天假期全社会跨区域人员流动量约6.5亿人次，国庆7天预计21.3亿人次、首日或达3.4亿创历史同期新高，两节合计27.8亿人次。国庆假期10月1日至7日7座及以下小客车高速免费；全国新能源车保有量已达4897万辆，国庆首日高速新能源流量预计1780万辆，为平时的1.8倍。", "source": "人民日报/交通运输部", "url": "https://www.163.com/dy/article/L7LGB4PV0530QRMB.html"}, {"id": 14, "category": "汽车出行", "scope": "国内", "title": "智能网联新能源车“十五五”规划出炉，2030年进入汽车强国行列", "summary": "工信部等九部门印发《智能网联新能源汽车产业发展“十五五”规划》，提出到2030年全产业链优势巩固、进入世界汽车强国行列，国内新能源乘用车、商用车新车销量占比分别达70%、40%，具备自动驾驶功能汽车规模应用。行业数据印证势头：1至8月国内新能源汽车销量破1065万辆、渗透率52.4%，L2级辅助驾驶渗透率超70%。", "source": "中国政府网/工信部", "url": "https://www.gov.cn/lianbo/202609/content_7080733.htm"}, {"id": 15, "category": "游戏电竞", "scope": "国内", "title": "亚运电竞《永劫无间》中国队3:0泰国夺冠，斩获电竞首金", "summary": "9月24日，名古屋亚运会电子竞技《永劫无间》决赛，由王枫、王统榕、许坤彬、隋享纭、谭栩杰组成的中国队以3:0战胜泰国队，夺得中国代表团本届亚运电竞项目首金，也是永劫无间作为亚运正式项目的首金。该作是唯一主打东方武侠的中式竞技电竞项目，由国内团队自主研发。", "source": "腾讯新闻/新华社", "url": "https://news.qq.com/rain/a/20260924A0F47R00"}, {"id": 16, "category": "社会民生与教育", "scope": "国内", "title": "2027年考研初试时间确定，全国城市联合招聘秋招同步启动", "summary": "教育部发布通知，2027年全国硕士研究生招生初试时间为2026年12月19日至20日，报名时间为10月15日至24日。与此同时，人社部启动“职引未来”2026年全国城市联合招聘高校毕业生秋季专场，面向2027届及往届未就业毕业生，提供岗位发布、直播带岗、政策宣讲与就业指导等一站式服务。", "source": "川观新闻/光明日报", "url": "https://cbgc.scol.com.cn/news/7995042"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "2026做書图书市集·杭州开幕，全国百余出版品牌迎书香中秋", "summary": "9月25日至27日，2026做書图书市集·杭州在武林921数字文化产业园举办，全国100多家出版社、图书品牌、书店与设计工作室参展，含书量达90%。主办方以“编辑模拟器”为主题，设美索不达米亚主题书展、阿伦特《智慧动物》沉浸展及多场新书首发沙龙，读者开放日恰逢中秋假期。", "source": "腾讯新闻/百度百科", "url": "https://news.qq.com/rain/a/20260923A09WUB00"}, {"id": 18, "category": "娱乐影视", "scope": "国内", "title": "中秋国庆档近30部影片登陆影院，长征胜利90周年片单发布", "summary": "中秋档9月25日开启，十余部影片集中上映，《复仇者联盟4》加码臻享版以新增4分钟前瞻内容领跑，历史片《敦煌英雄》、犯罪喜剧《老江湖》、3D恐怖片《死亡禁区实录》等类型齐全。国庆档《神探之痕迹》《小猪佩奇·完美假期》等接棒。适逢长征胜利90周年，片单发布并启动经典国产影片复映计划。", "source": "央视网/腾讯新闻", "url": "https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=8223465965486665456&channelId=1119"}]}};</script>

      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
