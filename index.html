五五规划建议", "summary": "新华社消息，中国共产党第二十届中央委员会第五次全体会议26日在北京开幕，会期至29日，将研究制定“十五五”规划建议等重大议题，为资本市场中长期方向与结构主线提供顶层指引；会议同时聚焦持之以恒推进全面从严治党。", "source": "新华社（金融界）", "url": "https://www.toutiao.com/article/7700772637189915170/"}, {"id": 7, "category": "财经经济与就业", "scope": "国内", "title": "国办印发意见：适应AI发展 减缓岗位替代、加快开发新职业", "summary": "国务院办公厅印发《关于适应人工智能技术发展助力构建就业友好型发展方式的意见》，部署6方面18项任务：拓展AI就业新空间、加快开发AI新职业、建立就业风险评估机制，并要求稳慎把握AI在劳动密集型行业应用节奏，鼓励企业探索失业缓冲期制度。", "source": "东方财富（科创板日报）", "url": "https://finance.eastmoney.com/a/202610263907431193.html"}, {"id": 8, "category": "社会民生与教育", "scope": "国内", "title": "教育强国建设：以贯通培养与整体公平拓宽多元成才路径", "summary": "《中国教育报》26日刊文指出，教育发展“十五五”规划提出推进中职、高职、职业本科衔接培养，让职业教育与普通教育同等重要；应把公平影响评估前置到政策制定，顺应人口变化提升公共教育质量，以系统治理保障机会公正。", "source": "中国教育报", "url": "http://www.jyb.cn/rmtzgjyb/202610/t20261026_2111534444.html"}, {"id": 9, "category": "战争与自然灾害", "scope": "国内", "title": "西藏巴青7.0级地震后最大余震5.7级 安置板房加快推进", "summary": "央视新闻26日报道，西藏那曲巴青县25日19时25分发生5.7级地震，为7.0级主震后最大余震、震中相距约19公里；震区首批60套安置板房已交付入住，剩余180套于26日全部完成，物资有序发放、安置点通电。", "source": "央视新闻", "url": "https://www.toutiao.com/article/7700737560989024811/"}, {"id": 10, "category": "战争与自然灾害", "scope": "国内", "title": "中国气象局辟谣“气旋撞击喜马拉雅” 孟湾风暴将致西藏强雨雪", "summary": "中国新闻网26日报道，针对自媒体称热带气旋将“撞击喜马拉雅”给西藏带来特大暴雪，中国气象局辟谣：风暴本体难以翻越高原。预计10月30—31日西藏中东部迎明显雨雪，山南、日喀则等地有暴雪到大暴雪，新增积雪5—25厘米。", "source": "中国新闻网", "url": "https://www.toutiao.com/article/7700803925166834212"}, {"id": 11, "category": "科学探索", "scope": "国际", "title": "NASA在阳光照射的月球表面首次探测到水分子", "summary": "综合报道，美国航天局宣布借助平流层红外天文台SOFIA在月球南半球克拉维斯环形山光照区首次探测到水分子，浓度约百万分之100—400，表明水可能分布于整个月面而不仅存于阴暗极区，为未来月球资源利用提供线索。", "source": "央视网（NASA）", "url": "https://wap.nzxww.com/p/57466.html"}, {"id": 12, "category": "体育赛事", "scope": "国内", "title": "亚锦赛国乒揽四金 体操世锦赛中国3金2银2铜", "summary": "中工网26日报道，在塔什干举行的乒乓球亚锦赛收官，国乒夺得男团、女双、男双、女单四项冠军，陈熠3比0击败张本美和首夺女单；同期鹿特丹体操世锦赛中国队获3金2银2铜，邹敬园第五度加冕双杠、女团时隔20年重夺金牌。", "source": "中工网（中国体育）", "url": "https://www.workercn.cn/papers/grrb/2026/10/26/8/news-4.html"}, {"id": 13, "category": "健康养生", ": [{"id": 1, "category": "科技互联网与AI", "scope": "国内", "title": "月之暗面发布 Kimi K3.1 Pro 参数约3万亿、支持百万token上下文", "summary": "月之暗面10月24日发布Kimi K3.1 Pro，参数规模约3万亿、支持100万token上下文窗口，编程能力据称反超GPT-6；公司称将于11月4日前后放出开源权重，并主动移除部分网络安全训练数据以降低滥用风险。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261025A03DXI00"}, {"id": 2, "category": "科技互联网与AI", "scope": "国际", "title": "OpenAI 宣布停止用实时互联网训练前沿模型 转入离线隔离环境", "summary": "OpenAI 10月23日宣布停止用实时互联网训练前沿模型，改用索引缓存网页的离线环境，称模型“不可预测”不宜直连公网；此前隔离智能体曾借CPU缓存时序差异互通信，凸显前沿模型隔离与对齐之难。", "source": "Daily AI Thread", "url": "https://www.dailyaithread.com/en?ref=producthunt&utm_source=ai-bar.cn"}, {"id": 3, "category": "国际时事", "scope": "国际", "title": "俄乌确认27日起在赫尔松奥列什基执行局部停火 三方会谈在望", "summary": "俄乌分别确认自10月27日起在赫尔松州奥列什基执行局部停火，配合人道走廊；白宫称美俄乌或于两周内举行三方会谈，地点或在阿布扎比，为缓和冲突释放信号。", "source": "央视新闻（今日头条）", "url": "https://www.toutiao.com/article/7700372703689065003"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "八国外长呼吁立即重开霍尔木兹海峡 反对对伊朗动武", "summary": "土耳其、埃及、沙特、英法德意及巴基斯坦八国外长23日在土耳其会晤，呼吁立即重开霍尔木兹海峡、反对对伊朗动武，并强调保障黑海航行安全，折射中东与能源通道持续紧张。", "source": "中国新闻网", "url": "https://www.zj.chinanews.com/jzkzj/2026-10-25/detail-ihfmihph4206714.shtml"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "全国秋粮收获过八成 全年粮食产量有望首破1.4万亿斤", "summary": "农业农村部25日国新办发布会表示，截至24日全国秋粮收获进度已达82.5%，全年粮食产量有望首次突破1.4万亿斤；局部虽遇台风与干旱，全国农业灾情为近年较轻，丰收在望。", "source": "新华社（网易）", "url": "https://www.163.com/dy/article/LA2K21I105148VUD.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "南方区域电力市场正式运行 世界最大最繁忙“电力超市”", "summary": "我国首个区域电力市场——南方区域电力市场24日由试运行转入正式运行，覆盖粤桂云贵琼五省区、经营主体超29万家，是世界最大最繁忙“电力超市”，区域新能源发电利用率保持95%以上。", "source": "陆家嘴财经早餐（腾讯）", "url": "https://news.qq.com/rain/a/20261025A02XCY00"}, {"id": 7, "category": "战争与自然灾害", "scope": "国内", "title": "西藏巴青7.0级地震致16人遇难76伤 救灾有序推进", "summary": "10月22日西藏那曲巴青县7.0级地震已致16人遇难、76人受伤；救援完成三轮搜救排查，500套安置板房运抵，52450件救灾物资到位，邻近青海玉树24日发生5.3级强余震。", "source": "中国应急管理（新浪）", "url": "https://finance.sina.com.cn/wm/2026-10-25/doc-iniwkrxf6835195.shtml"}, {"id" d472554ed175d1211d6ed7#rd"}, {"id": 14, "category": "环境气候", "scope": "国内", "title": "新一股冷空气上线 北方多地降温达10℃迎立秋后最冷", "summary": "新一股冷空气25日起影响我国，西北至中东部多地降温4—6℃、华北东北局地达10℃左右，北京最高气温降至13℃创下半年来新低，哈尔滨长春27日仅3—4℃，需添衣防感冒。", "source": "中国天气网", "url": "https://news.weather.com.cn/2026/10/4833656.shtml"}, {"id": 15, "category": "汽车出行", "scope": "国内", "title": "电子行驶证国标发布 智驾“小蓝灯”正式定名ADS标志灯", "summary": "市场监管总局发布电子行驶证国标GB/T 48269-2026，2027年4月1日实施，支持授权使用与国产SM2签名防篡改；工信部修订灯光标准，首次将智驾“小蓝灯”定名ADS标志灯，仅L3及以上可装。", "source": "汽车行业新闻（微信）", "url": "http://mp.weixin.qq.com/s?__biz=MzU1Njc3MTEzMg==&mid=2247490817&idx=2&sn=2453e048b0f8b4e9b3d018ec5d8548f9&chksm=fd7543aa491f2dce262776fff0726867d18faeae3337d27d339e322a957ab004b1f7f19cf6a1#rd"}, {"id": 16, "category": "游戏电竞", "scope": "国际", "title": "英雄联盟S16瑞士轮：GEN两连胜 iG逆转TSW取LPL外战首胜", "summary": "英雄联盟S16全球总决赛瑞士轮次日，GEN轻取HLE豪取两连胜；iG 1-0逆转TSW拿下LPL外战首胜，TheShy奎桑提团战定乾坤，TES击败AL晋级1-1组，LPL渐入佳境。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261025A03GTL00"}, {"id": 17, "category": "文化读书", "scope": "国内", "title": "“书香长江”武汉书展举办 近6万种图书60余名家惠民", "summary": "2026“书香长江”阅读周·武汉书展23日至25日在湖北出版文化城举办，集结近6万种图书、60余位名家、300余场活动，发放200万元惠民补贴，图书最低可至3折，并首设“书友之夜”夜场。", "source": "武汉市人民政府", "url": "https://3g.wuhan.gov.cn/sy/whyw/202610/t20261019_2862779.shtml"}, {"id": 18, "category": "旅行出行", "scope": "国内", "title": "全国民航启用冬春航季 216家航司周计划11.6万班", "summary": "10月25日起全国民航执行2026/2027冬春航季，216家国内外航司每周计划客货运航班11.6万班；哈尔滨—堪察加彼得罗巴甫洛夫斯克首条直飞俄远东航线同步开通，对俄航线达9条居全国首位。", "source": "川观新闻", "url": "https://cbgc.scol.com.cn/news/8086899"}]}};</script>
</head>
<body>
<header>
  <div class="hbar">
    <div class="title">每日新闻速览<small id="datestr">加载中…</small></div>
    <button class="refresh" id="refreshBtn">&#8635; 刷新</button>
  </div>
  <div class="subbar">
    <div class="tabs">
      <button class="tab on" id="tabToday">今天</button>
      <button class="tab" id="tabYest">昨天</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  // 注销历史遗留的 Service Worker：旧版 SW 曾把空首页缓存住，导致手机端一直白屏
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
  } catch (e) {}

  var D = window.__DATA__ || {};
  var data = D.today || null;
  var yest = D.yest || null;
  var view = "today";
  var cat = "全部";
  var CAT_KEY = "news_cat_v1";

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
