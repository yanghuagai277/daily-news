egory": "国际时事", "scope": "国际", "title": "霍尔木兹海峡多艘油轮遭不明射弹击中，伊朗称已收到美方回应", "summary": "英国海上贸易行动办公室9月30日通报，霍尔木兹海峡内一艘液化天然气运输船、两艘油轮遭不明射弹击中。伊朗方面称已收到美方就重开海峡'七天方案'的回应，当前分歧主要集中于各项措施的实施顺序而非方案内容本身。", "source": "每日经济新闻", "url": "https://cd.nbd.com.cn/articles/2026-10-01/4596353.html"}, {"id": 4, "category": "国际时事", "scope": "国际", "title": "美军9月30日完成从伊拉克撤军，结束长达23年军事存在", "summary": "美国总统特朗普9月30日称最后一批美军正撤离伊拉克，标志着自2003年伊拉克战争以来长达23年的军事存在结束；美方表示'伊斯兰国'已被击败，主导打击IS的国际联盟在伊拉克的军事任务随之落幕。", "source": "澎湃新闻", "url": "https://www.thepaper.cn/newsDetail_forward_34186227"}, {"id": 5, "category": "财经经济与就业", "scope": "国内", "title": "中国9月制造业PMI回升至50.1%，三大指数重返扩张区间", "summary": "国家统计局9月30日公布，9月制造业采购经理指数（PMI）为50.1%，环比回升0.3个百分点，结束连续两个月低于荣枯线、重返扩张区间；非制造业商务活动指数与综合PMI产出指数分别为50.2%、50.7%，均重回扩张区间。", "source": "国家统计局", "url": "https://www.stats.gov.cn/xxgk/jd/sjjd2020/202609/t20260930_1965450.html"}, {"id": 6, "category": "财经经济与就业", "scope": "国内", "title": "居民购房贷款贴息10月1日起实施，六大行公告'免申即享'", "summary": "财政部等三部门通知，10月1日起实施居民购房贷款贴息，中央财政首次对个人首套住房商业性贷款贴息，年化1个百分点、期限不超5年；工行等六大行公告采取'免申即享'，按月收息自动扣减贴息，单户上限100万元。", "source": "人民网", "url": "https://finance.people.com.cn/n1/2026/1001/c1004-40808484.html"}, {"id": 7, "category": "社会民生与教育", "scope": "国内", "title": "新中国77周年华诞，多地校园开展科普与爱国教育活动", "summary": "新中国77周年华诞之际，多地校园开展科普与爱国教育活动：三峡大学师生赴中小学捐赠7座长江水利枢纽模型并开讲水利科普课，天津实验小学邀请梁启超后人讲述梁氏家族跨越百年的家国故事，在少年心中种下爱国报国之种。", "source": "中国教育新闻网", "url": "https://www.jyb.cn/rmtzgjyb/202610/t20261001_2111527576.html"}, {"id": 8, "category": "战争与自然灾害", "scope": "国际", "title": "迪拜飞特拉维夫客机驾驶舱遇袭，副驾驶刺伤机长、客机骤降约4200米", "summary": "一架从迪拜飞往特拉维夫的客机驾驶舱遇袭，副驾驶刺伤机长、客机在不到30秒内骤降约4200米；乘客与机组冲入驾驶舱制服嫌犯，另两名飞行员接管并于沙特阿拉伯安全降落，仅1名乘客受非致命轻伤，以方称系未遂恐怖袭击。", "source": "City News Service", "url": "https://www.citynewsservice.cn/articles/china-biz-buzz/daily-buzz/daily-buzz-1-october-2026-pk8v40vn"}, {"id": 9, "category": "科学探索", "scope": "国内", "title": "'天关'卫星与拉索联手，破解宇宙线'百年谜题'", "summary": "我国'天关'卫星与四川稻城高海拔宇宙线观测站（拉索）联合观测，捕捉到一条长约42光年的宇宙线'长尾'踪迹，首次实现天上卫星与地面望远镜强强联手，向破解宇宙线起源这一困扰学界百年的谜题 亿（为平日1.7倍），10月1日为高峰单日或达3.4亿；公路与自驾占比超90%，7座及以下小客车10月1日0时至7日24时免收通行费，新能源车出行规模约为平日1.8倍。", "source": "央视网", "url": "https://news.cctv.com/2026/09/30/ARTI4ynCu9IYslRpz89TJ26z260930.shtml"}, {"id": 17, "category": "娱乐影视", "scope": "国内", "title": "2026国庆档13部新片集中上映，预售前三出炉", "summary": "2026国庆档10月1日正式开启，13部新片集中上映覆盖刑侦、喜剧、现实、动画等类型；据猫眼，截至9月30日预售前三为《神探之痕迹》《什么意思夫妇》《小猪佩奇·完美假期》，长线片《欢迎来龙餐馆》累计票房已破23亿元。", "source": "腾讯新闻", "url": "https://news.qq.com/rain/a/20261001A044K400"}]}};</script>

  function setText(id, t){ var el = $(id); if (el) el.textContent = t; }

  var COLORS = {"科技互联网与AI":"#1f6feb","国际时事":"#8b5cf6","财经经济与就业":"#f59e0b","社会民生与教育":"#10b981","战争与自然灾害":"#ef4444","科学探索":"#0ea5e9","体育赛事":"#14b8a6","健康养生":"#06b6d4","环境气候":"#22c55e","汽车出行":"#64748b","娱乐影视":"#ec4899","游戏电竞":"#6366f1","文化读书":"#a855f7","旅行出行":"#f97316"};
  function colorOf(n){ return COLORS[n] || "#7b8698"; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function current(){ return view === "today" ? data : yest; }

  function renderChips(){
    var box = $("chips"); if (!box) return;
    var d = current();
    var cats = [];
    if (d && d.items) {
      d.items.forEach(function(it){
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
    }
    if (!cats.length) { box.innerHTML = ""; return; }
    if (cat !== "全部" && cats.indexOf(cat) < 0) cat = "全部";
    var html = ['<button class="chip' + (cat === "全部" ? " on" : "") + '" data-c="全部">全部</button>'];
    cats.forEach(function(c){
      html.push('<button class="chip' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>');
    });
    box.innerHTML = html.join("");
    var btns = box.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", (function(btn){
        return function(){
          cat = btn.getAttribute("data-c");
          try { localStorage.setItem(CAT_KEY, cat); } catch (e) {}
          renderChips(); renderList();
        };
      })(btns[i]));
    }
  }

  function renderList(){
    var list = $("list"); if (!list) return;
    var d = current();
    if (!d || !d.items || !d.items.length) {
      setText("stat", "");
      list.innerHTML = '<div class="empty">暂无数据。<br>请稍后点右上角「刷新」重试。</div>';
      return;
    }
    var items = d.items.filter(function(it){
      return cat === "全部" || it.category === cat;
    });
    setText("stat", (view === "today" ? "今日 " : "昨日 ") + items.length + " 条");
    setText("datestr", (d.date || "") + (view === "today" ? " · 每天更新" : " · 昨日回顾"));
    if (!items.length) {
      list.innerHTML = '<div class="empty">该分类暂无内容，换个分类看看。</div>';
      return;
    }
    var out = "";
    items.forEach(function(it){
      out += '<div class="card">'
        + '<div><span class="tag" style="background:' + colorOf(it.category) + '">' + esc(it.category) + '</span>'
        + '<span class="scope">' + esc(it.scope || "") + '</span></div>'
        + '<h2>' + esc(it.title) + '</h2>'
        + '<p>' + esc(it.summary) + '</p>'
        + '<div class="meta"><span>来源：' + esc(it.source || "未知") + '</span>'
        + '<a class="read" href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文 &rsaquo;</a></div>'
        + '</div>';
    });
    list.innerHTML = out;
    setText("foot", "共 " + d.items.length + " 条 · 来源为公开报道");
  }

  function render(){ renderChips(); renderList(); }

  function switchView(v){
    view = v;
    var t = $("tabToday"), y = $("tabYest");
    if (t) t.className = "tab" + (v === "today" ? " on" : "");
    if (y) y.className = "tab" + (v === "yesterday" ? " on" : "");
    render();
  }

  function load(){
    // 任何情况下都不允许更新逻辑影响已渲染内容（老浏览器无 fetch 时同步抛错也要吞掉）
    try {
      return fetch("./data/news.json", { cache: "no-store" })
        .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){
          if (j && j.items && j.items.length) { data = j; render(); }
        })
        .catch(function(){ /* 静默：保留内联数据，绝不清空页面 */ });
    } catch (e) {
      return Promise.resolve();
    }
  }

  try {
    var saved = null;
    try { saved = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (saved) cat = saved;
    var t = $("tabToday"); if (t) t.addEventListener("click", function(){ switchView("today"); });
    var y = $("tabYest"); if (y) y.addEventListener("click", function(){ switchView("yesterday"); });
    var r = $("refreshBtn");
    if (r) r.addEventListener("click", function(){
      r.textContent = "更新中…";
      load().then(function(){ r.textContent = "\u21BB 刷新"; });
    });
    render();
    try { load(); } catch (e2) {}
  } catch (e) {
    var l = $("list");
    if (l) l.innerHTML = '<div class="empty">页面出错：' + esc(e && e.message) + '</div>';
  }
})();
</script>
</body>
</html>
